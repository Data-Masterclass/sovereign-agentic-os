# Dagster run-launcher lock-down (opt-in overlay). Apply on top of the profile you deploy:
#   helm upgrade --install agentic-os charts/sovereign-agentic-os -n agentic-os -f <profile> -f values.dagster-launcher-lockdown.yaml
# Rollback: drop this file from the deploy.
#
# What it does, with Dagster's documented options only (docs/components/dagster.md, "Run launcher
# lock-down"; https://docs.dagster.io/deployment/oss/deployment-options/kubernetes/customizing-your-deployment):
#   - the run launcher is still dagster_k8s.K8sRunLauncher, configured through the subchart's
#     `CustomRunLauncher` type because the subchart's own K8sRunLauncher template cannot render the
#     two allow-list keys. Its config is the subchart's stock render, key for key, plus
#     `only_allow_user_defined_k8s_config_fields` / `only_allow_user_defined_env_vars`: a run's
#     `dagster-k8s/config` tag may set container env and resources only, and env names only those
#     the OS itself sends (os_projects.run_pod_env, tabs/data/lib/dbt/launch.ts);
#   - dagster-k8s applies the allow-list to the CODE LOCATION's container context too, so the code
#     location stops propagating it (`includeConfigInLaunchedRuns.enabled: false`) and the run pod's
#     env, volumes, sidecar, service account and resources move, unchanged, into the launcher's own
#     `run_k8s_config` (operator-defined, not subject to the allow-list).
#
# Two copies kept in step BY A TEST, not by hand: `run_k8s_config` below equals what the code
# location propagated, and the `deployments` entry equals values.yaml's entry (Helm replaces a list,
# so the one flag needs the whole entry). scripts/tests/dagster-launcher-lockdown.test.sh fails CI
# on any drift. Change values.yaml's `sovereign` deployment -> change both copies here.
# Another overlay that adds operator run_k8s_config (e.g. values.dagster-run-identity.yaml) must put
# it under `customRunLauncher.config.run_k8s_config` below; `k8sRunLauncher.runK8sConfig` is not
# read while this overlay is applied. A profile that sets `dagster.imagePullSecrets` needs the same
# list as `image_pull_secrets` in the config below (the stock template renders it from there).
dagster:
  runLauncher:
    type: CustomRunLauncher
    config:
      customRunLauncher:
        module: dagster_k8s
        class: K8sRunLauncher
        config:
          # ── the stock render (charts/dagster _run-launcher.tpl, K8sRunLauncher), unchanged ──
          load_incluster_config: true
          job_namespace: agentic-os
          image_pull_policy: Always
          service_account_name: agentic-os-dagster
          dagster_home: /opt/dagster/dagster_home
          instance_config_map: agentic-os-dagster-instance
          postgres_password_secret: dagster-postgresql
          run_k8s_config:
            # values.yaml dagster.runLauncher.config.k8sRunLauncher.runK8sConfig (stock)
            pod_template_spec_metadata:
              labels:
                component: user-deployments
                app.kubernetes.io/part-of: sovereign-os
            # ── what the `sovereign` code location propagated (its container context), now the
            # operator's: image pull policy, env ConfigMap, env, resources, the checkout volume,
            # the repo-sync sidecar (exits 0 in a run pod), service account, token automount.
            container_config:
              image_pull_policy: IfNotPresent
              env_from:
                - config_map_ref: { name: agentic-os-dagster-user-deployments-sovereign-user-env }
              env:
                - {name: TRINO_HOST, value: trino}
                - {name: TRINO_PORT, value: '8080'}
                - {name: TRINO_USER, value: dbt-runner}
                - {name: TRINO_CATALOG, value: iceberg}
                - {name: DESTINATION__SQLALCHEMY__CREDENTIALS__DRIVERNAME, value: trino}
                - {name: DESTINATION__SQLALCHEMY__CREDENTIALS__HOST, value: trino}
                - {name: DESTINATION__SQLALCHEMY__CREDENTIALS__PORT, value: '8080'}
                - {name: DESTINATION__SQLALCHEMY__CREDENTIALS__DATABASE, value: iceberg}
                - {name: TRINO_SCHEMA, value: sales}
                - {name: REPO_SYNC_ENABLED, value: 'true'}
                - {name: REPO_SYNC_DOMAINS, value: ''}
                - {name: REPO_SYNC_INDEX_URL, value: 'http://os-ui:3000/api/data/projects'}
                - {name: REPO_SYNC_GIT_BASE, value: 'git://os-repos'}
                - {name: REPO_SYNC_CHECKOUT, value: /repos-checkout}
                - {name: REPO_SYNC_INTERVAL, value: '15'}
                - {name: REPO_SYNC_STATUS_PORT, value: '8089'}
                - {name: DAGSTER_RELOAD_LOCATION, value: sovereign}
                - {name: DAGSTER_GRAPHQL_URL, value: 'http://agentic-os-dagster-webserver:80/graphql'}
                - {name: OS_INDEX_FILE, value: /repos-checkout/.os-index.json}
                - {name: OS_QUARANTINE_THRESHOLD, value: '10'}
              resources:
                requests: {cpu: 50m, memory: 384Mi}
                limits: {cpu: '1', memory: 1Gi}
              volume_mounts:
                - {name: repos-checkout, mountPath: /repos-checkout}
            pod_spec_config:
              service_account_name: agentic-os-dagster-user-deployments-user-deployments
              automount_service_account_token: true
              volumes:
                - {name: repos-checkout, emptyDir: {}}
              containers:
                - name: repo-sync
                  image: ghcr.io/data-masterclass/sovereign-os/dagster:0.3.2@sha256:48616a492124cea26c289fcbf2eb7014a98dfa5f940cf223e553addb76c8f9bb
                  imagePullPolicy: IfNotPresent
                  command:
                  - /bin/sh
                  - /opt/dagster/app/repo-sync.sh
                  env:
                  - name: POD_NAME
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.name
                  - name: POD_IP
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP
                  - name: REPO_SYNC_ENABLED
                    value: 'true'
                  - name: REPO_SYNC_DOMAINS
                    value: ''
                  - name: REPO_SYNC_INDEX_URL
                    value: http://os-ui:3000/api/data/projects
                  - name: REPO_SYNC_GIT_BASE
                    value: git://os-repos
                  - name: REPO_SYNC_CHECKOUT
                    value: /repos-checkout
                  - name: REPO_SYNC_INTERVAL
                    value: '15'
                  - name: REPO_SYNC_STATUS_PORT
                    value: '8089'
                  - name: DAGSTER_RELOAD_LOCATION
                    value: sovereign
                  - name: DAGSTER_GRAPHQL_URL
                    value: http://agentic-os-dagster-webserver:80/graphql
                  - name: AGENT_RUNTIME_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: agent-runtime-token
                        key: token
                  ports:
                  - name: repo-status
                    containerPort: 8089
                  volumeMounts:
                  - name: repos-checkout
                    mountPath: /repos-checkout
                  resources:
                    requests:
                      cpu: 20m
                      memory: 128Mi
                    limits:
                      cpu: 500m
                      memory: 512Mi
          # ── the two documented restrictions ──
          only_allow_user_defined_k8s_config_fields:
            container_config:
              env: true
              resources: true
          only_allow_user_defined_env_vars:
            - OS_PINNED_COMMITS
            - OS_PRINCIPAL
            - DESTINATION__SQLALCHEMY__CREDENTIALS__USERNAME
  dagster-user-deployments:
    deployments:
      # values.yaml's `sovereign` entry, verbatim (comments there), plus the one flag at the end.
      - name: sovereign
        image:
          repository: ghcr.io/data-masterclass/sovereign-os/dagster
          tag: "0.3.2"
          digest: "sha256:48616a492124cea26c289fcbf2eb7014a98dfa5f940cf223e553addb76c8f9bb"
          pullPolicy: IfNotPresent
        dagsterApiGrpcArgs:
          - "--python-file"
          - "/opt/dagster/app/repo.py"
        port: 3030
        env:
          - { name: TRINO_HOST, value: trino }
          - { name: TRINO_PORT, value: "8080" }
          - { name: TRINO_USER, value: dbt-runner }
          - { name: TRINO_CATALOG, value: iceberg }
          - { name: DESTINATION__SQLALCHEMY__CREDENTIALS__DRIVERNAME, value: trino }
          - { name: DESTINATION__SQLALCHEMY__CREDENTIALS__HOST, value: trino }
          - { name: DESTINATION__SQLALCHEMY__CREDENTIALS__PORT, value: "8080" }
          - { name: DESTINATION__SQLALCHEMY__CREDENTIALS__DATABASE, value: iceberg }
          - { name: TRINO_SCHEMA, value: sales }
          - { name: REPO_SYNC_ENABLED, value: "true" }
          - { name: REPO_SYNC_DOMAINS, value: "" }
          - { name: REPO_SYNC_INDEX_URL, value: "http://os-ui:3000/api/data/projects" }
          - { name: REPO_SYNC_GIT_BASE, value: "git://os-repos" }
          - { name: REPO_SYNC_CHECKOUT, value: "/repos-checkout" }
          - { name: REPO_SYNC_INTERVAL, value: "15" }
          - { name: REPO_SYNC_STATUS_PORT, value: "8089" }
          - { name: DAGSTER_RELOAD_LOCATION, value: "sovereign" }
          - { name: DAGSTER_GRAPHQL_URL, value: "http://agentic-os-dagster-webserver:80/graphql" }
          - { name: OS_INDEX_FILE, value: "/repos-checkout/.os-index.json" }
          - { name: OS_QUARANTINE_THRESHOLD, value: "10" }
        resources:
          requests: { cpu: 50m, memory: 384Mi }
          limits: { cpu: "1", memory: 1Gi }
        volumes:
          - name: repos-checkout
            emptyDir: {}
        volumeMounts:
          - name: repos-checkout
            mountPath: /repos-checkout
        sidecarContainers:
          - name: repo-sync
            image: ghcr.io/data-masterclass/sovereign-os/dagster:0.3.2@sha256:48616a492124cea26c289fcbf2eb7014a98dfa5f940cf223e553addb76c8f9bb
            imagePullPolicy: IfNotPresent
            command: ["/bin/sh", "/opt/dagster/app/repo-sync.sh"]
            env:
              - name: POD_NAME
                valueFrom:
                  fieldRef: { fieldPath: metadata.name }
              - name: POD_IP
                valueFrom:
                  fieldRef: { fieldPath: status.podIP }
              - { name: REPO_SYNC_ENABLED, value: "true" }
              - { name: REPO_SYNC_DOMAINS, value: "" }
              - { name: REPO_SYNC_INDEX_URL, value: "http://os-ui:3000/api/data/projects" }
              - { name: REPO_SYNC_GIT_BASE, value: "git://os-repos" }
              - { name: REPO_SYNC_CHECKOUT, value: "/repos-checkout" }
              - { name: REPO_SYNC_INTERVAL, value: "15" }
              - { name: REPO_SYNC_STATUS_PORT, value: "8089" }
              - { name: DAGSTER_RELOAD_LOCATION, value: "sovereign" }
              - { name: DAGSTER_GRAPHQL_URL, value: "http://agentic-os-dagster-webserver:80/graphql" }
              - name: AGENT_RUNTIME_TOKEN
                valueFrom:
                  secretKeyRef: { name: agent-runtime-token, key: token }
            ports:
              - { name: repo-status, containerPort: 8089 }
            volumeMounts:
              - name: repos-checkout
                mountPath: /repos-checkout
            resources:
              requests: { cpu: 20m, memory: 128Mi }
              limits: { cpu: 500m, memory: 512Mi }
        includeConfigInLaunchedRuns:
          enabled: false
