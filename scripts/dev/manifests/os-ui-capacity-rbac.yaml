#
# Monitoring → Platform → Capacity on dev — operator-owned, applied with the ADMIN kubeconfig.
# The chart would create this grant itself (templates/base/os-ui/os-ui-capacity.yaml), but the dev CI
# account deploys namespaced objects only (ci-rbac.yaml) and may not create cluster RBAC, so
# values.dev.yaml sets osUI.capacityReader.createClusterRole=false and the grant lives here instead.
#
# Exactly what the chart grants, nothing more: `list` on pods in all namespaces (no get, no watch, no
# pods/log, no pods/exec), bound to the os-ui ServiceAccount in agentic-os. The names are
# `sovereign-os-*`, NOT the chart's `<release>-os-ui-capacity`, so Helm never owns or fights over these
# objects. Without this grant the card shows "Node requests unavailable (forbidden)" — never invented numbers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: sovereign-os-os-ui-capacity }
rules:
  - { apiGroups: [""], resources: [pods], verbs: [list] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: sovereign-os-os-ui-capacity }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: sovereign-os-os-ui-capacity }
subjects: [{ kind: ServiceAccount, name: os-ui, namespace: agentic-os }]
