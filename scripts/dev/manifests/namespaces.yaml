#
# The dev namespaces and their Pod Security Standard (Kubernetes Pod Security Admission labels,
# https://kubernetes.io/docs/concepts/security/pod-security-admission/). Applied by the OPERATOR
# (scripts/dev/bootstrap-secrets.sh, admin kubeconfig). The CI account cannot change them: it has
# no write right on namespaces (ci-rbac.yaml).
#   agentic-os     baseline enforced (no privileged, no hostPath, no host namespaces); restricted
#                  is only warned and audited, because upstream subcharts run as root.
#   agentic-apps   restricted, as production labels it.
#   dev-model-key  restricted; the CI account has no rights here at all.
#   agentic-os-kube-state-metrics  kube-state-metrics alone (observability.kubeStateMetrics.createNamespace: false),
#                  restricted, with exactly the chart's labels (scripts/check-kube-state-metrics-chart.mjs).
#   apps-dev, apps-prod  the App Builder's env namespaces (values.dev.yaml softwareRunner.environments,
#                  createNamespaces: false): restricted, with EXACTLY the labels the chart would give them
#                  (templates/base/os-ui/software-apps-envs.yaml), so the chart's objects inside them behave the same.
#   agentic-os-scans  the software scanner's own namespace (values.dev.yaml osUI.software.scanner, createNamespace:
#                  false): restricted, with EXACTLY the labels the chart would give it
#                  (templates/base/os-ui/software-scanner.yaml). os-ui's Role there: scanner-roles.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: agentic-os
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: agentic-apps
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
---
# Connection credentials (ciphertext Secrets only, no pods) — os-ui's durable credential store
# (chart os-ui-connection-secrets.yaml; values.dev.yaml sets connectionSecrets.createNamespace: false
# because Helm will not adopt a namespace it did not create).
apiVersion: v1
kind: Namespace
metadata:
  name: agentic-os-conn-secrets
  labels:
    soa.dev/purpose: connection-secrets
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: dev-model-key
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps-dev
  labels:
    soa.dev/purpose: app-env
    soa.dev/app-env: dev
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps-prod
  labels:
    soa.dev/purpose: app-env
    soa.dev/app-env: prod
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: agentic-os-scans
  labels:
    soa.dev/purpose: software-scanner
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: agentic-os-kube-state-metrics
  labels:
    soa.dev/purpose: kube-state-metrics
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
