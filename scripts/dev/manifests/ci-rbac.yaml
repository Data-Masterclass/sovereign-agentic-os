#
# The CI account of the dev cluster (scripts/dev/ci-kubeconfig.sh) — a namespaced deploy role:
#   - everything in agentic-os and agentic-apps (what helm installs; what the journeys create,
#     exec into, scale and delete). Pod Security Admission still applies there (namespaces.yaml);
#   - in the App Builder's apps-dev / apps-prod only what the chart writes there (quota, limit range,
#     NetworkPolicies, os-ui's Roles and bindings by name) plus exactly the rules those os-ui Roles grant (RBAC
#     escalation prevention); never a Secret read, pods/exec, escalate or bind;
#   - cluster-wide: PriorityClasses and the chart's ValidatingAdmissionPolicy (+ binding; change or
#     delete only by the chart's names), and READ on namespaces and nodes (helm's namespace check;
#     deploy.sh's DEV_NODE flavour check);
#   - get on the environment marker.
# NOT granted: any write on namespaces (so no Pod Security label can be changed), anything in
# kube-system (no pod there), anything in dev-model-key (the model key).
apiVersion: v1
kind: Namespace
metadata: { name: sovereign-os-ci }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: sovereign-os-ci, namespace: sovereign-os-ci }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: sovereign-os-ci-cluster }
rules:
  - { apiGroups: [scheduling.k8s.io], resources: [priorityclasses], verbs: ["*"] }
  - { apiGroups: [""], resources: [namespaces, nodes], verbs: [get, list] }
  # The chart's admission policies (templates/extensions/dagster/run-pod-admission.yaml). A
  # ValidatingAdmissionPolicy can only refuse requests, so creating one never widens access;
  # changing or deleting one is limited to the chart's own names.
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies, validatingadmissionpolicybindings]
    verbs: [get, list, watch, create]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies, validatingadmissionpolicybindings]
    # + the App Builder's (software-apps-envs.yaml, rendered only while softwareRunner.environments.enabled).
    resourceNames:
      - agentic-os-dagster-run-pod-shape
      - app-env-ingress-allowlist
      - sovereign-os-app-env-dev-objects
      - sovereign-os-app-env-dev-pods-dry-run-only
      - sovereign-os-app-env-prod-objects
      - sovereign-os-app-env-prod-pods-dry-run-only
      - app-databases-os-ui-secrets
      - app-databases-os-ui-configmaps
      - app-databases-os-ui-jobs
      - app-databases-os-ui-workloads
      - app-databases-os-ui-cronjobs
      - app-databases-os-ui-pods
      # #398: the build pod's shape (software-tekton.yaml; renders once builds are on).
      - app-checks-build-pod
    verbs: [update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: sovereign-os-ci-cluster }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: sovereign-os-ci-cluster }
subjects: [{ kind: ServiceAccount, name: sovereign-os-ci, namespace: sovereign-os-ci }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: sovereign-os-ci-marker, namespace: kube-public }
rules:
  - { apiGroups: [""], resources: [configmaps], resourceNames: [sovereign-os-environment], verbs: [get] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: sovereign-os-ci-marker, namespace: kube-public }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: sovereign-os-ci-marker }
subjects: [{ kind: ServiceAccount, name: sovereign-os-ci, namespace: sovereign-os-ci }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: sovereign-os-ci-deploy, namespace: agentic-os }
rules:
  - { apiGroups: ["*"], resources: ["*"], verbs: ["*"] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: sovereign-os-ci-deploy, namespace: agentic-os }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: sovereign-os-ci-deploy }
subjects: [{ kind: ServiceAccount, name: sovereign-os-ci, namespace: sovereign-os-ci }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: sovereign-os-ci-deploy, namespace: agentic-apps }
rules:
  - { apiGroups: ["*"], resources: ["*"], verbs: ["*"] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: sovereign-os-ci-deploy, namespace: agentic-apps }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: sovereign-os-ci-deploy }
subjects: [{ kind: ServiceAccount, name: sovereign-os-ci, namespace: sovereign-os-ci }]
---
# apps-dev / apps-prod (App Builder env namespaces, operator-owned in namespaces.yaml): NOT the agentic-apps wildcard.
# The CI account gets only what helm writes there (no Secret reads: the apps' env and db Secrets stay os-ui's, which
# itself may only write them). Turning builds or app databases on adds chart objects here (the zot-users bindings, the
# apps-pg Cluster, its NetworkPolicies and CA publisher): extend these rules by name in the same change.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: sovereign-os-ci-deploy, namespace: apps-dev }
rules:
  # What the chart renders here with the App Builder switch on and builds/databases off: the quota and limit range, the
  # NetworkPolicies, os-ui's two Roles and their bindings.
  - { apiGroups: [""], resources: ["resourcequotas", "limitranges"], verbs: ["get", "list", "watch", "create", "update", "patch", "delete"] }
  - { apiGroups: ["networking.k8s.io"], resources: ["networkpolicies"], verbs: ["get", "list", "watch", "create", "update", "patch", "delete"] }
  # `create` cannot be limited by name in RBAC; every other write is limited to the chart's Role names.
  - { apiGroups: ["rbac.authorization.k8s.io"], resources: ["roles", "rolebindings"], verbs: ["get", "list", "watch", "create"] }
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    resourceNames: ["os-ui-app-env", "os-ui-app-databases"]
    verbs: ["update", "patch", "delete"]
  # RBAC escalation prevention: whoever creates os-ui's Roles must hold what they grant, or hold `escalate`. `escalate`
  # cannot be limited by name on a CREATE (the request carries no name), so it would be unbounded; instead the CI account
  # holds EXACTLY the rules of os-ui-app-env + the env half of os-ui-app-databases (software-apps-envs.yaml,
  # software-app-databases-rbac.yaml) and nothing beyond them: Secrets are written, never read (no get/list/watch),
  # no pods/exec, no escalate, no bind. Keep this list equal to those two Roles.
  - { apiGroups: ["apps"], resources: ["deployments", "deployments/scale"], verbs: ["create", "get", "list", "watch", "update", "patch", "delete"] }
  - { apiGroups: ["apps"], resources: ["replicasets"], verbs: ["get", "list", "watch"] }
  - { apiGroups: [""], resources: ["services"], verbs: ["create", "get", "list", "watch", "update", "patch", "delete"] }
  - { apiGroups: ["networking.k8s.io"], resources: ["ingresses"], verbs: ["create", "get", "list", "watch", "update", "patch", "delete"] }
  - { apiGroups: [""], resources: ["pods"], verbs: ["get", "list", "watch", "create"] }
  - { apiGroups: [""], resources: ["pods/log"], verbs: ["get"] }
  - { apiGroups: [""], resources: ["secrets"], verbs: ["create", "patch", "delete"] }
  - { apiGroups: [""], resources: ["configmaps"], verbs: ["create", "get", "patch"] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: sovereign-os-ci-deploy, namespace: apps-dev }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: sovereign-os-ci-deploy }
subjects: [{ kind: ServiceAccount, name: sovereign-os-ci, namespace: sovereign-os-ci }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: sovereign-os-ci-deploy, namespace: apps-prod }
rules:
  # What the chart renders here with the App Builder switch on and builds/databases off: the quota and limit range, the
  # NetworkPolicies, os-ui's two Roles and their bindings.
  - { apiGroups: [""], resources: ["resourcequotas", "limitranges"], verbs: ["get", "list", "watch", "create", "update", "patch", "delete"] }
  - { apiGroups: ["networking.k8s.io"], resources: ["networkpolicies"], verbs: ["get", "list", "watch", "create", "update", "patch", "delete"] }
  # `create` cannot be limited by name in RBAC; every other write is limited to the chart's Role names.
  - { apiGroups: ["rbac.authorization.k8s.io"], resources: ["roles", "rolebindings"], verbs: ["get", "list", "watch", "create"] }
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    resourceNames: ["os-ui-app-env", "os-ui-app-databases"]
    verbs: ["update", "patch", "delete"]
  # RBAC escalation prevention: whoever creates os-ui's Roles must hold what they grant, or hold `escalate`. `escalate`
  # cannot be limited by name on a CREATE (the request carries no name), so it would be unbounded; instead the CI account
  # holds EXACTLY the rules of os-ui-app-env + the env half of os-ui-app-databases (software-apps-envs.yaml,
  # software-app-databases-rbac.yaml) and nothing beyond them: Secrets are written, never read (no get/list/watch),
  # no pods/exec, no escalate, no bind. Keep this list equal to those two Roles.
  - { apiGroups: ["apps"], resources: ["deployments", "deployments/scale"], verbs: ["create", "get", "list", "watch", "update", "patch", "delete"] }
  - { apiGroups: ["apps"], resources: ["replicasets"], verbs: ["get", "list", "watch"] }
  - { apiGroups: [""], resources: ["services"], verbs: ["create", "get", "list", "watch", "update", "patch", "delete"] }
  - { apiGroups: ["networking.k8s.io"], resources: ["ingresses"], verbs: ["create", "get", "list", "watch", "update", "patch", "delete"] }
  - { apiGroups: [""], resources: ["pods"], verbs: ["get", "list", "watch", "create"] }
  - { apiGroups: [""], resources: ["pods/log"], verbs: ["get"] }
  - { apiGroups: [""], resources: ["secrets"], verbs: ["create", "patch", "delete"] }
  - { apiGroups: [""], resources: ["configmaps"], verbs: ["create", "get", "patch"] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: sovereign-os-ci-deploy, namespace: apps-prod }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: sovereign-os-ci-deploy }
subjects: [{ kind: ServiceAccount, name: sovereign-os-ci, namespace: sovereign-os-ci }]
---
# agentic-os-conn-secrets: helm creates the os-ui-connection-secrets Role/RoleBinding here, and RBAC
# escalation prevention requires the creator to hold what that Role grants (Secret CRUD). Nothing
# else: no pods, no other resource type.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: sovereign-os-ci-deploy, namespace: agentic-os-conn-secrets }
rules:
  - { apiGroups: [""], resources: ["secrets"], verbs: ["get", "list", "watch", "create", "update", "patch", "delete"] }
  - { apiGroups: ["rbac.authorization.k8s.io"], resources: ["roles", "rolebindings"], verbs: ["get", "list", "watch", "create", "update", "patch", "delete"] }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: sovereign-os-ci-deploy, namespace: agentic-os-conn-secrets }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: sovereign-os-ci-deploy }
subjects: [{ kind: ServiceAccount, name: sovereign-os-ci, namespace: sovereign-os-ci }]
---
apiVersion: v1
kind: Secret
metadata:
  name: sovereign-os-ci-token
  namespace: sovereign-os-ci
  annotations: { kubernetes.io/service-account.name: sovereign-os-ci }
type: kubernetes.io/service-account-token
