---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: os-ui-app-databases
  namespace: apps-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: os-ui-app-databases
subjects:
  - kind: ServiceAccount
    name: os-ui
    namespace: agentic-os
  - kind: ServiceAccount
    name: os-ui-worker
    namespace: agentic-os
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
