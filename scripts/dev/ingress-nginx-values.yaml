#
# ingress-nginx values for the chart pinned in scripts/dev/platform-versions.env. Used by
# scripts/dev/platform.sh (dev cluster) and scripts/tests/app-ingress-admission.kind.sh; the
# production upgrade passes the same file (components/ingress-nginx/UPSTREAM.md).
# Chart values reference: https://github.com/kubernetes/ingress-nginx/blob/helm-chart-4.15.1/charts/ingress-nginx/values.yaml
# ConfigMap keys:         https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/configmap/
controller:
  # The class every OS Ingress names (ingress.className / softwareRunner.ingressClass).
  ingressClassResource:
    name: nginx
    default: true
  # Snippet annotations stay off (also the upstream default since v1.9).
  allowSnippetAnnotations: false
  config:
    # The chart writes this key only when snippets are ON; stated here so the live ConfigMap
    # says it (production's already does).
    allow-snippet-annotations: "false"
    # Stated explicitly rather than inherited, so a future chart default cannot widen them.
    # "High" admits every annotation the OS's own Ingresses use (auth-url, auth-response-headers,
    # auth-type/secret/realm, proxy-*, force-ssl-redirect, whitelist-source-range) and refuses the
    # "Critical" ones (the snippet family). Upstream default since v1.12.
    annotations-risk-level: "High"
    # Path values are validated against their pathType (upstream default since v1.12).
    strict-validate-path-type: "true"
  service:
    type: LoadBalancer
  resources:
    requests: { cpu: 100m, memory: 90Mi }
    # 512Mi: the controller was OOMKilled on prod at 256Mi (2026-11-25).
    limits: { memory: 512Mi }
