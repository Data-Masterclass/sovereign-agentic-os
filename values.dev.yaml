# =============================================================================
# values.dev.yaml — the DEV environment profile (docs/ops/dev-environment.md).
# =============================================================================
# Layered on the chart defaults, then the PRIVATE overlay that scripts/dev/bootstrap-secrets.sh
# generates (random credentials, the synthetic demo users, the dev model key):
#
#   scripts/deploy.sh --env dev --from-registry main-<sha>
#     = helm upgrade --install agentic-os charts/sovereign-agentic-os \
#         -f values.dev.yaml -f <private overlay from the dev cluster> --set osUI.image.tag=...
#
# WHAT DEV IS. The same chart and the same real components as production, at the same pinned
# images, on ONE smaller node (g2i.8, 8 vCPU / 32 GB). Only sizes are smaller. No component is
# swapped for an imitation; the only optional stand-in is the model upstream
# (values.dev.model-stub.yaml), and only when the owner chooses it.
#
# DATA. Synthetic only: the Northpeak gold mart (marts, generated in SQL), the Northpeak demo
# cast and their demo domains (seed/ecommerce, run by scripts/dev/seed.sh). No production data,
# no real user list, no backup of production is ever restored here.
#
# SECRETS. Like production, the chart renders its own Secrets (global.profile: local). EVERY
# credential literal of values.yaml is replaced by a random value in the private overlay; this
# file holds none. Capacity: charts/sovereign-agentic-os/capacity.dev.yaml (the dev node budget),
#   node scripts/check-capacity.mjs --profile default \
#     --budget charts/sovereign-agentic-os/capacity.dev.yaml --values values.dev.yaml
# =============================================================================

global:
  profile: local       # the chart renders its Secrets; the private overlay makes them random
  storageClass: ""     # SKE CSI default
  # The bespoke images are private GHCR packages. bootstrap-secrets.sh creates this Secret from a
  # READ-ONLY token (read:packages) the owner gives it; dev never holds a push credential.
  imagePullSecrets:
    - name: registry-pull-secret

# --- Public route: ONE host, in the dev zone ----------------------------------------------------
# The dev ingress-nginx Service is pinned to the reserved dev IP (scripts/dev/platform.sh), and
# cert-manager issues the certificate. LiteLLM stays unpublished, as in production.
# Langfuse: the operators' route (ingress.restricted.langfuse.operatorIngress) on its own host,
# behind nginx basic auth from the htpasswd Secret `langfuse-basic-auth` (created by hand in the
# dev namespace; without it ingress-nginx answers 503), with Langfuse's own login behind that.
# Its NEXTAUTH_URL (langfuse.langfuse.nextauth.url below) must be https://<this host>.
ingress:
  enabled: true
  className: nginx
  tlsIssuer: letsencrypt-prod
  hosts:
    osUI: dev.agentic.datamasterclass.com
    langfuse: langfuse.dev.agentic.datamasterclass.com
  restricted:
    langfuse:
      operatorIngress:
        enabled: true

# --- Images: the registry-qualified images production runs ---------------------------------
# The chart's defaults for these four name the laptop's local builds (`sovereign-os/...`, loaded
# into kind), which a real cluster cannot pull. These are the images production runs (read
# 2026-11-20 with `kubectl get deploy`), pinned here by digest. (data-runner and query-tool: under
# their resource blocks below; one YAML key per component.)
egressProxy:
  image:
    repository: ghcr.io/aborek/sovereign-os/egress-proxy
    tag: "0.1.0@sha256:8426ee9d0cfe297e6fe961bab6a3a9854e1b97cb6ae713158e826f84f456f9ee"
webFetch:
  image:
    repository: ghcr.io/aborek/sovereign-os/web-fetch
    tag: "0.1.0@sha256:1487d74ff0d7e7327793525701720479df21eecf1ce6bb0b11b228deae08686d"
dbt:
  image:
    repository: ghcr.io/aborek/sovereign-os/dbt
    tag: "0.2.0@sha256:dcec728155d4ff03f7b999753cb5ec00fd84e37d2cf8be3641a0ee426ae915d5"
  trino:
    user: sales     # see "Synthetic seed" below: the fresh-install schema rule

osUI:
  # The first role mapping (os/models.yml, written once when it does not exist): embeddings on STACKIT's model.
  # strong/worker come from the chart seed (STACKIT Qwen / gpt-oss) until an admin maps them in Platform -> Models.
  modelRoles:
    seed:
      sovereign-embedding: stackit-qwen3-vl-embedding-8b
  # WP-05: the node list is ON on dev, but the chart creates NO ClusterRole — the dev CI account
  # deploys namespaced objects only (scripts/dev/manifests/ci-rbac.yaml) and may not create cluster
  # RBAC. The read-only grant (get/list nodes) is operator-owned:
  # scripts/dev/manifests/os-ui-nodes-rbac.yaml, applied once with the admin kubeconfig
  # (scripts/dev/manifests/README.md). Without it Platform shows a red 403 — never an invented list.
  nodesReader:
    enabled: true
    createClusterRole: false
  publicUrl: https://dev.agentic.datamasterclass.com
  offlineMock: refuse            # never invented numbers, also on dev
  allowOfflineUserSeed: false
  externalConnectorsEnabled: false
  # Durable connection credentials: the dedicated namespace agentic-os-conn-secrets is OPERATOR-owned on
  # dev (scripts/dev/manifests/namespaces.yaml — the CI account may not create namespaces, and Helm will
  # not adopt one it did not create). ci-rbac.yaml grants CI Secret + Role/RoleBinding rights there only.
  # Operator step before the first deploy of this: scripts/dev/ci-kubeconfig.sh with the admin kubeconfig.
  connectionSecrets:
    createNamespace: false
  # Same tabs as production, so dev tests what prod runs (an empty value shows only a minimal set).
  enabledTabs: "home,agents,dashboards,software,data,metrics,files,knowledge,connections,monitoring,governance,admin,workflows"
  # The agent worker as its own Deployment, as in production (AT-c deletes it mid-run).
  worker:
    enabled: true
    # 4 parallel runs (prod: 6). The dev node's memory-limit budget is at ~85 %, so the worker keeps its
    # 1Gi limit: ~395 MiB idle + ~100 MiB per running run. Scale a dev load-test result by 6/4 for prod.
    concurrency: 4
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { cpu: 1, memory: 1Gi }
  resources:
    requests: { cpu: 70m, memory: 192Mi }
    limits: { cpu: 1, memory: 1Gi }
  # A LOW budget per agent system (production: 5 a week).
  agentSystemKey:
    maxBudget: 1
    budgetDuration: "7d"
  # NATIVE LAYOUTS, dev first (docs: values.yaml osUI.dataProjectGit.layout and
  # osUI.agentGraphModule). ONE domain, `sales`. Step 1 (done 21 Nov 2026): `dry-run` — os-ui logged
  # the planned `git mv` for sales (13 moves into data/dbt/, 1 personal lane to its user repo, 6
  # READMEs) and wrote nothing. Step 2 (this value), after the plan was approved: `apply`
  # moves the repo to the v2 layout (dbt at data/dbt/, Dagster definitions at data/dagster/, one
  # `OS-Reason: layout-migration` commit); every other dev domain keeps its v1 repo. The agent
  # systems in sales are generated and run as LangGraph modules (graph.mjs). Rollback:
  # `migration: "off"` and `agentGraphModule.enabled: false`, then `git revert` the migration commit.
  dataProjectGit:
    layout:
      migration: apply
      migrationDomains: [sales]
  agentGraphModule:
    enabled: true
    domains: [sales]
  # APP BUILDER (H): app databases OFF on dev until the owner decides the PostgreSQL operand image licence
  # (scripts/cnpg/versions.env candidate). The Database panel says "not set up on this installation yet".
  # Turning it on: `cnpg` here, scripts/cnpg/install.sh by the operator, and the plan's dev requests.
  software:
    databases:
      mode: ""
    # The SECURITY SCANNER's dedicated namespace agentic-os-scans (chart default `<release>-scans`) is
    # OPERATOR-owned on dev, like apps-dev/apps-prod: the CI account may not create namespaces, nor the
    # scanner Role (it grants Secret create/delete). The chart still renders the admission policy and the
    # NetworkPolicies there (ci-rbac.yaml grants exactly those). OPERATOR STEPS BEFORE THE FIRST DEV DEPLOY
    # WITH THIS (admin kubeconfig): apply scripts/dev/manifests/namespaces.yaml, scanner-roles.yaml and
    # ci-rbac.yaml (docs/components/software-scanner.md "Dev").
    scanner:
      createNamespace: false         # operator-owned: scripts/dev/manifests/namespaces.yaml
      createOsUiRoles: false         # operator-applied: scripts/dev/manifests/scanner-roles.yaml

# --- Models: the same STACKIT AI Model Serving API, a SEPARATE low-budget key --------------
# The key is the dev project's own Model Serving token (docs/ops/dev-environment.md "Dev model
# key"). It is NOT in this namespace: scripts/dev/bootstrap-secrets.sh puts it into the
# namespace dev-model-key, where a small reverse proxy adds it to each request. The CI account
# has no rights in that namespace, so it cannot read the key. LiteLLM calls the proxy, and its
# own api_key below is a placeholder.
stackitPremium:
  apiBaseUrl: http://model-key-proxy.dev-model-key.svc.cluster.local:8080/v1
  local:
    apiKey: held-by-model-key-proxy
# STACKIT tokens carry no spend limit, so the caps are LiteLLM's:
#   - a TOTAL proxy budget (`litellm_settings.max_budget` + `budget_duration`, LiteLLM "Global
#     proxy budget": https://docs.litellm.ai/docs/proxy/users#global-proxy). It covers every key,
#     the master key included: 20 per 30 days (in the price book's currency, EUR).
#   - the shared agent key at 5 a week (production: 25) and 1 a week per agent system (above).
# As in production, no in-cluster model: the STACKIT API is the upstream.
mockModel:
  enabled: false

litellmAgentKey:
  maxBudget: 5
  budgetDuration: "7d"
  maxParallelRequests: 4

# --- Synthetic seed -----------------------------------------------------------------------
# On a FRESH install os-ui writes Trino's rules.json at boot, before the post-install hooks run,
# and it grants schema `sales` only to the sales domain principals. The two hooks that build the
# demo (dbt-build, weight 15; northpeak-marts-init, weight 20) both CREATE SCHEMA IF NOT EXISTS
# iceberg.sales, so as `dbt-sales` / `northpeak-marts` they are denied (first dev install,
# 2026-11-20). On dev they run as the schema's own domain principal, `sales` (dbt: under its
# image block above).
marts:
  enabled: true          # the Northpeak gold mart, generated in SQL (no real data)
  rows: 150000
  trino:
    user: sales

# Seeded state survives a pod restart; `scripts/dev/reset.sh` wipes it on purpose.
objectStorage:
  persistence:
    enabled: true
    size: 10Gi
  # 512Mi limit (was 1Gi): MinIO uses about 135Mi on dev (kubectl top, 21 Nov 2026). The 512Mi
  # makes room for the Dagster code server's 1.5Gi limit under the dev memory-limit gate (85 %).
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1, memory: 512Mi }

# --- Reduced sizes ------------------------------------------------------------------------
# Requests and limits sized to one demo tenant and the acceptance journeys. JVM heaps shrink
# with their limits so a limit is never below its heap.
trino:
  jvm:
    maxHeap: 1536M
  query:
    maxMemory: 1GB
    maxMemoryPerNode: 640MB
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: 2, memory: 2Gi }

# Trino cut-over prerequisite (a): OPA pulls its data as bundles from os-ui (os-data, os-grants;
# WP-11) instead of the reconciler's pushes. The bundle volume keeps the last good bundles.
opa:
  dataBundle:
    enabled: true

opensearch:
  # No privileged init container in agentic-os (it enforces the baseline Pod Security Standard on
  # dev): vm.max_map_count is set by a DaemonSet in kube-system (scripts/dev/manifests/node-sysctl.yaml).
  sysctlInit:
    enabled: false
  opensearchJavaOpts: "-Xms512m -Xmx512m"
  resources:
    requests: { cpu: 150m, memory: 768Mi }
    limits: { cpu: 1, memory: 1280Mi }

clickhouse:
  # Langfuse's trace tables live here. Without a volume a pod restart drops them, and every trace
  # read then fails (dev, 21 Nov 2026: "Unknown table ... traces" after the 06:41 restart) until
  # Langfuse runs its migrations again, which it does only when its own pods start. Production has
  # this on; the size is the chart's, so the smoke test's volume check holds on dev too.
  persistence:
    enabled: true
  resources:
    requests: { cpu: 100m, memory: 768Mi }
    limits: { cpu: 1, memory: 1280Mi }

docling:
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { cpu: 2, memory: 1536Mi }

polaris:
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: 1, memory: 768Mi }

litellm:
  proxy_config:
    # NO model_list here, nor in the private overlay. Dev's models are LiteLLM DATABASE rows, created by hand
    # in dev's LiteLLM (with dev's own provider keys) and checked against production by
    # scripts/check-gateway-parity-live.mjs. scripts/deploy.sh layers deploy/gateway-no-config-models.yaml
    # (an empty list) last, so a list set anywhere else would be dropped anyway
    # (docs/components/litellm.md "Models live in LiteLLM's database").
    litellm_settings:
      max_budget: 20
      budget_duration: 30d
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: 1, memory: 1536Mi }

langfuse:
  langfuse:
    # The operators' Langfuse address (ingress.hosts.langfuse above); the chart refuses any other.
    nextauth:
      url: https://langfuse.dev.agentic.datamasterclass.com/tools/langfuse
    web:
      resources:
        requests: { cpu: 100m, memory: 512Mi }
        limits: { cpu: 1, memory: 1Gi }
    worker:
      resources:
        requests: { cpu: 100m, memory: 512Mi }
        limits: { cpu: 1, memory: 768Mi }

postgres:
  # Trino cut-over prerequisite (a), dev first (docs/components/trino-cutover.md): the governance
  # database (WP-07) the OPA bundles and the run grants read. The admin Secret and its role are
  # created by scripts/dev/bootstrap-secrets.sh; the three role passwords are in the private overlay.
  governance:
    enabled: true
    adminSecretName: postgres-governance-admin
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: 1, memory: 768Mi }

# Valkey stays at the old 256Mi on dev (the dev node's memory-limit budget, capacity.dev*.yaml, has
# no room for production's 512Mi). The --maxmemory cap is what prevents the OOMKill, so it is set
# ~20 % under this limit: a full Valkey refuses writes (noeviction) instead of being killed.
valkey:
  maxMemory: 200mb
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

dataRunner:
  # The chart pins data-runner itself now (repository, tag AND dataRunner.image.digest); dev only
  # lowers its resources. A tag carrying the digest again rendered "…@sha256:x@sha256:x"
  # (InvalidImageName) on the first dev install.
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { cpu: 1, memory: 512Mi }

queryTool:
  image:
    repository: ghcr.io/aborek/sovereign-os/query-tool
    tag: "0.6.2@sha256:3abffd091adf1a53c8d4fddd245f065f5da94625623e66b511c01855b92a8976"
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { cpu: 1, memory: 512Mi }

dagster:
  # The Dagster subcharts take their OWN pull secrets: global.imagePullSecrets does not reach
  # them, and the org image is private. The webserver, the daemon, the code location and every
  # launched run pod need it (first dev install, 2026-11-20: ImagePullBackOff without it).
  imagePullSecrets: [{ name: registry-pull-secret }]
  dagster-user-deployments:
    imagePullSecrets: [{ name: registry-pull-secret }]
  runLauncher:
    config:
      k8sRunLauncher:
        imagePullSecrets: [{ name: registry-pull-secret }]
  dagsterWebserver:
    # Applies to BOTH webservers: the editable one and the read-only one behind /tools/dagster
    # (dagsterWebserver.enableReadOnly, docs/ops/tool-consoles.md). The memory limit is 448Mi, not
    # 512Mi, so the second pod fits the dev node's 85 % memory-limit budget (capacity.dev.yaml:
    # 84.8 % with it). Watch `kubectl top` on dev after the first apply; raise it if either OOMs.
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { cpu: 1, memory: 448Mi }
  dagsterDaemon:
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { cpu: 1, memory: 512Mi }

# WP-05: the observability stack (Collector, VictoriaMetrics, VictoriaLogs) is OFF on the dev node.
# Two hard limits of the dev environment: (1) the dev namespaces enforce Pod Security "baseline"
# (scripts/dev/manifests/namespaces.yaml), which refuses the Collector's container-log reader
# (hostPath /var/log/pods, root); (2) with the stack the dev render's memory limits reach 88 % of
# the dev node (capacity.dev.yaml gate: 85 %). Production runs it. Backup alerts stay on.
observability:
  enabled: false
  # When observability is switched on here: the dev CI account cannot create cluster RBAC, so the
  # kube-state-metrics grant (list/watch pods + nodes) is operator-owned:
  # scripts/dev/manifests/kube-state-metrics-rbac.yaml (kept equal to the chart by
  # scripts/check-kube-state-metrics-chart.mjs).
  kubeStateMetrics:
    createClusterRole: false

# APP BUILDER on dev (workstream H; docs/superpowers/plans/2026-11-26-app-builder.md "H", "Dev capacity").
# The switch is ON so the owner can walk the Stories, Chat and Code-and-runs views, the go-live rules and
# the app sign-in on dev - with BUILDS OFF and APP DATABASES OFF (osUI.software.databases above):
#   - builds: no `build.image` (no gated builder digest on files/builder-digests.txt yet) and Tekton is off
#     on dev, so no registry (Zot), no build/push/scan step and no keeper render; os-ui gets an EMPTY app
#     registry and every release path answers the `no_builder` reason (Code and runs shows it).
# Capacity (scripts/check-capacity.mjs against capacity.dev-m2i4.yaml): the switch adds NO workload, only
# the env namespaces' quota and limit range, NetworkPolicies, os-ui's Role and admission policies, so CPU
# requests stay at 84.3 % (gate 85 %). Builds or databases on need the plan's dev budget (or a larger
# pool) and their own capacity check.
# OPERATOR STEPS BEFORE THE FIRST DEV DEPLOY WITH THIS (the CI account owns no namespace and changes only
# named admission policies): apply scripts/dev/manifests/namespaces.yaml (apps-dev, apps-prod),
# app-builder-roles.yaml (os-ui's Roles there) and ci-rbac.yaml, and run scripts/dev/bootstrap-secrets.sh once for the app identity token key
# `os-app-token-key` (docs/ops/dev-environment.md "App Builder on dev").
#
# App Builder BUILD isolation on dev (#398): the dedicated, tainted build pool `builds` of the dev cluster
# (deploy/envs/dev/main.tf; minimum 0, so it costs nothing while no build runs). Inert until a gated
# builder image is set (`build.image`; the switch alone renders no build step). The build-image pod gets
# this nodeSelector and toleration (the admission policy app-checks-build-pod refuses it without them) and
# the PriorityClass soa-build-pool (-10), which the cluster autoscaler does not treat as expendable, so a
# Pending build brings the pool from 0 to 1 node. Its requests (buildkitd 500m / 1 Gi, limits 2 CPU / 3 Gi;
# chart defaults) fit the pool's g2i.2 (2 vCPU / 8 GB). docs/components/app-builder-build.md
# "Dedicated build pool with scale-to-zero".
softwareRunner:
  environments:
    enabled: true
    createNamespaces: false          # operator-owned: scripts/dev/manifests/namespaces.yaml
    createOsUiRoles: false           # operator-applied: scripts/dev/manifests/app-builder-roles.yaml
    # Small quotas: two demo apps x Dev/Prod plus one preview slot (plan "Dev capacity").
    quota:
      dev: { pods: "8", cpu: "500m", memory: 2Gi }
      prod: { pods: "4", cpu: "300m", memory: 1Gi }
    build:
      isolation: dedicated-nodes
      dedicatedNodes:
        nodeSelector: { soa.dev/pool: builds }
        tolerations: [{ key: soa.dev/build, operator: Exists, effect: NoSchedule }]

