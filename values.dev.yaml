# =============================================================================
# values.dev.yaml — the DEV environment profile (docs/ops/dev-environment.md).
# =============================================================================
# Layered on the chart defaults, then the PRIVATE overlay that scripts/dev/bootstrap-secrets.sh
# generates (random credentials, the synthetic demo users, the dev model key):
#
#   scripts/deploy.sh --env dev --from-registry main-<sha>
#     = helm upgrade --install agentic-os charts/sovereign-agentic-os \
#         -f values.dev.yaml -f <private overlay from the dev cluster> --set osUI.image.tag=...
#
# WHAT DEV IS. The same chart and the same real components as production, at the same pinned
# images, on ONE smaller node (g2i.8, 8 vCPU / 32 GB). Only sizes are smaller. No component is
# swapped for an imitation; the only optional stand-in is the model upstream
# (values.dev.model-stub.yaml), and only when the owner chooses it.
#
# DATA. Synthetic only: the Northpeak gold mart (marts, generated in SQL), the Northpeak demo
# cast and their demo domains (seed/ecommerce, run by scripts/dev/seed.sh). No production data,
# no real user list, no backup of production is ever restored here.
#
# SECRETS. Like production, the chart renders its own Secrets (global.profile: local). EVERY
# credential literal of values.yaml is replaced by a random value in the private overlay; this
# file holds none. Capacity: charts/sovereign-agentic-os/capacity.dev.yaml (the dev node budget),
#   node scripts/check-capacity.mjs --profile default \
#     --budget charts/sovereign-agentic-os/capacity.dev.yaml --values values.dev.yaml
# =============================================================================

global:
  profile: local       # the chart renders its Secrets; the private overlay makes them random
  storageClass: ""     # SKE CSI default
  # The bespoke images are private GHCR packages. bootstrap-secrets.sh creates this Secret from a
  # READ-ONLY token (read:packages) the owner gives it; dev never holds a push credential.
  imagePullSecrets:
    - name: registry-pull-secret

# --- Public route: ONE host, in the dev zone ----------------------------------------------------
# The dev ingress-nginx Service is pinned to the reserved dev IP (scripts/dev/platform.sh), and
# cert-manager issues the certificate. LiteLLM and Langfuse stay unpublished, as in production.
ingress:
  enabled: true
  className: nginx
  tlsIssuer: letsencrypt-prod
  hosts:
    osUI: dev.agentic.datamasterclass.com

# --- Images: the registry-qualified images production runs ---------------------------------
# The chart's defaults for these four name the laptop's local builds (`sovereign-os/...`, loaded
# into kind), which a real cluster cannot pull. These are the images production runs (read
# 2026-11-20 with `kubectl get deploy`), pinned here by digest. (data-runner and query-tool: under
# their resource blocks below; one YAML key per component.)
egressProxy:
  image:
    repository: ghcr.io/aborek/sovereign-os/egress-proxy
    tag: "0.1.0@sha256:8426ee9d0cfe297e6fe961bab6a3a9854e1b97cb6ae713158e826f84f456f9ee"
webFetch:
  image:
    repository: ghcr.io/aborek/sovereign-os/web-fetch
    tag: "0.1.0@sha256:1487d74ff0d7e7327793525701720479df21eecf1ce6bb0b11b228deae08686d"
dbt:
  image:
    repository: ghcr.io/aborek/sovereign-os/dbt
    tag: "0.2.0@sha256:dcec728155d4ff03f7b999753cb5ec00fd84e37d2cf8be3641a0ee426ae915d5"
  trino:
    user: sales     # see "Synthetic seed" below: the fresh-install schema rule

osUI:
  # WP-05: no node-list ClusterRole on dev — the dev CI account deploys namespaced objects only
  # (scripts/dev/manifests/ci-rbac.yaml) and may not create cluster RBAC. Platform says the nodes
  # are not readable (403 → forbidden), never an invented list.
  nodesReader:
    enabled: false
  publicUrl: https://dev.agentic.datamasterclass.com
  offlineMock: refuse            # never invented numbers, also on dev
  allowOfflineUserSeed: false
  externalConnectorsEnabled: false
  # Same tabs as production, so dev tests what prod runs (an empty value shows only a minimal set).
  enabledTabs: "home,agents,dashboards,software,data,metrics,files,knowledge,connections,monitoring,governance,admin,workflows"
  # The agent worker as its own Deployment, as in production (AT-c deletes it mid-run).
  worker:
    enabled: true
    resources:
      requests: { cpu: 100m, memory: 384Mi }
      limits: { cpu: 1, memory: 1Gi }
  resources:
    requests: { cpu: 70m, memory: 192Mi }
    limits: { cpu: 1, memory: 1Gi }
  # A LOW budget per agent system (production: 5 a week).
  agentSystemKey:
    maxBudget: 1
    budgetDuration: "7d"

# --- Models: the same STACKIT AI Model Serving API, a SEPARATE low-budget key --------------
# The key is the dev project's own Model Serving token (docs/ops/dev-environment.md "Dev model
# key"). It is NOT in this namespace: scripts/dev/bootstrap-secrets.sh puts it into the
# namespace dev-model-key, where a small reverse proxy adds it to each request. The CI account
# has no rights in that namespace, so it cannot read the key. LiteLLM calls the proxy, and its
# own api_key below is a placeholder.
stackitPremium:
  apiBaseUrl: http://model-key-proxy.dev-model-key.svc.cluster.local:8080/v1
  local:
    apiKey: held-by-model-key-proxy
# STACKIT tokens carry no spend limit, so the caps are LiteLLM's:
#   - a TOTAL proxy budget (`litellm_settings.max_budget` + `budget_duration`, LiteLLM "Global
#     proxy budget": https://docs.litellm.ai/docs/proxy/users#global-proxy). It covers every key,
#     the master key included: 20 per 30 days (in the price book's currency, EUR).
#   - the shared agent key at 5 a week (production: 25) and 1 a week per agent system (above).
# As in production, no in-cluster model: the STACKIT API is the upstream.
mockModel:
  enabled: false

litellmAgentKey:
  maxBudget: 5
  budgetDuration: "7d"
  maxParallelRequests: 4

# --- Synthetic seed -----------------------------------------------------------------------
# On a FRESH install os-ui writes Trino's rules.json at boot, before the post-install hooks run,
# and it grants schema `sales` only to the sales domain principals. The two hooks that build the
# demo (dbt-build, weight 15; northpeak-marts-init, weight 20) both CREATE SCHEMA IF NOT EXISTS
# iceberg.sales, so as `dbt-sales` / `northpeak-marts` they are denied (first dev install,
# 2026-11-20). On dev they run as the schema's own domain principal, `sales` (dbt: under its
# image block above).
marts:
  enabled: true          # the Northpeak gold mart, generated in SQL (no real data)
  rows: 150000
  trino:
    user: sales

# Seeded state survives a pod restart; `scripts/dev/reset.sh` wipes it on purpose.
objectStorage:
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: 1, memory: 1Gi }

# --- Reduced sizes ------------------------------------------------------------------------
# Requests and limits sized to one demo tenant and the acceptance journeys. JVM heaps shrink
# with their limits so a limit is never below its heap.
trino:
  jvm:
    maxHeap: 1536M
  query:
    maxMemory: 1GB
    maxMemoryPerNode: 640MB
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: 2, memory: 2Gi }

opensearch:
  # No privileged init container in agentic-os (it enforces the baseline Pod Security Standard on
  # dev): vm.max_map_count is set by a DaemonSet in kube-system (scripts/dev/manifests/node-sysctl.yaml).
  sysctlInit:
    enabled: false
  opensearchJavaOpts: "-Xms512m -Xmx512m"
  resources:
    requests: { cpu: 150m, memory: 768Mi }
    limits: { cpu: 1, memory: 1280Mi }

clickhouse:
  # 1280Mi OOM-killed ClickHouse 44x in 7h on the m2i4 dev node (Langfuse trace inserts + merges).
  resources:
    requests: { cpu: 100m, memory: 1Gi }
    limits: { cpu: 1, memory: 3Gi }

docling:
  resources:
    requests: { cpu: 250m, memory: 768Mi }
    limits: { cpu: 2, memory: 1536Mi }

polaris:
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: 1, memory: 768Mi }

litellm:
  proxy_config:
    # Same model mapping as production: STACKIT model ids carry their own provider prefix
    # (openai/gpt-oss-20b), so LiteLLM needs openai/openai/gpt-oss-20b. No mock model on dev.
    model_list:
    - litellm_params:
        api_base: os.environ/STACKIT_API_BASE
        api_key: os.environ/STACKIT_API_KEY
        model: openai/openai/gpt-oss-20b
      model_info:
        input_cost_per_token: 1.5e-07
        max_input_tokens: 131000
        max_output_tokens: 8192
        mode: chat
        output_cost_per_token: 2.5e-07
        supports_function_calling: true
        supports_vision: false
      model_name: sovereign-default
    - litellm_params:
        api_base: os.environ/STACKIT_API_BASE
        api_key: os.environ/STACKIT_API_KEY
        model: openai/openai/gpt-oss-20b
      model_info:
        input_cost_per_token: 1.5e-07
        max_input_tokens: 131000
        max_output_tokens: 8192
        mode: chat
        output_cost_per_token: 2.5e-07
        supports_function_calling: true
        supports_vision: false
      model_name: sovereign-mock
    - litellm_params:
        api_base: os.environ/STACKIT_API_BASE
        api_key: os.environ/STACKIT_API_KEY
        extra_body:
          chat_template_kwargs:
            enable_thinking: false
        model: openai/Qwen/Qwen3-VL-235B-A22B-Instruct-FP8
        timeout: 300
      model_info:
        input_cost_per_token: 1.5e-06
        max_input_tokens: 200000
        max_output_tokens: 16384
        mode: chat
        output_cost_per_token: 1.75e-06
        supports_function_calling: true
        supports_vision: true
      model_name: sovereign-reasoning
    - litellm_params:
        api_base: os.environ/STACKIT_API_BASE
        api_key: os.environ/STACKIT_API_KEY
        extra_body:
          chat_template_kwargs:
            enable_thinking: false
        model: openai/Qwen/Qwen3-VL-235B-A22B-Instruct-FP8
      model_info:
        input_cost_per_token: 1.5e-06
        max_input_tokens: 200000
        max_output_tokens: 16384
        mode: chat
        output_cost_per_token: 1.75e-06
        supports_function_calling: true
        supports_vision: true
      model_name: sovereign-reasoning-fast
    - litellm_params:
        api_base: os.environ/STACKIT_API_BASE
        api_key: os.environ/STACKIT_API_KEY
        extra_body:
          chat_template_kwargs:
            enable_thinking: false
        model: openai/Qwen/Qwen3-VL-235B-A22B-Instruct-FP8
      model_info:
        input_cost_per_token: 1.5e-06
        max_input_tokens: 200000
        max_output_tokens: 16384
        mode: chat
        output_cost_per_token: 1.75e-06
        supports_function_calling: true
        supports_vision: true
      model_name: sovereign-vision
    - litellm_params:
        api_base: os.environ/STACKIT_API_BASE
        api_key: os.environ/STACKIT_API_KEY
        extra_body:
          chat_template_kwargs:
            enable_thinking: false
        model: openai/Qwen/Qwen3-VL-235B-A22B-Instruct-FP8
      model_info:
        input_cost_per_token: 1.5e-06
        max_input_tokens: 200000
        max_output_tokens: 16384
        mode: chat
        output_cost_per_token: 1.75e-06
        supports_function_calling: true
        supports_vision: true
      model_name: sovereign-premium
    - litellm_params:
        api_base: os.environ/STACKIT_API_BASE
        api_key: os.environ/STACKIT_API_KEY
        model: openai/Qwen/Qwen3-VL-Embedding-8B
      model_info:
        input_cost_per_token: 8.0e-08
        max_input_tokens: 32000
        mode: embedding
        output_cost_per_token: 0
        output_vector_size: 4096
        supports_vision: false
      model_name: sovereign-embed
    litellm_settings:
      max_budget: 20
      budget_duration: 30d
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: 1, memory: 1536Mi }

langfuse:
  langfuse:
    web:
      resources:
        requests: { cpu: 100m, memory: 512Mi }
        limits: { cpu: 1, memory: 1Gi }
    worker:
      resources:
        requests: { cpu: 100m, memory: 512Mi }
        limits: { cpu: 1, memory: 768Mi }

postgres:
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: 1, memory: 768Mi }

dataRunner:
  # The chart pins data-runner itself now (repository, tag AND dataRunner.image.digest); dev only
  # lowers its resources. A tag carrying the digest again rendered "…@sha256:x@sha256:x"
  # (InvalidImageName) on the first dev install.
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { cpu: 1, memory: 512Mi }

queryTool:
  image:
    repository: ghcr.io/aborek/sovereign-os/query-tool
    tag: "0.6.2@sha256:3abffd091adf1a53c8d4fddd245f065f5da94625623e66b511c01855b92a8976"
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { cpu: 1, memory: 512Mi }

dagster:
  # The Dagster subcharts take their OWN pull secrets: global.imagePullSecrets does not reach
  # them, and the org image is private. The webserver, the daemon, the code location and every
  # launched run pod need it (first dev install, 2026-11-20: ImagePullBackOff without it).
  imagePullSecrets: [{ name: registry-pull-secret }]
  dagster-user-deployments:
    imagePullSecrets: [{ name: registry-pull-secret }]
  runLauncher:
    config:
      k8sRunLauncher:
        imagePullSecrets: [{ name: registry-pull-secret }]
  dagsterWebserver:
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { cpu: 1, memory: 512Mi }
  dagsterDaemon:
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { cpu: 1, memory: 512Mi }

# WP-05: the observability stack (Collector, VictoriaMetrics, VictoriaLogs) is OFF on the dev node.
# Two hard limits of the dev environment: (1) the dev namespaces enforce Pod Security "baseline"
# (scripts/dev/manifests/namespaces.yaml), which refuses the Collector's container-log reader
# (hostPath /var/log/pods, root); (2) with the stack the dev render's memory limits reach 88 % of
# the dev node (capacity.dev.yaml gate: 85 %). Production runs it. Backup alerts stay on.
observability:
  enabled: false

