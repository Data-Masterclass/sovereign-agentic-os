#
# docling-live — prove the Docling hop against the REAL docling-serve image, not a mock.
#
# Builds our derived image (images/extensions/docling: upstream docling-serve-cpu v1.38.2 plus the
# Apache-2.0 TableFormer v2 weights, v1 weights removed), starts it with the chart's own
# DOCLING_SERVE_* settings and an API key, and runs os-ui's docling-live.ci.test.ts against it with
# DOCLING_LIVE_REQUIRED=1 (a skip is a failure). Also runs the chart test for the Docling
# Deployment, Secret and NetworkPolicy. Separate from ci.yml because the image is several GB and
# only changes when Docling's files do. Actions are pinned to commit SHAs, as ci.yml does.
name: docling-live

on:
  pull_request:
    branches: [main]
    paths:
      - images/extensions/docling/**
      - os-ui/tabs/files/lib/ingest/**
      - os-ui/tabs/files/lib/pipeline-server.ts
      - charts/sovereign-agentic-os/templates/base/os-ui/_os-ui-env.tpl
      - charts/sovereign-agentic-os/templates/extensions/docling/**
      - charts/sovereign-agentic-os/templates/base/network/docling-ingress-policy.yaml
      - charts/sovereign-agentic-os/values.yaml
      - scripts/tests/docling-*
      - .github/workflows/docling-live.yml
  push:
    branches: [main]
    paths:
      - images/extensions/docling/**
      - os-ui/tabs/files/lib/ingest/**
      - os-ui/tabs/files/lib/pipeline-server.ts
      - charts/sovereign-agentic-os/templates/base/os-ui/_os-ui-env.tpl
      - charts/sovereign-agentic-os/templates/extensions/docling/**
      - charts/sovereign-agentic-os/templates/base/network/docling-ingress-policy.yaml
      - scripts/tests/docling-*
      - .github/workflows/docling-live.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docling-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docling-live:
    name: docling-live
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The docling-serve image is several GB; the runner's preinstalled SDKs are not needed here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install (os-ui)
        run: npm --prefix os-ui ci
      - name: Setup Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.3
      - name: Resolve chart dependencies
        run: |
          helm dependency build charts/sovereign-agentic-os \
            || helm dependency update charts/sovereign-agentic-os
      - name: Docling chart test (limits, key, probes, NetworkPolicy)
        run: bash scripts/tests/docling-chart.test.sh
      - name: Build the derived Docling image
        run: docker build -t sovereign-os/docling:ci images/extensions/docling
      - name: Live test against the real docling-serve
        env:
          DOCLING_LIVE_IMAGE: sovereign-os/docling:ci
          DOCLING_LIVE_LOG: ${{ runner.temp }}/docling.log
        run: bash scripts/tests/docling-live.sh
      - name: Docling container log (on failure)
        if: failure()
        run: tail -200 "${{ runner.temp }}/docling.log" || true
