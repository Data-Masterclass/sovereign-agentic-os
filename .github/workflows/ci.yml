#
# CI — runs on pull requests targeting `main` AND on every push to `main`. The job ids below
# (build, helm-lint, secret-scan) are STABLE and are wired as required status checks in the
# branch ruleset. Actions are pinned to commit SHAs.
#
# WHY `push: main` TOO (2026-11-19). A PR run tests the PR's head, not what lands on main: a
# rebase merge writes NEW commits, and two PRs that were each green can be red together. Before
# this, main only ran `license-gate` on push, so the merged combination never had a full run and
# nothing could prove a release commit was tested. The SAME jobs run on both events (one file,
# no second copy), and `scripts/lib/workflow-status.sh` — used by `build-images.yml` and
# `scripts/release.sh` — accepts only a green PUSH run of this workflow on `main` for the exact
# commit being released.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# One group per ref: a newer push to main cancels the older main run (its commit then has no
# green run and cannot be released — release the newer one), and a PR's group is its own
# `refs/pull/<n>/merge`, so PR runs and main runs never cancel each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-ui:
    name: test-ui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install (os-ui)
        run: npm --prefix os-ui ci
      - name: Test (os-ui)
        run: npm --prefix os-ui test
      # gate.sh's three chart checks (`check-worker-env.mjs`, `check-trino-rules-chart.mjs`)
      # run `helm template`, which needs BOTH helm and the subchart tarballs — and the tarballs
      # are gitignored, so a fresh runner has neither. Without this the gate either died on helm's
      # raw "found in Chart.yaml, but missing in charts/ directory" or (once the scripts learned to
      # skip) silently asserted nothing on the one machine that is meant to enforce them. Same two
      # steps as the `helm-lint` job below; the repositories come from Chart.yaml's pinned
      # `repository` + `version` fields, so `update` resolves exactly the pinned versions.
      - name: Setup Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.3
      - name: Resolve chart dependencies (gate.sh renders the chart)
        run: |
          helm dependency build charts/sovereign-agentic-os \
            || helm dependency update charts/sovereign-agentic-os
      - name: Builder-vertical regression gate
        working-directory: os-ui
        # CI=true makes a skipped chart check a hard failure (see the scripts' headers).
        run: bash scripts/gate.sh

      - name: Structure ratchet (core / tabs / components)
        run: node scripts/check-structure.mjs

      # Langfuse web: sign-up off, and the NetworkPolicy admits only the OS's own callers.
      # Renders the chart (the dependencies were built above); CI=true turns a skip into a failure.
      - name: Langfuse hardening chart test
        run: bash scripts/tests/langfuse-hardening.test.sh

      # WP-47 capacity gate tests: the real chart passes, and the negative twins (2 extra CPU
      # cores, over-committed memory limits, a container with no memory request, an empty render)
      # fail; the limit trims and the PriorityClass ladder are asserted on the rendered chart, both
      # profiles. The deploy test runs the real deploy.sh with a faked cluster: over-committing
      # release values or VALUES_OVERLAY stop it before the backup and `helm upgrade`.
      - name: Capacity gate tests
        run: |
          node --test scripts/tests/check-capacity.test.mjs
          bash scripts/tests/deploy-capacity-gate.test.sh

      # The registry deploy mode and the widened conflict-copy check. No Docker, no network, no
      # cluster: it drives `deploy.sh --verify-only` against a fake digest probe and runs the
      # real gate.sh / check-structure.mjs inside throwaway trees. It also asserts the CI worker
      # smoke in build-images.yml is still deploy.sh's command verbatim.
      - name: deploy.sh --from-registry + conflict-copy tests
        run: bash scripts/tests/deploy-from-registry.test.sh

      # The release gate itself (scripts/release.sh, scripts/lib/workflow-status.sh), the post-
      # deploy smoke test and the deploy's values diff — all against stubs: real git in
      # throwaway repositories, fake gh / kubectl / helm / curl. No network, no cluster.
      - name: release.sh + smoke-test.sh + values-diff tests
        run: |
          bash scripts/tests/release.test.sh
          bash scripts/tests/smoke-test.test.sh
          bash scripts/tests/values-diff.test.sh

      # Generates the code map and fails if the generator cannot (a broken
      # manifest, an unreadable tab). Deliberately NOT `--check`: comparing a
      # COMMITTED copy made the artifact a merge-conflict magnet without
      # catching anything a plain run does not.
      - name: Code map generates cleanly
        run: node scripts/build-docs.mjs

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test-ui
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install (os-ui)
        run: npm --prefix os-ui ci
      - name: Build (os-ui)
        run: npm --prefix os-ui run build
      - name: License gate (os-ui)
        run: npm --prefix os-ui run check:licenses

  test-python:
    name: test-python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install "pytest>=8.0,<9"
      # data-runner: existing + new failure-mode tests
      - name: Install data-runner deps
        run: pip install -r images/extensions/data-runner/requirements.txt
      - name: pytest (data-runner)
        run: python3 -m pytest -q images/extensions/data-runner/test_app.py
      # web-fetch: new tests (zero tests previously)
      - name: pytest (web-fetch)
        run: python3 -m pytest -q images/base/web-fetch/test_app.py
      # query-tool: the governed Trino door. `test_query_budget.py` is what closes checklist X9's
      # handler half (the `query_max_run_time` + `request_timeout` + `max+1` ceilings), and
      # `test_execute_guard.py` / `test_bearer.py` guard the write path and the bearer check.
      # ONE discovery pass (iteration 2). Part F had to run these per file because each module
      # installed its own `sys.modules.setdefault` stubs, so the first importer bound `app` to its
      # fake trino and every later module's recorder stayed empty — 7 of 12 budget tests failed
      # together and all passed alone. The stubs now live once in `tests/_stubs.py`, the suites
      # that monkeypatch `app` restore it, and `tests/test_isolation.py` fails by name if either
      # regresses. Per-file would now HIDE an ordering bug, so the whole directory runs at once.
      - name: unittest (query-tool)
        run: python3 -m unittest discover -s images/extensions/query-tool/tests
      # dagster: the code location the OS generates — `parse_schedules`, `ensure_checkout`,
      # `partition_definitions`, the source assets and the chart contract (checklist D7/D8/D11).
      - name: Install dagster-test deps
        run: pip install "pyyaml>=6,<7"
      - name: pytest (dagster extension)
        run: python3 -m pytest -q images/extensions/dagster/tests/test_os_projects.py
      # agent-runtime: deleted in the engine rebuild (A5) — agent systems execute as a real
      # LangGraph StateGraph inside os-ui, covered by `npm --prefix os-ui test`.

  # OPA policy tests — skipped in CI if the opa binary is unavailable; a comment
  # explains how to run locally. Adding the full setup-opa action adds ~30s and
  # OPA is not currently on the required-checks list; add it when policies grow.
  #
  # To run locally:
  #   opa test tests/policies/ --v1-compatible
  #
  # Uncomment the block below and add 'test-opa' to required status checks when ready:
  #
  # test-opa:
  #   name: test-opa
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
  #     - uses: open-policy-agent/setup-opa@34a30e8a924d1b03ce2cf70eca3d7d0888cee374 # v2.2.0
  #       with:
  #         version: latest
  #     - run: opa test tests/policies/ --v1-compatible

  helm-lint:
    name: helm-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.3
      - name: Resolve chart dependencies
        run: |
          helm dependency build charts/sovereign-agentic-os \
            || helm dependency update charts/sovereign-agentic-os
      - name: Helm lint
        run: helm lint charts/sovereign-agentic-os

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # gitleaks-action v2 requires a PAID licence for ORGANISATION repos; without
      # GITLEAKS_LICENSE it exits "missing gitleaks license" BEFORE scanning, so this
      # gate reported failure while never actually scanning anything (2026-09-23).
      # The gitleaks CLI itself is MIT-licensed — run it directly, pinned by version,
      # and scan ONLY this PR's commit range so pre-existing history cannot fail
      # every PR. Fails the job (--exit-code 1) when a secret is found; --redact keeps
      # any finding out of the public log.
      # On a push to main the range is the push itself (`before..sha`: every commit a rebase
      # merge wrote). An all-zero `before` (a newly created ref) scans just the head commit.
      - name: Gitleaks scan (the PR's or the push's commits)
        env:
          GITLEAKS_VERSION: '8.21.2'
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          range="${BASE_SHA}..${HEAD_SHA}"
          # empty, or only zeros: there is no base commit, so scan the head commit alone
          if [ -z "${BASE_SHA//0/}" ]; then range="${HEAD_SHA}^!"; fi
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect \
            --source . \
            --log-opts "$range" \
            --redact --no-banner --exit-code 1
