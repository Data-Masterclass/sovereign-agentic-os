#
# CI — runs on pull requests targeting `main` AND on every push to `main`. The job ids below
# (build, helm-lint, secret-scan) are STABLE and are wired as required status checks in the
# branch ruleset. Actions are pinned to commit SHAs.
#
# WHY `push: main` TOO (2026-11-19). A PR run tests the PR's head, not what lands on main: a
# rebase merge writes NEW commits, and two PRs that were each green can be red together. Before
# this, main only ran `license-gate` on push, so the merged combination never had a full run and
# nothing could prove a release commit was tested. The SAME jobs run on both events (one file,
# no second copy), and `scripts/lib/workflow-status.sh` — used by `build-images.yml` and
# `scripts/release.sh` — accepts only a green PUSH run of this workflow on `main` for the exact
# commit being released.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Nightly: the GLUE-6 component validators run unconditionally (a PR only runs them when it
  # touches what they validate). A schedule run is never a release candidate: workflow-status.sh
  # accepts only PUSH runs.
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

# One group per ref: a newer push to main cancels the older main run (its commit then has no
# green run and cannot be released — release the newer one), and a PR's group is its own
# `refs/pull/<n>/merge`, so PR runs and main runs never cancel each other.
# The nightly run has its OWN group, so it can never cancel a push run on main (whose green run
# is what a release needs).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

jobs:
  test-ui:
    name: test-ui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install (os-ui)
        run: npm --prefix os-ui ci
      - name: Test (os-ui)
        run: npm --prefix os-ui test
      # gate.sh's three chart checks (`check-worker-env.mjs`, `check-trino-rules-chart.mjs`)
      # run `helm template`, which needs BOTH helm and the subchart tarballs — and the tarballs
      # are gitignored, so a fresh runner has neither. Without this the gate either died on helm's
      # raw "found in Chart.yaml, but missing in charts/ directory" or (once the scripts learned to
      # skip) silently asserted nothing on the one machine that is meant to enforce them. Same two
      # steps as the `helm-lint` job below; the repositories come from Chart.yaml's pinned
      # `repository` + `version` fields, so `update` resolves exactly the pinned versions.
      - name: Setup Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.3
      - name: Resolve chart dependencies (gate.sh renders the chart)
        run: |
          helm dependency build charts/sovereign-agentic-os \
            || helm dependency update charts/sovereign-agentic-os
      - name: Builder-vertical regression gate
        working-directory: os-ui
        # CI=true makes a skipped chart check a hard failure (see the scripts' headers).
        run: bash scripts/gate.sh

      - name: Structure ratchet (core / tabs / components)
        run: node scripts/check-structure.mjs

      # Glue-discipline rules (design 00 §8.3 + artifact contract), ratcheted against
      # scripts/structure-baseline.json → glue, then their negative twins: one fixture per rule
      # that must turn the checker red naming that rule.
      # `!cancelled()`: they are pure static checks, so they report even when an earlier step
      # failed — a bad PR always sees every glue rule it breaks, by name.
      - name: Glue-discipline ratchet (GLUE-1 … GLUE-10)
        if: ${{ !cancelled() }}
        run: node scripts/check-glue.mjs
      - name: Glue-discipline negative twins + the verifier's evasion cases
        if: ${{ !cancelled() }}
        run: node --test scripts/tests/check-glue.test.mjs scripts/tests/check-glue-evasions.test.mjs
      # The baseline may only shrink. A change that adds a fingerprint (or raises a check-structure
      # count) fails unless it also sets a new `glue.$approvedRaise` — the marker the owner sees in
      # the diff. PRs compare with their base, pushes with the commit they replace.
      - name: Glue baseline never grows without an owner-visible marker
        if: ${{ !cancelled() }}
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = schedule ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "glue baseline guard: a $EVENT run has no base commit to compare with — PR and push runs compare"; exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          node scripts/check-glue.mjs --guard FETCH_HEAD
      # WP-55: repository paths come from os-ui/core/infra/repo-layout.ts only (ratchet + twins).
      - name: Repo-layout ratchet
        run: node scripts/check-repo-layout.mjs && node --test scripts/tests/check-repo-layout.test.mjs && bash scripts/tests/repo-layout-chart.test.sh
      # WP-51: the lifecycle tag migration is dry-run only (plans, writes nothing, refuses --apply).
      - name: Lifecycle tag migration (dry-run)
        run: node --test scripts/tests/lifecycle-tags-migrate.test.mjs

      # Langfuse web: sign-up off, and the NetworkPolicy admits only the OS's own callers.
      # Renders the chart (the dependencies were built above); CI=true turns a skip into a failure.
      - name: Langfuse hardening chart test
        run: bash scripts/tests/langfuse-hardening.test.sh

      # LiteLLM: restrict ingress to OS components (defence in depth) — the chart check passes and
      # its four broken twins fail.
      - name: LiteLLM ingress policy tests
        run: bash scripts/tests/litellm-ingress-policy.test.sh

      # LITELLM_SALT_KEY: rendered into litellm-credentials (local), required as an operator Secret
      # on other profiles, with negative twins. The lookup change guard: litellm-salt-key-guard.kind.sh.
      - name: LiteLLM salt key chart test
        run: bash scripts/tests/litellm-salt-key-chart.test.sh

      # WP-10: platform Secrets through External Secrets — the chart renders the same Secret names,
      # types and keys as ExternalSecrets (with negative twins); the migration plan is dry-run only.
      - name: External Secrets chart + migration plan tests
        run: |
          bash scripts/tests/external-secrets-chart.test.sh
          bash scripts/tests/eso-migration-plan.test.sh
          bash scripts/tests/secret-deletion-guard.test.sh

      # rotate-secrets.sh against a fake kubectl/helm: the re-key overlays, mode 600, no value in the
      # output, and the refusals (another cluster, the wrong step, none-stored while values are stored).
      - name: rotate-secrets.sh test
        run: |
          bash scripts/tests/rotate-secrets.test.sh
          bash scripts/tests/readers-restarted.test.sh
          bash scripts/tests/rotation-checks.test.sh
          bash scripts/tests/rotation-readers.test.sh

      # WP-47 capacity gate tests: the real chart passes, and the negative twins (2 extra CPU
      # cores, over-committed memory limits, a container with no memory request, an empty render)
      # fail; the limit trims and the PriorityClass ladder are asserted on the rendered chart, both
      # profiles. The deploy test runs the real deploy.sh with a faked cluster: over-committing
      # release values or VALUES_OVERLAY stop it before the backup and `helm upgrade`.
      - name: Capacity gate tests
        run: |
          node --test scripts/tests/check-capacity.test.mjs
          bash scripts/tests/deploy-capacity-gate.test.sh

      # The registry deploy mode and the widened conflict-copy check. No Docker, no network, no
      # cluster: it drives `deploy.sh --verify-only` against a fake digest probe and runs the
      # real gate.sh / check-structure.mjs inside throwaway trees. It also asserts the CI worker
      # smoke in build-images.yml is still deploy.sh's command verbatim.
      - name: deploy.sh --from-registry + conflict-copy tests
        run: bash scripts/tests/deploy-from-registry.test.sh

      # The release gate itself (scripts/release.sh, scripts/lib/workflow-status.sh), the post-
      # deploy smoke test and the deploy's values diff — all against stubs: real git in
      # throwaway repositories, fake gh / kubectl / helm / curl. No network, no cluster.
      - name: release.sh + smoke-test.sh + values-diff tests
        run: |
          bash scripts/tests/release.test.sh
          bash scripts/tests/env-guard.test.sh
          bash scripts/tests/dev-bootstrap.test.sh
          bash scripts/tests/smoke-test.test.sh
          bash scripts/tests/values-diff.test.sh
          bash scripts/tests/deploy-dagster-image.test.sh
          bash scripts/tests/deploy-data-runner-image.test.sh
          bash scripts/tests/rollback-runner-guard.test.sh
          bash scripts/tests/image-label.test.sh
          bash scripts/tests/dagster-layout-check.test.sh

      # Generates the code map and fails if the generator cannot (a broken
      # manifest, an unreadable tab). Deliberately NOT `--check`: comparing a
      # COMMITTED copy made the artifact a merge-conflict magnet without
      # catching anything a plain run does not.
      - name: Code map generates cleanly
        run: node scripts/build-docs.mjs

  # WP-26: the agent engine's human-in-the-loop and durability proofs against the REAL LangGraph
  # library and the REAL PostgresSaver on the chart's Postgres image. Every test step runs in a
  # fresh node process (a real worker restart). REQUIRE_PG_TESTS=1 makes a missing database fail.
  test-langgraph-pg:
    name: test-langgraph-pg
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:5c855ad7b85e68e48a62f34662853f38b57c1c1d80f3a927ab58034fd6d31c5e
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: agent_runs
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install (os-ui)
        run: npm --prefix os-ui ci
      - name: One copy of @langchain/langgraph and @langchain/core
        working-directory: os-ui
        run: node scripts/check-langgraph-single-copy.mjs
      - name: HITL + durability against Postgres 17
        working-directory: os-ui
        env:
          AGENT_RUNS_TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/agent_runs
          REQUIRE_PG_TESTS: '1'
        run: node --experimental-test-module-mocks --import ./scripts/test-setup.mjs --test --test-concurrency=4 'tabs/**/*.pg.test.ts'

  # WP-21: OpenSearch snapshots and cleanup against the REAL image we ship
  # (images/extensions/opensearch), a REAL S3 store (SeaweedFS) and the chart's own egress proxy,
  # configured from the rendered chart + deploy/overlays/opensearch-s3-snapshots.stackit.yaml.
  # Plus the one-client check and its negative twin.
  test-opensearch:
    name: test-opensearch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Setup Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.3
      - name: One OpenSearch client in os-ui (+ negative twin)
        run: |
          node scripts/check-opensearch-client.mjs
          bash scripts/tests/check-opensearch-client.test.sh
      - name: Chart dependencies
        run: |
          pip install "pyyaml>=6,<7"
          helm dependency build charts/sovereign-agentic-os || helm dependency update charts/sovereign-agentic-os
      # Cleanup is opt-in (a plain release renders no cleanup Job), placeholders refuse to render,
      # and `--dry-run=server` checks the keystore Secret's exact keys against a real API server.
      - name: Chart guards (kind, helm --dry-run=server)
        env:
          CI: 'true'
          WP21_KUBE_CONTEXT: kind-wp21
        run: |
          curl -sSLo /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.30.0/kind-linux-amd64
          echo "517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889  /tmp/kind" | sha256sum -c -
          chmod +x /tmp/kind && /tmp/kind create cluster --name wp21 --wait 120s
          bash scripts/tests/opensearch-chart.test.sh
          /tmp/kind delete cluster --name wp21
          # Dev Pod Security + the dev CI account's limits, by server dry runs (its own kind cluster).
          PATH="/tmp:$PATH" bash scripts/tests/dev-pod-security.kind.sh
          # WP-10: the real External Secrets Operator (pinned) takes the chart's Secrets over in place.
          PATH="/tmp:$PATH" bash scripts/tests/external-secrets.kind.sh
      - name: Start the stack (our image, SeaweedFS, egress proxy)
        run: |
          sudo sysctl -w vm.max_map_count=262144
          bash tests/opensearch/up.sh
      - name: os-snapshot + os-cleanup (real OpenSearch)
        run: node --test --test-concurrency=1 tests/opensearch/os-snapshot.int.test.mjs tests/opensearch/os-cleanup.int.test.mjs tests/opensearch/os-audit-mapping.int.test.mjs
      - name: Logs (on failure)
        if: failure()
        run: |
          docker logs --tail 200 soa-it-opensearch || true
          docker logs --tail 50 soa-it-proxy || true

  # WP-13: the chart's Trino, Polaris (on Postgres 17), OPA and an S3 store, every file and image
  # from the rendered chart (tests/lakehouse/render.py). Resource groups and session defaults
  # (limits), the npm trino-client headers (client), cross-namespace rename + tag DDL (iceberg).
  test-lakehouse:
    name: test-lakehouse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Setup Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.3
      - name: Chart dependencies + harness client
        run: |
          pip install "pyyaml>=6,<7"
          helm dependency build charts/sovereign-agentic-os || helm dependency update charts/sovereign-agentic-os
          npm --prefix tests/lakehouse ci
      - name: Start the lakehouse (chart images and config)
        env:
          LH_WORK_PARENT: ${{ runner.temp }}
        run: bash tests/lakehouse/up.sh --set trino.catalog.iceberg.expireSnapshotsMinRetention=0s
      - name: limits + client + iceberg (real Trino)
        run: node --test --test-concurrency=1 tests/lakehouse/limits.int.test.mjs tests/lakehouse/client.int.test.mjs tests/lakehouse/iceberg.int.test.mjs
      - name: Metric FQN, lane names, dataset versions + Trino SQL errors (real Trino + OPA + Polaris)
        working-directory: os-ui
        env:
          LH_TRINO_URL: http://127.0.0.1:18080
          LH_RUNNER_URL: http://127.0.0.1:18000
          OPA_URL: http://127.0.0.1:18181
        run: |
          npm ci --no-audit --no-fund
          node --experimental-test-module-mocks --import ./scripts/test-setup.mjs --test --test-concurrency=1 tabs/metrics/lib/build/explore-fqn.trino.test.ts tabs/data/lib/lane-names.trino.test.ts tabs/data/lib/dataset-versions.trino.test.ts core/mcp/trino-sql-error.trino.test.ts ../tests/dashboards/native-render.trino.test.ts
      # WP-14: TLS + PASSWORD service users + OPA sidecar ImpersonateUser, on the dual-run render
      # (the steps above are today's plain-HTTP clients, unchanged), then the closed render.
      - name: WP-14 auth, impersonation, parity (dual-run)
        env:
          LH_EXPECT_HTTP: insecure
        run: node --test --test-concurrency=1 tests/lakehouse/auth.int.test.mjs tests/lakehouse/impersonation.int.test.mjs tests/lakehouse/parity.int.test.mjs
      - name: WP-14 query-tool connection code over TLS (real trino client)
        run: |
          pip install "trino>=0.330,<1"
          LH_WORK="$(cat "${TMPDIR:-/tmp}/soa-lakehouse.work")" python3 images/extensions/query-tool/tests/test_trino_tls_int.py -v
      - name: WP-14 closed state (plain HTTP refused), parity against the dual-run answers
        env:
          LH_WORK_PARENT: ${{ runner.temp }}
        run: |
          bash tests/lakehouse/restrict.sh
          LH_EXPECT_HTTP=refused node --test --test-concurrency=1 tests/lakehouse/auth.int.test.mjs tests/lakehouse/impersonation.int.test.mjs tests/lakehouse/parity.int.test.mjs
      - name: Logs (on failure)
        if: failure()
        run: docker compose -p soa-lakehouse logs --tail 120 trino trino-opa opa polaris catalog-init polaris-bootstrap-check data-runner || true
      - name: Stop
        if: always()
        run: bash tests/lakehouse/down.sh || true

  # WP-31: one Langfuse writer, proven on Langfuse's own API. Langfuse 3.194.1 (the live server)
  # from its documented self-host compose, plus the production LiteLLM image and callback
  # settings; the engine runs one traced agent run through the real gateway. The negative twin
  # re-introduces a second writer and must see two generations per call.
  tracing-e2e:
    name: tracing-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install (os-ui)
        run: npm --prefix os-ui ci
      - name: Start Langfuse + LiteLLM
        run: docker compose -f tests/langfuse/compose.yaml -p wp31-langfuse up -d --wait --wait-timeout 600
      - name: Tracing e2e (Langfuse 3.194.1)
        working-directory: os-ui
        env:
          TRACING_E2E: "1"
        run: node --experimental-test-module-mocks --import ./scripts/test-setup.mjs --test --test-concurrency=1 tabs/agents/lib/engine/tracing.e2e.test.ts tabs/agents/lib/module/tracing.e2e.test.ts
      - name: Stack logs on failure
        if: failure()
        run: docker compose -f tests/langfuse/compose.yaml -p wp31-langfuse logs --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose -f tests/langfuse/compose.yaml -p wp31-langfuse down -v

  # GLUE-6 + C1: generated config through the component's OWN tool, in containers pinned to the
  # chart's images — dbt parse + dbt compile and dagster definitions validate (the chart's Dagster
  # image, built here with a layer cache; dbt compile against the chart's Trino image), opa check
  # --strict + opa test (the chart's OPA image), helm template | kubeconform on both profiles — and
  # then the negative twins, which must FAIL. Its own job, in parallel with test-ui. On a PR it runs
  # only when the PR touches what it validates; push and nightly runs always run it.
  validate-generated:
    name: validate-generated
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Path filter (PRs only)
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "a $EVENT run always validates"; exit 0; fi
          changed="$(git diff --name-only "$BASE"...HEAD)"
          if grep -qE '^(images/extensions/(dagster|dbt)/|os-ui/tabs/data/lib/dbt/|os-ui/tabs/dashboards/lib/git/|charts/|scripts/glue/|scripts/validate-generated\.sh$|scripts/tests/validate-generated\.test\.sh$|scripts/tests/glue-fixtures/GLUE-6/|tests/policies/|values[^/]*\.yaml$|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "validated inputs changed:"; grep -E '^(images/extensions/(dagster|dbt)/|os-ui/tabs/data/lib/dbt/|os-ui/tabs/dashboards/lib/git/|charts/|scripts/glue/|scripts/validate-generated|scripts/tests/validate-generated|scripts/tests/glue-fixtures/GLUE-6/|tests/policies/|values|\.github/workflows/ci\.yml)' <<<"$changed" | head -20
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "GLUE-6: this PR touches nothing the component validators check — not run (push and nightly runs always run it)"
          fi
      - name: Setup Node.js
        if: steps.filter.outputs.run == 'true'
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install (os-ui) — js-yaml for reading the chart's pinned images
        if: steps.filter.outputs.run == 'true'
        run: npm --prefix os-ui ci
      - name: Pinned images from the chart
        if: steps.filter.outputs.run == 'true'
        id: images
        run: node scripts/glue/validate-generated-lib.mjs images | tee -a "$GITHUB_OUTPUT"
      - name: Setup Docker Buildx
        if: steps.filter.outputs.run == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the chart's Dagster image (layer cache)
        if: steps.filter.outputs.run == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/extensions
          file: images/extensions/dagster/Dockerfile
          tags: ${{ steps.images.outputs.DAGSTER_IMAGE }}
          load: true
          push: false
          cache-from: type=gha,scope=glue6-dagster
          cache-to: type=gha,scope=glue6-dagster,mode=max
      - name: Setup Helm
        if: steps.filter.outputs.run == 'true'
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.3
      - name: Resolve chart dependencies
        if: steps.filter.outputs.run == 'true'
        run: |
          helm dependency build charts/sovereign-agentic-os \
            || helm dependency update charts/sovereign-agentic-os
      - name: Generated config validated by the component's own tool (GLUE-6, C1) + twins
        if: ${{ !cancelled() && steps.filter.outputs.run == 'true' }}
        env:
          CI: 'true'
          GLUE6_TEST_BUILD_FLAG: --skip-build
        run: bash scripts/tests/validate-generated.test.sh

  # WP-50 eject tests (design 11 §2 row d, AT-f): an artefact the OS commits runs on the upstream
  # tool with no OS present — a committed Trino catalog file in the chart's Trino pin, an OKF bundle
  # through the OKF reference validator. Every `*.eject.test.ts` runs here, in real containers; the
  # negative twins inside each file must fail for the test to pass.
  artifacts-eject:
    name: artifacts-eject
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install (os-ui)
        run: npm --prefix os-ui ci --no-audit --no-fund
      - name: Eject tests (real containers)
        working-directory: os-ui
        env:
          WP50_EJECT: "1"
        run: |
          files="$(find tabs core -name '*.eject.test.ts' | sort)"
          test -n "$files" || { echo "no eject tests found"; exit 1; }
          echo "$files"
          node --experimental-test-module-mocks --import ./scripts/test-setup.mjs --test --test-concurrency=1 $files

  # WP-52 eject test: a native dashboard (dbt saved queries + exposure + Vega-Lite v5), with the OS
  # layer deleted, passes `dbt parse` in the chart's Dagster image, its panel SQL runs on a plain
  # Trino (the chart's tag, in-memory catalog), and vl-convert renders every spec — plus the twins.
  dashboards-eject:
    name: dashboards-eject
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install (os-ui)
        run: npm --prefix os-ui ci
      - name: Pinned images from the chart
        id: images
        run: node scripts/glue/validate-generated-lib.mjs images | tee -a "$GITHUB_OUTPUT"
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the chart's Dagster image (layer cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/extensions
          file: images/extensions/dagster/Dockerfile
          tags: ${{ steps.images.outputs.DAGSTER_IMAGE }}
          load: true
          push: false
          cache-from: type=gha,scope=glue6-dagster
      - name: Eject test (dbt parse, plain Trino, vl-convert) + negative twins
        working-directory: os-ui
        env:
          WP52_EJECT: '1'
          WP52_TMP: ${{ runner.temp }}
          DAGSTER_IMAGE: ${{ steps.images.outputs.DAGSTER_IMAGE }}
          TRINO_IMAGE: ${{ steps.images.outputs.TRINO_IMAGE }}
        run: node --experimental-test-module-mocks --import ./scripts/test-setup.mjs --test --test-concurrency=1 ../tests/dashboards/native-eject.docker.test.ts

  # `build` is the REQUIRED check. It aggregates: `if: always()` makes it run even when a job it
  # needs failed or was cancelled — GitHub reports a SKIPPED required check as passing, which is how
  # a red test-ui (and with it every glue rule) used to merge. The first step fails unless every
  # needed job succeeded; only then does it build.
  build:
    name: build
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [test-ui, test-langgraph-pg, test-opensearch, test-lakehouse, tracing-e2e, validate-generated, test-python, dagster-image, git-http-image, test-opa, test-opa-bundle, test-postgres, helm-lint, secret-scan, artifacts-eject, dashboards-eject]
    steps:
      - name: Every needed job succeeded (failed, cancelled or skipped fails the build)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' >/dev/null \
            || { echo "::error::build: a needed job did not succeed — see the list above"; exit 1; }
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install (os-ui)
        run: npm --prefix os-ui ci
      - name: Build (os-ui)
        run: npm --prefix os-ui run build
      # Keep development secret fallbacks out of the browser bundle (defence in depth). The scan
      # reads the literals from their sources (dev-secret-defaults.ts, values.yaml, langfuse init);
      # its negative twin runs first.
      - name: No development secret default in the client bundle (+ negative twin)
        run: |
          node --test os-ui/scripts/check-client-bundle-secrets.test.mjs
          node os-ui/scripts/check-client-bundle-secrets.mjs
      - name: License gate (os-ui)
        run: npm --prefix os-ui run check:licenses

  # The governance schema, the audit chain and pg-boss, against the postgres:17 digest that runs
  # live (components/postgresql/UPSTREAM.md). Never mocked; the tests fail if OS_PG_TEST_URL is unset.
  test-postgres:
    name: test-postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:5c855ad7b85e68e48a62f34662853f38b57c1c1d80f3a927ab58034fd6d31c5e
        env:
          POSTGRES_PASSWORD: ci-only-throwaway
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install (os-ui)
        run: npm --prefix os-ui ci
      - name: Real-Postgres tests (migrations, audit chain, pg-boss)
        working-directory: os-ui
        env:
          OS_PG_TEST_URL: postgres://postgres:ci-only-throwaway@127.0.0.1:5432/postgres
        run: node --experimental-test-module-mocks --import ./scripts/test-setup.mjs --test --test-concurrency=2 core/testing/postgres/*.it.ts

  test-python:
    name: test-python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install "pytest>=8.0,<9"
      # data-runner: existing + new failure-mode tests
      - name: Install data-runner deps
        run: pip install -r images/extensions/data-runner/requirements.txt
      - name: pytest (data-runner)
        run: python3 -m pytest -q images/extensions/data-runner/test_app.py images/extensions/data-runner/test_bronze_raw.py images/extensions/data-runner/test_refs.py
      # The BUILT data-runner image carries the capability label deploy.sh reads from the registry.
      - name: data-runner image carries its capability label
        run: |
          set -euo pipefail
          docker build -q -t data-runner:ci images/extensions/data-runner >/dev/null
          v=$(docker inspect --format '{{ index .Config.Labels "org.sovereign-os.applies-column-names" }}' data-runner:ci)
          [ "$v" = true ] || { echo "::error::the data-runner image carries org.sovereign-os.applies-column-names='$v', expected 'true'"; exit 1; }
          echo "label ok: $v"
      # web-fetch: new tests (zero tests previously)
      - name: pytest (web-fetch)
        run: python3 -m pytest -q images/base/web-fetch/test_app.py
      # query-tool: the governed Trino door. `test_query_budget.py` is what closes checklist X9's
      # handler half (the `query_max_run_time` + `request_timeout` + `max+1` ceilings), and
      # `test_execute_guard.py` / `test_bearer.py` guard the write path and the bearer check.
      # ONE discovery pass (iteration 2). Part F had to run these per file because each module
      # installed its own `sys.modules.setdefault` stubs, so the first importer bound `app` to its
      # fake trino and every later module's recorder stayed empty — 7 of 12 budget tests failed
      # together and all passed alone. The stubs now live once in `tests/_stubs.py`, the suites
      # that monkeypatch `app` restore it, and `tests/test_isolation.py` fails by name if either
      # regresses. Per-file would now HIDE an ordering bug, so the whole directory runs at once.
      - name: unittest (query-tool)
        run: python3 -m unittest discover -s images/extensions/query-tool/tests
      # dagster: the code location the OS generates — `parse_schedules`, `ensure_checkout`,
      # `partition_definitions`, the source assets and the chart contract (checklist D7/D8/D11).
      - name: Install dagster-test deps
        run: pip install "pyyaml>=6,<7"
      - name: pytest (dagster extension)
        run: python3 -m pytest -q images/extensions/dagster/tests/test_os_projects.py
      # agent-runtime: deleted in the engine rebuild (A5) — agent systems execute as a real
      # LangGraph StateGraph inside os-ui, covered by `npm --prefix os-ui test`.

  # The Dagster image under test, built from this commit: `dbt parse` of every generator golden,
  # repo-sync's per-sha verdict cache, and the eject test (plain dbt-core + dbt-trino against a
  # stock Trino, no OS present). 01 §7.1 tests 1–2; owner acceptance rule.
  dagster-image:
    name: dagster-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the Dagster image
        run: docker build -f images/extensions/dagster/Dockerfile -t sovereign-os/dagster:ci images/extensions
      - name: Image tests + eject test
        run: sh images/extensions/dagster/tests/image/run.sh sovereign-os/dagster:ci

  # The git-http sidecar image, built from the branch: its lighttpd refuses encoded path
  # separators and dot segments (layer 2 of the path guard; layer 1 is in test-ui).
  git-http-image:
    name: git-http-image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the git-http image
        run: docker build -t sovereign-os/git-http:ci images/base/git-http
      - name: lighttpd path guard against the built image
        env:
          GIT_HTTP_IMAGE: sovereign-os/git-http:ci
        run: node --test tests/git-http/lighttpd-guard.test.mjs
      # WP-51 eject test against the IMAGE: the OS writes the lifecycle tags, a plain `git clone`
      # through the OS's auth decision and this lighttpd + git-http-backend shows the same state.
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install (os-ui)
        run: npm --prefix os-ui ci
      - name: Lifecycle refs through the built image (eject)
        env:
          GIT_HTTP_IMAGE: sovereign-os/git-http:ci
        working-directory: os-ui
        run: node --experimental-test-module-mocks --import ./scripts/test-setup.mjs --test core/infra/lifecycle-refs-http.test.ts

  # OPA policies (04 M0–M1). The policies are plain Rego + JSON data in
  # charts/sovereign-agentic-os/policies with their *_test.rego beside them, so upstream
  # OPA alone runs them (the eject test). The CLI version is read from the chart's
  # image pin, never typed here. Then the chart's own OPA config runs in the pinned
  # container and decision-log.int.test proves one masked log line per decision.
  test-opa:
    name: test-opa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read the chart's OPA pin
        id: pin
        run: |
          tag=$(yq '.opa.image.tag' charts/sovereign-agentic-os/values.yaml)
          echo "opa=${tag%%-*}" >> "$GITHUB_OUTPUT"
      - name: Setup OPA (chart version)
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: ${{ steps.pin.outputs.opa }}
      - name: Setup Regal
        uses: open-policy-agent/setup-regal@761188c3b435761fa254beca508a44875619648f # v2.0.0
        with:
          version: v0.43.0
      - name: opa fmt (no diff)
        run: opa fmt --list --fail charts/sovereign-agentic-os/policies
      - name: opa check --strict
        run: opa check --strict charts/sovereign-agentic-os/policies
      - name: regal lint
        run: regal lint charts/sovereign-agentic-os/policies
      - name: opa test
        run: opa test charts/sovereign-agentic-os/policies -v
      - name: opa test coverage >= 90 %
        run: opa test charts/sovereign-agentic-os/policies --coverage --threshold 90 > /dev/null
      - name: Setup Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.3
      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install (os-ui)
        run: npm --prefix os-ui ci
      - name: Start the chart's OPA (pinned image, chart args and ConfigMaps)
        run: |
          pip install "pyyaml>=6,<7"
          helm dependency build charts/sovereign-agentic-os || helm dependency update charts/sovereign-agentic-os
          python3 tests/opa/run-chart-opa.py opa-it 18181
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18181/health && break; sleep 1; done
      - name: decision-log.int.test (real OPA)
        working-directory: os-ui
        env:
          OPA_IT_URL: http://127.0.0.1:18181
          OPA_IT_CONTAINER: opa-it
        run: node --experimental-test-module-mocks --import ./scripts/test-setup.mjs --test ../tests/opa/decision-log.int.test.ts
      - name: state-reconcile.int.test (real OPA, restarts the container)
        working-directory: os-ui
        env:
          OPA_IT_URL: http://127.0.0.1:18181
          OPA_IT_CONTAINER: opa-it
        run: node --experimental-test-module-mocks --import ./scripts/test-setup.mjs --test ../tests/opa/state-reconcile.int.test.ts
      - name: OPA logs (on failure)
        if: failure()
        run: docker logs opa-it || true

  # WP-11: OPA loads its data as bundles from os-ui. Real OPA (the chart's image and config in
  # bundle mode), real postgres:17 (os_governance) and real Trino 476 (the chart's access control),
  # all downloading from os-ui's own route handlers: parity with today's push path, restart with
  # os-ui down, negative twins (partial/empty source, bundle-server outage, database down, no
  # status), cold start fails closed, and grant propagation p95 < 2 s.
  test-opa-bundle:
    name: test-opa-bundle
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:5c855ad7b85e68e48a62f34662853f38b57c1c1d80f3a927ab58034fd6d31c5e
        env:
          POSTGRES_PASSWORD: ci-only-throwaway
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.3
      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install
        run: |
          pip install "pyyaml>=6,<7"
          helm dependency build charts/sovereign-agentic-os || helm dependency update charts/sovereign-agentic-os
          npm --prefix os-ui ci
      - name: bundle-parity + bundle + grant-propagation + trino-bundle (real OPA, Postgres, Trino)
        working-directory: os-ui
        env:
          OS_PG_TEST_URL: postgres://postgres:ci-only-throwaway@127.0.0.1:5432/postgres
          OPA_IT_DIR: ${{ runner.temp }}
        run: |
          for t in bundle-parity bundle grant-propagation trino-bundle; do
            node --experimental-test-module-mocks --import ./scripts/test-setup.mjs --test ../tests/opa/$t.int.test.ts
          done
      - name: Container logs (on failure)
        if: failure()
        run: for c in $(docker ps -a --format '{{.Names}}' | grep wp11-); do echo "== $c"; docker logs --tail 80 "$c" 2>&1; done

  helm-lint:
    name: helm-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.3
      - name: Resolve chart dependencies
        run: |
          helm dependency build charts/sovereign-agentic-os \
            || helm dependency update charts/sovereign-agentic-os
      - name: Helm lint
        run: helm lint charts/sovereign-agentic-os

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # gitleaks-action v2 requires a PAID licence for ORGANISATION repos; without
      # GITLEAKS_LICENSE it exits "missing gitleaks license" BEFORE scanning, so this
      # gate reported failure while never actually scanning anything (2026-09-23).
      # The gitleaks CLI itself is MIT-licensed — run it directly, pinned by version,
      # and scan ONLY this PR's commit range so pre-existing history cannot fail
      # every PR. Fails the job (--exit-code 1) when a secret is found; --redact keeps
      # any finding out of the public log.
      # On a push to main the range is the push itself (`before..sha`: every commit a rebase
      # merge wrote). An all-zero `before` (a newly created ref) scans just the head commit.
      - name: Gitleaks scan (the PR's or the push's commits)
        env:
          GITLEAKS_VERSION: '8.21.2'
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          range="${BASE_SHA}..${HEAD_SHA}"
          # empty, or only zeros: there is no base commit, so scan the head commit alone
          if [ -z "${BASE_SHA//0/}" ]; then range="${HEAD_SHA}^!"; fi
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect \
            --source . \
            --log-opts "$range" \
            --redact --no-banner --exit-code 1
