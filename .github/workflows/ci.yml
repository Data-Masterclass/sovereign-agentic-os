#
# CI — runs on pull requests targeting `main`. The job ids below (build,
# helm-lint, secret-scan) are STABLE and are wired as required status checks in
# the branch ruleset. Actions are pinned to commit SHAs.
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-ui:
    name: test-ui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install (os-ui)
        run: npm --prefix os-ui ci
      - name: Test (os-ui)
        run: npm --prefix os-ui test

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test-ui
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install (os-ui)
        run: npm --prefix os-ui ci
      - name: Build (os-ui)
        run: npm --prefix os-ui run build
      - name: License gate (os-ui)
        run: npm --prefix os-ui run check:licenses

  test-python:
    name: test-python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
      - name: Install pytest
        run: pip install "pytest>=8.0,<9"
      # data-runner: existing + new failure-mode tests
      - name: Install data-runner deps
        run: pip install -r images/extensions/data-runner/requirements.txt
      - name: pytest (data-runner)
        run: python3 -m pytest -q images/extensions/data-runner/test_app.py
      # web-fetch: new tests (zero tests previously)
      - name: pytest (web-fetch)
        run: python3 -m pytest -q images/base/web-fetch/test_app.py
      # agent-runtime: existing interpreter tests (no new tests added here)
      - name: Install agent-runtime deps
        run: pip install -r images/base/agent-runtime/requirements.txt
      - name: pytest (agent-runtime)
        run: python3 -m pytest -q images/base/agent-runtime/tests/

  # OPA policy tests — skipped in CI if the opa binary is unavailable; a comment
  # explains how to run locally. Adding the full setup-opa action adds ~30s and
  # OPA is not currently on the required-checks list; add it when policies grow.
  #
  # To run locally:
  #   opa test tests/policies/ --v1-compatible
  #
  # Uncomment the block below and add 'test-opa' to required status checks when ready:
  #
  # test-opa:
  #   name: test-opa
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
  #     - uses: open-policy-agent/setup-opa@34a30e8a924d1b03ce2cf70eca3d7d0888cee374 # v2.2.0
  #       with:
  #         version: latest
  #     - run: opa test tests/policies/ --v1-compatible

  helm-lint:
    name: helm-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.3
      - name: Resolve chart dependencies
        run: |
          helm dependency build charts/sovereign-agentic-os \
            || helm dependency update charts/sovereign-agentic-os
      - name: Helm lint
        run: helm lint charts/sovereign-agentic-os

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # gitleaks-action v2 requires a PAID licence for ORGANISATION repos; without
      # GITLEAKS_LICENSE it exits "missing gitleaks license" BEFORE scanning, so this
      # gate reported failure while never actually scanning anything (2026-09-23).
      # The gitleaks CLI itself is MIT-licensed — run it directly, pinned by version,
      # and scan ONLY this PR's commit range so pre-existing history cannot fail
      # every PR. Fails the job (--exit-code 1) when a secret is found; --redact keeps
      # any finding out of the public log.
      - name: Gitleaks scan (PR commits)
        env:
          GITLEAKS_VERSION: '8.21.2'
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect \
            --source . \
            --log-opts "${BASE_SHA}..${HEAD_SHA}" \
            --redact --no-banner --exit-code 1
