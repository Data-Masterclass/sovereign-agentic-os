#
# prod — stage 3 of the pipeline (docs/ops/ci-cd.md): a production release, by MANUAL dispatch,
# of a commit that was green on dev. The owner approves it in GitHub: the `prod` Environment has
# a required reviewer, so this job waits for that approval before it can read PROD_KUBECONFIG.
#
# It runs the SAME gate an operator runs locally, scripts/release.sh, with:
#   --sha <commit>           the commit to release (default: main's head); it must be on main
#   --remote origin          this checkout's remote
#   RELEASE_PROMOTE_IMAGE=1  give the dev image main-<sha> the version tag (same digest, NO rebuild)
# release.sh then checks CI, AND that dev.yml's dev-green job passed for that SHA (refused
# otherwise, and --no-dev-gate is refused in CI), the repository gates, tags os-ui-v<version>,
# deploys with deploy.sh --env prod (backup gate included) and smoke-tests. The Helm revision it
# replaced is in the job summary and the `deploy-record` artifact (scripts/rollback.sh --env prod).
#
# The local path (an operator running scripts/release.sh on a laptop) is unchanged and still works.
name: prod

on:
  workflow_dispatch:
    inputs:
      version:
        description: "the release version, e.g. 0.9.22 (tag os-ui-v<version>)"
        required: true
        type: string
      sha:
        description: "the commit of main to release (default: main's head). It must be green on dev."
        required: false
        type: string
        default: ""

permissions:
  contents: write   # push the os-ui-v<version> tag
  packages: write   # tag the dev image with the version (no rebuild)
  actions: read     # read CI and dev runs for the gate

concurrency:
  group: prod-release
  cancel-in-progress: false

jobs:
  release:
    name: release (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: prod
      url: https://os.agentic.datamasterclass.com
    env:
      VERSION: ${{ inputs.version }}
      INPUT_SHA: ${{ inputs.sha }}
      IMAGE_REPO: ${{ vars.IMAGE_REPO_PREFIX || 'ghcr.io/data-masterclass/sovereign-os' }}
      RELEASE_PROMOTE_IMAGE: "1"
      KUBE_CONTEXT: dmagenticos
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_RECORD: ${{ github.workspace }}/prod-report/deploy-record.json
    steps:
      - name: Checkout main (full history and tags)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Select the commit
        run: |
          set -euo pipefail
          case $VERSION in *[!A-Za-z0-9._-]* | '' | [!0-9]*) echo "::error::'$VERSION' is not a version"; exit 1 ;; esac
          sha=${INPUT_SHA:-$(git rev-parse origin/main)}
          case $sha in *[!0-9a-f]* | '') echo "::error::'$sha' is not a commit SHA"; exit 1 ;; esac
          git checkout -q --detach "$sha"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p prod-report

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Setup Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.3

      - name: Install os-ui dependencies and chart dependencies (gates)
        run: |
          npm --prefix os-ui ci --no-audit --no-fund
          helm dependency build charts/sovereign-agentic-os

      - name: Registry login (tag the dev image)
        env:
          REGISTRY_USER: ${{ vars.IMAGE_REGISTRY_USER || github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | skopeo login ghcr.io -u "$REGISTRY_USER" --password-stdin >/dev/null

      - name: Prod kubeconfig
        env:
          PROD_KUBECONFIG: ${{ secrets.PROD_KUBECONFIG }}
        run: |
          set -euo pipefail
          [ -n "$PROD_KUBECONFIG" ] || { echo "::error::the prod environment secret PROD_KUBECONFIG is not set (docs/ops/ci-cd.md, owner checklist)"; exit 1; }
          umask 077
          printf '%s' "$PROD_KUBECONFIG" > "$RUNNER_TEMP/prod-kubeconfig.yaml"
          echo "KUBECONFIG=$RUNNER_TEMP/prod-kubeconfig.yaml" >> "$GITHUB_ENV"

      - name: Helm revision before
        run: |
          helm --kube-context "$KUBE_CONTEXT" history agentic-os -n agentic-os --max 1 -o json \
            > prod-report/revision-before.json || true

      # release.sh is the gate. Its last line is RELEASE_<v>_OK or RELEASE_<v>_STOPPED: <reason>.
      - name: scripts/release.sh (CI, dev-green, gates, tag, promote, deploy, smoke)
        run: |
          set -o pipefail
          bash scripts/release.sh --remote origin --sha "$RELEASE_SHA" "$VERSION" | tee prod-report/release.txt

      - name: Report to job summary
        if: always()
        run: |
          {
            echo "## prod release \`$VERSION\` of \`${RELEASE_SHA:0:12}\`"
            echo
            [ ! -f prod-report/release.txt ] || { echo '```'; tail -40 prod-report/release.txt; echo '```'; }
            if [ -f prod-report/revision-before.json ]; then
              rev=$(python3 -c 'import json,sys; h=json.load(open(sys.argv[1])); print(h[-1]["revision"] if h else "")' prod-report/revision-before.json 2>/dev/null || true)
              [ -z "$rev" ] || { echo; echo "Roll back: \`scripts/rollback.sh --env prod --to $rev\` (or the rollback workflow)"; }
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-record
          path: prod-report/
          if-no-files-found: warn
