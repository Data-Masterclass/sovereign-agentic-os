#
# License gate — fails the build if any bundled component's license is not on the
# allowlist (licenses/allowed-licenses.txt), blocking accidental ELv2 / BSL / SSPL
# (and AGPL-when-bundled) dependencies. Also (re)generates the CycloneDX SBOM with
# syft and uploads it as an artifact.
#
# Part of the release gate (2026-11-19): `scripts/lib/workflow-status.sh` requires this
# workflow's push run on `main` to be green before an os-ui image is built. So it is pinned like
# `ci.yml`: actions by commit SHA, syft by release (its tagged install script verifies the
# download's checksum). It used to run `@v4` tags and the installer from syft's moving `main`.
name: license-gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  license-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install syft
        env:
          SYFT_VERSION: v1.57.0
        run: |
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" \
            | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"
          syft version

      - name: SPDX headers present on our source
        run: bash scripts/add-spdx-headers.sh --check

      - name: Generate SBOM (CycloneDX)
        run: |
          SYFT_CHECK_FOR_APP_UPDATE=false \
            syft scan dir:. -o cyclonedx-json=sbom.cdx.json -q
          test -s sbom.cdx.json

      - name: License allowlist gate
        run: bash scripts/license-check.sh

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
