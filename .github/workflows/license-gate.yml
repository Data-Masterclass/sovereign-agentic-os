#
# License gate — enforces the licence policy of 2026-11-22 (licenses/policy.json) over npm, Python and
# container components: copyleft and source-available licences fail, unknown fails without a reviewed
# exception, and anything other than Apache-2.0/MIT needs an attribution entry. Also (re)generates the
# CycloneDX SBOM with syft and uploads it as an artifact.
#
# Part of the release gate (2026-11-19): `scripts/lib/workflow-status.sh` requires this
# workflow's push run on `main` to be green before an os-ui image is built. So it is pinned like
# `ci.yml`: actions by commit SHA, syft by release (its tagged install script verifies the
# download's checksum). It used to run `@v4` tags and the installer from syft's moving `main`.
name: license-gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # Weekly: rebuild and re-gate the litellm-oss image even when nothing in the repo changed.
  schedule:
    - cron: '17 4 * * 1'

jobs:
  license-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install syft
        env:
          SYFT_VERSION: v1.57.0
        run: |
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" \
            | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"
          syft version

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Licence gate tests (fixture packages, each with a negative twin)
        run: node --test scripts/tests/license-gate.test.mjs

      - name: SPDX headers present on our source
        run: bash scripts/add-spdx-headers.sh --check

      - name: Generate SBOM (CycloneDX)
        run: |
          SYFT_CHECK_FOR_APP_UPDATE=false \
            syft scan dir:. -o cyclonedx-json=sbom.cdx.json -q
          test -s sbom.cdx.json

      - name: License gate (licenses/policy.json)
        run: |
          python3 -m pip install --upgrade pip
          bash scripts/license-check.sh

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

  # THE LITELLM GATEWAY IMAGE, judged on its BUILT bytes (owner decision 2026-11-24: permissive code
  # only, never the proprietary litellm-enterprise). The repo-wide gate above resolves requirements
  # files; this builds images/extensions/litellm-oss and runs scripts/license-gate-image.mjs on it:
  # every installed Python distribution, the components compiled into the wheels (their embedded
  # SBOMs), the Prisma CLI's npm packages, and any trace of litellm_enterprise (which always fails).
  # COST: the image build (~10 min) runs only when something it judges changed — on a pull request
  # (diff against the base) AND on a push to main (diff against the previous head, github.event.before).
  # It always runs on workflow_dispatch and on the weekly schedule (a new upstream advisory or a moved
  # base must still be caught). When nothing changed every step after the check is skipped and the job
  # stays green, so the release gate (workflow-status.sh) is not blocked by a skipped build.
  litellm-oss-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Did the image or its licence inputs change?
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) range="$PR_BASE...HEAD" ;;
            push)
              # A new branch, a force-push or a first commit has no usable "before": build.
              if [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                echo "run=true" >> "$GITHUB_OUTPUT"; echo "push without a usable previous head: building"; exit 0
              fi
              range="$BEFORE..HEAD" ;;
            *) echo "run=true" >> "$GITHUB_OUTPUT"; echo "$EVENT: always built"; exit 0 ;;
          esac
          # A git error (unknown base, shallow history, …) must BUILD, never skip: only a diff that
          # succeeded and names none of the inputs may skip the build.
          if ! changed=$(git diff --name-only "$range" 2>&1); then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "git diff $range failed ($changed): building"; exit 0
          fi
          if printf '%s\n' "$changed" | grep -E '^(images/extensions/litellm-oss/|scripts/license-gate-image\.mjs|scripts/lib/image-inventory\.py|scripts/lib/license-policy\.mjs|licenses/|THIRD-PARTY-LICENSES\.md|\.github/workflows/license-gate\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "nothing the image gate judges changed in $range: build skipped, job green"
          fi

      - name: Set up Buildx
        if: steps.changed.outputs.run == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build litellm-oss (linux/amd64, not pushed)
        if: steps.changed.outputs.run == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/extensions/litellm-oss
          file: images/extensions/litellm-oss/Dockerfile
          platforms: linux/amd64
          provenance: false
          load: true
          push: false
          tags: litellm-oss:ci
          cache-from: type=gha,scope=litellm-oss
          cache-to: type=gha,mode=max,scope=litellm-oss

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: 22

      # --strict: no ratchet. certifi/orjson/tqdm are also on the repo-wide known-violations list (other
      # images need them, with a floating version); in this image only the owner-signed, exact-version
      # exceptions may pass them, so a bumped certifi fails here as a new finding.
      - name: Image licence gate (no litellm_enterprise; licenses/policy.json on every installed package)
        if: steps.changed.outputs.run == 'true'
        run: node scripts/license-gate-image.mjs --image litellm-oss:ci --scope litellm-oss --strict

      - name: Negative twin — the gate must refuse the upstream image (it ships litellm-enterprise)
        if: steps.changed.outputs.run == 'true'
        run: |
          set -uo pipefail
          up=ghcr.io/berriai/litellm-database:1.109.1@sha256:932c54440654f8f8466a85887612d95dcfb04ae2fc01257844332f4bf3b96986
          docker pull -q "$up" >/dev/null
          if node scripts/license-gate-image.mjs --image "$up" > twin.txt 2>&1; then
            cat twin.txt; echo "::error::the image gate PASSED the upstream image, which ships litellm-enterprise"; exit 1
          fi
          grep -q '^ENTERPRISE  distribution litellm-enterprise' twin.txt || { cat twin.txt; echo "::error::the gate failed the upstream image for another reason"; exit 1; }
          echo "negative twin: the upstream image is refused ($(grep -c '^ENTERPRISE' twin.txt) enterprise traces)"
