#
# License gate — enforces the licence policy of 2026-11-22 (licenses/policy.json) over npm, Python and
# container components: copyleft and source-available licences fail, unknown fails without a reviewed
# exception, and anything other than Apache-2.0/MIT needs an attribution entry. Also (re)generates the
# CycloneDX SBOM with syft and uploads it as an artifact.
#
# Part of the release gate (2026-11-19): `scripts/lib/workflow-status.sh` requires this
# workflow's push run on `main` to be green before an os-ui image is built. So it is pinned like
# `ci.yml`: actions by commit SHA, syft by release (its tagged install script verifies the
# download's checksum). It used to run `@v4` tags and the installer from syft's moving `main`.
name: license-gate

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  license-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install syft
        env:
          SYFT_VERSION: v1.57.0
        run: |
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" \
            | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"
          syft version

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Licence gate tests (fixture packages, each with a negative twin)
        run: node --test scripts/tests/license-gate.test.mjs

      - name: SPDX headers present on our source
        run: bash scripts/add-spdx-headers.sh --check

      - name: Generate SBOM (CycloneDX)
        run: |
          SYFT_CHECK_FOR_APP_UPDATE=false \
            syft scan dir:. -o cyclonedx-json=sbom.cdx.json -q
          test -s sbom.cdx.json

      - name: License gate (licenses/policy.json)
        run: |
          python3 -m pip install --upgrade pip
          bash scripts/license-check.sh

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
