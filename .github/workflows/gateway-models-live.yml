#
# gateway-models-live — prove that the OS model list IS LiteLLM's, against the REAL LiteLLM image the
# chart pins (scripts/tests/gateway-models/run.sh), started the way the chart runs it (a `model_list`
# config file AND store_model_in_db, on a real Postgres): a model added through LiteLLM's own admin API
# shows up in the OS model route with no OS change, one removed disappears, a config-file model is
# told apart from a database one (and refused for removal by the OS and by LiteLLM), and no credential
# value reaches the OS answer. It also proves the OS-owned role mapping (sovereign-strong/-worker/-embedding
# written to router_settings.model_group_alias): a remap changes the next call with no restart, a foreign
# edit is repaired and reported, a mapping to a missing model is refused, a removed catalog model is a typed
# failure (no silent fallback), an old alias still works and logs a deprecation. Separate from ci.yml because it pulls the gateway image.
# Actions are pinned to commit SHAs, as ci.yml does.
name: gateway-models-live

on:
  pull_request:
    branches: [main]
    paths:
      - charts/sovereign-agentic-os/Chart.yaml
      - charts/sovereign-agentic-os/Chart.lock
      - charts/sovereign-agentic-os/values.yaml
      - os-ui/core/models/gateway-catalog*.ts
      - os-ui/core/models/role-*.ts
      - os-ui/core/infra/litellm-admin.ts
      - os-ui/app/api/platform-admin/models/roles/**
      - os-ui/tabs/admin/lib/model-roles.e2e.test.ts
      - os-ui/app/api/agents/models/**
      - os-ui/tabs/admin/lib/model-remove.ts
      - os-ui/tabs/admin/lib/gateway-models.e2e.test.ts
      - scripts/tests/gateway-models/**
      - .github/workflows/gateway-models-live.yml
  push:
    branches: [main]
    paths:
      - charts/sovereign-agentic-os/Chart.lock
      - os-ui/core/models/gateway-catalog*.ts
      - os-ui/core/models/role-*.ts
      - scripts/tests/gateway-models/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-models-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-models-live:
    name: gateway-models-live
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install (os-ui)
        run: npm --prefix os-ui ci
      - name: Setup Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.3
      - name: Resolve chart dependencies
        run: |
          helm dependency build charts/sovereign-agentic-os \
            || helm dependency update charts/sovereign-agentic-os
      - name: The OS model list against the real gateway (with the negative twins)
        env:
          GATEWAY_MODELS_WORKDIR: ${{ runner.temp }}/gateway-models
        run: bash scripts/tests/gateway-models/run.sh
