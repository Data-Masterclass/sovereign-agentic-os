#
# software-factory-e2e - on kind with Calico (an enforcing CNI), a REAL git push to the OS git server runs the
# app's own Tekton pipeline on that exact commit (typecheck, lint, tests, build, OPA policy, Trivy source scan).
# Negative twins: a failing test blocks, a superseded run is cancelled, a deploy without a green record is
# refused, the NetworkPolicies hold, another domain's app is untouched.
name: software-factory-e2e

on:
  pull_request:
    paths:
      - "templates/**"
      - "os-ui/tabs/software/**"
      - "tests/software-factory/**"
      - "scripts/tekton/**"
      - "components/tekton/**"
      - "charts/sovereign-agentic-os/templates/base/os-ui/software-tekton.yaml"
      - "charts/sovereign-agentic-os/files/tekton/**"
      - "charts/sovereign-agentic-os/templates/base/network/**"
      - ".github/workflows/software-factory-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: software factory e2e (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SF_KUBECONFIG: ${{ github.workspace }}/.sf-e2e-kubeconfig
      SF_REPOS_PARENT: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Install kind (pinned, checksum-verified)
        run: |
          . tests/e2e/kind/versions.env
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  kind" | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind

      - name: os-ui dependencies
        working-directory: os-ui
        run: npm ci --no-audit --no-fund

      - name: Chart dependencies (helm is preinstalled on the runner)
        run: helm dependency build charts/sovereign-agentic-os

      - name: End to end (kind + Calico + Tekton: real push, per-commit run, negative twins)
        run: bash tests/software-factory/e2e.sh

  isolation:
    name: sandbox isolation (kind + Calico, enforcing)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SF_ISO_KUBECONFIG: ${{ github.workspace }}/.sf-iso-kubeconfig
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install kind (pinned, checksum-verified)
        run: |
          . tests/e2e/kind/versions.env
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  kind" | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind

      - name: Chart dependencies
        run: helm dependency build charts/sovereign-agentic-os || helm dependency update charts/sovereign-agentic-os

      - name: Isolation (os-ui, postgres, OPA and the API server blocked; proxy and DNS open; control reaches them)
        run: bash tests/software-factory/isolation.sh
