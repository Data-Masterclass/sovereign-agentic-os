#
# software-factory-e2e - (job `isolation`: the gates sandbox namespace on an ENFORCING CNI) an app instantiated from templates/nextjs-web passes its gates in the sandbox Job
# (node + OPA sidecar) on a kind cluster, is built from its own Dockerfile, and is deployed to agentic-apps
# by the OS runner. Negative twins: a failing test and hand-made authorization each block on their own gate.
name: software-factory-e2e

on:
  pull_request:
    paths:
      - "templates/**"
      - "os-ui/tabs/software/**"
      - "tests/software-factory/**"
      - "charts/sovereign-agentic-os/templates/base/os-ui/software-sandbox.yaml"
      - "charts/sovereign-agentic-os/templates/base/network/**"
      - ".github/workflows/software-factory-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: software factory e2e (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FACTORY_E2E_KUBECONFIG: ${{ github.workspace }}/.factory-e2e-kubeconfig
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Install kind (pinned, checksum-verified)
        run: |
          . tests/e2e/kind/versions.env
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  kind" | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind

      - name: os-ui dependencies
        working-directory: os-ui
        run: npm ci --no-audit --no-fund

      - name: End to end (kind, sandbox gates, build, deploy; negative twins)
        run: bash tests/software-factory/e2e.sh

  isolation:
    name: sandbox isolation (kind + Calico, enforcing)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SF_ISO_KUBECONFIG: ${{ github.workspace }}/.sf-iso-kubeconfig
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install kind (pinned, checksum-verified)
        run: |
          . tests/e2e/kind/versions.env
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  kind" | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind

      - name: Chart dependencies
        run: helm dependency build charts/sovereign-agentic-os

      - name: Isolation (os-ui, postgres, OPA and the API server blocked; proxy and DNS open; control reaches them)
        run: bash tests/software-factory/isolation.sh
