#
# build-images — build ONE of our images on a GitHub runner and push it to GHCR.
#
# WHY THIS EXISTS. Every image this project ever shipped was built on the owner's Mac through
# Colima: a 14 GB VM on a 24 GB host. The VM's DNS failed twice mid-build (after the deploy's
# backup gate had already run), the host OOM-killed runs, and an emulated linux/amd64 build
# blocks the machine for 10-15 minutes. GitHub's runners are amd64 natively and have a cache.
# `scripts/deploy.sh --from-registry <version>` then rolls out a tag built here, with no local
# Docker at all.
#
# WHERE IT PUSHES. This repository is `Data-Masterclass/...`, and a workflow's built-in
# GITHUB_TOKEN can push to `ghcr.io/data-masterclass/*` and CANNOT push to the `aborek` user
# namespace. So os-ui now lives at `ghcr.io/data-masterclass/sovereign-os/os-ui` (option A,
# taken 2026-11-19); the other images remain at `ghcr.io/aborek/sovereign-os/*`.
#
#   Option A (TAKEN — the default, no secret at all) — push to
#     ghcr.io/data-masterclass/sovereign-os. Nothing to configure, and no pull-secret change
#     was needed: the cluster's existing ghcr.io credential can read the private org package.
#   Option B (not taken: keep ghcr.io/aborek/sovereign-os) — set the repository VARIABLE
#     IMAGE_REPO_PREFIX=ghcr.io/aborek/sovereign-os and the repository SECRET GHCR_TOKEN to a
#     classic PAT with `write:packages` on the aborek account.
#
# An unset secret or variable is the EMPTY STRING inside a ${{ }} expression, hence falsy — so
# `secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN` needs no `if:` and no second job, and the
# workflow is correct under both options with nothing set today. CONTRIBUTING.md -> "Images:
# build in CI" carries the owner's copy-paste blocks.
#
# Actions are pinned to commit SHAs, as `ci.yml` does.
name: build-images

on:
  push:
    tags:
      - 'os-ui-v*'
      - 'git-http-v*'
      - 'dagster-v*'
      - 'docling-v*'
      - 'data-runner-v*'
      - 'query-tool-v*'
      - 'opensearch-v*'
      - 'backup-tools-v*'
      - 'litellm-oss-v*'
  # The dev stage (.github/workflows/dev.yml) calls this with image=os-ui, version=main-<sha>.
  workflow_call:
    inputs:
      image:
        description: which image to build
        required: true
        type: string
      version:
        description: the image tag to push
        required: true
        type: string
    outputs:
      ref:
        description: the pushed image reference (repository:tag)
        value: ${{ jobs.build.outputs.ref }}
      digest:
        description: the pushed manifest digest (sha256:...)
        value: ${{ jobs.build.outputs.digest }}
  workflow_dispatch:
    inputs:
      image:
        description: which image to build
        required: true
        type: choice
        options: [os-ui, git-http, git-daemon, dagster, docling, data-runner, query-tool, opensearch, backup-tools, litellm-oss]
      version:
        description: the image tag to push (e.g. 0.9.0)
        required: true
        type: string

# packages: write to push to GHCR; contents: read to check the source out; actions: read so the
# `require-green-ci` job can read this repository's workflow runs. Nothing else — this workflow
# must not be able to move a ref or open a pull request.
permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: build-images-${{ github.ref }}-${{ inputs.image || '' }}
  cancel-in-progress: false

jobs:
  # NO os-ui IMAGE WITHOUT A GREEN CI ON THAT EXACT COMMIT (2026-11-19). The image used to be
  # built from whatever a tag pointed at, guarded only by the worker import smoke below — so a
  # commit whose tests were red, or never ran (main ran only `license-gate` on push), could
  # reach production. This job asks the API whether `ci.yml` AND `license-gate.yml` concluded
  # `success` on a PUSH to `main` for `github.sha`, and waits for them if they are still running
  # (a tag pushed right after a merge). WHY THE API RATHER THAN RE-RUNNING THE TESTS HERE: the
  # question is "did the suite pass on this commit", which `ci.yml` already answers on push;
  # running the jobs again here would be a second copy of them that drifts, and would double
  # the runner time of every release. The query lives in `scripts/lib/workflow-status.sh`, the
  # same script `scripts/release.sh` uses before it tags.
  #
  # os-ui only (tag or dispatch): the brief this gate exists for. The other images keep their
  # old behaviour; the job is then `skipped`, which the `build` job below accepts.
  require-green-ci:
    name: require-green-ci
    if: startsWith(github.ref_name, 'os-ui-v') || inputs.image == 'os-ui'
    runs-on: ubuntu-latest
    # CI takes ~15 min; a tag pushed straight after a merge waits for it, but not forever.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: ci.yml and license-gate.yml passed on main for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! bash scripts/lib/workflow-status.sh --sha "$SHA" --branch main \
                 --workflows "ci.yml license-gate.yml" --wait-minutes 50; then
            echo "::error::CI_NOT_GREEN — ci.yml and license-gate.yml must both pass on a push to main for $SHA before its os-ui image is built. Merge to main, wait for CI, then tag that commit (scripts/release.sh does this)."
            exit 1
          fi

  build:
    name: build
    needs: require-green-ci
    # `skipped` is fine (a non-os-ui image); anything else but `success` is not.
    if: ${{ !cancelled() && (needs.require-green-ci.result == 'success' || needs.require-green-ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    # An os-ui build is ~10 min warm and the whole point of this workflow is that nobody is
    # watching it. A hung buildx step must not burn an hour of runner time (review L7).
    timeout-minutes: 45
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
      ref: ${{ steps.meta.outputs.ref }}
      digest: ${{ steps.reuse.outputs.digest || steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # A tag names ONE image, so this is a resolve step rather than a matrix (a matrix would
      # build all four on every tag). The dockerfile/context pairs differ per image and getting
      # one wrong fails SILENTLY — a wrong context just misses a COPY source. The table is the
      # one in `scripts/os` ($IMAGES), which is otherwise the only place that knows it.
      - name: Resolve image, version, dockerfile and context
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_VERSION: ${{ inputs.version }}
          PREFIX: ${{ vars.IMAGE_REPO_PREFIX || 'ghcr.io/data-masterclass/sovereign-os' }}
        run: |
          set -euo pipefail
          # A dispatch or a call (dev.yml) names the image and version; a tag push encodes them.
          if [ "$EVENT" = workflow_dispatch ] || [ -n "$INPUT_IMAGE" ]; then
            image=$INPUT_IMAGE
            version=$INPUT_VERSION
            # main-<sha> belongs to the dev stage (dev.yml calls this workflow on a push). A dispatch
            # must never write it: that would re-point a tag dev already tested at other bytes.
            if [ "$EVENT" = workflow_dispatch ]; then
              case $version in main-*) echo "::error::'main-*' tags are written only by the dev stage (dev.yml), never by a dispatch" >&2; exit 1 ;; esac
            fi
          else
            # Split on the LAST `-v`, so the version is always what follows it and an image
            # name that itself contains `-v` falls through to the `unknown image` error below
            # rather than being silently truncated.
            image=${REF_NAME%-v*}
            version=${REF_NAME##*-v}
          fi
          # A dispatch input is operator-supplied text that ends up in a shell and in a tag.
          # Refuse anything that is not a Docker tag before it goes anywhere near either.
          case $version in
            *[!A-Za-z0-9._-]* | '' | [!A-Za-z0-9]*)
              echo "::error::'$version' is not a valid image tag" >&2; exit 1 ;;
          esac
          case $image in
            # os-ui's context is the REPO ROOT: the image bakes in docs/components/*.md.
            os-ui)      dockerfile=images/base/os-ui/Dockerfile;        context=. ;;
            git-http)   dockerfile=images/base/git-http/Dockerfile;     context=images/base/git-http ;;
            git-daemon) dockerfile=images/base/git-daemon/Dockerfile;   context=images/base/git-daemon ;;
            # dagster COPYs both dagster/ and dbt/, so its context is their shared parent.
            dagster)    dockerfile=images/extensions/dagster/Dockerfile; context=images/extensions ;;
            # docling: upstream docling-serve-cpu plus the allowlisted model weights (no code).
            docling)    dockerfile=images/extensions/docling/Dockerfile; context=images/extensions/docling ;;
            # data-runner: the ingest service (app.py + the shared column_name_rule.json).
            data-runner) dockerfile=images/extensions/data-runner/Dockerfile; context=images/extensions/data-runner ;;
            # query-tool: the governed Trino read/write door (app.py, execute_guard.py, trino_login.py).
            query-tool) dockerfile=images/extensions/query-tool/Dockerfile; context=images/extensions/query-tool ;;
            # 3.7.0 + repository-s3 (WP-21); tag e.g. opensearch-v3.7.0-soa.1.
            opensearch) dockerfile=images/extensions/opensearch/Dockerfile; context=images/extensions/opensearch ;;
            # git + aws-cli + jq for the WP-56 bundle sidecar and restore drills.
            backup-tools) dockerfile=images/base/backup-tools/Dockerfile; context=images/base/backup-tools ;;
            # The LiteLLM gateway from MIT core only, without litellm-enterprise; tag e.g. litellm-oss-v1.109.1-soa.1.
            litellm-oss) dockerfile=images/extensions/litellm-oss/Dockerfile; context=images/extensions/litellm-oss ;;
            *) echo "::error::unknown image '$image' — expected one of os-ui, git-http, git-daemon, dagster, docling, data-runner, query-tool, opensearch, backup-tools, litellm-oss" >&2; exit 1 ;;
          esac
          test -f "$dockerfile" || { echo "::error::$dockerfile does not exist" >&2; exit 1; }
          {
            echo "image=$image"
            echo "version=$version"
            echo "dockerfile=$dockerfile"
            echo "context=$context"
            echo "ref=$PREFIX/$image:$version"
          } >> "$GITHUB_OUTPUT"
          echo "resolved: $image $version -> $PREFIX/$image:$version  ($dockerfile in $context)"

      # NO REBUILD OF A COMMIT DEV ALREADY TESTED (docs/ops/ci-cd.md). An os-ui RELEASE tag
      # (os-ui-v<version>) on a commit that the dev stage built as main-<sha> gets THAT image:
      # the same manifest, tagged <version> in the registry, so production runs the bytes dev
      # ran its acceptance suite on. Only when no main-<sha> exists (a commit older than the dev
      # stage) does the build below run as before. scripts/lib/promote-image.sh refuses to move
      # an existing version tag and checks that both tags resolve to one digest.
      - name: Reuse the dev-tested image of this commit (os-ui release tags)
        id: reuse
        if: steps.meta.outputs.image == 'os-ui' && startsWith(github.ref, 'refs/tags/os-ui-v')
        env:
          PREFIX: ${{ vars.IMAGE_REPO_PREFIX || 'ghcr.io/data-masterclass/sovereign-os' }}
          REF: ${{ steps.meta.outputs.ref }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ vars.IMAGE_REGISTRY_USER || github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | skopeo login ghcr.io -u "$REGISTRY_USER" --password-stdin >/dev/null
          # The digest dev RECORDED for this commit (dev.yml's dev-tested-digest artifact), not
          # whatever main-<sha> says today. No record = a commit from before the dev stage: build.
          if ! rec=$(bash scripts/lib/dev-digest.sh --sha "$SHA" | tail -1); then
            # A commit that WAS green on dev must ship its tested bytes; never a rebuild.
            if bash scripts/lib/workflow-status.sh --sha "$SHA" --branch main --workflows dev.yml \
                 --require-job dev-green --wait-minutes 0 >/dev/null 2>&1; then
              echo "::error::$SHA is green on dev but its digest record is unreadable ($rec). Refusing to rebuild a tested commit."
              exit 1
            fi
            echo "no dev record for $SHA ($rec) and not green on dev — building this commit as before"
            exit 0
          fi
          now=$(skopeo inspect --format '{{.Digest}}' "docker://$PREFIX/os-ui:main-$SHA" 2>/dev/null || true)
          if [ "$now" != "$rec" ]; then
            echo "::error::MAIN_TAG_MOVED — main-$SHA resolves to '${now:-nothing}', dev tested $rec. Refusing to tag or rebuild."
            exit 1
          fi
          bash scripts/lib/promote-image.sh "$PREFIX/os-ui@$rec" "$REF"
          echo "digest=$rec" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # GHCR_TOKEN when the owner chose option B, else the built-in token (option A).
      #
      # The USERNAME must be the PAT's owner under option B (review L10). `github.actor` is
      # whoever pushed the tag, which is only incidentally the PAT owner — and when it is not,
      # GHCR rejects the login outright rather than falling back. So option B also sets the
      # repository variable IMAGE_REGISTRY_USER=aborek; option A leaves it unset and the actor
      # is correct, because the built-in token belongs to this repository.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ vars.IMAGE_REGISTRY_USER || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # os-ui ONLY, and BEFORE the pushing build: build into the local daemon so the worker
      # smoke can run against the real image. A registry has no un-push, so a broken worker
      # graph must be caught here. The second build call is a cache hit and costs seconds.
      - name: Build os-ui locally (for the worker smoke)
        id: load
        if: steps.meta.outputs.image == 'os-ui' && steps.reuse.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.dockerfile }}
          platforms: linux/amd64
          provenance: false
          load: true
          push: false
          tags: ${{ steps.meta.outputs.ref }}
          cache-from: type=gha,scope=${{ steps.meta.outputs.image }}
          cache-to: type=gha,mode=max,scope=${{ steps.meta.outputs.image }}

      # The SAME smoke `scripts/deploy.sh` runs, copied byte-for-byte. The os-ui-worker
      # container executes the TypeScript SOURCE under Node's type stripping, which no unit
      # test can verify: it is a property of the BASE IMAGE's Node (>= 22.6) and of the resolve
      # hook's aliases. A base-image bump that goes backwards breaks the worker with
      # ERR_UNKNOWN_FILE_EXTENSION at boot, AFTER the deploy. Nothing connects to a database
      # until main() runs, so this needs no cluster and fails loudly on its own.
      - name: Worker smoke — the image can import the worker under --experimental-strip-types
        if: steps.meta.outputs.image == 'os-ui' && steps.reuse.outputs.digest == ''
        env:
          REF: ${{ steps.meta.outputs.ref }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint node --workdir /app/src "$REF" \
            --experimental-strip-types --no-warnings --input-type=module \
            -e "import { register } from 'node:module'; register('./worker/resolve-hook.mjs', 'file:///app/src/'); const m = await import('./worker/agent-runs.ts'); if (typeof m.main !== 'function') { console.error('worker/agent-runs.ts exports no main()'); process.exit(1); } console.log('worker smoke: graph loaded, main() present');" \
            || { echo "WORKER_STRIP_TYPES_SMOKE_FAILED — the image cannot load the worker graph (Node < 22.6, or a package missing from the standalone tree: see scripts/worker-deps.mjs)"; exit 1; }

      # litellm-oss ONLY, and BEFORE the pushing build: the image exists to carry permissive code only, so
      # its licences are judged on the BUILT bytes (every installed Python distribution, the components
      # compiled into the wheels, the Prisma CLI's npm packages, and any trace of litellm_enterprise) before
      # anything reaches the registry. Same gate the license-gate workflow runs on every relevant PR.
      - name: Build litellm-oss locally (for the image licence gate)
        if: steps.meta.outputs.image == 'litellm-oss'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.dockerfile }}
          platforms: linux/amd64
          provenance: false
          load: true
          push: false
          tags: ${{ steps.meta.outputs.ref }}
          cache-from: type=gha,scope=${{ steps.meta.outputs.image }}
          cache-to: type=gha,mode=max,scope=${{ steps.meta.outputs.image }}

      - name: Image licence gate — no litellm_enterprise, only allowed licences
        if: steps.meta.outputs.image == 'litellm-oss'
        env:
          REF: ${{ steps.meta.outputs.ref }}
        run: node scripts/license-gate-image.mjs --image "$REF" --scope litellm-oss

      # provenance: false is not cosmetic. An attestation makes the pushed tag a manifest LIST,
      # and `docker inspect`'s RepoDigests[0] then yields the attestation index rather than the
      # image — which is exactly the digest deploy.sh pins into osUI.image.tag. Same flag
      # deploy.sh already passes to `docker build`.
      - name: Build and push
        id: push
        if: steps.reuse.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.dockerfile }}
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.ref }}
          cache-from: type=gha,scope=${{ steps.meta.outputs.image }}
          cache-to: type=gha,mode=max,scope=${{ steps.meta.outputs.image }}

      # The data-runner image must SAY it applies os-ui's `columnNames`: scripts/deploy.sh reads
      # this label from the registry to decide the runner's capability (and refuses when it can't).
      # Read back from the pushed digest, so the check is on the published bytes.
      - name: The pushed data-runner carries its capability label
        if: steps.meta.outputs.image == 'data-runner'
        env:
          REF: ${{ steps.meta.outputs.ref }}
          DIGEST: ${{ steps.reuse.outputs.digest || steps.push.outputs.digest }}
          DEPLOY_IMAGE_LABEL_PROBE: ''
        run: |
          set -euo pipefail
          v=$(bash scripts/lib/image-label.sh "${REF%:*}@$DIGEST" org.sovereign-os.applies-column-names)
          [ "$v" = true ] || { echo "::error::$REF@$DIGEST carries org.sovereign-os.applies-column-names='$v', expected 'true'"; exit 1; }
          echo "label ok: org.sovereign-os.applies-column-names=$v on $REF@$DIGEST"

      # THE PUSHED IMAGE MUST BE THE IMAGE THAT WAS SMOKED (review L6). The smoke runs against
      # a locally loaded build and the push is a SECOND build-push-action call: same context and
      # same cache, so they should be identical — but "should" is not a check, and a cache miss,
      # a mutated context or a buildx bug would quietly ship an image nothing verified. Compare
      # the smoked image's config id with the config digest inside the manifest that was pushed;
      # they are the same object, so they must be equal.
      - name: The pushed image is the image that was smoked
        if: steps.meta.outputs.image == 'os-ui' && steps.reuse.outputs.digest == ''
        env:
          REF: ${{ steps.meta.outputs.ref }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          smoked=$(docker image inspect --format '{{.Id}}' "$REF")
          pushed=$(docker buildx imagetools inspect "$REF@$DIGEST" --raw \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["config"]["digest"])')
          # What `.Id` IS depends on the runner's image store. The classic store reports the
          # image CONFIG digest; the containerd image store (the default on current GitHub
          # runners) reports the MANIFEST digest — which is exactly the digest the push
          # returned. The first run of this workflow failed here with smoked == $DIGEST: the
          # same image, compared against the wrong kind of digest. Either equality proves
          # identity; neither can hold for a different image.
          if [ "$smoked" = "$DIGEST" ]; then
            echo "pushed manifest $DIGEST == the smoked image (containerd image store)"
          elif [ "$smoked" = "$pushed" ]; then
            echo "pushed image config $pushed == the smoked image"
          else
            echo "SMOKED_IMAGE_IS_NOT_THE_PUSHED_IMAGE — smoked $smoked, pushed manifest $DIGEST, pushed config $pushed" >&2
            echo "   The worker smoke verified an image that is not the one now in the registry." >&2
            exit 1
          fi

      # The digest is what an operator needs next, so print it with the command that uses it.
      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          REF: ${{ steps.meta.outputs.ref }}
          DIGEST: ${{ steps.reuse.outputs.digest || steps.push.outputs.digest }}
          REUSED: ${{ steps.reuse.outputs.digest != '' }}
          PREFIX: ${{ vars.IMAGE_REPO_PREFIX || 'ghcr.io/data-masterclass/sovereign-os' }}
        run: |
          set -euo pipefail
          {
            echo "### pushed \`$REF\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| image | \`$IMAGE\` |"
            echo "| version | \`$VERSION\` |"
            echo "| digest | \`$DIGEST\` |"
            echo "| reused the dev image (no rebuild) | $REUSED |"
            echo
            if [ "$IMAGE" = os-ui ]; then
              echo "Roll it out with no local Docker:"
              echo
              echo '```bash'
              echo "IMAGE_REPO=$PREFIX IMAGE_FROM_REGISTRY=1 ./scripts/deploy.sh $VERSION"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest $DIGEST"
