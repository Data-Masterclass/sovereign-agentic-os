#
# agent-key-migration-live — prove the make-before-break agent-system key migration against the
# REAL LiteLLM image the chart pins (scripts/tests/agent-key-migration/run.sh): an existing system
# keeps a working key at every step, the old guessable key is refused (401) afterwards, and a pass
# killed half-way is finished by the next one with one new value. Includes the negative twin (a
# key the gateway never issued must be 401). The same gateway also proves the continuous key reconcile
# (an edit made through LiteLLM's own admin API is reported as drift and left alone by default) and the
# chart's shared-key init Job (rendered and executed: create-only, a hand edit survives; the negative
# twin with reapplyOnUpgrade overwrites). Separate from ci.yml because it pulls the gateway image.
# Actions are pinned to commit SHAs, as ci.yml does.
name: agent-key-migration-live

on:
  pull_request:
    branches: [main]
    paths:
      - charts/sovereign-agentic-os/Chart.yaml
      - charts/sovereign-agentic-os/Chart.lock
      - charts/sovereign-agentic-os/values.yaml
      - os-ui/core/infra/agent-system-keys.ts
      - os-ui/core/infra/agent-system-key-sweep.ts
      - os-ui/tabs/agents/lib/build/live.ts
      - os-ui/tabs/agents/lib/build/live-clients.ts
      - os-ui/tabs/agents/lib/build/system-key-migration*.ts
      - os-ui/tabs/agents/lib/build/key-reconcile*.ts
      - os-ui/core/infra/agent-key-drift.ts
      - charts/sovereign-agentic-os/templates/base/litellm/agent-key.yaml
      - scripts/tests/agent-key-migration/**
      - .github/workflows/agent-key-migration-live.yml
  push:
    branches: [main]
    paths:
      - charts/sovereign-agentic-os/Chart.lock
      - os-ui/tabs/agents/lib/build/system-key-migration*.ts
      - os-ui/tabs/agents/lib/build/key-reconcile*.ts
      - charts/sovereign-agentic-os/templates/base/litellm/agent-key.yaml
      - scripts/tests/agent-key-migration/**
  workflow_dispatch:

permissions:
  contents: read
  packages: read   # pull the private gateway image (litellm-oss)

concurrency:
  group: agent-key-migration-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-key-migration-live:
    name: agent-key-migration-live
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The gateway image is our private org package (images/extensions/litellm-oss); read it with this
      # repository's token (packages: read).
      - name: Log in to GHCR (the gateway image is a private org package)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - name: Install (os-ui)
        run: npm --prefix os-ui ci
      - name: Setup Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.3
      - name: Resolve chart dependencies
        run: |
          helm dependency build charts/sovereign-agentic-os \
            || helm dependency update charts/sovereign-agentic-os
      - name: Key migration against the real gateway (with the negative twin)
        env:
          AGENT_KEY_MIGRATION_WORKDIR: ${{ runner.temp }}/agent-key-migration
        run: bash scripts/tests/agent-key-migration/run.sh
