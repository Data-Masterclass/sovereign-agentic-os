#
# app-eject — WP-54's real-component proof. A seeded app is built from its own Dockerfile, pushed to a
# local OCI registry (CNCF Distribution, standing in for the platform registry), and its committed
# k8s/ manifests are applied to a kind cluster with Pod Security `restricted`: once with plain
# kubectl and no OS (the eject), once through the OS runner's deploy (dry run, then apply). Negative
# twins: no Dockerfile → no build; stripped securityContext → refused by the real admission.
name: app-eject

on:
  pull_request:
    paths:
      - "os-ui/tabs/software/**"
      - "tests/app-eject/**"
      - ".github/workflows/app-eject.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eject:
    name: app eject (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_EJECT_CLUSTER: app-eject
      APP_EJECT_KUBECONFIG: ${{ github.workspace }}/.app-eject-kubeconfig
      APP_EJECT_REGISTRY_PORT: "5001"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Install kind (pinned, checksum-verified)
        run: |
          . tests/e2e/kind/versions.env
          curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  kind" | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind

      - name: os-ui dependencies
        working-directory: os-ui
        run: npm ci --no-audit --no-fund

      - name: kind + local registry
        run: bash tests/app-eject/up.sh

      - name: Eject test (build → push → kubectl apply; OS deploy; negative twins)
        working-directory: os-ui
        run: node --experimental-test-module-mocks --import ./scripts/test-setup.mjs --test tabs/software/lib/app-eject.kind.test.ts

      - name: Teardown
        if: always()
        run: bash tests/app-eject/down.sh
