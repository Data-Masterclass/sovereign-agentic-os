#
# dev — stage 2 of the pipeline (docs/ops/ci-cd.md): EVERY push to main, once CI is green,
# is built, deployed to the dev environment and accepted there.
#
#   image       build-images.yml (reusable): waits for ci.yml + license-gate.yml to pass on main for
#               this SHA, then builds os-ui as main-<sha> and pushes it (pinned by digest).
#   deploy      GitHub Environment `dev`: scripts/deploy.sh --env dev --from-registry main-<sha>
#               (the env guard refuses any cluster that is not the marked dev cluster), checks
#               that the digest RUNNING on dev is the digest the image job built, then the smoke
#               test and the WP-02 acceptance journeys. Results go to the job summary and the
#               `dev-report` artifact (with the deploy record: scripts/rollback.sh --env dev --to <rev>).
#   dev-green   the ONE job whose success means "this commit was green on dev". It records the
#               tested digest as the artifact `dev-tested-digest`; scripts/release.sh requires
#               this job (workflow-status.sh --require-job dev-green) and deploys ONLY that digest.
#
# WHAT "GREEN ON DEV" MEANS TODAY: built, deployed, the running digest checked, smoke-tested, and
# the acceptance journeys ran with no UNEXPECTED result. It does not yet mean "the journeys pass":
# every journey assertion is still marked expected-fail until the work package that closes it
# lands (the report lists them), and the journeys that drive the kind-only scriptable model stub
# are skipped on dev with that reason.
#
# ENABLING: nothing deploys until the owner sets the repository variable DEV_ENVIRONMENT_ENABLED=true
# and the `dev` environment secret DEV_KUBECONFIG (scripts/dev/ci-kubeconfig.sh). Until then the
# jobs are skipped, dev-green is skipped, and no commit counts as green on dev.
#
# CONCURRENCY: one dev deploy at a time. The image stage of an older push is cancelled by a newer
# one; a deploy that is RUNNING is never cancelled (a cancelled `helm upgrade` leaves the release
# pending), but a newer push replaces a deploy still WAITING for it — so stale commits are skipped.
name: dev

on:
  push:
    branches: [main]

# Least privilege: nothing at workflow level; each job asks for what it needs. Only the image
# job can write packages, and it holds no kubeconfig and runs no npm install.
permissions: {}

jobs:
  image:
    name: image (os-ui main-<sha>)
    if: vars.DEV_ENVIRONMENT_ENABLED == 'true'
    concurrency:
      group: dev-image
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write   # push main-<sha>
      actions: read     # require-green-ci reads this repository's workflow runs
    uses: ./.github/workflows/build-images.yml
    with:
      image: os-ui
      version: main-${{ github.sha }}

  deploy:
    name: deploy + accept (dev)
    needs: image
    if: vars.DEV_ENVIRONMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read    # deploy.sh reads the pinned data-runner's capability label (and digests)
    outputs:
      digest: ${{ steps.running.outputs.digest }}
    environment:
      name: dev
      url: https://os.dev.agentic.datamasterclass.com
    concurrency:
      group: dev-environment
      cancel-in-progress: false
    env:
      DEV_KUBE_CONTEXT: dmagosdev
      DEV_PRIVATE_VALUES: cluster          # read the private overlay from the dev cluster
      DEV_NODE: ${{ vars.DEV_NODE || 'g2i8' }}   # the node profile the owner chose (g2i8 | m2i4)
      IMAGE_REPO: ${{ vars.IMAGE_REPO_PREFIX || 'ghcr.io/data-masterclass/sovereign-os' }}
      TAG: main-${{ github.sha }}
      DIGEST: ${{ needs.image.outputs.digest }}
      E2E_KUBE_CONTEXT: dmagosdev
      E2E_REPORT_DIR: ${{ github.workspace }}/dev-report
      DEPLOY_RECORD: ${{ github.workspace }}/dev-report/deploy-record.json
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Setup Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: v3.16.3

      # Only js-yaml for the capacity gate: no install scripts run next to the kubeconfig.
      - name: Install os-ui dependencies (capacity gate)
        run: npm --prefix os-ui ci --no-audit --no-fund --ignore-scripts

      - name: Resolve chart dependencies
        run: helm dependency build charts/sovereign-agentic-os

      # The dev kubeconfig holds ONE context (dmagosdev, a ServiceAccount of the dev cluster). It is
      # written to a private file and used through KUBECONFIG; nothing else is on this runner.
      - name: Dev kubeconfig
        env:
          DEV_KUBECONFIG: ${{ secrets.DEV_KUBECONFIG }}
        run: |
          set -euo pipefail
          [ -n "$DEV_KUBECONFIG" ] || { echo "::error::the dev environment secret DEV_KUBECONFIG is not set (docs/ops/ci-cd.md, owner checklist)"; exit 1; }
          umask 077
          printf '%s' "$DEV_KUBECONFIG" > "$RUNNER_TEMP/dev-kubeconfig.yaml"
          echo "KUBECONFIG=$RUNNER_TEMP/dev-kubeconfig.yaml" >> "$GITHUB_ENV"
          mkdir -p "$E2E_REPORT_DIR"

      # READ-ONLY registry login, exactly as prod.yml: deploy.sh reads the pinned data-runner's OCI
      # label (scripts/lib/image-label.sh, skopeo inspect --config) and refuses the deploy when it
      # cannot — so dev must be able to read the org packages before the first new runner pin.
      - name: Registry login (read)
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | skopeo login ghcr.io -u "$REGISTRY_USER" --password-stdin >/dev/null

      - name: Deploy main-<sha> to dev
        run: |
          set -euo pipefail
          # The digest the image stage pushed must be the one the registry serves for the tag.
          [ -n "$DIGEST" ] || { echo "::error::the image job reported no digest"; exit 1; }
          echo "built $IMAGE_REPO/os-ui:$TAG@$DIGEST"
          # EXPECT_DIGEST: deploy.sh refuses if the tag already resolves to other bytes.
          EXPECT_DIGEST=$DIGEST bash scripts/deploy.sh --env dev --from-registry "$TAG"

      # The digest dev RUNS (both os-ui Deployments) must be the digest the image job built.
      - name: The running digest is the built digest
        id: running
        run: |
          set -euo pipefail
          for d in os-ui os-ui-worker; do
            img=$(kubectl --context "$DEV_KUBE_CONTEXT" -n agentic-os get deploy "$d" -o jsonpath='{.spec.template.spec.containers[0].image}')
            run=${img##*@}
            [ "$run" = "$DIGEST" ] || { echo "::error::$d runs $run, the image job built $DIGEST"; exit 1; }
            echo "$d runs $run"
          done
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Smoke test (dev)
        run: |
          set -o pipefail
          bash scripts/smoke-test.sh --env dev --expect-tag "$TAG" | tee "$E2E_REPORT_DIR/smoke.txt"

      # Budgets must BLOCK: LiteLLM's database is connected, and a throwaway key with a tiny budget
      # is refused once spent (scripts/dev/budget-check.sh). Skipped with the model stub.
      - name: LiteLLM budget blocks (dev)
        if: vars.DEV_MODEL != 'stub'
        run: |
          set -o pipefail
          bash scripts/dev/budget-check.sh | tee "$E2E_REPORT_DIR/budget.txt"

      # The harness reads the gateway and Langfuse keys of THIS deployment from the dev cluster
      # into masked variables; they are never printed.
      - name: Acceptance credentials (masked)
        run: |
          set -euo pipefail
          get() { kubectl --context "$DEV_KUBE_CONTEXT" -n agentic-os get secret "$1" -o jsonpath="{.data.$2}" | base64 -d; }
          while read -r var secret key; do
            v=$(get "$secret" "$key")
            echo "::add-mask::$v"
            echo "$var=$v" >> "$GITHUB_ENV"
          done <<'LIST'
          E2E_LITELLM_MASTER_KEY litellm-credentials masterkey
          E2E_LANGFUSE_PUBLIC_KEY litellm-credentials LANGFUSE_PUBLIC_KEY
          E2E_LANGFUSE_SECRET_KEY litellm-credentials LANGFUSE_SECRET_KEY
          LIST

      # The journeys AT-a … AT-f (not the kind self-test: it proves kind's own CNI and SeaweedFS).
      # Expected-fail markers apply as on kind: the run is green while every red is an expected red.
      # Exit status: 0 when every result is the expected one (green, or red where marked
      # expected-fail); non-zero on an UNEXPECTED result (a regression, or an unexpected green).
      - name: WP-02 acceptance suite (dev)
        run: bash tests/e2e/kind/run.sh journeys/journey-*.e2e.mjs

      - name: Report to job summary
        if: always()
        run: |
          {
            echo "## dev: \`main-${GITHUB_SHA:0:12}\`"
            echo
            echo "**What green means here:** built, deployed, running digest checked, smoke-tested, and the"
            echo "acceptance journeys ran with no unexpected result. Expected-fail assertions are counted below;"
            echo "they turn green as their work packages land. It is not yet a full acceptance pass."
            echo
            if [ -f "$DEPLOY_RECORD" ]; then
              echo "Deploy record (roll back with the command shown):"
              echo; echo '```json'; cat "$DEPLOY_RECORD"; echo '```'; echo
            fi
            if [ -f "$E2E_REPORT_DIR/budget.txt" ]; then
              echo "### LiteLLM budget"; echo; echo '```'; cat "$E2E_REPORT_DIR/budget.txt"; echo '```'; echo
            fi
            if [ -f "$E2E_REPORT_DIR/smoke.txt" ]; then
              echo "### smoke test"; echo; echo '```'; cat "$E2E_REPORT_DIR/smoke.txt"; echo '```'; echo
            fi
            [ ! -f "$E2E_REPORT_DIR/report.md" ] || cat "$E2E_REPORT_DIR/report.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report and deploy record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dev-report
          path: dev-report/
          if-no-files-found: warn

  # "Green on dev" = this job succeeded. It is skipped when dev is not enabled and fails when the
  # deploy, the smoke test or the acceptance suite failed (or was cancelled by a newer push).
  dev-green:
    name: dev-green
    needs: [image, deploy]
    if: always() && vars.DEV_ENVIRONMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: The image, the deploy, the running digest, the smoke test and the acceptance run all passed
        env:
          IMAGE: ${{ needs.image.result }}
          DEPLOY: ${{ needs.deploy.result }}
          BUILT: ${{ needs.image.outputs.digest }}
          RUNNING: ${{ needs.deploy.outputs.digest }}
          REPO_PREFIX: ${{ vars.IMAGE_REPO_PREFIX || 'ghcr.io/data-masterclass/sovereign-os' }}
        run: |
          set -euo pipefail
          echo "image=$IMAGE deploy=$DEPLOY built=$BUILT running=$RUNNING"
          [ "$IMAGE" = success ] && [ "$DEPLOY" = success ]
          [ -n "$BUILT" ] && [ "$BUILT" = "$RUNNING" ]
          mkdir -p record
          python3 - "$GITHUB_SHA" "$RUNNING" "$REPO_PREFIX/os-ui" "$GITHUB_RUN_ID" > record/dev-tested-digest.json <<'PY'
          import json, sys
          sha, digest, image, run = sys.argv[1:5]
          print(json.dumps({"sha": sha, "digest": digest, "image": image, "run_id": run}))
          PY
          cat record/dev-tested-digest.json
          { echo "### dev-tested digest"; echo; echo "\`$REPO_PREFIX/os-ui@$RUNNING\` for \`$GITHUB_SHA\`"; } >> "$GITHUB_STEP_SUMMARY"

      # The ONE record production deploys from (scripts/lib/dev-digest.sh). An artifact belongs to
      # this run and cannot be rewritten in place; a newer tag on main-<sha> does not change it.
      - name: Record the dev-tested digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dev-tested-digest
          path: record/dev-tested-digest.json
          if-no-files-found: error
          retention-days: 90
