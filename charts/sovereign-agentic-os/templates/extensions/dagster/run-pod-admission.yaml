{{- /*
  Copyright 2026 Borek Data Ventures UG (haftungsbeschränkt)
  SPDX-License-Identifier: Apache-2.0

  Dagster run-pod shape, enforced by the API server (ValidatingAdmissionPolicy, in-tree:
  https://kubernetes.io/docs/reference/access-authn-authz/validating-admission-policy/).

  The Dagster subchart grants its ServiceAccounts create/patch on Pods and Jobs in this namespace
  (the K8sRunLauncher starts each run as a Job; https://docs.dagster.io/deployment/oss/deployment-options/kubernetes).
  Every Pod or Job such an identity writes must have the run-pod shape:
    - labels: only the ones dagster-k8s and the chart's podTemplateSpecMetadata put on a run
      (app.kubernetes.io/name=dagster, instance=dagster, component run_worker|step_worker,
      part-of dagster|sovereign-os, version, `component: user-deployments`, `dagster/*`, and the
      Job controller's own `job-name`/`controller-uid`/`batch.kubernetes.io/*`) — so no
      platform workload's identity (os-ui, opa, trino, …) that NetworkPolicies trust;
    - images: the pinned Dagster code-location images only;
    - serviceAccountName: the run ServiceAccount(s) only;
    - no hostPath volume, no host network/PID/IPC, no privileged container.
  Pods the Job controller creates from an admitted Job are not re-checked (their requester is the
  Job controller); the Job's template was. A Pod UPDATE (e.g. a relabel) by these identities is
  checked too.

  Identities and run ServiceAccounts follow the subchart's names for this release; override
  `dagsterPodAdmission.launcherServiceAccounts` / `runServiceAccounts` when a custom launcher or
  run identity uses others. scripts/check-dagster-pod-admission.mjs asserts both lists against the
  rendered RBAC and run config; scripts/tests/dagster-pod-admission.kind.sh proves it on a cluster.
*/}}
{{- $pa := .Values.dagsterPodAdmission | default dict }}
{{- if and .Values.dagster.enabled $pa.enabled }}
{{- $ns := .Release.Namespace }}
{{- $launchers := $pa.launcherServiceAccounts | default (list (printf "%s-dagster" .Release.Name) (printf "%s-dagster-user-deployments-user-deployments" .Release.Name)) }}
{{- $runSAs := $pa.runServiceAccounts | default (list (printf "%s-dagster-user-deployments-user-deployments" .Release.Name)) }}
{{- $images := list }}
{{- range ((index .Values.dagster "dagster-user-deployments" | default dict).deployments | default list) }}
{{- $i := .image | default dict }}
{{- if $i.digest }}
{{- $images = append $images (printf "%s@%s" $i.repository $i.digest) }}
{{- $images = append $images (printf "%s:%s@%s" $i.repository (toString $i.tag) $i.digest) }}
{{- else }}
{{- $images = append $images (printf "%s:%s" $i.repository (toString $i.tag)) }}
{{- end }}
{{- end }}
{{- range ($pa.extraImages | default list) }}{{- $images = append $images . }}{{- end }}
{{- $users := list }}
{{- range $launchers }}{{- $users = append $users (printf "system:serviceaccount:%s:%s" $ns .) }}{{- end }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ .Release.Name }}-dagster-run-pod-shape
  labels:
    {{- include "soa.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $ns | quote }}
    resourceRules:
      - { apiGroups: [""], apiVersions: ["v1"], operations: ["CREATE", "UPDATE"], resources: ["pods"] }
      - { apiGroups: ["batch"], apiVersions: ["v1"], operations: ["CREATE", "UPDATE"], resources: ["jobs"] }
  matchConditions:
    - name: dagster-launcher-identity
      expression: {{ printf "request.userInfo.username in %s" ($users | toJson) | quote }}
  variables:
    - name: spec
      expression: "request.kind.kind == 'Job' ? object.spec.template.spec : object.spec"
    - name: labels
      expression: "request.kind.kind == 'Job' ? object.spec.template.?metadata.?labels.orValue({}) : object.metadata.?labels.orValue({})"
    - name: containers
      expression: "variables.spec.containers + variables.spec.?initContainers.orValue([]) + variables.spec.?ephemeralContainers.orValue([])"
  validations:
    - expression: >-
        variables.labels.all(k, k.startsWith('dagster/') || k.startsWith('batch.kubernetes.io/') ||
        k in ['app.kubernetes.io/name', 'app.kubernetes.io/instance', 'app.kubernetes.io/component',
        'app.kubernetes.io/part-of', 'app.kubernetes.io/version', 'component', 'job-name', 'controller-uid'])
      message: "a Dagster run pod carries only the run labels (dagster-k8s and podTemplateSpecMetadata)"
    - expression: >-
        variables.labels[?'app.kubernetes.io/name'].orValue('dagster') == 'dagster' &&
        variables.labels[?'app.kubernetes.io/instance'].orValue('dagster') == 'dagster' &&
        variables.labels[?'app.kubernetes.io/component'].orValue('run_worker') in ['run_worker', 'step_worker'] &&
        variables.labels[?'app.kubernetes.io/part-of'].orValue('dagster') in ['dagster', 'sovereign-os'] &&
        variables.labels[?'component'].orValue('user-deployments') == 'user-deployments'
      message: "a Dagster run pod may not carry another workload's identity labels"
    - expression: {{ printf "variables.containers.all(c, c.image in %s)" ($images | toJson) | quote }}
      message: "a Dagster run pod runs only the pinned Dagster code-location images"
    - expression: {{ printf "variables.spec.?serviceAccountName.orValue('') in %s" ($runSAs | toJson) | quote }}
      message: "a Dagster run pod runs as the run ServiceAccount"
    - expression: "variables.spec.?volumes.orValue([]).all(v, !has(v.hostPath))"
      message: "a Dagster run pod mounts no hostPath"
    - expression: "!variables.spec.?hostNetwork.orValue(false) && !variables.spec.?hostPID.orValue(false) && !variables.spec.?hostIPC.orValue(false)"
      message: "a Dagster run pod uses no host namespace"
    - expression: "variables.containers.all(c, !c.?securityContext.?privileged.orValue(false))"
      message: "a Dagster run pod runs no privileged container"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ .Release.Name }}-dagster-run-pod-shape
  labels:
    {{- include "soa.labels" . | nindent 4 }}
spec:
  policyName: {{ .Release.Name }}-dagster-run-pod-shape
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $ns | quote }}
{{- end }}
