{{- /*
  SPDX-License-Identifier: Apache-2.0
  Copyright 2026 Borek Data Ventures UG (haftungsbeschränkt)

  WP-56: the backup and restore-drill scripts (files/backup/*) plus the chart's ONE OpenSearch
  shell client, as one ConfigMap. The same files run in CI (tests/backup) unchanged.
*/}}
{{- $b := .Values.backup }}
{{- if or (include "soa.gitBundlesOn" .) $b.drill.enabled $b.veleroDrill.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
data:
  {{- range $path, $_ := .Files.Glob "files/backup/*.sh" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
  os-curl.sh: |
    {{- .Files.Get "files/opensearch/lib/os-curl.sh" | nindent 4 }}
{{- end }}
