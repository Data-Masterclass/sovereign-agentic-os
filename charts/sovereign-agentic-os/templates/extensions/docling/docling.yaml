{{- if .Values.docling.enabled }}
{{- /*
  Docling (MIT) — document parsing service (docling-serve). Converts uploaded
  documents (PDF/DOCX/HTML/…) into clean text/markdown for the knowledge index
  (architecture.md: "upload docs (parsed by Docling) -> embedded into OpenSearch").
  Runs as the image's non-root uid 1001; rootfs stays writable for the model cache.

  The image is OUR derived image (images/extensions/docling): upstream docling-serve-cpu with the
  Apache-2.0 TableFormer v2 weights baked in, the TableFormer v1 weights removed, and the table
  preset fixed to v2 server-side. Settings are docling-serve's own DOCLING_SERVE_* variables
  (docs/configuration.md). Probes: `/ready` answers 503 until the boot warm-up has loaded the
  default-preset (v2) models; `/livez` is the process check. The image is always pinned by
  digest: rendering fails without `docling.image.digest` (`docling.image.localBuild` is the one
  exception, for an image built and loaded into a local kind cluster by scripts/os). Ingress is limited to os-ui and
  os-ui-worker (templates/base/network/docling-ingress-policy.yaml), and every API call needs the
  key from the `docling-api-key` Secret (docling-api-key.yaml).
*/}}
{{- $d := .Values.docling }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docling
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "docling") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "soa.selectorLabels" (dict "ctx" . "component" "docling") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "soa.labels" . | nindent 8 }}
        {{- include "soa.selectorLabels" (dict "ctx" . "component" "docling") | nindent 8 }}
    spec:
      {{- include "soa.priorityClassName" (dict "ctx" . "tier" "app") | nindent 6 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "soa.podSecurityContext" . | nindent 8 }}
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: docling
          {{- if $d.image.localBuild }}
          image: "{{ $d.image.repository }}:{{ $d.image.tag }}"
          {{- else }}
          image: "{{ $d.image.repository }}:{{ $d.image.tag }}@{{ required "docling.image.digest must be set: the digest build-images.yml printed for this tag" $d.image.digest }}"
          {{- end }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "soa.containerSecurityContext" . | nindent 12 }}
          ports:
            - { name: http, containerPort: 5001 }
          env:
            - name: DOCLING_SERVE_MAX_FILE_SIZE
              value: {{ $d.maxFileSize | int64 | quote }}
            - name: DOCLING_SERVE_MAX_NUM_PAGES
              value: {{ $d.maxNumPages | int64 | quote }}
            - name: DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT
              value: {{ $d.maxDocumentTimeout | int64 | quote }}
            - name: DOCLING_SERVE_RESULT_REMOVAL_DELAY
              value: {{ $d.resultRemovalDelay | int64 | quote }}
            - name: DOCLING_SERVE_ENG_LOC_NUM_WORKERS
              value: {{ $d.workers | int64 | quote }}
            - name: DOCLING_SERVE_SHOW_VERSION_INFO
              value: {{ $d.showVersionInfo | quote }}
            - name: DOCLING_SERVE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "soa.doclingApiKeySecret" . }}
                  key: apiKey
          startupProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 20
          resources:
            {{- toYaml $d.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: docling
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "docling") | nindent 4 }}
spec:
  selector:
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "docling") | nindent 4 }}
  ports:
    - { name: http, port: 5001, targetPort: http }
{{- end }}
