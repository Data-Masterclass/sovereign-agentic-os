{{- if and .Values.langfuse.enabled (eq .Values.global.profile "local") }}
{{- /*
  Local-only Langfuse core secrets (salt, encryption key, NextAuth secret), from
  `langfuseInit.{salt,nextauthSecret,encryptionKey}`. The defaults are STABLE dev values: they must not change between
  `helm upgrade`s by accident (a new encryption key orphans already-encrypted data). Set them
  from a private overlay (scripts/ops/rotate-secrets.sh). On STACKIT this Secret is provided
  externally (External Secrets) and nothing here renders (profile != local).
*/}}
{{- if not (include "soa.eso.owned" (list $ "langfuse-core-secrets")) }}
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-core-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "langfuse") | nindent 4 }}
  {{- with include "soa.eso.keep" (list $ "langfuse-core-secrets") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
{{- /* langfuseInit.{salt,nextauthSecret,encryptionKey}: set them from a private overlay (the dev
       overlay and scripts/ops/rotate-secrets.sh do); unset = the old literals, so an existing
       install renders unchanged. */}}
{{- $i := .Values.langfuseInit }}
{{- $salt := $i.salt | default "sovereign-os-local-dev-salt" }}
{{- $nextauth := $i.nextauthSecret | default "sovereign-os-local-dev-nextauth-secret" }}
{{- $enc := $i.encryptionKey | default "a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90" }}
{{- if not (regexMatch "^[0-9a-f]{64}$" $enc) }}
{{- fail "langfuseInit.encryptionKey must be 64 lowercase hex characters (256 bits): openssl rand -hex 32" }}
{{- end }}
stringData:
  # API-key fast hash (apiAuth.ts). A change re-hashes each key on its next use; it locks no key out.
  salt: {{ $salt | quote }}
  # Signs Langfuse sessions: a change signs everyone out. Must not be a known value.
  nextauthSecret: {{ $nextauth | quote }}
  # Encrypts LLM connections and integration secrets at rest. A change orphans them:
  # docs/ops/secret-rotation.md, "Langfuse encryptionKey".
  encryptionKey: {{ $enc | quote }}
{{- end }}
{{- end }}
