{{- /* WP-11: the chart's governance seed (values `opa.governance` plus the optional dagster-analytics
     warehouse principal), computed exactly as `$gov` below, and the whole seed (data.json +
     governance.json) as one JSON document: os-ui's os-data bundle base (OS_OPA_SEED). */}}
{{- define "soa.opaGovernance" -}}
{{- $wp := (.Values.dagsterAnalytics | default dict).warehousePrincipal | default dict }}
{{- $gov := (.Values.opa.governance | default dict) }}
{{- if $wp.enabled }}
{{-   $gov = deepCopy $gov }}
{{-   $princ := (dig "principals" dict $gov) }}
{{-   $princ = merge (dict) $princ (dict $wp.name (dict "domains" ($wp.domains | default (list "sales")) "clearances" ($wp.clearances | default list))) }}
{{-   $_ := set $gov "principals" $princ }}
{{- end }}
{{- $gov | toJson }}
{{- end }}
{{- define "soa.opaSeed" -}}
{{- /* Bundle mode adds one seed grant: OPA's own status reports to os-ui are an OPA decision. */}}
{{- $grants := merge (dict "opa-status-reporter" (list "opa_status_report")) (deepCopy (.Values.opa.grants | default dict)) }}
{{- /* WP-15: the Dagster pods' run-grant calls are an OPA decision too, per ServiceAccount. */}}
{{- $ri := .Values.dagsterRunIdentity | default dict }}
{{- if $ri.enabled }}
{{- $_ := set $grants (printf "system:serviceaccount:%s:%s" .Release.Namespace $ri.runServiceAccount) (list "run_grant_start") }}
{{- $_ := set $grants (printf "system:serviceaccount:%s:%s" .Release.Namespace $ri.codeServiceAccount) (list "run_grant_finish") }}
{{- end }}
{{- dict "seed_grants" $grants "requires_approval" (.Values.opa.requiresApproval | default list) "governance" (include "soa.opaGovernance" . | fromJson) | toJson }}
{{- end }}
{{- if .Values.opa.enabled }}
{{- /*
  OPA — policy-as-code at the MCP/tool boundary (Layer 2 / security.md).
  Default-deny tool authorization: a principal (a LiteLLM key / agent identity)
  may invoke a tool only if it's granted. Internet tools (web_fetch) are not in
  the default grants, so they're denied unless explicitly granted — exactly the
  "deny internet tools unless granted" baseline. The governed web_fetch tool and
  its wiring arrive with the egress baseline step.
*/}}
{{- $opa := .Values.opa }}
{{- /*
  epic #146 Phase 4 — dagster-analytics warehouse principal. Default OFF, so `$gov`
  is byte-identical to `$opa.governance` unless the operator flips the toggle. When
  enabled, we deep-copy the governance object and add ONE principal (Trino has no
  user store — declaring it here IS defining it; the trino.rego write-target floor +
  row-filter do the rest). deepCopy avoids mutating the shared .Values map.
*/}}
{{- $wp := (.Values.dagsterAnalytics | default dict).warehousePrincipal | default dict }}
{{- $gov := ($opa.governance | default dict) }}
{{- if $wp.enabled }}
{{-   $gov = deepCopy $gov }}
{{-   $princ := (dig "principals" dict $gov) }}
{{-   $princ = merge (dict) $princ (dict $wp.name (dict "domains" ($wp.domains | default (list "sales")) "clearances" ($wp.clearances | default list))) }}
{{-   $_ := set $gov "principals" $princ }}
{{- end }}
{{- $db := $opa.dataBundle | default dict }}
{{- $govDb := (.Values.postgres.governance | default dict) }}
{{- $grantsBundle := and $db.enabled .Values.postgres.enabled $govDb.enabled }}
{{- $persist := and $db.enabled ($db.persistence | default dict).enabled }}
{{- /* The revision of everything OPA loads: policies + chart data. Used for the
  pod-restart checksum and as OPA's `policy_rev` label. */}}
{{- $guardrails := ($opa.guardrailsData | default dict).enabled }}
{{- if and $guardrails (not $db.enabled) }}
{{- fail "opa.guardrailsData.enabled needs opa.dataBundle.enabled: the guardrail data reaches OPA only in the os-data bundle" }}
{{- end }}
{{- $policyRev := printf "%s-%s-%s-%s-%s-%s-%s-%s-%s-%s" ($opa.grants | toJson) (($opa.requiresApproval | default list) | toJson) ($gov | toJson) (.Files.Get "policies/authz.rego") (.Files.Get "policies/trino.rego") (.Files.Get "policies/trino_impersonation.rego") (.Files.Get "policies/service_identities.json") (.Files.Get "policies/connections.rego") (.Files.Get "policies/system/log.rego") (.Files.Get "policies/system/authz.rego") | sha256sum }}
{{- if $guardrails }}
{{- $policyRev = printf "%s-%s" $policyRev (.Files.Get "policies/guardrails.rego") | sha256sum }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-policy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "opa") | nindent 4 }}
data:
  # The agent-tool policy (package agentic.authz). Plain Rego in the chart's
  # policies/ dir, tested beside it (authz_test.rego, CI job `test-opa`).
  authz.rego: |
{{ .Files.Get "policies/authz.rego" | indent 4 }}
  # Chart-baked defaults. The grants seed is written under `seed_grants` — a path
  # DISTINCT from the runtime `data.grants` that os-ui's policy compiler replaces
  # wholesale (`PUT /v1/data/grants`). This makes authorization deterministic: the
  # seed is never clobbered by a runtime PUT, and an OPA restart / file re-read
  # always restores it (killing the query_data/retrieve deny flip-flop). authz.rego
  # reads BOTH `data.grants` and `data.seed_grants` (bare + domain:/user: forms).
  data.json: |
    {{ dict "seed_grants" $opa.grants "requires_approval" ($opa.requiresApproval | default list) | toJson }}
  # SECOND policy doc — Trino data governance (row filter by domain + column mask
  # by sensitivity). Same OPA, different package (`trino`); agentic.authz untouched.
  trino.rego: |
{{ .Files.Get "policies/trino.rego" | indent 4 }}
  # Who may set another Trino session user (WP-14): only the three service users, each bounded
  # by run grants or active users.
  trino_impersonation.rego: |
{{ .Files.Get "policies/trino_impersonation.rego" | indent 4 }}
  # The service identities no one may impersonate (os-ui core/infra/trino-service-identities.ts).
  service_identities.json: |
{{ .Files.Get "policies/service_identities.json" | indent 4 }}
  # Governance data the Trino policy reads (data.governance). In production this is
  # populated from the artifact-registry / OpenMetadata visibility model; locally
  # we seed the Sales worked example so the governance proof runs on kind.
  governance.json: |
    {{ dict "governance" $gov | toJson }}
  # Connection capability policy (package connections.authz), loaded and tested
  # (connections_test.rego). Its per-connection data is not published to OPA yet.
  connections.rego: |
{{ .Files.Get "policies/connections.rego" | indent 4 }}
  # Decision-log policy (package system.log): `drop` skips plain data-document reads,
  # `mask` erases secret-bearing keys (decision_logs.drop_decision / mask_decision).
  system-log.rego: |
{{ .Files.Get "policies/system/log.rego" | indent 4 }}
  # OPA's own API authorization (package system.authz): who may write data and policies and
  # who may ask for which decision. Active with `opa.auth.enforce` (--authorization=basic).
  system-authz.rego: |
{{ .Files.Get "policies/system/authz.rego" | indent 4 }}
{{- if $guardrails }}
  # Knowledge guardrails (package os.guardrails, WP-30): one platform policy that reads the
  # committed guardrail data at data.os_data.guardrails (os-data bundle); tested beside it.
  guardrails.rego: |
{{ .Files.Get "policies/guardrails.rego" | indent 4 }}
{{- end }}
---
# OPA's own configuration file (--config-file). Decision logs go to the console
# (OPA's log output, one JSON line per decision); the cluster log pipeline collects them
# from there. `labels.policy_rev` is the revision of the policy + data above and
# is stamped on every decision-log entry.
# https://www.openpolicyagent.org/docs/configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "opa") | nindent 4 }}
data:
  opa-config.yaml: |
    labels:
      policy_rev: {{ $policyRev | quote }}
    {{- if $db.enabled }}
      instance: opa
    # WP-11: policy DATA comes from os-ui's bundles, which OPA downloads, activates atomically and
    # persists itself (https://www.openpolicyagent.org/docs/management-bundles). Nothing is pushed.
    # The bearer is the dedicated `opa-bundle-token`, held only by OPA and the os-ui web process.
    services:
      osui:
        url: {{ $db.serviceUrl | quote }}
        credentials:
          bearer:
            token_path: /var/run/opa/bundle-token/token
    bundles:
      os-data:
        service: osui
        resource: bundles/os-data.tar.gz
        persist: true
        polling:
          min_delay_seconds: {{ $db.polling.minDelaySeconds }}
          max_delay_seconds: {{ $db.polling.maxDelaySeconds }}
      {{- if $grantsBundle }}
      os-grants:
        service: osui
        resource: bundles/os-grants.tar.gz
        persist: true
        polling:
          long_polling_timeout_seconds: {{ $db.grants.longPollingTimeoutSeconds }}
      {{- end }}
    # With `persist: true`, a restarted OPA (and, with the PVC, a NEW pod) activates the last good
    # bundles from here even while os-ui is down (bundle persistence).
    persistence_directory: /var/opa
    # Each activation is reported to os-ui (POST /api/opa/status), so a run can wait until its
    # grant is active (https://www.openpolicyagent.org/docs/management-status).
    status:
      service: osui
    {{- end }}
    {{- if $opa.decisionLogs.enabled }}
    decision_logs:
      console: true
      drop_decision: system/log/drop
      mask_decision: system/log/mask
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "opa") | nindent 4 }}
spec:
  replicas: 1
  {{- if $persist }}
  # One ReadWriteOnce volume: the old pod releases it before the new one starts (no multi-attach).
  # The new pod is ready within seconds from the persisted bundle. maxSurge 0 does that without
  # changing `type`: an upgrade from a release whose Deployment holds `rollingUpdate` (the API
  # server's default) is refused when `type` becomes Recreate (scripts/tests/opa-strategy.test.sh).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  {{- end }}
  selector:
    matchLabels:
      {{- include "soa.selectorLabels" (dict "ctx" . "component" "opa") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/policy: {{ $policyRev }}
        {{- if $db.enabled }}
        checksum/config: {{ list $opa.decisionLogs $db $grantsBundle ($opa.auth | default dict).enforce | toJson | sha256sum }}
        {{- else }}
        checksum/config: {{ list $opa.decisionLogs ($opa.auth | default dict).enforce | toJson | sha256sum }}
        {{- end }}
      labels:
        {{- include "soa.labels" . | nindent 8 }}
        {{- include "soa.selectorLabels" (dict "ctx" . "component" "opa") | nindent 8 }}
    spec:
      {{- include "soa.priorityClassName" (dict "ctx" . "tier" "critical") | nindent 6 }}
      securityContext:
        {{- include "soa.podSecurityContext" . | nindent 8 }}
        runAsUser: 1000
        {{- if $persist }}
        {{- /* The `opa-bundles` PVC is root-owned when first provisioned; OPA runs as 1000 and
             persists its bundles under /var/opa/bundles (`mkdir /var/opa/bundles: permission
             denied` without this). Kubernetes' documented fix: fsGroup makes the volume group-
             writable for the pod; OnRootMismatch skips the recursive chown once the root is right. */}}
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
      containers:
        - name: opa
          image: "{{ $opa.image.repository }}:{{ $opa.image.tag }}@{{ $opa.image.digest }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "soa.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          args:
            - "run"
            - "--server"
            - "--addr=0.0.0.0:8181"
            - "--log-level=info"
            - "--config-file=/config/opa-config.yaml"
            {{- if ($opa.auth | default dict).enforce }}
            # Bearer tokens + the system.authz policy (https://www.openpolicyagent.org/docs/security).
            - "--authentication=token"
            - "--authorization=basic"
            {{- end }}
            - "--watch"
            # Explicit files, not the dir: ConfigMap volumes add ..data symlinks
            # that make a recursive dir load see each file multiple times.
            {{- if $db.enabled }}
            # Bundle mode: the seed data files are in the os-data bundle, not loaded here (a file
            # under a bundle root would conflict with it).
            {{- regexReplaceAll "(?m)^- \"/policies/(data|governance)\\.json\"\n?" (include "soa.opaPolicyFiles" .) "" | trimSuffix "\n" | nindent 12 }}
            {{- else }}
            {{- include "soa.opaPolicyFiles" . | nindent 12 }}
            {{- end }}
          # system.authz reads the two tokens from here (opa.runtime().env).
          env:
            - name: OPA_WRITER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "soa.opa.tokenSecret" . }}
                  key: writer
            - name: OPA_READER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "soa.opa.tokenSecret" . }}
                  key: reader
          ports:
            - { name: http, containerPort: 8181 }
          readinessProbe:
            {{- if $db.enabled }}
            # Ready only once every bundle is activated: a cold OPA takes no traffic (fail closed).
            httpGet: { path: "/health?bundles", port: http }
            {{- else }}
            httpGet: { path: /health, port: http }
            {{- end }}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml $opa.resources | nindent 12 }}
          volumeMounts:
            - { name: policy, mountPath: /policies, readOnly: true }
            - { name: config, mountPath: /config, readOnly: true }
            {{- if $db.enabled }}
            - { name: bundle-token, mountPath: /var/run/opa/bundle-token, readOnly: true }
            - { name: bundle-persist, mountPath: /var/opa }
            {{- end }}
      volumes:
        - name: policy
          configMap:
            name: opa-policy
        - name: config
          configMap:
            name: opa-config
        {{- if $db.enabled }}
        - name: bundle-token
          secret:
            secretName: opa-bundle-token
            items: [{ key: token, path: token }]
        - name: bundle-persist
          {{- if $persist }}
          persistentVolumeClaim:
            claimName: opa-bundles
          {{- else }}
          # Survives a container restart only; a new pod starts unready until os-ui serves a bundle.
          emptyDir: { sizeLimit: 64Mi }
          {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "opa") | nindent 4 }}
spec:
  selector:
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "opa") | nindent 4 }}
  ports:
    - { name: http, port: 8181, targetPort: http }
{{- if $db.enabled }}
---
# WP-11: the bundle-service bearer, for OPA and the os-ui web process ONLY (not the run worker, not
# Dagster). Generated in the cluster on first install and kept across upgrades; never in values.
{{- $existing := lookup "v1" "Secret" .Release.Namespace "opa-bundle-token" }}
apiVersion: v1
kind: Secret
metadata:
  name: opa-bundle-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "opa") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ if $existing }}{{ index $existing.data "token" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- if $persist }}
---
# The last good bundles survive a new pod (node roll, eviction, rollout restart).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opa-bundles
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "opa") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with $db.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $db.persistence.size }}
{{- end }}
{{- end }}
{{- end }}
