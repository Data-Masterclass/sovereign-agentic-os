{{- /*
  Docling: restrict ingress to the OS components that use it (defence in depth).

  Selects the docling-serve pod and admits :5001 only from the OS components that call it —
    os-ui         (component os-ui; uploads and the admin re-index call Docling)
    os-ui-worker  (component os-ui-worker; background extraction and indexing)

  Everything else in the namespace (and outside it) is not admitted. Kubelet probes and
  `kubectl port-forward` are unaffected (they do not traverse pod-to-pod policy). Behind the
  policy, docling-serve also requires its API key on every API route (docling-api-key.yaml).

  A NEW direct client of Docling must be added here, or its requests will time out once the
  policy is enforced.

  Gated by `docling.networkPolicy.enabled` (default true) and rendered only with
  `docling.enabled`. kind's default CNI does not enforce NetworkPolicies — locally this applies
  but is inert; on STACKIT (Calico) it enforces.
*/}}
{{- if and .Values.docling.enabled .Values.docling.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: docling-allow-os-ui-only
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "soa.selectorLabels" (dict "ctx" . "component" "docling") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: os-ui
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: os-ui-worker
      ports:
        - { protocol: TCP, port: 5001 }
{{- end }}
