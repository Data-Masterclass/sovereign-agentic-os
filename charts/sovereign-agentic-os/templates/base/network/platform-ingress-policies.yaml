    - Ingress
  ingress:
    - from:
        {{- include "soa.np.peers" (dict "extra" (concat $langfusePods $litellmPods)) | nindent 8 }}
      ports:
        - { protocol: TCP, port: 6379 }
{{- end }}

{{- if .Values.clickhouse.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse-allow-callers
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
spec:
