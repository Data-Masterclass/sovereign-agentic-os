    - Ingress
  ingress:
    - from:
        {{- include "soa.np.peers" (dict "extra" $langfusePods) | nindent 8 }}
      ports:
        - { protocol: TCP, port: 8123 }
        - { protocol: TCP, port: 9000 }
{{- end }}

{{- if .Values.webFetch.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-fetch-allow-callers
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: web-fetch
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- include "soa.np.peers" (dict) | nindent 8 }}
      ports:
        - { protocol: TCP, port: 8000 }
{{- end }}

{{- if .Values.egressProxy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: egress-proxy-allow-callers
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: egress-proxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- include "soa.np.peers" (dict "components" (list "web-fetch" "opensearch-snapshot-register" "opensearch-snapshot-cron" "opensearch-maintenance") "extra" (concat $opensearchPods $litellmPods)) | nindent 8 }}
      ports:
        - { protocol: TCP, port: 3128 }
{{- end }}

{{- /* query-tool and data-runner: os-ui-apps-runner.yaml carries the same allowlist, but only with
       softwareRunner.networkPolicy.enabled; under default-deny they need one on every profile.
       LiteLLM's MCP entry for query-tool is NOT admitted: agent tools run inside os-ui (A5),
       which calls query-tool itself, so the gateway has no business on the data plane. */}}
{{- range $svc := list (dict "on" .Values.queryTool.enabled "c" "query-tool") (dict "on" .Values.dataRunner.enabled "c" "data-runner") }}
{{- if $svc.on }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $svc.c }}-allow-callers
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "soa.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: {{ $svc.c }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- include "soa.np.peers" (dict) | nindent 8 }}
      ports:
        - { protocol: TCP, port: 8000 }
{{- end }}
{{- end }}

{{- if .Values.mockModel.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mock-model-allow-callers
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mock-model
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- include "soa.np.peers" (dict "extra" $litellmPods) | nindent 8 }}
      ports:
        - { protocol: TCP, port: 8080 }
{{- end }}
{{- end }}
