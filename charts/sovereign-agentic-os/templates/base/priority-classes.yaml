{{- if .Values.priorityClasses.enabled }}
{{- /*
  PriorityClasses (00 §10.1 decision 2, WP-47). The ladder, highest first:
    - critical:      Postgres, OPA, os-ui (and Keycloak when it lands). Identity, policy and the
                     database are what every other component depends on.
    - infra:         the data backends (OpenSearch, ClickHouse, Valkey, object storage).
    - app:           every other OS workload.
    - (no class, 0): pods of subcharts that have no priorityClassName value upstream
                     (Langfuse, LiteLLM, Dagster).
    - observability: the Victoria stack. Under memory pressure it goes first among OS pods.
    - userApps:      Software-tab user apps. Below every platform pod, and never preempts.
  The kubelet evicts lower-priority pods first under node pressure; the scheduler preempts lower
  to place higher. All values sit far below the system-cluster-critical / system-node-critical
  band (2000000000), so none preempts kube-system. None is globalDefault, so pods outside this
  chart keep their own behaviour. `value` is immutable on a live PriorityClass; a new value needs
  a new name. Cluster-scoped, gated by `priorityClasses.enabled`; Helm installs PriorityClass
  before workloads.
  https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/
*/}}
{{- $descriptions := dict
  "critical" "Sovereign Agentic OS critical tier (Postgres, OPA, os-ui, identity). The last OS pods to be evicted."
  "infra" "Sovereign Agentic OS infra tier (data backends). Evicted after the app tier, before the critical tier."
  "app" "Sovereign Agentic OS application tier. Evicted before the infra and critical tiers."
  "observability" "Sovereign Agentic OS observability tier (Victoria stack). Evicted before every other OS pod."
  "userApps" "User apps from the Software tab. Lowest priority; never preempts another pod." }}
{{- range $tier := list "critical" "infra" "app" "observability" "userApps" }}
{{- $pc := index $.Values.priorityClasses $tier }}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ $pc.name }}
  labels:
    {{- include "soa.labels" $ | nindent 4 }}
value: {{ $pc.value }}
globalDefault: false
preemptionPolicy: {{ eq $tier "userApps" | ternary "Never" "PreemptLowerPriority" }}
description: {{ index $descriptions $tier | quote }}
{{- end }}
{{- end }}
{{- if include "soa.appBuilder.buildReady" . }}
{{- /* App Builder (C1, spec 6.1): every app-checks run pod (gates, build-image, push-image, scans) sits below every
       platform pod and never preempts, so an os-ui rollout always wins the node; builds queue instead. Rendered exactly
       when the run pods reference it (builds configured), independent of priorityClasses.enabled. */}}
{{- $bpc := (.Values.softwareRunner.environments.build | default dict).priorityClass | default dict }}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ $bpc.name | default "soa-build-low" }}
  labels:
    {{- include "soa.labels" $ | nindent 4 }}
value: {{ $bpc.value | default -200 }}
globalDefault: false
preemptionPolicy: Never
description: "App Builder build pods (app-checks runs). Below every platform pod; never preempts."
{{- $ppc := include "soa.appBuilder.buildPoolPriorityClass" . | fromYaml }}
{{- if $ppc.name }}
{{- /* The build-image pod on the DEDICATED build pool: at or above the cluster autoscaler's expendable cutoff (-10), so a
       Pending build scales an autoscaled / scale-to-zero pool up. Never preempts; only build pods tolerate that pool. */}}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ $ppc.name }}
  labels:
    {{- include "soa.labels" $ | nindent 4 }}
value: {{ $ppc.value }}
globalDefault: false
preemptionPolicy: Never
description: "App Builder build-image pods on the dedicated build pool. Not expendable for the cluster autoscaler; never preempts."
{{- end }}
{{- end }}
