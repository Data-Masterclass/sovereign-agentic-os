{{- if .Values.osUI.enabled }}
{{- /*
  OS UI — the Next.js front door (the unified app shell + the live tabs:
  Home, Agents/Chat, Structured Data, Monitoring, Dashboards).
  Server-side API routes call the in-cluster backends (sample-agent, query-tool,
  Langfuse); the Langfuse keys come from a Secret so they never sit in plaintext.
  Non-root, readiness + liveness probes, port 3000.

  NOTE: this template is gated on `.Values.osUI.enabled`. The other engineer must
  add the `osUI:` block to values.yaml + the image to scripts/build-images.sh —
  see os-ui/INTEGRATION.md. Without that block this file renders to nothing.
*/}}
{{- $u := .Values.osUI }}
{{- $dpg := $u.dataProjectGit | default dict }}
{{- /*
  Scoped RBAC for the native Components surface. The OS UI server reads workload
  status + scales Deployments/StatefulSets 0<->1 and reads CNPG Clusters
  directly via the in-cluster API (lib/platform.ts).
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: os-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "os-ui") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: os-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "deployments/scale", "statefulsets/scale"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
  {{- if or .Values.osUI.externalConnectorsEnabled .Values.osUI.dataProjectGit.enabled }}
  # One-click external-warehouse catalog registration (Connections tab): the os-ui
  # server merges the catalog `.properties` into the `trino-catalog` ConfigMap and
  # materializes a `trino-ext-<catalog>` Secret in-namespace, then rolls Trino
  # (lib/connections/warehouse/k8s-registration.ts). Least-privilege: namespaced
  # configmaps + secrets read/write only — gated on the same flag as the feature, so a
  # deployment with external connectors OFF grants no secret access at all.
  # ALSO granted with osUI.dataProjectGit (engine rebuild B3): the OS reconciles the
  # `trino-access-rules` ConfigMap from domain membership (core/infra/trino-rules-server.ts).
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "create", "patch", "update"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: os-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: os-ui
subjects:
  - kind: ServiceAccount
    name: os-ui
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "os-ui") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "soa.selectorLabels" (dict "ctx" . "component" "os-ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "soa.labels" . | nindent 8 }}
        {{- include "soa.selectorLabels" (dict "ctx" . "component" "os-ui") | nindent 8 }}
    spec:
      {{- include "soa.priorityClassName" (dict "ctx" . "tier" "app") | nindent 6 }}
      serviceAccountName: os-ui
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "soa.podSecurityContext" . | nindent 8 }}
        runAsUser: 1000
      {{- /* Gate startup on the durable user-directory mirror. os-ui booting before
           OpenSearch was reachable took the offline branch and silently re-seeded
           every account from OS_USERS (2026-09-10 all-users lockout). Rendered
           unless osUI.waitForOpenSearch is explicitly false, so it survives
           `helm --reuse-values` (which ignores new chart defaults). Uses the os-ui
           image itself — no extra image to pull or allow-list. */}}
      {{- if ne (toString $u.waitForOpenSearch) "false" }}
      initContainers:
        - name: wait-for-opensearch
          image: "{{ $u.image.repository }}:{{ $u.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "soa.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits: { cpu: 200m, memory: 128Mi }
          env:
            - name: OPENSEARCH_URL
              value: {{ include "soa.opensearchUrl" . | quote }}
          command: ["node", "-e"]
          args:
            - |
              const url = process.env.OPENSEARCH_URL + '/_cluster/health?wait_for_status=yellow&timeout=5s';
              const deadline = Date.now() + 10 * 60 * 1000;
              (async () => {
                for (;;) {
                  try {
                    const r = await fetch(url);
                    if (r.ok) { console.log('opensearch ready'); process.exit(0); }
                    console.log('opensearch not ready: HTTP ' + r.status);
                  } catch (e) { console.log('opensearch unreachable: ' + e.message); }
                  if (Date.now() > deadline) { console.error('gave up waiting for opensearch'); process.exit(1); }
                  await new Promise((r) => setTimeout(r, 3000));
                }
              })();
      {{- end }}
      containers:
        - name: os-ui
          image: "{{ $u.image.repository }}:{{ $u.image.tag }}"
          imagePullPolicy: IfNotPresent      # locally-built image, loaded into kind
          securityContext:
            {{- include "soa.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          env:
            {{- include "soa.osUI.env" . | nindent 12 }}
            {{- /* A4: os-ui ENQUEUES and TAILS; it only stops executing runs in-process once
                 the worker Deployment exists. */}}
            {{- if and $u.worker $u.worker.enabled }}
            - name: AGENTS_WORKER
              value: "worker"
            {{- end }}
            {{- if and $u.worker $u.worker.leaseMs }}
            - name: AGENTS_WORKER_LEASE_MS
              value: {{ $u.worker.leaseMs | quote }}
            {{- end }}
            {{- with $u.langfuseRedaction }}
            - name: LANGFUSE_REDACTION
              value: {{ . | quote }}
            {{- end }}
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml $u.resources | nindent 12 }}
          {{- if $dpg.enabled }}
          volumeMounts:
            - name: os-repos
              mountPath: /repos
        # Read-only git daemon exporting every domain repo in-cluster (git://os-repos/<domain>.git)
        # for the Dagster repo-sync sidecar. --export-all: bare repos written by isomorphic-git
        # carry no git-daemon-export-ok marker. Nothing in a repo is a secret.
        - name: git-daemon
          image: "{{ $dpg.gitDaemon.image.repository }}:{{ $dpg.gitDaemon.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "soa.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          command: ["git", "daemon", "--export-all", "--base-path=/repos", "--reuseaddr", "--verbose", "--port=9418", "--informative-errors"]
          ports:
            - { name: git, containerPort: 9418 }
          volumeMounts:
            - name: os-repos
              mountPath: /repos
              readOnly: true
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: os-repos
          persistentVolumeClaim:
            claimName: os-repos
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: os-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "os-ui") | nindent 4 }}
spec:
  selector:
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "os-ui") | nindent 4 }}
  {{- with .Values.osUI.service.nodePort }}
  type: NodePort
  {{- end }}
  ports:
    - name: http
      port: 3000
      targetPort: http
      {{- with .Values.osUI.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
{{- end }}
