{{- if .Values.osUI.enabled }}
{{- /*
  OS UI — the Next.js front door (the unified app shell + the live tabs:
  Home, Agents/Chat, Structured Data, Monitoring, Dashboards).
  Server-side API routes call the in-cluster backends (sample-agent, query-tool,
  Langfuse); the Langfuse keys come from a Secret so they never sit in plaintext.
  Non-root, readiness + liveness probes, port 3000.

  NOTE: this template is gated on `.Values.osUI.enabled`. The other engineer must
  add the `osUI:` block to values.yaml + the image to scripts/build-images.sh —
  see os-ui/INTEGRATION.md. Without that block this file renders to nothing.
*/}}
{{- $u := .Values.osUI }}
{{- $dpg := $u.dataProjectGit | default dict }}
{{- $gh := $dpg.gitHttp | default dict }}
{{- /*
  Scoped RBAC for the native Components surface. The OS UI server reads workload
  status + scales Deployments/StatefulSets 0<->1 and reads CNPG Clusters
  directly via the in-cluster API (lib/platform.ts).
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: os-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "os-ui") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: os-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "deployments/scale", "statefulsets/scale"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
  # `batch/v1` CronJobs (B4-review-H-2). The os-ui server reconciles CronJobs through the
  # in-cluster API on TWO paths, and before this rule BOTH failed with a 403 that was reported as
  # "Kubernetes rejected the …" and nothing else:
  #   - AGENT SCHEDULES (`tabs/agents/lib/schedule-cron.ts`): GET + POST/PUT + DELETE of
  #     `agent-schedule-<system>`, so a saved cron schedule actually fires. This path is NOT gated
  #     on `dataProjectGit`, which is why the rule is unconditional — see the deviation.
  #   - the DATA-SYNC CLEANUP (`tabs/data/lib/sync-cron-removal.ts`): DELETE only, of the pre-B2
  #     `data-sync-<dataset>` CronJob, at boot and on every sync save, so one slice cannot fire
  #     twice once Dagster schedules it from the repository.
  # Namespaced, CronJobs only: no Jobs, no pod exec, no other `batch` resource.
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "create", "update", "delete"]
  {{- if .Values.osUI.externalConnectorsEnabled }}
  # One-click external-warehouse catalog registration (Connections tab): the os-ui
  # server merges the catalog `.properties` into the `trino-catalog` ConfigMap and
  # materializes a `trino-ext-<catalog>` Secret in-namespace, then rolls Trino
  # (lib/connections/warehouse/k8s-registration.ts). Namespaced configmaps + secrets
  # read/write, gated on the FEATURE's own flag — a deployment with external connectors
  # OFF grants no Secret access at all. This is the ONLY rule that grants Secrets.
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "create", "patch", "update"]
  {{- end }}
  {{- if and .Values.trino.enabled (.Values.trino.accessControl | default dict).enabled .Values.trino.opa.enabled }}
  # Trino access rules (engine rebuild B3; narrowed in B3-review-H-6). The reconciler reads and
  # PATCHes ONE ConfigMap and nothing else, so the grant names it: no `secrets`, no `create`, no
  # `list`, no other ConfigMap. Previously this rode on the external-connector rule — a
  # namespace-wide Secrets grant handed to every install with `dataProjectGit` on.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["trino-access-rules"]
    verbs: ["get", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: os-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: os-ui
subjects:
  - kind: ServiceAccount
    name: os-ui
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "os-ui") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "soa.selectorLabels" (dict "ctx" . "component" "os-ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "soa.labels" . | nindent 8 }}
        {{- include "soa.selectorLabels" (dict "ctx" . "component" "os-ui") | nindent 8 }}
    spec:
      {{- include "soa.priorityClassName" (dict "ctx" . "tier" "app") | nindent 6 }}
      serviceAccountName: os-ui
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "soa.podSecurityContext" . | nindent 8 }}
        runAsUser: 1000
        {{- if $dpg.enabled }}
        # The os-repos volume arrives owned by root; without fsGroup every git commit failed with
        # EACCES on the first 0.8.0 rollout (fail-soft, so datasets were created with no history).
        # OnRootMismatch: chown once, not on every pod start.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
      {{- /* Gate startup on the durable user-directory mirror. os-ui booting before
           OpenSearch was reachable took the offline branch and silently re-seeded
           every account from OS_USERS (2026-09-10 all-users lockout). Rendered
           unless osUI.waitForOpenSearch is explicitly false, so it survives
           `helm --reuse-values` (which ignores new chart defaults). Uses the os-ui
           image itself — no extra image to pull or allow-list. */}}
      {{- if ne (toString $u.waitForOpenSearch) "false" }}
      initContainers:
        - name: wait-for-opensearch
          image: "{{ $u.image.repository }}:{{ $u.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "soa.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits: { cpu: 200m, memory: 128Mi }
          env:
            - name: OPENSEARCH_URL
              value: {{ include "soa.opensearchUrl" . | quote }}
          command: ["node", "-e"]
          args:
            - |
              const url = process.env.OPENSEARCH_URL + '/_cluster/health?wait_for_status=yellow&timeout=5s';
              const deadline = Date.now() + 10 * 60 * 1000;
              (async () => {
                for (;;) {
                  try {
                    const r = await fetch(url);
                    if (r.ok) { console.log('opensearch ready'); process.exit(0); }
                    console.log('opensearch not ready: HTTP ' + r.status);
                  } catch (e) { console.log('opensearch unreachable: ' + e.message); }
                  if (Date.now() > deadline) { console.error('gave up waiting for opensearch'); process.exit(1); }
                  await new Promise((r) => setTimeout(r, 3000));
                }
              })();
      {{- end }}
      containers:
        - name: os-ui
          image: "{{ $u.image.repository }}:{{ $u.image.tag }}"
          imagePullPolicy: IfNotPresent      # locally-built image, loaded into kind
          securityContext:
            {{- include "soa.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          env:
            {{- include "soa.osUI.env" . | nindent 12 }}
            {{- /* A4: os-ui ENQUEUES and TAILS; it only stops executing runs in-process once
                 the worker Deployment exists. */}}
            {{- if and $u.worker $u.worker.enabled }}
            - name: AGENTS_WORKER
              value: "worker"
            {{- end }}
            {{- if and $u.worker $u.worker.leaseMs }}
            - name: AGENTS_WORKER_LEASE_MS
              value: {{ $u.worker.leaseMs | quote }}
            {{- end }}
            {{- with $u.langfuseRedaction }}
            - name: LANGFUSE_REDACTION
              value: {{ . | quote }}
            {{- end }}
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml $u.resources | nindent 12 }}
          {{- if $dpg.enabled }}
          volumeMounts:
            - name: os-repos
              mountPath: /repos
        {{- if $gh.enabled }}
        # THE ENGINEER'S DOOR (stream E, decision D27): git's own `git-http-backend` CGI behind
        # lighttpd, so `git clone https://<os>/git/<domain>.git` works from VS Code. A SEPARATE
        # process, non-root, read-only root filesystem; the OS authenticates every request through
        # the ingress sub-request to /api/git/authenticate (see os-git-http.yaml), and the repo's
        # pre-receive hook calls /api/git/receive, which holds the per-domain lock and validates.
        # /repos is mounted WRITABLE here (unlike the read-only git-daemon beside it) because
        # `receive-pack` is the whole point of this container.
        - name: git-http
          image: "{{ $dpg.gitHttp.image.repository }}:{{ $dpg.gitHttp.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "soa.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          env:
            # The ONE endpoint the receive hooks call, on this pod's own loopback.
            - name: OS_RECEIVE_URL
              value: "http://127.0.0.1:3000/api/git/receive"
            {{- if ($.Values.serviceBearer).enabled }}
            # The hook proves it IS the OS's own hook when a service bearer is configured — the
            # same shared token and the same posture as the data-plane calls (`soa.serviceBearerEnv`).
            - name: OS_SERVICE_BEARER
              valueFrom:
                secretKeyRef:
                  name: service-bearer-token
                  key: SERVICE_BEARER_TOKEN
            {{- end }}
          ports:
            - { name: git-http, containerPort: 9419 }
          volumeMounts:
            - name: os-repos
              mountPath: /repos
            # lighttpd buffers a push's request body here, and the hooks write one temp file.
            - name: git-http-tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 500m, memory: 256Mi }
        {{- end }}
        # Read-only git daemon exporting every domain repo in-cluster (git://os-repos/<domain>.git)
        # for the Dagster repo-sync sidecar. --export-all: bare repos written by isomorphic-git
        # carry no git-daemon-export-ok marker. Nothing in a repo is a secret.
        - name: git-daemon
          image: "{{ $dpg.gitDaemon.image.repository }}:{{ $dpg.gitDaemon.image.tag }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- include "soa.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          command: ["git", "daemon", "--export-all", "--base-path=/repos", "--reuseaddr", "--verbose", "--port=9418", "--informative-errors"]
          ports:
            - { name: git, containerPort: 9418 }
          volumeMounts:
            - name: os-repos
              mountPath: /repos
              readOnly: true
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: os-repos
          persistentVolumeClaim:
            claimName: os-repos
        {{- if $gh.enabled }}
        - name: git-http-tmp
          emptyDir: { sizeLimit: 2Gi }
        {{- end }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: os-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "os-ui") | nindent 4 }}
spec:
  selector:
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "os-ui") | nindent 4 }}
  {{- with .Values.osUI.service.nodePort }}
  type: NodePort
  {{- end }}
  ports:
    - name: http
      port: 3000
      targetPort: http
      {{- with .Values.osUI.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
{{- end }}
