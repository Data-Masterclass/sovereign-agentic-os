{{- if .Values.osUI.enabled }}
{{- /*
  DURABLE CONNECTION CREDENTIALS (2026-11-23) — the dedicated namespace, its RBAC, and the key.

  os-ui's credential store (os-ui/core/infra/secrets.ts + secret-backend.ts) keeps every credential
  a user saves on a connection as ONE Kubernetes Secret in a DEDICATED namespace
  (`osUI.connectionSecrets.namespace`, default `<release namespace>-conn-secrets`):
    name   os-conn-secret-<readable ref>-<sha256(ref)[:16]>
    labels app.kubernetes.io/managed-by=os-ui, app.kubernetes.io/component=connection-secret,
           os.connection-id=<ref name>
    data   sealed = AES-256-GCM ciphertext (app-side; the plaintext never reaches the API server)

  1. LEAST PRIVILEGE. Kubernetes RBAC cannot restrict Secrets by label, and `create`/`list` take no
     resourceNames — so a Secret grant is always namespace-wide. That is why the credentials live in
     their OWN namespace: the Role below grants get/list/create/update/delete on `secrets` THERE ONLY,
     to the `os-ui` ServiceAccount (writes on create/rotate/OAuth connect) and the `os-ui-worker`
     ServiceAccount (reads, and writes back silently refreshed OAuth tokens). Neither ServiceAccount
     gets any Secret right in the release namespace (litellm-credentials, os-ui-session, … stay out
     of reach — B3-review-H-6 and check-worker-env stand). The namespace holds no pods.
     scripts/check-connection-secrets-chart.mjs asserts all of this on the rendered chart.

  2. THE KEY (`os-secrets-encryption-key`, key OS_SECRETS_ENCRYPTION_KEY) stays in the RELEASE
     namespace: a pod can only read a secretKeyRef from its own namespace — and keeping the key apart
     from the ciphertext means one namespace's Secrets never hold both. Resolution:
     `connectionSecrets.existingSecret` (yours — RECOMMENDED: an ExternalSecret from STACKIT Secrets
     Manager) → explicit `connectionSecrets.secret` → the value already stored (lookup, kept across
     upgrades) → a new 64-character random value on first install. `helm.sh/resource-policy: keep`.
     HONEST LIMITS: a chart-generated key is itself a Kubernetes Secret, in the same etcd as the
     ciphertext. App-side sealing protects against the ciphertext namespace being read, listed or
     backed up on its own (and against unencrypted etcd snapshots of that namespace), NOT against an
     attacker who can read both namespaces or the whole etcd. For that, source the key from STACKIT
     Secrets Manager via ESO.
     BACKUPS: the key carries `velero.io/exclude-from-backup`, so a Velero backup never holds key and
     ciphertext together (deploy/velero/values.yaml backs up the conn-secrets namespace). Restoring
     from such a backup therefore NEEDS the key from its own source (ESO/Secrets Manager); with a
     chart-generated key that was not kept elsewhere, restored credentials read "unreadable" and each
     connection needs a reconnect — that is the price of not shipping key + ciphertext in one backup.
     ROTATION: put the old value in `previousKeysSecret`, then change the key; the store re-seals
     every value under the new key on its next refresh and reports how many are still on the old one.
     GITOPS: `lookup` is empty under `helm template`/Argo/Flux. Set `connectionSecrets.gitops: true`
     there and the render FAILS unless `secret` or `existingSecret` (or ESO) supplies the key —
     instead of minting a new key, and making every credential unreadable, on each sync.
*/}}
{{- $cfg := .Values.osUI.connectionSecrets | default dict }}
{{- $ns := $cfg.namespace | default (printf "%s-conn-secrets" .Release.Namespace) }}
{{- if eq $ns .Release.Namespace }}
{{- fail "osUI.connectionSecrets.namespace must NOT be the release namespace: a Secret grant there would let os-ui and the worker read every platform Secret" }}
{{- end }}
{{- $keyName := "os-secrets-encryption-key" }}
{{- $esoOwned := include "soa.eso.owned" (list $ $keyName) }}
{{- if and $cfg.gitops (not $cfg.existingSecret) (not $cfg.secret) (not $esoOwned) }}
{{- fail "osUI.connectionSecrets.gitops is set: supply the key with osUI.connectionSecrets.existingSecret (recommended: ESO from STACKIT Secrets Manager) or osUI.connectionSecrets.secret — a GitOps render cannot keep a generated key" }}
{{- end }}
{{- if ne ($cfg.createNamespace | toString) "false" }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    soa.dev/purpose: connection-secrets
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
  annotations:
    # An uninstall must not delete every stored credential with the namespace.
    "helm.sh/resource-policy": keep
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: os-ui-connection-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
rules:
  # Namespace-wide by necessity (RBAC has no label selectors; create/list take no resourceNames) —
  # which is exactly why this namespace holds nothing but connection credentials.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: os-ui-connection-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: os-ui-connection-secrets
subjects:
  - kind: ServiceAccount
    name: os-ui
    namespace: {{ .Release.Namespace }}
  {{- if and .Values.osUI.worker .Values.osUI.worker.enabled }}
  - kind: ServiceAccount
    name: os-ui-worker
    namespace: {{ .Release.Namespace }}
  {{- end }}
{{- if not $cfg.existingSecret }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $keyName) }}
{{- $current := "" }}
{{- if $existing }}{{ $current = (index $existing.data "OS_SECRETS_ENCRYPTION_KEY" | b64dec) }}{{- end }}
{{- $secret := $cfg.secret | default $current | default (randAlphaNum 64) }}
{{- if lt (len $secret) 32 }}
{{- fail "osUI.connectionSecrets.secret must be at least 32 characters" }}
{{- end }}
{{- if not $esoOwned }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $keyName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "os-ui") | nindent 4 }}
    # Never in the same Velero backup as the ciphertext (see the header).
    velero.io/exclude-from-backup: "true"
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  OS_SECRETS_ENCRYPTION_KEY: {{ $secret | quote }}
{{- end }}
{{- end }}
{{- end }}
