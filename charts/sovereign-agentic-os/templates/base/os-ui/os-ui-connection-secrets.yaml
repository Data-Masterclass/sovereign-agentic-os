{{- if .Values.osUI.enabled }}
{{- /*
  DURABLE CONNECTION CREDENTIALS (2026-11-23) — the encryption key + the RBAC for the store.

  os-ui's credential store (os-ui/core/infra/secrets.ts + secret-backend.ts) keeps every credential
  a user saves on a connection as ONE Kubernetes Secret in this namespace:
    name   os-conn-secret-<readable ref>-<sha256(ref)[:16]>
    labels app.kubernetes.io/managed-by=os-ui, app.kubernetes.io/component=connection-secret,
           os.connection-id=<ref name>
    data   sealed = AES-256-GCM ciphertext (app-side; the plaintext never reaches the API server)
  os-ui and os-ui-worker both run as the `os-ui` ServiceAccount: os-ui writes on create / rotate /
  OAuth connect, the worker writes back silently refreshed OAuth tokens, both list at boot and on
  a timer. Before this the store was an in-process Map: every restart lost every credential.

  1. THE KEY (`os-secrets-encryption-key`, key OS_SECRETS_ENCRYPTION_KEY). Same lifecycle as
     os-ui-agent-key-encryption: `connectionSecrets.existingSecret` (yours) → explicit
     `connectionSecrets.secret` → the value already stored (lookup, kept across upgrades) → a new
     64-character random value on first install. `helm.sh/resource-policy: keep`. ESO can own it
     (files/external-secrets/catalog.yaml). It MUST NOT change silently: the app derives a key id
     from it, and a value sealed under a key the pod does not hold is reported unreadable, never
     guessed. Rotation = add the old value to `previousKeysSecret`, then change the key.
     GITOPS CAVEAT: `lookup` is empty under `helm template`/Argo/Flux — set `secret` or
     `existingSecret` there, or each sync would mint a new key.

  2. THE RBAC (Role/RoleBinding `os-ui-connection-secrets`). Kubernetes RBAC CANNOT restrict by
     label, and `create` / `list` cannot be restricted by resourceNames either (names are derived
     from refs at runtime, so `get`/`update`/`delete` cannot be pinned at render time). The grant is
     therefore namespace-wide on `secrets` for get/list/create/update/delete (no patch, no watch).
     Mitigations: the app only ever lists with the label selector above and only touches
     `os-conn-secret-*` names; the values it writes are ciphertext; the grant is in ONE Role, so it
     can be audited and removed on its own. Residual risk (documented, accepted for now): a
     compromised os-ui pod can read other Secrets in this namespace — move the store to STACKIT
     Secrets Manager (one new SecretBackend) to drop the grant.
*/}}
{{- $cfg := .Values.osUI.connectionSecrets | default dict }}
{{- if not $cfg.existingSecret }}
{{- $name := "os-secrets-encryption-key" }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $current := "" }}
{{- if $existing }}{{ $current = (index $existing.data "OS_SECRETS_ENCRYPTION_KEY" | b64dec) }}{{- end }}
{{- $secret := $cfg.secret | default $current | default (randAlphaNum 64) }}
{{- if lt (len $secret) 32 }}
{{- fail "osUI.connectionSecrets.secret must be at least 32 characters" }}
{{- end }}
{{- if not (include "soa.eso.owned" (list $ $name)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "os-ui") | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  OS_SECRETS_ENCRYPTION_KEY: {{ $secret | quote }}
---
{{- end }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: os-ui-connection-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
rules:
  # Namespace-wide by necessity (see the header): RBAC has no label selectors, and create/list take no
  # resourceNames. The app scopes itself to label app.kubernetes.io/component=connection-secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: os-ui-connection-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: os-ui-connection-secrets
subjects:
  # os-ui AND os-ui-worker (the worker Deployment runs as this ServiceAccount too).
  - kind: ServiceAccount
    name: os-ui
    namespace: {{ .Release.Namespace }}
{{- end }}
