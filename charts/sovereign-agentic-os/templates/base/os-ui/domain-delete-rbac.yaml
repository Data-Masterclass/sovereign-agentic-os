{{- /*
  Delete domain (Admin -> Domains): the Kubernetes reach the run needs, least privilege, in the two
  namespaces it touches beyond the release namespace. Proven with `kubectl auth can-i` against the
  rendered RBAC on a real kind cluster (tests/domain-delete/rbac.kind.sh).

  - Apps namespace (softwareRunner.namespace): cert-manager Certificates get/list/delete (the run
    waits for an app's Certificate to be gone before its TLS Secret) and Secrets get/list/delete
    (the TLS Secret has no owner reference, so nothing else removes it).
    WHAT RBAC CANNOT RESTRICT: Kubernetes RBAC has no label selectors and no name prefixes —
    `resourceNames` must list exact names, and an app's TLS Secret name (`<slug>.<domain>.<apps
    domain>-tls`) is only known at run time. So the Secret rule covers every Secret in the apps
    namespace. The bound is the namespace itself (only app workloads live there, never platform
    credentials) plus os-ui's code, which deletes only the TLS Secret of an app of the domain being
    deleted, after its Certificate is gone.
  - Velero namespace (domainDelete.veleroNamespace, when set): `backups.velero.io` get/list,
    read-only — the 2 h backup gate reads the deploy/pre-upgrade-backup.sh pair there.
*/}}
{{- if .Values.softwareRunner.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: os-ui-domain-delete
  namespace: {{ .Values.softwareRunner.namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
rules:
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: os-ui-domain-delete
  namespace: {{ .Values.softwareRunner.namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: os-ui-domain-delete }
subjects:
  - { kind: ServiceAccount, name: os-ui, namespace: {{ .Release.Namespace }} }
{{- end }}
{{- with .Values.domainDelete.veleroNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: os-ui-backups-read
  namespace: {{ . }}
  labels:
    {{- include "soa.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["velero.io"]
    resources: ["backups"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: os-ui-backups-read
  namespace: {{ . }}
  labels:
    {{- include "soa.labels" $ | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: os-ui-backups-read }
subjects:
  - { kind: ServiceAccount, name: os-ui, namespace: {{ $.Release.Namespace }} }
{{- end }}
