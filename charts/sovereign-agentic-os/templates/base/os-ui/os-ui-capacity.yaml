{{- $cr := .Values.osUI.capacityReader | default dict }}
{{- /*
  SPDX-License-Identifier: Apache-2.0
  Copyright 2026 Borek Data Ventures UG (haftungsbeschränkt)

  Monitoring → Platform → Capacity (tabs/monitoring/lib/adapters/capacity.ts): node CPU/memory
  REQUESTS vs allocatable are the sum of the requests of every pod on the node — kube-system,
  ingress, Velero and user apps included — and OOM kills are each container's
  `lastState.terminated.reason`. Both come from GET /api/v1/pods across all namespaces, so this is a
  ClusterRole: read-only, `list` on pods only — no get/watch, no pods/log, no pods/exec, no secrets.
  (os-ui already has get/list pods in its own namespace, os-ui.yaml.)

  capacityReader.enabled            the card reads pods (env OS_CAPACITY_READER). Off = "not measured".
  capacityReader.createClusterRole  the chart creates the ClusterRole + binding (default true). false =
                                    an operator pre-created the same grant under other names
                                    (dev: scripts/dev/manifests/os-ui-capacity-rbac.yaml); a missing grant
                                    then shows as "unavailable (forbidden)" on the card.
*/}}
{{- if and .Values.osUI.enabled (ne $cr.enabled false) (ne $cr.createClusterRole false) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-os-ui-capacity
  labels:
    {{- include "soa.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-os-ui-capacity
  labels:
    {{- include "soa.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-os-ui-capacity
subjects:
  - kind: ServiceAccount
    name: os-ui
    namespace: {{ .Release.Namespace }}
{{- end }}
