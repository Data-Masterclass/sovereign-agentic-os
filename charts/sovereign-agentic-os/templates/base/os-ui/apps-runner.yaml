{{- if .Values.softwareRunner.enabled }}
{{- /*
  Software live-app runner (Software tab). The os-ui provisions a real
  Deployment + Service + Ingress per built app into a DEDICATED namespace so a
  student's running app is isolated from the platform namespace. This grants the
  os-ui ServiceAccount (which lives in the release namespace) exactly the verbs it
  needs IN THE RUNNER NAMESPACE ONLY — least privilege, no cluster-wide power, no
  namespace-create (the namespace is declared here so the runner never needs it).
  Gated by softwareRunner.enabled (off in the base chart; on for the STACKIT deploy).

  NOTE (operator): reachable per-app URLs (<slug>.<domain>.<appsDomain>) also need
  a wildcard DNS record `*.<appsDomain>` → the ingress-nginx LoadBalancer, and
  cert-manager issues a per-host TLS cert via HTTP-01. Without the wildcard DNS the
  app still runs in-cluster (pod Ready) but its public host will not resolve.
*/}}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.softwareRunner.namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    soa.dev/purpose: software-runner
    {{- /* Pod Security Standards: enforce `restricted` (nil-safe default under
           --reuse-values). Student apps run untrusted code; every app deploy is a
           server-side dry run against this admission first (WP-54). */}}
    pod-security.kubernetes.io/enforce: {{ .Values.softwareRunner.podSecurityStandard | default "restricted" }}
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: {{ .Values.softwareRunner.podSecurityStandard | default "restricted" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: os-ui-apps-runner
  namespace: {{ .Values.softwareRunner.namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    # `create` is used ONLY as a server-side dry run (?dryRun=All) of the Deployment's pod template,
    # so Pod Security admission judges the committed manifest before it is applied (WP-54). The
    # same identity can already create Deployments, whose ReplicaSets create these pods.
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: os-ui-apps-runner
  namespace: {{ .Values.softwareRunner.namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: os-ui-apps-runner
subjects:
  - kind: ServiceAccount
    name: os-ui
    namespace: {{ .Release.Namespace }}
{{- if (.Values.softwareRunner.networkPolicy | default dict).enabled }}
{{- /*
  SECURITY (C2c/C2d): network isolation for the student-apps namespace.

  Apps are UNTRUSTED code. A per-app workload is the app's OWN committed
  `apps/<slug>/k8s/` manifests, running an image from `softwareRunner.imageRegistry`
  pinned by digest (WP-54). This repo builds no app image and ships none; with no
  registry configured nothing is served and `start_preview` says so. Apps may commit
  only Deployment, Service and Ingress -- these NetworkPolicies stay the platform's.

  NOTE: this template itself deploys NO workload. It is the Namespace + RBAC +
  NetworkPolicy scaffolding that lets the os-ui process create those per-app
  Deployments at runtime.

  Their ONLY legitimate traffic is: INGRESS from the ingress controller (public
  per-app host) and EGRESS to DNS. The browser talks to os-ui directly over the
  public ingress (the OS_API_URL baked at build time), so the app POD never needs
  to reach os-ui or any platform service in-cluster. We therefore default-deny
  both directions and open only those two paths.

  NOTE: kind's default CNI (kindnet) does NOT enforce NetworkPolicies — locally these
  are inert; on STACKIT (Cilium) they enforce. Written to keep the stack working when
  enforced (mirrors templates/network/egress-policies.yaml).
*/}}
---
# 1) Default-deny ALL ingress + egress for every app pod (baseline).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apps-default-deny
  namespace: {{ .Values.softwareRunner.namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# 2) Allow ingress ONLY from the ingress-controller namespace (public per-app host).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apps-allow-ingress-from-controller
  namespace: {{ .Values.softwareRunner.namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ (.Values.softwareRunner.networkPolicy | default dict).ingressNamespace | default "ingress-nginx" }}
---
# 3) Allow egress to DNS only (kube-system :53). No platform services, no internet —
# a static SPA needs nothing else; the browser reaches os-ui over the public ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apps-allow-dns-egress
  namespace: {{ .Values.softwareRunner.namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
        # Gardener/SKE CoreDNS listens on 8053 (see egress-policies.yaml note).
        - { protocol: UDP, port: 8053 }
        - { protocol: TCP, port: 8053 }
---
# 4) INGRESS lock on query-tool (in the PLATFORM namespace): only os-ui pods may reach
# it. The governed query engine must not be callable by any other in-namespace pod
# (nothing else reaches it: agent graphs run INSIDE os-ui since A5, so there is no
# second process and no callback door — `/api/agents/tool` is deleted).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: query-tool-allow-os-ui-only
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: query-tool
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: os-ui
        # The run worker executes agent runs (AGENTS_WORKER=worker) and therefore the governed
        # data tools; without this peer every run saw "Could not reach query-tool" and fell back
        # to offline-mock (2026-11-18, first live worker rollout).
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: os-ui-worker
      ports:
        - { protocol: TCP, port: 8000 }
---
# 5) INGRESS lock on data-runner: only os-ui pods may reach it (the ingest/land path
# is always mediated by the os-ui backend, which supplies the session-bound principal).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-runner-allow-os-ui-only
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: data-runner
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: os-ui
        # The run worker executes agent runs (AGENTS_WORKER=worker) and therefore the governed
        # data tools; without this peer every run saw "Could not reach query-tool" and fell back
        # to offline-mock (2026-11-18, first live worker rollout).
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: os-ui-worker
      ports:
        - { protocol: TCP, port: 8000 }
{{- end }}
{{- end }}
