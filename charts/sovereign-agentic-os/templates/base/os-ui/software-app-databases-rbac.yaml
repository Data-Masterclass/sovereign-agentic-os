{{- if include "soa.appDatabases.cnpg" . }}
{{- /*
  Copyright 2026 Borek Data Ventures UG (haftungsbeschränkt)
  SPDX-License-Identifier: Apache-2.0

  APP BUILDER APP DATABASES - os-ui's rights in each env namespace (workstream D; spec 7, 13). Its own file and Role, so
  C1's deploy Role (software-apps-envs.yaml) stays exactly C1's:
    - clusters.postgresql.cnpg.io: get + patch, ONLY the `apps-pg` Cluster (add an app's managed role);
    - databases.postgresql.cnpg.io: create/get/list/delete (one per app);
    - Secrets: create/patch/delete only — os-ui never READS a Secret here (the app's `-db` and `-env` Secrets are written,
      ownership of an existing one is proved by an admission-checked patch); ConfigMaps create/get/patch (the env list);
      Jobs: create/get/list/delete (the isolation and migrate Jobs); pods get/list + pods/log get (a failed Job's log).
  RBAC cannot say "only the objects os-ui made, only these fields", so ValidatingAdmissionPolicies scoped to os-ui's
  own identities (os-ui, os-ui-worker) narrow every write in apps-dev/apps-prod (security review of #393):
    - Cluster: only `spec.managed.roles` may change (every other .spec property, `managed.services`, labels,
      annotations and finalizers stay as they were); every role is a plain LOGIN role `app_…_<h8>` with no privilege
      flag, no inRoles, `ensure: present`, and a passwordSecret bound to it by the same 8-hex hash (`app-…-<h8>-db`);
    - Database: name and owner equal `app_…_<h8>`, the resource bound to it by the hash, cluster `apps-pg`, `ensure:
      present`, reclaim policy `retain`, and NO other property (extensions, schemas, fdws, servers, template, …);
      delete only an `app-…-db` resource (retain: the data stays);
    - Secret: create/update/delete only `app-…-<h8>-(db|env)` (never CNPG's `apps-pg-*`), a `-db` Secret is never
      updated (no password reset), never a service-account token;
    - every pod os-ui writes (Deployment, ReplicaSet, StatefulSet, DaemonSet, Job, CronJob, Pod incl. the deploy's dry
      run — C1's Role grants Deployments): Secret references only to the workload's OWN `-db` / `-env` (derived from its
      name `app-<domain>-<slug>-<h8>[-p1|-p2|-migrate|-revoke]`), no service-account token, default ServiceAccount, no
      imagePullSecrets, no `cnpg.io/*` labels, `soa.dev/role` only `app-migrate` on a Job;
    - a Job additionally carries `soa.dev/role: app-migrate`, no envFrom, no volumes, and Secret keys username/password.
  Rendered ONLY with softwareRunner.environments.enabled AND osUI.software.databases.mode=cnpg.
*/}}
{{- $db := include "soa.appDatabases.values" . | fromYaml }}
{{- $e := .Values.softwareRunner.environments }}
{{- $platform := .Release.Namespace }}
{{- $cluster := $db.cluster | default "apps-pg" }}
{{- /* The images os-ui may start a Job from: the app registry's `apps/` repositories, by digest (the release images).
       `osUI.software.databases.jobImagePrefix` overrides it (tests, an external registry); with neither, no Job is admitted. */}}
{{- $jobImagePrefix := $db.jobImagePrefix | default (ternary (printf "%s/apps/" (include "soa.appBuilder.registryHost" .)) "" (eq (include "soa.appBuilder.buildReady" .) "true")) }}
{{- $osUiUsers := list (printf "system:serviceaccount:%s:os-ui" $platform) (printf "system:serviceaccount:%s:os-ui-worker" $platform) }}
{{- $envs := list (dict "env" "dev" "ns" ($e.devNamespace | default "apps-dev")) (dict "env" "prod" "ns" ($e.prodNamespace | default "apps-prod")) }}
{{- $nsList := list }}{{ range $envs }}{{ $nsList = append $nsList .ns }}{{ end }}
{{- range $envs }}
{{- $ns := .ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: os-ui-app-databases
  namespace: {{ $ns }}
  labels:
    {{- include "soa.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    resourceNames: [{{ $cluster | quote }}]
    verbs: ["get", "patch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["databases"]
    verbs: ["create", "get", "list", "delete"]
  # Secrets: written, NEVER read (no get/list/watch): CNPG's own Secrets (CA, replication certificate) sit here too.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch", "delete"]
  # The env list (names, kinds, who, when; never a value) of each app.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: os-ui-app-databases
  namespace: {{ $ns }}
  labels:
    {{- include "soa.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: os-ui-app-databases
subjects:
  - kind: ServiceAccount
    name: os-ui
    namespace: {{ $platform }}
  {{- include "soa.osUI.workerSubject" $ | nindent 2 }}
{{- end }}
{{- /* ---------------------------------------------------------------- the admission policies ---- */}}
{{- $policies := list
  (dict "name" "app-databases-os-ui-clusters" "group" "postgresql.cnpg.io" "resources" (list "clusters") "ops" (list "UPDATE"))
  (dict "name" "app-databases-os-ui-databases" "group" "postgresql.cnpg.io" "resources" (list "databases") "ops" (list "CREATE" "UPDATE" "DELETE"))
  (dict "name" "app-databases-os-ui-secrets" "group" "" "resources" (list "secrets") "ops" (list "CREATE" "UPDATE" "DELETE"))
  (dict "name" "app-databases-os-ui-configmaps" "group" "" "resources" (list "configmaps") "ops" (list "CREATE" "UPDATE" "DELETE"))
  (dict "name" "app-databases-os-ui-jobs" "group" "batch" "resources" (list "jobs") "ops" (list "CREATE" "UPDATE"))
  (dict "name" "app-databases-os-ui-workloads" "group" "apps" "resources" (list "deployments" "replicasets" "statefulsets" "daemonsets") "ops" (list "CREATE" "UPDATE"))
  (dict "name" "app-databases-os-ui-cronjobs" "group" "batch" "resources" (list "cronjobs") "ops" (list "CREATE" "UPDATE"))
  (dict "name" "app-databases-os-ui-pods" "group" "" "resources" (list "pods") "ops" (list "CREATE" "UPDATE")) }}
{{- range $policies }}
{{- $p := . }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $p.name }}
  labels:
    {{- include "soa.labels" $ | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - { key: kubernetes.io/metadata.name, operator: In, values: {{ $nsList | toJson }} }
    resourceRules:
      - apiGroups: [{{ $p.group | quote }}]
        apiVersions: ["*"]
        operations: {{ $p.ops | toJson }}
        resources: {{ $p.resources | toJson }}
  matchConditions:
    - name: written-by-os-ui
      expression: 'request.userInfo.username in {{ $osUiUsers | toJson }}'
{{- if eq $p.name "app-databases-os-ui-clusters" }}
  variables:
    - name: roles
      expression: 'has(object.spec.managed) && has(object.spec.managed.roles) ? object.spec.managed.roles : []'
  validations:
    - expression: >-
        {{ include "soa.appDatabases.clusterSpecUnchanged" $ }}
      message: "app-databases-os-ui-clusters: os-ui may change only spec.managed.roles of the Cluster"
      reason: Forbidden
    - expression: >-
        (has(object.spec.managed) && has(object.spec.managed.services)) == (has(oldObject.spec.managed) && has(oldObject.spec.managed.services)) &&
        (!(has(object.spec.managed) && has(object.spec.managed.services)) || object.spec.managed.services == oldObject.spec.managed.services)
      message: "app-databases-os-ui-clusters: os-ui may not change spec.managed.services"
      reason: Forbidden
    - expression: >-
        has(object.metadata.labels) == has(oldObject.metadata.labels) && (!has(object.metadata.labels) || object.metadata.labels == oldObject.metadata.labels) &&
        has(object.metadata.annotations) == has(oldObject.metadata.annotations) && (!has(object.metadata.annotations) || object.metadata.annotations == oldObject.metadata.annotations) &&
        has(object.metadata.finalizers) == has(oldObject.metadata.finalizers) && (!has(object.metadata.finalizers) || object.metadata.finalizers == oldObject.metadata.finalizers) &&
        has(object.metadata.ownerReferences) == has(oldObject.metadata.ownerReferences) && (!has(object.metadata.ownerReferences) || object.metadata.ownerReferences == oldObject.metadata.ownerReferences)
      message: "app-databases-os-ui-clusters: os-ui may not change the Cluster's labels, annotations, finalizers or ownerReferences"
      reason: Forbidden
    - expression: >-
        variables.roles.all(r,
        r.name.matches('^app_[a-z0-9_]+_[0-9a-f]{8}$') &&
        (!has(r.superuser) || !r.superuser) && (!has(r.createdb) || !r.createdb) && (!has(r.createrole) || !r.createrole) &&
        (!has(r.replication) || !r.replication) && (!has(r.bypassrls) || !r.bypassrls) &&
        (!has(r.inRoles) || size(r.inRoles) == 0) && (!has(r.ensure) || r.ensure == 'present') &&
        (!has(r.disablePassword) || !r.disablePassword) && !has(r.validUntil) &&
        has(r.passwordSecret) && r.passwordSecret.name.matches('^app-[a-z0-9-]+-[0-9a-f]{8}-db$') &&
        r.passwordSecret.name.endsWith('-' + r.name.substring(size(r.name) - 8) + '-db'))
      messageExpression: >-
        "app-databases-os-ui-clusters: every managed role must be a plain login role app_…_<h8> (no superuser, createdb, createrole, replication, bypassrls, inRoles; ensure present) with its own app-…-<h8>-db password Secret; refused: " +
        variables.roles.filter(r, !r.name.matches('^app_[a-z0-9_]+_[0-9a-f]{8}$') || (has(r.superuser) && r.superuser) || (has(r.createdb) && r.createdb) || (has(r.createrole) && r.createrole) || (has(r.replication) && r.replication) || (has(r.bypassrls) && r.bypassrls) || (has(r.inRoles) && size(r.inRoles) > 0) || (has(r.ensure) && r.ensure != 'present') || (has(r.disablePassword) && r.disablePassword) || has(r.validUntil) || !has(r.passwordSecret) || !r.passwordSecret.name.endsWith('-' + r.name.substring(size(r.name) - 8) + '-db')).map(r, r.name).join(', ')
      reason: Forbidden
{{- else if eq $p.name "app-databases-os-ui-databases" }}
  validations:
    - expression: "request.operation != 'DELETE' || oldObject.metadata.name.matches('^app-[a-z0-9-]+-[0-9a-f]{8}-db$')"
      message: "app-databases-os-ui-databases: os-ui deletes only an app's own app-…-db Database resource"
      reason: Forbidden
    - expression: >-
        request.operation == 'DELETE' || (
        object.metadata.name.matches('^app-[a-z0-9-]+-[0-9a-f]{8}-db$') &&
        object.spec.name.matches('^app_[a-z0-9_]+_[0-9a-f]{8}$') && object.spec.owner == object.spec.name &&
        object.metadata.name.endsWith('-' + object.spec.name.substring(size(object.spec.name) - 8) + '-db') &&
        object.spec.cluster.name == {{ $cluster | quote }} &&
        (!has(object.spec.ensure) || object.spec.ensure == 'present') &&
        (!has(object.spec.databaseReclaimPolicy) || object.spec.databaseReclaimPolicy == 'retain'))
      message: "app-databases-os-ui-databases: a Database is app_…_<h8> owned by the role of the same name on {{ $cluster }}, ensure present, reclaim policy retain, named app-…-<h8>-db"
      reason: Forbidden
    - expression: >-
        request.operation == 'DELETE' || ({{ include "soa.appDatabases.databaseSpecClosed" $ }})
      message: "app-databases-os-ui-databases: os-ui sets only name, owner, cluster, ensure and databaseReclaimPolicy (no extensions, schemas, fdws, servers, template, locale …)"
      reason: Forbidden
{{- else if eq $p.name "app-databases-os-ui-secrets" }}
  variables:
    - name: name
      expression: "request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name"
  validations:
    - expression: "variables.name.matches('^app-[a-z0-9-]+-[0-9a-f]{8}-(db|env)$')"
      message: "app-databases-os-ui-secrets: os-ui writes only an app's own app-…-<h8>-db / -env Secret here (never apps-pg-*)"
      reason: Forbidden
    - expression: "request.operation != 'UPDATE' || !variables.name.endsWith('-db') || (has(object.data) == has(oldObject.data) && (!has(object.data) || object.data == oldObject.data))"
      message: "app-databases-os-ui-secrets: an app's database credential is created once and never changed by os-ui"
      reason: Forbidden
    - expression: >-
        request.operation != 'UPDATE' || (
        has(oldObject.metadata.annotations) && 'soa.dev/domain' in oldObject.metadata.annotations && 'soa.dev/slug' in oldObject.metadata.annotations &&
        has(object.metadata.annotations) && 'soa.dev/domain' in object.metadata.annotations && 'soa.dev/slug' in object.metadata.annotations &&
        object.metadata.annotations['soa.dev/domain'] == oldObject.metadata.annotations['soa.dev/domain'] &&
        object.metadata.annotations['soa.dev/slug'] == oldObject.metadata.annotations['soa.dev/slug'])
      message: "app-databases-os-ui-secrets: os-ui changes only a Secret of the same app (soa.dev/domain, soa.dev/slug), never takes one over"
      reason: Forbidden
    - expression: "request.operation == 'DELETE' || !has(object.type) || object.type != 'kubernetes.io/service-account-token'"
      message: "app-databases-os-ui-secrets: os-ui never creates a service-account token here"
      reason: Forbidden
{{- else if eq $p.name "app-databases-os-ui-configmaps" }}
  variables:
    - name: name
      expression: "request.operation == 'DELETE' ? oldObject.metadata.name : object.metadata.name"
  validations:
    - expression: "variables.name.matches('^app-[a-z0-9-]+-[0-9a-f]{8}-env$')"
      message: "app-databases-os-ui-configmaps: os-ui writes only an app's own env list (app-…-<h8>-env) here"
      reason: Forbidden
    - expression: >-
        request.operation != 'UPDATE' || (
        has(oldObject.metadata.annotations) && 'soa.dev/domain' in oldObject.metadata.annotations && 'soa.dev/slug' in oldObject.metadata.annotations &&
        has(object.metadata.annotations) && 'soa.dev/domain' in object.metadata.annotations && 'soa.dev/slug' in object.metadata.annotations &&
        object.metadata.annotations['soa.dev/domain'] == oldObject.metadata.annotations['soa.dev/domain'] &&
        object.metadata.annotations['soa.dev/slug'] == oldObject.metadata.annotations['soa.dev/slug'])
      message: "app-databases-os-ui-configmaps: os-ui changes only the env list of the same app"
      reason: Forbidden
{{- else if eq $p.name "app-databases-os-ui-jobs" }}
  variables:
    {{- include "soa.appDatabases.ownVars" (dict "name" "object.metadata.name") | nindent 4 }}
    - name: pod
      expression: 'object.spec.template.spec'
  validations:
    - expression: 'has(object.spec.template.metadata) && has(object.spec.template.metadata.labels) && object.spec.template.metadata.labels.exists(k, k == "soa.dev/role" && object.spec.template.metadata.labels[k] == "app-migrate")'
      message: 'app-databases-os-ui-jobs: a Job os-ui starts here carries soa.dev/role=app-migrate'
      reason: Forbidden
    - expression: '(!has(variables.pod.volumes) || size(variables.pod.volumes) == 0) && (!has(variables.pod.initContainers) || size(variables.pod.initContainers) == 0)'
      message: 'app-databases-os-ui-jobs: no volumes and no init containers'
      reason: Forbidden
    - expression: >-
        variables.pod.containers.all(c, !has(c.envFrom) &&
          (!has(c.env) || c.env.all(v, !has(v.valueFrom) ||
            (has(v.valueFrom.secretKeyRef) && v.valueFrom.secretKeyRef.name == variables.base + '-db' &&
             v.valueFrom.secretKeyRef.key in ["username", "password"]))))
      message: "app-databases-os-ui-jobs: env from Secrets only as username/password of the Job's own app's -db Secret, no envFrom"
      reason: Forbidden
    - expression: >-
        {{ if $jobImagePrefix }}variables.pod.containers.all(c, c.image.startsWith({{ $jobImagePrefix | quote }}) &&
        c.image.matches('^[^@]+@sha256:[0-9a-f]{64}$')){{ else }}false{{ end }}
      message: "app-databases-os-ui-jobs: a Job runs only an app release image from the app registry ({{ $jobImagePrefix | default "none configured" }}), by digest"
      reason: Forbidden
    - expression: >-
        size(variables.pod.containers) == 1 && variables.pod.containers.all(c, !has(c.args) && has(c.command) && (
        c.command == ['node', '/app/migrate/node_modules/node-pg-migrate/bin/node-pg-migrate.js', 'up', '-m', '/app/migrate/db/migrations', '--migration-file-language', 'sql', '--single-transaction'] ||
        c.command == ['node', '/app/migrate/isolate.mjs']))
      message: "app-databases-os-ui-jobs: one container with the platform's fixed migrate or isolate command, no args"
      reason: Forbidden
    - expression: >-
        variables.pod.containers.all(c, has(c.securityContext) && has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem == true &&
        has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false)
      message: "app-databases-os-ui-jobs: read-only root filesystem, no privilege escalation"
      reason: Forbidden
    {{- include "soa.appDatabases.podRules" (dict "pod" "variables.pod" "meta" "object.spec.template.metadata" "jobs" "true") | nindent 4 }}
{{- else if eq $p.name "app-databases-os-ui-workloads" }}
  variables:
    {{- include "soa.appDatabases.ownVars" (dict "name" "object.metadata.name") | nindent 4 }}
  validations:
    {{- include "soa.appDatabases.podRules" (dict "pod" "object.spec.template.spec" "meta" "object.spec.template.metadata" "jobs" "false") | nindent 4 }}
{{- else if eq $p.name "app-databases-os-ui-cronjobs" }}
  variables:
    {{- include "soa.appDatabases.ownVars" (dict "name" "object.metadata.name") | nindent 4 }}
  validations:
    {{- include "soa.appDatabases.podRules" (dict "pod" "object.spec.jobTemplate.spec.template.spec" "meta" "object.spec.jobTemplate.spec.template.metadata" "jobs" "true") | nindent 4 }}
{{- else if eq $p.name "app-databases-os-ui-pods" }}
  variables:
    {{- include "soa.appDatabases.ownVars" (dict "name" "has(object.metadata.labels) && 'app.kubernetes.io/name' in object.metadata.labels ? object.metadata.labels['app.kubernetes.io/name'] : object.metadata.name") | nindent 4 }}
  validations:
    {{- include "soa.appDatabases.podRules" (dict "pod" "object.spec" "meta" "object.metadata" "jobs" "false") | nindent 4 }}
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $p.name }}
  labels:
    {{- include "soa.labels" $ | nindent 4 }}
spec:
  policyName: {{ $p.name }}
  validationActions: ["Deny"]
{{- end }}
{{- end }}
