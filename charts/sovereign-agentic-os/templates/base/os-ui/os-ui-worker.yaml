{{- if and .Values.osUI.enabled .Values.osUI.worker .Values.osUI.worker.enabled }}
{{- /*
  os-ui-worker — agent runs execute HERE, not in a request (engine rebuild, Phase A4).

  SAME image as os-ui, SAME RUN-PATH environment (`soa.osUI.runEnv`, the one list os-ui includes
  too, so the two can never drift), different command: `node --experimental-strip-types
  worker/start.mjs` drains the `run_jobs` queue in the `agent_runs` database, claiming one run at
  a time with FOR UPDATE SKIP LOCKED and writing each engine event to `run_events`, which os-ui
  tails.

  NOT `soa.osUI.env`: that adds `soa.osUI.adminEnv` — the session/MCP signing keys, the Graph mail
  secret, the LiteLLM UI login and the LiteLLM MASTER key. The worker serves no HTTP and the run
  path never reads them, so a run compromised in this pod must not find them here (A4 review M-4).

  NO Service points at this Deployment: it serves no HTTP. Liveness is therefore a FRESHNESS check
  on a heartbeat file the loop touches every 15 s (`/tmp/worker-alive`, A4 review L-2): a wedged
  event loop stops touching it and the pod is restarted, where `node -e 'process.exit(0)'` only
  proved that a NEW process could start.

  SIGTERM: the loop stops claiming at once and the run in flight is aborted at its next superstep
  boundary, checkpointed, and put back on the queue as a `resume`. That is why
  terminationGracePeriodSeconds must cover ONE superstep (one model call + one tool call), not a
  whole run.

  PARALLEL RUNS come from `osUI.worker.concurrency` slots inside the one pod (worker-loop.ts
  workerPool), each with its own lease identity — not from replicas.
  replicas: 1 for now. The claim is safe for several replicas (SKIP LOCKED), but the in-process
  pieces a run still touches (the approvals queue hydration, the run-event topic) are single-
  replica by design until they move behind the database — see docs/components/os-ui.md.
*/}}
{{- $u := .Values.osUI }}
{{- $w := $u.worker }}
{{- /* WP-53e: a module run loads the team's committed graph.mjs from its domain repo, so with
     agent modules on the worker READS the repos. The os-repos PVC is ReadWriteOnce: it attaches to
     ONE NODE, and any number of pods on that node may mount it — so the worker mounts it READ-ONLY
     and is scheduled onto os-ui's node (required pod affinity). os-ui stays the only writer (the
     git store's in-process lock still covers every write); the worker only reads commits by SHA,
     whose objects never change. Off ⇒ no mount and no affinity, exactly as before. */}}
{{- $readRepos := and ($u.dataProjectGit | default dict).enabled ($u.agentGraphModule | default dict).enabled }}
{{- /*
  ITS OWN ServiceAccount (2026-11-24, PR #334 review B1). The worker used to run as `os-ui`, so every
  grant os-ui holds (scaling workloads, CronJob create/delete, the external-connector Secret rule, the
  connection-secrets Role) was also the agent-run pod's. The worker loads every MCP tool, so it gets
  exactly what those tools call, and nothing else:
    - this Role: READ of platform status rows (Deployments/StatefulSets/DaemonSets, Pods/Services,
      CNPG Clusters — never scale/patch); DELETE (only) of CronJobs (the pre-B2 data-sync cleanup);
      GET of the two named ConfigMaps Monitoring reads (trino-access-rules, the restore-drill status);
    - as an extra subject (_worker-rbac.tpl) of the SAME scoped Roles os-ui uses for those tools:
      os-ui-backup-status, os-ui-velero-backups, os-ui-apps-runner, os-ui-software-scanner,
      os-ui-software-checks, and os-ui-connection-secrets in the dedicated credentials namespace.
  Never the main `os-ui` Role (no CronJob create, no scaling, no external-connector Secret rule), no
  Secret read in this namespace, no node reads, no TokenReview. Warehouse catalog registration
  (k8s-registration.ts: ConfigMap + Secret writes here) stays os-ui-only and answers 403 from a run.
  scripts/check-worker-env.mjs maps EVERY Kubernetes call reachable from worker/agent-runs.ts to the
  Role that covers it and fails on an unmapped one.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: os-ui-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "os-ui-worker") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: os-ui-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
  # Connections exposure changes remove a dataset's pre-B2 `data-sync-<dataset>` CronJob
  # (tabs/data/lib/sync-cron-removal.ts). DELETE only — never create/update (a created CronJob could
  # run any image as any ServiceAccount here).
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["delete"]
  {{- if and .Values.trino.enabled (.Values.trino.accessControl | default dict).enabled .Values.trino.opa.enabled }}
  # get_monitoring_overview reads the Trino access rules (ONE ConfigMap, read only — os-ui alone patches it).
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["trino-access-rules"]
    verbs: ["get"]
  {{- end }}
  {{- if or .Values.backup.drill.enabled .Values.backup.veleroDrill.enabled }}
  # get_monitoring_overview reads the restore-drill results. ONE ConfigMap, read only.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ .Values.backup.drill.statusConfigMap | quote }}]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: os-ui-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: os-ui-worker
subjects:
  - kind: ServiceAccount
    name: os-ui-worker
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-ui-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "os-ui-worker") | nindent 4 }}
spec:
  replicas: {{ $w.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "soa.selectorLabels" (dict "ctx" . "component" "os-ui-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "soa.labels" . | nindent 8 }}
        {{- include "soa.selectorLabels" (dict "ctx" . "component" "os-ui-worker") | nindent 8 }}
    spec:
      {{- include "soa.priorityClassName" (dict "ctx" . "tier" "app") | nindent 6 }}
      {{- /* Its OWN ServiceAccount — read-only platform rows + the connection-secrets Role (above). */}}
      serviceAccountName: os-ui-worker
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "soa.podSecurityContext" . | nindent 8 }}
        runAsUser: 1000
      terminationGracePeriodSeconds: {{ $w.terminationGracePeriodSeconds | default 420 }}
      {{- if $readRepos }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  {{- include "soa.selectorLabels" (dict "ctx" . "component" "os-ui") | nindent 18 }}
              topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: os-ui-worker
          image: "{{ $u.image.repository }}:{{ $u.image.tag }}"
          imagePullPolicy: IfNotPresent      # locally-built image, loaded into kind
          securityContext:
            {{- include "soa.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          workingDir: /app/src
          {{- /* The standalone Next output has no entry for a non-HTTP process, so the worker runs
               its TypeScript source directly: `worker/start.mjs` registers the tsconfig path
               aliases and Node strips the types. The source tree is baked at /app/src next to the
               standalone node_modules (images/base/os-ui/Dockerfile). */}}
          command: ["node", "--experimental-strip-types", "--no-warnings", "worker/start.mjs"]
          env:
            {{- include "soa.osUI.runEnv" . | nindent 12 }}
            # This pod EXECUTES runs; os-ui only enqueues and tails.
            - name: AGENTS_WORKER
              value: "worker"
            {{- /* Runs this pod executes at once (worker-loop.ts workerPool). Only the worker gets it: os-ui
                 never executes runs in `worker` mode, so its agent_runs pool stays at the base size. */}}
            - name: AGENTS_WORKER_CONCURRENCY
              value: {{ $w.concurrency | default 1 | quote }}
            {{- if $w.leaseMs }}
            - name: AGENTS_WORKER_LEASE_MS
              value: {{ $w.leaseMs | quote }}
            {{- end }}
            {{- with $u.langfuseRedaction }}
            - name: LANGFUSE_REDACTION
              value: {{ . | quote }}
            {{- end }}
            # The liveness heartbeat file (A4 review L-2) — touched every 15 s by the loop.
            - name: AGENTS_WORKER_ALIVE_FILE
              value: /tmp/worker-alive
          {{- /* No HTTP server, so liveness is a FRESHNESS check on the process's own heartbeat
               file: `worker/agent-runs.ts` touches AGENTS_WORKER_ALIVE_FILE every 15 s from an
               unref'd interval, which only keeps running while the event loop does. Stale by more
               than twice the probe period (60 s) ⇒ the process is wedged ⇒ restart, and the run it
               held is re-queued by the next pod's lease reaper (or its boot sweep). A missing file
               fails too, so a process that never booted is restarted rather than idling. */}}
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "const s=require('node:fs').statSync('/tmp/worker-alive');if(Date.now()-s.mtimeMs>60000)process.exit(1)"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          {{- /* readOnlyRootFilesystem: the heartbeat file needs a writable /tmp. */}}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $readRepos }}
            # Read-only: the worker loads committed graph.mjs files (config.reposDir = /repos).
            - name: os-repos
              mountPath: /repos
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml ($w.resources | default $u.resources) | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $readRepos }}
        - name: os-repos
          persistentVolumeClaim:
            claimName: os-repos
            readOnly: true
        {{- end }}
{{- end }}
