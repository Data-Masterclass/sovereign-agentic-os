{{- /*
  THE SHARED SERVICE BEARER — `agent-runtime-token`.

  What used to live in this file (engine rebuild A5, 2026-11-13): the Python
  `agent-runtime` Deployment, its ConfigMap and its Service — a generic LangGraph IR
  interpreter that os-ui POSTed a compiled graph to (`/reload`) and then asked to run
  it (`/run`), calling back into os-ui's governed-tool endpoint for every tool call.
  All of it is deleted. Agent systems now execute as a real `StateGraph` INSIDE os-ui
  (`os-ui/tabs/agents/lib/engine/`), as the signed-in user, through the in-process
  governed dispatcher — so there is no second process, no IR on a wire, and no
  callback door (`/api/agents/tool` is gone with it).

  What REMAINS is the Secret, because the token outlived the workload it was named
  after: it is the shared bearer the OS's own CronJobs present to os-ui on the
  service paths (agent scheduled runs, the metrics data-sync sweep, the connections
  catalog-refresh sweep — see `runtimeTokenOk` in
  `os-ui/tabs/agents/lib/build/runtime-auth.ts`), and the data side's Dagster sidecar
  reads this same Secret. It therefore stays here, ungated, until that side lands its
  own template — at which point this file goes too and the key is renamed with it
  (deviation A5-1 in docs/superpowers/plans/2026-11-13-engine-rebuild.md).

  Local profile only: on non-local profiles the Secret is delivered by External
  Secrets (ESO), exactly as before.
*/}}
{{- $token := (.Values.agentRuntime).token }}
{{- if and $token (eq .Values.global.profile "local") }}
apiVersion: v1
kind: Secret
metadata:
  name: agent-runtime-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "agent-runtime") | nindent 4 }}
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- end }}
