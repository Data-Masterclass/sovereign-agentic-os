{{- /*
  Refuse published chart-default secrets on any install that is not a laptop.

  A laptop is `global.profile: local` with the Ingress off (values.local.yaml). Anything else —
  an Ingress, or another profile — is an install other people can reach, and this render FAILS
  (`helm template` and `helm upgrade` alike, before anything is applied) when a guarded value the
  chart renders is still the literal published in values.yaml. So a hand-run upgrade can never
  overwrite the live Secrets with defaults, nor hand os-ui a value its boot guard refuses
  (core/kernel/secret-guard.ts) and crash-loop the new pod.

  Guarded (the values the chart renders into Secrets or env on the local profile): the LiteLLM
  master key and console password, agentRuntime.token, the Langfuse project key pair, the init
  user's password, and the Langfuse core secrets. On other profiles those Secrets come from the
  secrets store and the chart renders none of them, so there is nothing to compare there.
  Compared by SHA-256 only; the message names keys, never values.

  `global.allowChartDefaultSecrets: true` switches the guard off. It exists for throwaway test
  renders only; never set it for a real install. Rotation: docs/ops/secret-rotation.md.
*/}}
{{- $g := .Values.global | default dict }}
{{- $laptop := and (eq $g.profile "local") (not (.Values.ingress | default dict).enabled) }}
{{- if and (not $laptop) (not $g.allowChartDefaultSecrets) (eq $g.profile "local") }}
{{- $i := .Values.langfuseInit | default dict }}
{{- $checks := list
      (list "litellmMasterKey" (.Values.litellmMasterKey | default "") "fadab17377ea25a99066f93f487fea827a9257e914131fa56bc92b84c520f5be")
      (list "litellmUI.password" ((.Values.litellmUI | default dict).password | default "") "b9bc785ea4c9130610eed2da8397ac72439ec926ad6554f447d94b96d64cfe8c")
      (list "agentRuntime.token" ((.Values.agentRuntime | default dict).token | default "") "5ea8c27ca270109bb957d4b54b08e0adc2f8711df077efb0d59cc4b017db336b")
      (list "langfuseInit.publicKey" ($i.publicKey | default "") "8ad181a220c5109ff0115e85250a33e13ba5f5cabcddb2f758f979f716724f6b")
      (list "langfuseInit.secretKey" ($i.secretKey | default "") "aef69d589a481ddf96a3a68a4996c4c3f40be57ecd3bb12fe071dbc522ab9c28")
      (list "langfuseInit.userPassword" ($i.userPassword | default "") "68621479951fa360d498f1df8a38bad6fd8037bc0978e75ea3437b1e9243df70")
      (list "langfuseInit.salt" ($i.salt | default "sovereign-os-local-dev-salt") "683ca8fd548e96e1526b2cd4201b854f9b2b79233cbcb3efc255a1eee8014ae0")
      (list "langfuseInit.nextauthSecret" ($i.nextauthSecret | default "sovereign-os-local-dev-nextauth-secret") "d4bc858585510082defe66c28b885f6060fa104d6244812c1f15227d7bcc86a1")
      (list "langfuseInit.encryptionKey" ($i.encryptionKey | default "a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90") "79175e70eb2236876b0c003be58294690c0e36b44c0947ae80f599ea9d039833") }}
{{- $bad := list }}
{{- range $checks }}
{{- $name := index . 0 }}{{- $value := index . 1 }}
{{- if or (eq $value "") (eq (sha256sum $value) (index . 2)) }}{{- $bad = append $bad $name }}{{- end }}
{{- end }}
{{- if $bad }}
{{- fail (printf "CHART_DEFAULT_SECRETS_REFUSED: this install is not a laptop (ingress enabled or profile != local), but these values are missing or still the chart's published defaults: %s. Set your own in a private overlay (docs/ops/secret-rotation.md); rendering them would overwrite the live Secrets and os-ui would refuse to boot." (join ", " $bad)) }}
{{- end }}
{{- end }}
