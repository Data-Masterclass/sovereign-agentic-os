{{- /*
  os_governance database bootstrap (WP-07). OFF by default: `postgres.governance.enabled`.

  WHY: the governance schema (os-ui/core/adapters/postgres/migrations) must be owned by a role
  that is NOT a superuser and cannot create roles, and the OS must run as a separate non-owner
  login, or the audit log's append-only guarantee does not hold against the OS's own credentials.
  Only a superuser can create those roles, so this one-shot hook runs with a DEDICATED admin
  credential (postgres.governance.adminSecretName; never postgres.secretName, which is Langfuse's
  login live) and does ONLY that:
    1. files/os-governance/roles.sql           — os_governance_app (NOLOGIN), owner, runtime, queue
    2. CREATE DATABASE <db> OWNER <owner>      — if missing
    3. files/os-governance/database-grants.sql — CONNECT only; no OS login may CREATE
  The schemas (`os_governance`, `pgboss`) and everything in them are created by the OWNER in the
  migration step (node-pg-migrate, then pg-boss's own install), never by this hook.
  The template refuses to render when a name collides with another service (below), and the SQL
  refuses at run time a superuser or a role that owns another database.
  It never runs the migrations: those run as the owner (node-pg-migrate), never as a superuser.
  The same two SQL files are executed by os-ui/core/testing/postgres/install.it.ts.
  Idempotent; safe on every upgrade. The pg-dump CronJob picks the new database up by itself.
*/}}
{{- if and .Values.postgres.enabled .Values.postgres.governance.enabled }}
{{- if ne .Values.postgres.engine "plain" }}
{{- fail "postgres.governance.enabled currently supports postgres.engine=plain only (the bootstrap Job connects as the plain engine's superuser)" }}
{{- end }}
{{- $pg := .Values.postgres }}
{{- $gov := $pg.governance }}
{{- if not $gov.adminSecretName }}
{{- fail "postgres.governance.adminSecretName is required: a dedicated superuser Secret for the bootstrap hook (never postgres.secretName)" }}
{{- end }}
{{- if or (eq $gov.adminSecretName $pg.secretName) (eq $gov.adminSecretName "postgres-langfuse-credentials") }}
{{- fail (printf "postgres.governance.adminSecretName %q is another service's credential; use a dedicated Secret" $gov.adminSecretName) }}
{{- end }}
{{- /* No credential of another service, by Secret name, for the admin or any governance login. */}}
{{- $foreignSecrets := list $pg.secretName "postgres-langfuse-credentials" }}
{{- range $pg.extraDatabases }}
{{- $foreignSecrets = append $foreignSecrets .secretName }}
{{- end }}
{{- $govSecrets := dict "postgres.governance.adminSecretName" $gov.adminSecretName "postgres.governance.owner.secretName" $gov.owner.secretName "postgres.governance.runtime.secretName" $gov.runtime.secretName "postgres.governance.queue.secretName" $gov.queue.secretName }}
{{- range $key, $val := $govSecrets }}
{{- if not $val }}
{{- fail (printf "%s must be set" $key) }}
{{- end }}
{{- if has $val $foreignSecrets }}
{{- fail (printf "%s=%q is another service's credential (%s); use a dedicated Secret" $key $val (join ", " ($foreignSecrets | uniq))) }}
{{- end }}
{{- end }}
{{- if ne (len (values $govSecrets | uniq)) 4 }}
{{- fail "postgres.governance: the admin, owner, runtime and queue Secrets must be four different Secrets" }}
{{- end }}
{{- $reserved := list "langfuse" "postgres" "litellm" "dagster" "polaris" "agent_runs" "os_governance_app" "template0" "template1" }}
{{- $reserved = append $reserved $pg.username }}
{{- range $pg.extraDatabases }}
{{- $reserved = append (append $reserved .name) .username }}
{{- end }}
{{- $names := dict "postgres.governance.database" $gov.database "postgres.governance.owner.username" $gov.owner.username "postgres.governance.runtime.username" $gov.runtime.username "postgres.governance.queue.username" $gov.queue.username }}
{{- range $key, $val := $names }}
{{- if not $val }}
{{- fail (printf "%s must be set" $key) }}
{{- end }}
{{- if has $val $reserved }}
{{- fail (printf "%s=%q collides with an existing service's database or role (%s)" $key $val (join ", " ($reserved | uniq))) }}
{{- end }}
{{- end }}
{{- if or (eq $gov.owner.username $gov.runtime.username) (eq $gov.owner.username $gov.queue.username) (eq $gov.runtime.username $gov.queue.username) }}
{{- fail "postgres.governance owner, runtime and queue must be three different roles" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: os-governance-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "os-governance-bootstrap") | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  roles.sql: |
{{ .Files.Get "files/os-governance/roles.sql" | indent 4 }}
  database-grants.sql: |
{{ .Files.Get "files/os-governance/database-grants.sql" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: os-governance-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "os-governance-bootstrap") | nindent 4 }}
  annotations:
    # After Postgres is up and after pg-extra-databases-reconcile (weight 5).
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "6"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "soa.selectorLabels" (dict "ctx" . "component" "os-governance-bootstrap") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "soa.podSecurityContext" . | nindent 8 }}
        runAsUser: 999
      volumes:
        - name: sql
          configMap:
            name: os-governance-bootstrap
      containers:
        - name: bootstrap
          image: "{{ $pg.plainImage.repository }}:{{ $pg.plainImage.tag }}{{ if $pg.plainImage.digest }}@{{ $pg.plainImage.digest }}{{ end }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "soa.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: sql, mountPath: /bootstrap, readOnly: true }
          env:
            - name: PGHOST
              value: {{ include "soa.pgHost" . | quote }}
            - name: PGPORT
              value: "5432"
            # The dedicated bootstrap admin, never postgres.secretName (guarded above).
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: {{ $gov.adminSecretName }}, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: {{ $gov.adminSecretName }}, key: password } }
            - name: GOV_DB
              value: {{ $gov.database | quote }}
            - name: GOV_OWNER
              value: {{ $gov.owner.username | quote }}
            - name: GOV_OWNER_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $gov.owner.secretName }}, key: password } }
            - name: GOV_RUNTIME
              value: {{ $gov.runtime.username | quote }}
            - name: GOV_RUNTIME_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $gov.runtime.secretName }}, key: password } }
            - name: GOV_QUEUE
              value: {{ $gov.queue.username | quote }}
            - name: GOV_QUEUE_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ $gov.queue.secretName }}, key: password } }
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              for i in $(seq 1 60); do
                pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -q && break
                sleep 5
              done
              # One psql run; values travel as psql variables (:'name'), never spliced into
              # SQL by the shell. CREATE DATABASE runs outside a transaction via \gexec.
              psql -v ON_ERROR_STOP=1 --dbname postgres -q \
                -v db="$GOV_DB" -v owner_role="$GOV_OWNER" -v owner_pw="$GOV_OWNER_PASSWORD" \
                -v runtime_role="$GOV_RUNTIME" -v runtime_pw="$GOV_RUNTIME_PASSWORD" \
                -v queue_role="$GOV_QUEUE" -v queue_pw="$GOV_QUEUE_PASSWORD" <<'SQL'
              select set_config('os_bootstrap.database', :'db', false),
                     set_config('os_bootstrap.owner_role', :'owner_role', false),
                     set_config('os_bootstrap.owner_password', :'owner_pw', false),
                     set_config('os_bootstrap.runtime_role', :'runtime_role', false),
                     set_config('os_bootstrap.runtime_password', :'runtime_pw', false),
                     set_config('os_bootstrap.queue_role', :'queue_role', false),
                     set_config('os_bootstrap.queue_password', :'queue_pw', false) \gset discard_
              \i /bootstrap/roles.sql
              select format('CREATE DATABASE %I OWNER %I', :'db', :'owner_role')
               where not exists (select 1 from pg_database where datname = :'db') \gexec
              \i /bootstrap/database-grants.sql
              SQL
              echo "os-governance-bootstrap: database ${GOV_DB}, owner ${GOV_OWNER}, runtime ${GOV_RUNTIME} reconciled"
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
{{- if eq .Values.global.profile "local" }}
---
# Local-only dev credentials for the three governance logins (NOT production secrets). On STACKIT
# these Secrets come from ESO under the same names. The admin Secret is never rendered here: the
# operator supplies a dedicated one (postgres.governance.adminSecretName).
{{- if not (include "soa.eso.owned" (list $ $gov.owner.secretName)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $gov.owner.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
  {{- with include "soa.eso.keep" (list $ $gov.owner.secretName) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ $gov.owner.username | quote }}
  password: {{ $gov.owner.localPassword | quote }}
{{- end }}
---
{{- if not (include "soa.eso.owned" (list $ $gov.runtime.secretName)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $gov.runtime.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
  {{- with include "soa.eso.keep" (list $ $gov.runtime.secretName) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ $gov.runtime.username | quote }}
  password: {{ $gov.runtime.localPassword | quote }}
{{- end }}
---
{{- if not (include "soa.eso.owned" (list $ $gov.queue.secretName)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $gov.queue.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
  {{- with include "soa.eso.keep" (list $ $gov.queue.secretName) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ $gov.queue.username | quote }}
  password: {{ $gov.queue.localPassword | quote }}
{{- end }}
{{- end }}
{{- end }}
