{{- if .Values.postgres.enabled }}
{{- if eq .Values.global.profile "local" }}
{{- /*
  Shared Postgres credential Secrets (kubernetes.io/basic-auth) — used by BOTH
  engines (plain + cnpg) and by every PG consumer. Local/dev only: on STACKIT
  (profile != local) these Secrets are supplied externally (External Secrets
  Operator) under the SAME names, so nothing here renders. Keeping them in one
  template (not inside the engine files) is what lets the StatefulSet and the
  CNPG Cluster share identical credentials.
*/}}
{{- $pg := .Values.postgres }}
# App-owner credentials (the bootstrap superuser/owner for engine:plain; the
# CNPG initdb owner for engine:cnpg). NOT a production secret.
{{- if not (include "soa.eso.owned" (list $ $pg.secretName)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pg.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "postgres") | nindent 4 }}
  {{- with include "soa.eso.keep" (list $ $pg.secretName) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ $pg.username | quote }}
  password: {{ $pg.local.password | quote }}
{{- end }}
{{- range $pg.extraDatabases }}
---
# Local-only dev credentials for the {{ .name }} Postgres role.
{{- if not (include "soa.eso.owned" (list $ .secretName)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .secretName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "soa.labels" $ | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
  {{- with include "soa.eso.keep" (list $ .secretName) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .username | quote }}
  password: {{ .localPassword | quote }}
{{- end }}
{{- end }}
{{- /*
  Dagster's copy of its database password. With `dagster.generatePostgresqlPasswordSecret: false`
  (we run Dagster against OUR Postgres, not its bundled one) the upstream subchart renders no
  Secret and reads the one named `dagster.global.postgresqlSecretName`, key `postgresql-password`
  (the key is fixed in the subchart's templates). It is the SAME password as the extraDatabases
  role named `dagster.postgresql.postgresqlUsername`, rendered from the same value, so the two can
  never drift. Until the pilot fixes nothing rendered it (fresh install: every Dagster pod in
  CreateContainerConfigError) and it was created by hand; a hand-made copy must be adopted before
  the upgrade that renders it (scripts/lib/adopt-secret.sh; docs/components/dagster.md).
*/}}
{{- $dg := .Values.dagster | default dict }}
{{- if and $dg.enabled (not $dg.generatePostgresqlPasswordSecret) }}
{{- $dgName := ($dg.global | default dict).postgresqlSecretName | default "" }}
{{- $dgUser := ($dg.postgresql | default dict).postgresqlUsername | default "" }}
{{- if not $dgName }}{{ fail "dagster.global.postgresqlSecretName is required when dagster.generatePostgresqlPasswordSecret is false" }}{{ end }}
{{- $dgRole := dict }}
{{- range $pg.extraDatabases }}{{ if eq .username $dgUser }}{{ $dgRole = . }}{{ end }}{{ end }}
{{- if not $dgRole }}{{ fail (printf "dagster.postgresql.postgresqlUsername %q matches no postgres.extraDatabases role: the chart cannot render Secret %s (Dagster's database password)" $dgUser $dgName) }}{{ end }}
{{- if not (include "soa.eso.owned" (list $ $dgName)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dgName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "soa.labels" $ | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" $ "component" "dagster") | nindent 4 }}
  {{- with include "soa.eso.keep" (list $ $dgName) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  postgresql-password: {{ $dgRole.localPassword | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
