{{- if and .Values.litellm.enabled .Values.litellmAgentKey.enabled }}
{{- /*
  Provision a scoped LiteLLM virtual key for the agents (least privilege).
  The key value lives in a Secret (the agents read it); a Job calls the LiteLLM
  key API with the master key to register it, limited to the allowed models
  with a budget cap and rate limits.

  CREATE-ONLY BY DEFAULT (ownership). The shared key is the platform team's to tune in LiteLLM
  (its budget, its models, its limits) — LiteLLM owns global budgets and rate limits. So the Job:
    - key missing  -> POST /key/generate with the full chart-derived properties
    - key present  -> compare the key with the chart values and REPORT the difference in the Job
                      log (`[key-drift] ...`); it does NOT write. An edit made in LiteLLM survives
                      `helm upgrade`.
  `litellmAgentKey.reapplyOnUpgrade: true` is the explicit opt-in to the earlier behaviour: on every
  run the key is brought to the chart values with POST /key/update (the SAME properties as the create
  path). The earlier behaviour was the reconcile fix for a stale allowlist (a later edit to
  `litellmAgentKey.models` never reached LiteLLM and surfaced as `key_model_access_denied` 403s once
  the run path moved off the master key); with create-only a changed `models` list is reported as
  drift and applied by `reapplyOnUpgrade` once, or by an admin in LiteLLM. `key_alias` is set at
  create time only.

  ROOT-CAUSE FIX (hooks): this Job used to be a Helm post-install/post-upgrade
  *hook*. The live deploy is forced to run `helm ... --no-hooks` (the argo-cd
  `argocd-redis-secret-init` pre-upgrade hook fails on this cluster), which
  silently skips ALL hooks — so the agent key was never registered and the
  agents hit 401s. It is now a NORMAL (non-hook) resource so a plain
  `helm install` (hooks on OR off) and ArgoCD sync both always run it. It polls
  LiteLLM readiness (the proxy only serves after its migration initContainer has
  created the schema), then registers or reconciles the key.
  `ttlSecondsAfterFinished` lets it self-clean so the next `helm upgrade` /
  ArgoCD sync recreates and re-runs it.

  LOGGING: the Job prints each drifted field (chart value and live value) — or, with
  `reapplyOnUpgrade`, the allowlist before and after the update — so an
  operator can confirm it in `kubectl logs`. It never prints the key
  value, the master key, or the raw /key/info body (which carries the key).
*/}}
{{- $k := .Values.litellmAgentKey }}
{{- if eq .Values.global.profile "local" }}
{{- if not (include "soa.eso.owned" (list $ $k.secretName)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $k.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "litellm") | nindent 4 }}
  {{- with include "soa.eso.keep" (list $ $k.secretName) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  apiKey: {{ $k.local.value | quote }}
{{- end }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-agent-key-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "litellm-key-init") | nindent 4 }}
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "soa.selectorLabels" (dict "ctx" . "component" "litellm-key-init") | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        {{- include "soa.podSecurityContext" . | nindent 8 }}
        runAsUser: 1000
      containers:
        - name: key-init
          image: curlimages/curl:8.11.1
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "soa.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          env:
            - name: MASTER_KEY
              valueFrom: { secretKeyRef: { name: litellm-credentials, key: masterkey } }
            - name: VIRTUAL_KEY
              valueFrom: { secretKeyRef: { name: {{ $k.secretName }}, key: apiKey } }
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              B=http://agentic-os-litellm:4000
              echo "waiting for LiteLLM readiness..."
              for i in $(seq 1 60); do
                code=$(curl -s -o /dev/null -w "%{http_code}" "$B/health/readiness" || true)
                [ "$code" = "200" ] && { echo "litellm ready"; break; }
                sleep 3
              done
              # The desired key properties, rendered from chart values. Shared by the
              # create and the update path so the two can never disagree.
              # Scoped virtual key (least privilege): allowed models + an overall
              # spend cap, PLUS a dedicated per-model spend cap for the pay-per-token
              # STACKIT premium/vision routes (model_max_budget — the hard cost
              # guardrail), and per-key rate limits (rpm_limit / tpm_limit /
              # max_parallel_requests). These do NOT queue: LiteLLM refuses a request
              # over the limit at once with HTTP 429 and a `retry-after` header, and
              # the router's num_retries does not retry that refusal. The caller backs off.
              # `model_max_budget` is a LiteLLM ENTERPRISE feature (OSS /key/generate
              # and /key/update 500 if it is set). Include the per-model STACKIT cost
              # cap ONLY when litellmAgentKey.enterprise is true; otherwise rely on the
              # overall max_budget cap (OSS) — the self-hosted default routes are free.
              # budget_duration (e.g. "7d") makes max_budget an auto-resetting
              # window (weekly pool). When the value is EMPTY it is sent as null, so
              # the reconcile can also turn a reset OFF again — omitting the field
              # (the earlier behaviour) left whatever window the key already had.
              # /key/update with a window sets a new reset time; the spend already
              # counted stays until that reset.
              # The access group admin-registered models join (Models & Providers flow, model_info
              # access_groups): holding the group lets this key call every such model with no values edit.
              {{- $models := $k.models }}
              {{- with ($.Values.llmProviders | default dict).accessGroup }}{{ $models = append $models . | uniq }}{{- end }}
              MODELS='{{ $models | toJson }}'
              PROPS='"models":'"$MODELS"',"max_budget":{{ $k.maxBudget }},"budget_duration":{{ if $k.budgetDuration }}{{ $k.budgetDuration | quote }}{{ else }}null{{ end }},{{ if $k.enterprise }}"model_max_budget":{{ $k.modelMaxBudget | toJson }},{{ end }}"rpm_limit":{{ $k.rpmLimit }},"tpm_limit":{{ $k.tpmLimit }},"max_parallel_requests":{{ $k.maxParallelRequests }}'
              # The allowlist LiteLLM currently holds for this key — ONLY the models
              # field. The /key/info body also carries the key itself and must never
              # be echoed.
              current_models() {
                curl -sS -H "Authorization: Bearer $MASTER_KEY" "$B/key/info?key=$VIRTUAL_KEY" \
                  | grep -o '"models": *\[[^]]*\]' | head -n 1 | sed 's/^"models": *//'
              }
              info=$(curl -s -o /dev/null -w "%{http_code}" \
                -H "Authorization: Bearer $MASTER_KEY" \
                "$B/key/info?key=$VIRTUAL_KEY" || true)
              if [ "$info" = "200" ]; then
{{- if $k.reapplyOnUpgrade }}
                before=$(current_models || true)
                echo "virtual key already provisioned; reconciling it to chart values (reapplyOnUpgrade; alias={{ $k.alias }}, budget={{ $k.maxBudget }}, rpm={{ $k.rpmLimit }}, tpm={{ $k.tpmLimit }})..."
                echo "  models before: ${before:-<unreadable>}"
                curl -fsS -X POST "$B/key/update" \
                  -H "Authorization: Bearer $MASTER_KEY" \
                  -H "Content-Type: application/json" \
                  -d '{"key":"'"$VIRTUAL_KEY"'",'"$PROPS"'}' >/dev/null
                after=$(current_models || true)
                echo "  models after:  ${after:-<unreadable>}"
                echo "virtual key reconciled"
                exit 0
{{- else }}
                # EXISTS: the platform team owns this key's settings in LiteLLM. Compare with the chart
                # values and REPORT; write nothing. (litellmAgentKey.reapplyOnUpgrade=true re-applies.)
                # The /key/info body carries the key itself: it stays in a variable, only the named
                # fields below are ever printed.
                body=$(curl -sS -H "Authorization: Bearer $MASTER_KEY" "$B/key/info?key=$VIRTUAL_KEY" || true)
                field() {
                  printf '%s' "$body" | grep -Eo "\"$1\": *(\[[^]]*\]|\"[^\"]*\"|[^,}]*)" | head -n 1 \
                    | sed -E 's/^"[a-z_]+": *//; s/^"//; s/"$//; s/\.0$//'
                }
                set_of() { printf '%s' "$1" | tr -d '[]" ' | tr ',' '\n' | sort | tr '\n' ' '; }
                drift=0
                compare() {
                  if [ "$2" != "$3" ]; then echo "[key-drift] $1: chart=${2:-null} live=${3:-<unreadable>}"; drift=1; fi
                }
                compare models "$(set_of "$MODELS")" "$(set_of "$(field models)")"
                compare max_budget "{{ $k.maxBudget }}" "$(field max_budget)"
                compare budget_duration "{{ $k.budgetDuration | default "null" }}" "$(field budget_duration)"
                compare rpm_limit "{{ $k.rpmLimit | int64 }}" "$(field rpm_limit)"
                compare tpm_limit "{{ $k.tpmLimit | int64 }}" "$(field tpm_limit)"
                compare max_parallel_requests "{{ $k.maxParallelRequests | int64 }}" "$(field max_parallel_requests)"
                if [ "$drift" = "1" ]; then
                  echo "virtual key (alias={{ $k.alias }}) exists and differs from the chart values; NOT overwritten (litellmAgentKey.reapplyOnUpgrade is false). Fix it in LiteLLM, change the chart values, or set reapplyOnUpgrade: true to re-apply on upgrade."
                else
                  echo "virtual key (alias={{ $k.alias }}) already provisioned and matches the chart values; nothing to do"
                fi
                exit 0
{{- end }}
              fi
              echo "provisioning scoped virtual key (alias={{ $k.alias }}, budget={{ $k.maxBudget }}, rpm={{ $k.rpmLimit }}, tpm={{ $k.tpmLimit }})..."
              PAYLOAD='{"key":"'"$VIRTUAL_KEY"'","key_alias":"{{ $k.alias }}",'"$PROPS"'}'
              # FAIL CLOSED: a refused /key/generate (an alias already taken, a database error) must
              # fail the Job (backoffLimit retries it), never end "complete" with no key — the agents
              # would then get 401s while the Job looks fine.
              if ! curl -fsS -X POST "$B/key/generate" \
                -H "Authorization: Bearer $MASTER_KEY" \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD" >/dev/null; then
                echo "virtual key NOT created: /key/generate refused (alias {{ $k.alias }} taken by another key, or LiteLLM failed)" >&2
                exit 1
              fi
              echo "virtual key created"
              echo "  models: $MODELS"
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
{{- end }}
