{{- if and .Values.litellm.enabled .Values.networkPolicies.defaultDeny (include "soa.litellmViaProxy" .) }}
{{- /*
  litellm-egress — the model gateway's complete egress allowlist while its provider calls go through
  the egress proxy. NetworkPolicies are additive, so the gateway is also taken OUT of the any-443
  policy (allow-apiserver-egress, templates/base/network/egress-policies.yaml); DNS and same-namespace
  services stay allowed by policies 2 and 3. What this adds:
    * the egress proxy (3128) — the only way to the internet;
    * the gateway's database on 5432 — the in-cluster Postgres pods, or the managed Postgres CIDR;
    * the namespaces of local model servers (llmProviders.localModelNamespaces).
  A client inside LiteLLM that ignores HTTPS_PROXY therefore cannot reach a provider directly.
  With the proxy off (viaEgressProxy=false) this policy is not rendered and the gateway keeps the
  any-443 rule, so a rollback restores direct provider calls.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: egress-proxy
      ports:
        - { protocol: TCP, port: 3128 }
    # Its database, and only its database: the in-cluster Postgres pods, or the managed Postgres CIDR
    # (`postgres.external.cidr`; a NetworkPolicy cannot name a host).
    - to:
        {{- if .Values.postgres.enabled }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgres
        {{- if eq (.Values.postgres.engine | default "plain") "cnpg" }}
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ .Values.postgres.clusterName | default "pg" | quote }}
        {{- end }}
        {{- else }}
        - ipBlock:
            cidr: {{ required "postgres.external.cidr is required when the model gateway is behind the egress proxy with a managed Postgres (its egress NetworkPolicy allows 5432 to that CIDR only) — or set llmProviders.viaEgressProxy=false" (.Values.postgres.external | default dict).cidr | quote }}
        {{- end }}
      ports:
        - { protocol: TCP, port: 5432 }
    {{- with (.Values.llmProviders | default dict).localModelNamespaces }}
    - to:
        {{- range . }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
    {{- end }}
{{- end }}
