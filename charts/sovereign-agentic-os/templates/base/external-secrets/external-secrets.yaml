{{- /*
  WP-10 — platform Secrets through the External Secrets Operator from STACKIT Secrets Manager
  (design 00 §3.2 and S2; components/external-secrets/UPSTREAM.md).

  - One ClusterSecretStore for STACKIT Secrets Manager: ESO's documented `vault` provider, KV v2,
    `userPass` auth against the instance's `userpass` mount; the KV mount (`path`) is the instance ID.
    The read-only user's password is a bootstrap Secret the owner creates once (it cannot come from
    the store it unlocks): docs/ops/external-secrets-migration.md.
  - One ExternalSecret per name in externalSecrets.managed, built from files/external-secrets/
    catalog.yaml: the SAME Secret name, type and keys the consumers read today. Remote key
    <remotePrefix | namespace>/<name>, or externalSecrets.remoteKeys.<name> when set.
    creationPolicy Orphan — ESO writes and refreshes the Secret but sets no owner reference, so
    deleting the ExternalSecret (rollback) never deletes the Secret.
  Off by default: nothing here renders unless externalSecrets.enabled.
*/}}
{{- $e := .Values.externalSecrets | default dict }}
{{- if $e.enabled }}
{{- $store := $e.store | default dict }}
{{- $cat := (.Files.Get "files/external-secrets/catalog.yaml" | fromYaml).secrets }}
{{- $prefix := $e.remotePrefix | default .Release.Namespace }}
{{- if $store.create }}
{{- if not $store.instanceId }}{{ fail "externalSecrets.store.instanceId is required (the STACKIT Secrets Manager instance ID — docs/ops/external-secrets-migration.md)" }}{{ end }}
{{- if not $store.username }}{{ fail "externalSecrets.store.username is required (the read-only Secrets Manager user)" }}{{ end }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $store.name }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
spec:
  # Only this release's namespace may read through the store.
  conditions:
    - namespaces: [{{ .Release.Namespace | quote }}]
  provider:
    vault:
      server: {{ $store.server | quote }}
      path: {{ $store.instanceId | quote }}
      version: v2
      auth:
        userPass:
          path: {{ $store.authMount | default "userpass" | quote }}
          username: {{ $store.username | quote }}
          secretRef:
            name: {{ $store.passwordSecret.name | quote }}
            namespace: {{ $store.passwordSecret.namespace | quote }}
            key: {{ $store.passwordSecret.key | quote }}
{{- end }}
{{- range $name := $e.managed | default list }}
{{- $entry := index $cat $name }}
{{- if not $entry }}{{ fail (printf "externalSecrets.managed: %q is not in files/external-secrets/catalog.yaml" $name) }}{{ end }}
{{- $rp := $entry.remoteProperty | default dict }}
{{- /* Handover guard. A chart Secret that Helm still owns live is DELETED by the release that stops
       rendering it unless the LIVE object carries helm.sh/resource-policy: keep — and ESO (Orphan)
       would only re-create it at the next refresh. So the switch release refuses until the
       handover release has put `keep` on it. Offline renders (empty lookup) pass. */}}
{{- if eq $entry.source "chart" }}
{{- $live := lookup "v1" "Secret" $.Release.Namespace $name }}
{{- if $live }}
{{- $ann := $live.metadata.annotations | default dict }}
{{- $lbl := $live.metadata.labels | default dict }}
{{- if and (eq (index $lbl "app.kubernetes.io/managed-by" | default "") "Helm") (ne (index $ann "helm.sh/resource-policy" | default "") "keep") }}
{{- fail (printf "externalSecrets.managed: the live Secret %q is owned by Helm without helm.sh/resource-policy: keep, so this release would DELETE it. Run the handover release first (externalSecrets.handover: [%s]) — docs/ops/external-secrets-migration.md" $name $name) }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "soa.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $e.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ $store.name }}
    kind: ClusterSecretStore
  target:
    name: {{ $name }}
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: {{ $entry.type }}
      engineVersion: v2
      {{- with $entry.labels }}
      metadata:
        labels:
          {{- toYaml . | nindent 10 }}
      {{- end }}
      # Every key goes through a template that FAILS on an empty or whitespace-only value (sprig `trim`): an empty property in
      # Secrets Manager then leaves the ExternalSecret not Ready and the Secret as it was,
      # instead of blanking a credential. ESO's template functions have no `fail` (and sprig
      # replaces Go's `slice`), so an empty value indexes past the end of a one-element list:
      # Go's `index` errors ("unable to execute template at key …: index out of range").
      data:
        {{- range $key := $entry.keys }}
        {{ $key | quote }}: {{ printf "{{ $v := index . %q }}{{ if empty (trim $v) }}{{ index (list \"empty value refused\") 1 }}{{ end }}{{ $v }}" $key | quote }}
        {{- end }}
  data:
    {{- range $key := $entry.keys }}
    - secretKey: {{ $key | quote }}
      remoteRef:
        key: {{ index ($e.remoteKeys | default dict) $name | default (printf "%s/%s" $prefix $name) | quote }}
        property: {{ index $rp $key | default $key | quote }}
    {{- end }}
{{- end }}
{{- end }}
