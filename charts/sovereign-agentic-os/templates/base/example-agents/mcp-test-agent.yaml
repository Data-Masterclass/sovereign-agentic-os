{{- if .Values.mcpTestAgent.enabled }}
{{- /*
  MCP test agent — proves the OS's own real, governed MCP registry
  (os-ui's /api/mcp) works end to end, the same way sample-agent proves
  OpenSearch+RAG works end to end. It calls tools/list + tools/call as a
  designated demo user, so OPA/role/DLS governance applies exactly as it
  would for a human using Claude Desktop — no privileged path.

  The demo user's MCP bearer token is NOT generated here: it is minted once
  via the normal "copy my MCP token" flow (McpConnect UI, /api/mcp/token) for
  a real, designated account, then supplied out-of-band as the
  mcp-test-agent-token Secret, e.g.:
    kubectl -n <ns> create secret generic mcp-test-agent-token \
      --from-literal=MCP_TOKEN='<the minted token>'
  or via a gitignored values.private.yaml (`mcpTestAgent.mcpToken`) / an
  ExternalSecret. Without it the pod still starts (health stays green); /ask
  fails honestly ("MCP_TOKEN not configured") rather than silently no-op'ing.

  This folder (templates/base/example-agents/) is a home for small agents
  that exist to PROVE a base service works end to end, not to run production
  workloads — mcp-test-agent is the first. Add future ones alongside it, one
  file per agent (mirrors templates/extensions/agent/, the equivalent home
  for extensions-tier example agents like sample-agent).
*/}}
{{- $a := .Values.mcpTestAgent }}
{{- $name := "mcp-test-agent-token" }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $current := "" }}
{{- if $existing }}{{ $current = (index $existing.data "MCP_TOKEN" | default "" | b64dec) }}{{- end }}
{{- $token := $a.mcpToken | default $current | default "" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  MCP_TOKEN: {{ $token | b64enc }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-test-agent
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "soa.syncWaveAnno" (dict "ctx" . "tier" "apps") | nindent 4 }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "mcp-test-agent") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "soa.selectorLabels" (dict "ctx" . "component" "mcp-test-agent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "soa.labels" . | nindent 8 }}
        {{- include "soa.selectorLabels" (dict "ctx" . "component" "mcp-test-agent") | nindent 8 }}
    spec:
      {{- include "soa.priorityClassName" (dict "ctx" . "tier" "app") | nindent 6 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "soa.podSecurityContext" . | nindent 8 }}
        runAsUser: 1000
      containers:
        - name: agent
          image: "{{ $a.image.repository }}:{{ $a.image.tag }}"
          imagePullPolicy: IfNotPresent      # locally-built image, loaded into kind
          securityContext:
            {{- include "soa.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
          env:
            - name: PORT
              value: "8000"
            - name: MCP_URL
              value: {{ $a.mcpUrl | default "http://os-ui:3000/api/mcp" | quote }}
            - name: MCP_TOKEN
              valueFrom: { secretKeyRef: { name: mcp-test-agent-token, key: MCP_TOKEN } }
            - name: LITELLM_BASE_URL
              value: "http://agentic-os-litellm:4000/v1"
            - name: LITELLM_API_KEY     # scoped virtual key (not the master key)
              valueFrom: { secretKeyRef: { name: agent-litellm-key, key: apiKey } }
            - name: CHAT_MODEL
              value: {{ $a.chatModel | quote }}
            # Langfuse tracing (public key + host are not secret; secret key via Secret).
            - name: LANGFUSE_HOST
              value: {{ .Values.langfuseInit.host | quote }}
            - name: LANGFUSE_PUBLIC_KEY
              value: {{ .Values.langfuseInit.publicKey | quote }}
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: langfuse-init, key: LANGFUSE_INIT_PROJECT_SECRET_KEY }
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml $a.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-test-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "soa.labels" . | nindent 4 }}
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "mcp-test-agent") | nindent 4 }}
spec:
  selector:
    {{- include "soa.selectorLabels" (dict "ctx" . "component" "mcp-test-agent") | nindent 4 }}
  ports:
    - { name: http, port: 8000, targetPort: http }
{{- end }}
