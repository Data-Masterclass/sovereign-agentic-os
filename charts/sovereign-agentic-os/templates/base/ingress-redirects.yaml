{{- /*
  Copyright 2026 Borek Data Ventures UG (haftungsbeschränkt)
  SPDX-License-Identifier: Apache-2.0

  Redirect-only hostnames (`ingress.redirectHosts: [{host, to}]`, EMPTY by default). Each entry
  renders ONE ingress-nginx Ingress that answers every request on `host` with a 308 to `to`,
  keeping the path and the query string, and proxies nothing:
    - `nginx.ingress.kubernetes.io/permanent-redirect: <to>$request_uri` and
      `permanent-redirect-code: "308"` (ingress-nginx annotations; nginx `return 308 …`, where
      `$request_uri` is nginx's own variable: the original path plus the query string);
    - its own cert-manager certificate (`cert-manager.io/cluster-issuer`, a `<host>-tls` Secret),
      so the HTTPS request is answered before it is redirected; HTTP-01 solving works because
      cert-manager's solver Ingress claims only /.well-known/acme-challenge/<token>;
    - the backend is a Service name that exists nowhere (`redirect-only`): the location returns
      before any proxying, and no os-ui route, cookie or session is involved.
  The canonical OS URL (`osUI.publicUrl`) and every other Ingress are unchanged.
  `to` must be an origin: https://<host>, no path, no query, no trailing slash.
  NOTE: with ingress-nginx `--enable-annotation-validation` on (a later default), the `$` of
  `$request_uri` fails the URL validator and the controller ignores the redirect: keep it off,
  or replace this Ingress, before such an upgrade (docs/runbooks/redirect-hostnames.md).
*/ -}}
{{- $ing := .Values.ingress }}
{{- $list := $ing.redirectHosts | default list }}
{{- if and $list (not $ing.enabled) }}{{ fail "ingress.redirectHosts needs ingress.enabled=true (ingress-nginx + cert-manager)" }}{{ end }}
{{- if $ing.enabled }}
{{- $seen := dict }}
{{- range $i, $r := $list }}
{{- $host := $r.host | default "" }}
{{- $to := $r.to | default "" }}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$" $host) }}{{ fail (printf "ingress.redirectHosts[%d].host %q is not a lower-case DNS name" $i $host) }}{{ end }}
{{- if not (regexMatch "^https://[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$" $to) }}{{ fail (printf "ingress.redirectHosts[%d].to %q must be an https origin (https://<host>, no path, query or trailing slash)" $i $to) }}{{ end }}
{{- if eq (trimPrefix "https://" $to) $host }}{{ fail (printf "ingress.redirectHosts[%d] redirects %s to itself" $i $host) }}{{ end }}
{{- if hasKey $seen $host }}{{ fail (printf "ingress.redirectHosts lists %s twice" $host) }}{{ end }}
{{- $_ := set $seen $host true }}
{{- range $k, $h := ($ing.hosts | default dict) }}
{{- if eq (toString $h) $host }}{{ fail (printf "ingress.redirectHosts host %s is also ingress.hosts.%s: a host is either served or redirected" $host $k) }}{{ end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "redirect-%s" ($host | replace "." "-") | trunc 63 | trimSuffix "-" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "soa.labels" $ | nindent 4 }}
    app.kubernetes.io/component: ingress-redirect
  annotations:
    cert-manager.io/cluster-issuer: {{ $ing.tlsIssuer | quote }}
    nginx.ingress.kubernetes.io/permanent-redirect: {{ printf "%s$request_uri" $to | quote }}
    nginx.ingress.kubernetes.io/permanent-redirect-code: "308"
spec:
  ingressClassName: {{ $ing.className }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ printf "%s-tls" $host | quote }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redirect-only
                port:
                  number: 80
{{- end }}
{{- end }}
