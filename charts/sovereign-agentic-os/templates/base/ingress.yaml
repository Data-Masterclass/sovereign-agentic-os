{{- /*
  Copyright 2026 Borek Data Ventures UG (haftungsbeschränkt)
  SPDX-License-Identifier: Apache-2.0

  Public-tool Ingress (Mode B / STACKIT). OFF by default (`ingress.enabled=false`)
  so the bundled/local Mode A path is untouched — nothing here renders unless an
  operator opts in via the values.stackit-managed.yaml overlay.

  One Ingress per public tool, emitted ONLY when its `ingress.hosts.<key>` is set
  (non-empty). Each carries the cert-manager cluster-issuer annotation + a TLS
  block (host + a `<host>-tls` secret cert-manager fills) and routes `/` to the
  in-cluster Service. Hostnames resolve to the ingress LB (terraform DNS zone).
*/ -}}
{{- if .Values.ingress.enabled }}
{{- $ctx := . }}
{{- $ing := .Values.ingress }}
{{- /* host key -> in-cluster Service + port (release name `agentic-os`). */}}
{{- /* DAGSTER HAS NO SIDE DOOR. Dagster OSS ships no login, so the only way to its UI is the OS:
       <OS host>/tools/dagster/ (admin-only, OFF until switched on in Platform → Tool consoles,
       docs/ops/tool-consoles.md). A `hosts.dagster` value is kept working for old links, but as a
       PURE 308 REDIRECT to `osUI.publicUrl` + /tools/dagster/: its backend is os-ui (never
       reached — ingress-nginx answers the redirect itself), NOT the Dagster webserver, and no
       basic-auth Secret is involved (`ingress.dagsterBasicAuthSecret` is ignored). Without an
       https `osUI.publicUrl` there is nothing to redirect to and the host renders NO Ingress.
       The Ingress keeps its old name, so an upgrade replaces the old proxying Ingress in place. */}}
{{- $dagsterTarget := "" }}
{{- $pub := ((($.Values.osUI | default dict).publicUrl | default "") | trimSuffix "/") }}
{{- if regexMatch "^https://[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$" $pub }}
{{- $dagsterTarget = printf "%s/tools/dagster/" $pub }}
{{- end }}
{{- $dagsterAnno := dict
      "nginx.ingress.kubernetes.io/permanent-redirect" $dagsterTarget
      "nginx.ingress.kubernetes.io/permanent-redirect-code" "308"
}}
{{- $routes := dict
  "osUI"         (dict "service" "os-ui" "port" 3000)
  "litellm"      (dict "service" "agentic-os-litellm" "port" 4000)
  "langfuse"     (dict "service" "agentic-os-langfuse-web" "port" 3000)
  "dagster"      (dict "service" "os-ui" "port" 3000 "name" "agentic-os-dagster-webserver-ingress" "annotations" $dagsterAnno "redirectOnly" true)
}}
{{- /* RESTRICTED CONSOLES — the model gateway (LiteLLM) and Langfuse. LiteLLM holds the
       provider credentials and an admin API; Langfuse holds every prompt, completion and tool
       result of every run. A hostname alone therefore renders NOTHING for them: the route needs
       `ingress.restricted.<key>.expose: true` AND a protection annotation under
       `ingress.restricted.<key>.annotations` (the render fails without one — soa.restrictedExposed).
       This holds for a release whose values still carry the old hostnames, which is what
       `scripts/deploy.sh` deploys. `scripts/check-consoles-not-public.mjs` fails the gate if the
       default or the STACKIT profile ever renders one. See docs/components/litellm.md and
       docs/components/langfuse.md, "Not reachable from the internet". */}}
{{- $restricted := include "soa.restrictedHosts" $ctx | fromJsonArray }}
{{- /* ALIAS → CANONICAL (opt-in `ingress.redirectAliasToPublicUrl`). The OS UI answers on two hosts
       (`hosts.osUI` and the apex `hosts.osUIApex`) but has ONE public URL (`osUI.publicUrl`, the
       OS_PUBLIC_URL os-ui gets). Sessions, OAuth nonce cookies and callbacks belong to that origin;
       with this on, the OS UI route of the OTHER host answers every request with a 308 to the
       canonical origin (ingress-nginx `permanent-redirect` + `permanent-redirect-code`,
       https://kubernetes.github.io/ingress-nginx/user-guide/nginx-configuration/annotations/#permanent-redirect).
       The annotation takes a URL only: ingress-nginx >= 1.12 validates it and refuses nginx variables
       such as `$request_uri`, so the path and query are NOT carried over — a deep link on the alias
       lands on the canonical home page. Only os-ui's `/` route is redirected: the `/git` Ingress on
       the same host is a separate location and is unchanged. */}}
{{- $canonHost := "" }}
{{- $canonUrl := ((($.Values.osUI | default dict).publicUrl | default "") | trimSuffix "/") }}
{{- if and $ing.redirectAliasToPublicUrl (not $canonUrl) }}{{ fail "ingress.redirectAliasToPublicUrl needs osUI.publicUrl (the canonical https origin)" }}{{ end }}
{{- if $ing.redirectAliasToPublicUrl }}
{{- if not (regexMatch "^https://[a-z0-9]([a-z0-9-]*[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$" $canonUrl) }}{{ fail (printf "osUI.publicUrl %q must be an https origin (https://<host>, no path) for ingress.redirectAliasToPublicUrl" $canonUrl) }}{{ end }}
{{- $canonHost = trimPrefix "https://" $canonUrl }}
{{- end }}
{{- $aliasRedirect := dict "nginx.ingress.kubernetes.io/permanent-redirect" (printf "%s/" $canonUrl) "nginx.ingress.kubernetes.io/permanent-redirect-code" "308" }}
{{- range $key, $route := $routes }}
{{- $host := index ($ing.hosts | default dict) $key }}
{{- $extra := dict }}
{{- if has $key $restricted }}
{{- if eq (include "soa.restrictedExposed" (dict "ctx" $ctx "key" $key)) "true" }}
{{- $extra = (index $ing.restricted $key).annotations | default dict }}
{{- $op := (index $ing.restricted $key).operatorIngress | default dict }}
{{- if eq (toString $op.enabled) "true" }}
{{- /* The operators' route: nginx basic auth, exactly as the Dagster console (ASCII realm —
       ingress-nginx refuses a non-ASCII annotation value). Over any extra annotations. */}}
{{- $extra = merge (dict
      "nginx.ingress.kubernetes.io/auth-type" "basic"
      "nginx.ingress.kubernetes.io/auth-secret" ($op.basicAuthSecret | toString)
      "nginx.ingress.kubernetes.io/auth-realm" (printf "%s - operators only" (title $key))
    ) $extra }}
{{- end }}
{{- else }}
{{- $host = "" }}
{{- end }}
{{- end }}
{{- if and $canonHost (eq $key "osUI") $host (ne (toString $host) $canonHost) }}
{{- $extra = $aliasRedirect }}
{{- end }}
{{- if and $route.redirectOnly (not $dagsterTarget) }}
{{- $host = "" }}
{{- end }}
{{- if $host }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $route.name | default (printf "%s-ingress" $route.service) }}
  namespace: {{ $ctx.Release.Namespace }}
  labels:
    {{- include "soa.labels" $ctx | nindent 4 }}
    app.kubernetes.io/name: {{ $route.service }}
    app.kubernetes.io/component: ingress
  annotations:
    cert-manager.io/cluster-issuer: {{ $ing.tlsIssuer | quote }}
    {{- with $ing.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $route.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ $ing.className }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ printf "%s-tls" $host | quote }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $route.service }}
                port:
                  number: {{ $route.port }}
{{- end }}
{{- end }}
{{- /*
  Apex route — the bare zone apex (e.g. agentic.datamasterclass.com) also serving
  the OS UI, so the apex no longer 404s alongside os.<zone>. Opt-in via
  `ingress.hosts.osUIApex`; a SECOND Ingress to the same os-ui Service (distinct
  name so it never collides with the osUI host's `os-ui-ingress`), its own TLS.
*/ -}}
{{- $apex := index ($ing.hosts | default dict) "osUIApex" }}
{{- if $apex }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: os-ui-apex-ingress
  namespace: {{ $ctx.Release.Namespace }}
  labels:
    {{- include "soa.labels" $ctx | nindent 4 }}
    app.kubernetes.io/name: os-ui
    app.kubernetes.io/component: ingress
  annotations:
    cert-manager.io/cluster-issuer: {{ $ing.tlsIssuer | quote }}
    {{- with $ing.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and $canonHost (ne (toString $apex) $canonHost) }}
    {{- toYaml $aliasRedirect | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ $ing.className }}
  tls:
    - hosts:
        - {{ $apex | quote }}
      secretName: {{ printf "%s-tls" $apex | quote }}
  rules:
    - host: {{ $apex | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: os-ui
                port:
                  number: 3000
{{- end }}
{{- end }}
