
# PriorityClasses — protect the data layer under memory pressure.
priorityClasses:
  enabled: true
  infra:
    name: sovereign-os-infra
    value: 100000
  app:
    name: sovereign-os-app
    value: 1000

global:
  # Logical namespace the workloads live in (created via --create-namespace).
  namespace: agentic-os
  # Profile: "local" (kind) or "stackit". Templates may branch on this.
  profile: local
  # Empty => use the cluster's default StorageClass (kind: "standard").
  storageClass: ""
  imagePullPolicy: IfNotPresent
  # Registry pull secret(s) for the bespoke images.
  imagePullSecrets: []
  # Secure-by-default pod hardening applied to bespoke workloads.
  podSecurity:
    runAsNonRoot: true
    seccompProfile: RuntimeDefault

# Secure-by-default network baseline (security.md).
networkPolicies:
  defaultDeny: true

# Backups (templates/extensions/backup/).
backup:
  pgDump:
    enabled: false
    schedule: "30 2 * * *"     # nightly, 02:30 UTC
    retentionDays: 14
    bucket: lakehouse          # existing bucket (objectStorage.buckets)
    prefix: backups/pg
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 256Mi }

# Ingress + TLS — OFF by default (Mode A is port-forward only).
ingress:
  enabled: false
  className: nginx            # ingress controller class (Mode B: ingress-nginx)
  tlsIssuer: letsencrypt-prod # cert-manager ClusterIssuer (cert-manager.io/cluster-issuer)
  annotations:                # extra annotations merged onto every tool Ingress
    # File uploads (Files tab)
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
    # A large upload over a normal link takes longer than nginx's default 60s
    # read/send timeout — nginx then CUTS the connection mid-body, so the app
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  # Per-tool public hostnames. Empty => that tool gets NO Ingress.
  hosts: {}

# Object storage — local stand-in for STACKIT Object Storage (MinIO, S3).
objectStorage:
  enabled: true
  # Backend mode. "bundled" (default) runs MinIO in-cluster; "external" (or
  mode: bundled
  external:
    # Managed S3 endpoint used when objectStorage is external (e.g. STACKIT Object Storage).
    endpoint: ""
  # Name of the Secret holding S3 credentials.
  secretName: object-storage-credentials
  region: us-east-1            # clients just need a value
  buckets:
    - langfuse                 # Langfuse v3 blob store (events/media)
    - lakehouse                # Iceberg warehouse (Polaris / Layer 3)
    - sandbox                  # personal/sandbox lane — per-user private prefixes (Iceberg personal_<uid>.*)
    - files                    # Files tab ORIGINAL uploaded bytes (config.filesBucket=FILES_BUCKET,
                               # default "files").
  image:
    # ghcr MIRROR of Chainguard's community MinIO build (cgr.dev/chainguard/minio,
    # MinIO RELEASE.2026-09-22T19-25-18Z).
    repository: ghcr.io/aborek/sovereign-os/minio
    digest: sha256:1887982b34cc821a569fdc94c4d30ee01c2826184fe7d3a49aee37bb3bbb23a7
  awsCli:
    repository: amazon/aws-cli
    digest: sha256:e14216fb361cce909ce199616711ad103182d5937f851cda9bebf25867d7180a   # 2.31.13
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    # Raised 768Mi→1536Mi (2026-07-26 audit: live MinIO sat at 86% of 768Mi —
    # headroom for scheduled-sync slice writes; the 20Gi PVC is the real ceiling,
    limits: { cpu: "1", memory: 1536Mi }
  # Data volume.
  persistence:
    enabled: false
    size: 20Gi
  # Dev-only credentials, used ONLY when global.profile == local.
  local:
    accessKey: agentic-os-local
    secretKey: agentic-os-local-secret

# Postgres (infra tier) — CloudNativePG-managed.
postgres:
  enabled: true
  # In-cluster engine (only applies when enabled:true):
  engine: plain
  # When enabled:false (Mode B), no in-cluster Postgres is created and the PG
  external:
    host: ""                   # managed PostgreSQL host (e.g. STACKIT PostgreSQL Flex)
  clusterName: pg              # creates services pg-rw / pg-ro / pg-r
  instances: 1                 # local: single instance (3 in production for HA)
  database: langfuse
  username: langfuse
  # Secret (kubernetes.io/basic-auth) for the app owner.
  secretName: postgres-langfuse-credentials
  storageSize: 2Gi
  # Image for engine:cnpg — CloudNativePG's PostgreSQL build (operator needs a tag
  # for upgrade detection; tag@digest pins the exact image too).
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    tag: "17.5"
    digest: sha256:b1deeed2aa998b2f381e39c5cadb9ec06127708c8bd62965743af19abf21628f
  # Image for engine:plain — the official upstream Postgres (PostgreSQL license).
  # No Kubernetes-API dependency; bootstraps DBs/users purely from env + initdb.
  plainImage:
    repository: postgres
    tag: "17"
    digest: sha256:5c855ad7b85e68e48a62f34662853f38b57c1c1d80f3a927ab58034fd6d31c5e
  resources:
    # Request bumped so concurrent boot-time schema migrations (Langfuse, LiteLLM,
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: "1", memory: 1Gi }
  # Dev-only password, used ONLY when global.profile == local. Not a production secret.
  local:
    password: langfuse-local-dev
  # Additional databases on the SAME CNPG cluster, each as a managed role +
  # Database CR. Other services (LiteLLM, Dagster, …)
  extraDatabases:
    - name: litellm           # LiteLLM admin UI + virtual keys + cost caps
      username: litellm
      secretName: postgres-litellm-credentials
      createdb: true          # Prisma's migration resolver needs a shadow DB
      localPassword: litellm-local-dev
    - name: dagster           # Dagster run/event/schedule storage
      username: dagster
      secretName: postgres-dagster-credentials
      createdb: false
      localPassword: dagster-local-dev
    - name: polaris           # Iceberg catalog metadata (CloudNativePG)
      username: polaris
      secretName: postgres-polaris-credentials
      createdb: false
      localPassword: polaris-local-dev
  # CLOUD-DURABLE CNPG extras (engine:cnpg ONLY).
  cnpg:
    # Durable zonal CSI storage class for the Postgres data volume (a zonal disk
    # can't cross-AZ-attach, so HA comes from replicas in OTHER zones, not shared
    storageClass: ""
    highAvailability:
      # Spread the 3 instances across zones (a soft topology-spread constraint)
      enabled: false
      # topology.kubernetes.io/zone spread across the node pool's AZs.
      topologyKey: topology.kubernetes.io/zone
      # PDB: keep at least this many instances available during voluntary disruption.
      minAvailable: 2
    backup:
      # WAL archiving + base backups to the overlay's object store via the Barman
      # Cloud PLUGIN (CNPG >= 1.26; the in-tree `spec.backup.barmanObjectStore`
      enabled: false
      # Barman plugin identifier (fixed by the plugin project).
      pluginName: barman-cloud.cloudnative-pg.io
      # Name of the ObjectStore CR this template creates and the Cluster references.
      objectStoreName: pg-barman-store
      # Bucket URL for WAL/base backups.
      destinationPath: ""
      # S3-compatible endpoint (EKS/S3-API only; leave empty for native GCS/Azure).
      endpointURL: ""
      # Retention policy (Barman `retentionPolicy`).
      retention: "30d"
      # Cron for the base backup (ScheduledBackup).
      schedule: "0 0 3 * * *"
    serviceAccount:
      # Bind the CNPG instance pods to a cloud identity so Barman's WAL push is
      # KEYLESS (Workload Identity / Pod Identity / Entra WI).
      enabled: false
      annotations: {}

# Valkey (BSD-3) — Langfuse queue/cache. NOT Redis (SSPL) — stack-decisions.md.
# Cache only; not backed up. Local: single ephemeral pod with auth.
valkey:
  enabled: true
  secretName: valkey-credentials   # local: chart-created; STACKIT: external
  image:
    repository: valkey/valkey
    tag: "8.1-alpine"
    digest: sha256:77643d152547b446fc15cbafaff22004545663fcd40c6b28038ad283837baa75
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  local:
    password: valkey-local-dev

# ClickHouse (Apache 2.0) — Langfuse v3 analytics backend.
clickhouse:
  enabled: true
  secretName: clickhouse-credentials   # local: chart-created; STACKIT: external
  database: langfuse
  user: langfuse
  image:
    repository: clickhouse/clickhouse-server
    tag: "24.8"
    digest: sha256:1ffa82edee000a42c09313bd9f1293d94c570aee74babc1b3ca9983a35fa597b
  resources:
    # ClickHouse keeps mark/uncompressed caches resident; request reflects real
    # steady-state.
    requests: { cpu: 200m, memory: 2Gi }
    limits: { cpu: "2", memory: 6Gi }
  # Data volume.
  persistence:
    enabled: false
    size: 10Gi
  local:
    password: clickhouse-local-dev

# Langfuse project keys (consumed by os-ui + LiteLLM to send traces).
langfuseInit:
  publicKey: "pk-lf-localdev0000public"
  secretKey: "sk-lf-localdev0000secret"
  host: "http://agentic-os-langfuse-web:3000"

# Langfuse v3 (MIT core) — wrapped upstream subchart, wired to OUR backends.
langfuse:
  enabled: true

  # ---- Langfuse application core ----
  langfuse:
    salt:
      secretKeyRef: { name: langfuse-core-secrets, key: salt }
    encryptionKey:
      secretKeyRef: { name: langfuse-core-secrets, key: encryptionKey }
    nextauth:
      url: http://localhost:3000        # local port-forward target
      secret:
        secretKeyRef: { name: langfuse-core-secrets, key: nextauthSecret }
    features:
      telemetryEnabled: false           # sovereign/offline — no phone-home
    # Headless org/project/key provisioning (Secret from templates/base/langfuse/init.yaml).
    additionalEnvFrom:
      - secretRef:
          name: langfuse-init

    # ---- CH readiness gate ----
    # initContainer that polls ClickHouse HTTP /ping before langfuse-web starts.
    extraInitContainers:
      - name: wait-for-clickhouse
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        command:
          - sh
          - -c
          - |
            echo "Waiting for ClickHouse HTTP /ping …"
            until wget -qO- http://clickhouse:8123/ping 2>/dev/null | grep -q Ok; do
              echo "  CH not ready, retrying in 5s"
              sleep 5
            done
            echo "ClickHouse is ready."

    # via the subchart's shared deployment annotations.
    web:
      resources:
        requests: { cpu: 100m, memory: 768Mi }
        limits: { cpu: "1", memory: 1536Mi }
      # Node's default old-space cap (~640MB)
      pod:
        additionalEnv:
          - name: NODE_OPTIONS
            value: "--max-old-space-size=1152"
    worker:
      resources:
        requests: { cpu: 100m, memory: 768Mi }
        limits: { cpu: "1", memory: 1280Mi }

  # ---- Postgres: external (CloudNativePG `pg-rw`) ----
  postgresql:
    deploy: false
    host: pg-rw
    port: 5432
    auth:
      username: langfuse
      database: langfuse
      existingSecret: postgres-langfuse-credentials
      secretKeys:
        userPasswordKey: password
        adminPasswordKey: password

  # ---- Redis protocol: external Valkey ----
  redis:
    deploy: false
    host: valkey
    port: 6379
    auth:
      username: default
      existingSecret: valkey-credentials
      existingSecretPasswordKey: password

  # ---- ClickHouse: external single node (NOT a cluster) ----
  clickhouse:
    deploy: false
    host: clickhouse
    httpPort: 8123
    nativePort: 9000
    database: langfuse
    clusterEnabled: false               # single node — no ON CLUSTER DDL
    auth:
      username: langfuse
      existingSecret: clickhouse-credentials
      existingSecretKey: password

  # ---- Blob storage: external SeaweedFS (S3) ----
  s3:
    deploy: false
    storageProvider: s3
    bucket: langfuse
    region: us-east-1
    endpoint: http://minio:9000
    forcePathStyle: true                # required for non-AWS S3
    accessKeyId:
      secretKeyRef: { name: object-storage-credentials, key: AWS_ACCESS_KEY_ID }
    secretAccessKey:
      secretKeyRef: { name: object-storage-credentials, key: AWS_SECRET_ACCESS_KEY }

# Mock model — local OpenAI-compatible stub for offline/kind deployments.
mockModel:
  enabled: true
  image:
    repository: sovereign-os/mock-model   # built locally, loaded into kind
    tag: "0.1.1"                           # 0.1.1 adds poem mode
  embedDim: 384                            # must match opensearch.knnDimension
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }

# STACKIT AI Model Serving — PREMIUM, managed, pay-per-token. NOT the default.
stackitPremium:
  enabled: false                 # opt-in; public default is self-hosted only
  # OpenAI-compatible base URL for STACKIT AI Model Serving (eu01).
  apiBaseUrl: "https://api.openai-compat.model-serving.eu01.onstackit.cloud/v1"
  # Confirmed STACKIT catalog model ids.
  visionModelId: "Qwen/Qwen3-VL-235B-A22B-Instruct-FP8"   # vision + last-resort chat
  chatModelId: "Qwen/Qwen3-VL-235B-A22B-Instruct-FP8"     # reuse the VLM for text fallback
  secretName: stackit-ai-model-serving-key
  # Local dev: key stays EMPTY (route defined but unauthenticated; only errors if
  # actually reached).
  local:
    apiKey: ""
  externalSecrets:
    enabled: false               # turn on with ESO + a STACKIT Secrets Manager store
    secretStoreRef:
      name: stackit-secrets-manager
      kind: ClusterSecretStore
    remoteKey: stackit-ai-model-serving-key
    property: apiKey

# LiteLLM master key (admin access to the gateway; os-ui + the key-init Job).
# Local dev throwaway; external on STACKIT.
litellmMasterKey: "sk-litellm-local-dev-master"

# LiteLLM admin UI login (DB-backed UI at /ui). Local dev throwaway.
litellmUI:
  username: "admin"
  password: "litellm-admin-local-dev"

# Scoped virtual key for the agents (least privilege — security.md).
litellmAgentKey:
  enabled: true
  secretName: agent-litellm-key
  alias: "sovereign-agents"
  # Per-model cost caps (model_max_budget)
  enterprise: false
  maxBudget: 5            # overall USD spend cap on this key
  # Auto-reset window for maxBudget (LiteLLM key `budget_duration`, e.g. "7d" =
  # weekly). Empty => no reset (a one-shot cap).
  budgetDuration: ""
  models:                 # only these models are callable with this key
    - sovereign-default   # standard/worker tier (STACKIT gpt-oss-20b)
    - sovereign-mock      # back-compat alias -> same standard/worker tier
    - sovereign-reasoning # reasoning tier (STACKIT Qwen3-VL-235B)
    - sovereign-embed     # offline embeddings (mock-model)
  # HARD COST GUARDRAIL: a dedicated per-model USD cap for the pay-per-token
  # STACKIT routes.
  modelMaxBudget: {}
  # Per-key rate limits with graceful queueing (security.md).
  rpmLimit: 120
  tpmLimit: 200000
  maxParallelRequests: 8
  local:
    value: "sk-agents-local-dev"

# LiteLLM — model/MCP gateway (wrapped upstream subchart, alias `litellm`).
litellm:
  enabled: true
  # Use the existing CloudNativePG database (enables the admin UI + virtual keys
  # + cost caps).
  db:
    deployStandalone: false
    useExisting: true
    endpoint: pg-rw
    database: litellm
    secret:
      name: postgres-litellm-credentials
      usernameKey: username
      passwordKey: password
  migrationJob:
    hooks:
      argocd:
        enabled: false   # Argo CD is not part of the stack
    # Keep enabled: the subchart sets DISABLE_SCHEMA_UPDATE=true on the proxy
    # container when this is on, so the running proxy never races the DB on a
    enabled: true
  # Schema migration as an initContainer on the proxy pod (NOT a Helm/Argo hook).
  extraInitContainers:
    - name: db-migrate
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      imagePullPolicy: "{{ .Values.image.pullPolicy }}"
      command: ["python", "litellm/proxy/prisma_migration.py"]
      workingDir: "/app"
      env:
        - name: DATABASE_USERNAME
          valueFrom:
            secretKeyRef: { name: postgres-litellm-credentials, key: username }
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef: { name: postgres-litellm-credentials, key: password }
        - name: DATABASE_HOST
          value: pg-rw
        - name: DATABASE_NAME
          value: litellm
        # $(VAR) refers to the env vars defined above (k8s dependent-env expansion).
        - name: DATABASE_URL
          value: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST)/$(DATABASE_NAME)
        # Force the migration to run here even though the proxy container has it
        # disabled (schema ownership lives in this initContainer).
        - name: DISABLE_SCHEMA_UPDATE
          value: "false"
      resources:
        # Prisma client-generate + `migrate deploy` spikes RAM; 1Gi OOMKills
        # (exit 137) on a cold DB.
        requests: { cpu: 100m, memory: 512Mi }
        limits: { cpu: "1", memory: 2Gi }
  # Master key + Langfuse env come from our local Secret.
  masterkeySecretName: litellm-credentials
  masterkeySecretKey: masterkey
  environmentSecrets:
    - litellm-credentials
  # SERVER_ROOT_PATH lets LiteLLM serve its UI + emit redirects under a path
  # prefix.
  envVars:
    SERVER_ROOT_PATH: "/tools/litellm"
    # DURABLE admin-registered models.
    STORE_MODEL_IN_DB: "true"
  resources:
    # This proxy was OOMKilled during the all-at-once boot.
    requests: { cpu: 100m, memory: 1Gi }
    limits: { cpu: "1", memory: 2Gi }
  proxy_config:
    model_list:
      # --- Standard / worker tier (STACKIT gpt-oss-20b, pay-per-token)
      - model_name: sovereign-default
        litellm_params:
          model: openai/gpt-oss-20b
          api_base: os.environ/STACKIT_API_BASE
          api_key: os.environ/STACKIT_API_KEY
      - model_name: sovereign-mock            # back-compat alias -> worker tier
        litellm_params:
          model: openai/gpt-oss-20b
          api_base: os.environ/STACKIT_API_BASE
          api_key: os.environ/STACKIT_API_KEY
      # --- Reasoning tier (STACKIT Qwen3-VL-235B, pay-per-token)
      - model_name: sovereign-reasoning
        litellm_params:
          model: openai/Qwen/Qwen3-VL-235B-A22B-Instruct-FP8   # == stackitPremium.chatModelId
          api_base: os.environ/STACKIT_API_BASE
          api_key: os.environ/STACKIT_API_KEY
          timeout: 300                        # generous: reasoning generations are long
      # --- Offline embeddings (mock-model, deterministic 384-dim) -------------
      - model_name: sovereign-embed
        litellm_params:
          model: openai/mock-embed
          api_base: http://mock-model:8080/v1
          api_key: "sk-mock-unused"
      # NOTE: this list is the shipped SEED only — the four aliases the OS actually
      # uses (sovereign-default/-mock/-reasoning/-embed).
    router_settings:
      routing_strategy: simple-shuffle        # load-balance across healthy deployments
      num_retries: 3                          # retry transient failures before failover
      timeout: 120                            # per-request timeout (s)
      allowed_fails: 3                        # circuit-breaking: trip after N fails...
      cooldown_time: 60                       # ...then cool the deployment down (s)
      # No static fallbacks: the pruned model_list is the four seed aliases, none of
      # which is a duplicate reasoning route to fail over to.
    litellm_settings:
      success_callback: ["langfuse"]          # gateway-level tracing to Langfuse
      drop_params: true
    general_settings:
      master_key: os.environ/PROXY_MASTER_KEY
      # Persist admin-registered models (via /model/new)
      store_model_in_db: true
    # MCP gateway — register tool servers; agents call them via LiteLLM
    mcp_servers:
      sovereign_query:
        url: "http://query-tool:8000/mcp"
        transport: "http"
        description: "Governed SQL over the lakehouse marts via central Trino (row/column governed)"

# OpenSearch — retrieval backbone (vector + lexical). Single node for local.
opensearch:
  enabled: true
  # When enabled:false (Mode B), the bundled OpenSearch subchart is NOT deployed and
  # consumers resolve their endpoint via soa.opensearchUrl
  external:
    protocol: https            # managed endpoints terminate TLS
    host: ""                   # managed OpenSearch host
    port: "9200"
  clusterName: opensearch
  masterService: opensearch
  singleNode: true
  replicas: 1
  protocol: http                          # security plugin disabled -> plain HTTP
  opensearchJavaOpts: "-Xmx512M -Xms512M"
  securityConfig:
    enabled: false
  persistence:
    enabled: false                        # ephemeral local stand-in
  sysctlInit:
    enabled: true                         # set vm.max_map_count=262144
  extraEnvs:
    - name: DISABLE_INSTALL_DEMO_CONFIG
      value: "true"
    - name: DISABLE_SECURITY_PLUGIN
      value: "true"
  priorityClassName: sovereign-os-infra   # priorityClasses.infra.name
  resources:
    # Heap is -Xmx512M; request covers heap + Lucene off-heap/page cache.
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: "2", memory: 1536Mi }

# OpenSearch filesystem snapshot repository.
opensearchSnapshots:
  enabled: false                          # off for local/kind; on for STACKIT
  repositoryName: sovereign-fs            # name used by the register Job + UI
  mountPath: /usr/share/opensearch/snapshots
  pvc:
    size: 20Gi
    accessMode: ReadWriteOnce
    # storageClass falls back to global.storageClass (same as all other PVCs)
  # Post-install/post-upgrade Job that registers the fs snapshot repo.
  registerJob:
    image:
      repository: curlimages/curl
      tag: "8.8.0"
    resources:
      requests: { cpu: 50m, memory: 32Mi }
      limits: { cpu: 200m, memory: 64Mi }
  # Optional nightly CronJob that snapshots all indices.
  cronJob:
    enabled: true
    schedule: "0 3 * * *"              # 03:00 UTC, after pg-dump (02:30)
    resources:
      requests: { cpu: 50m, memory: 32Mi }
      limits: { cpu: 200m, memory: 64Mi }

# Shared retrieval settings (knowledge index name + k-NN dimension).
retrieval:
  indexName: knowledge
  knnDimension: 384

# MCP test agent — proves the OS's own real, governed MCP registry (/api/mcp)
# Agent runtime — the live-execution backend for the Agents tab (Phase 4).
agentRuntime:
  enabled: true
  image:
    repository: sovereign-os/agent-runtime   # built locally, loaded into kind
    tag: "0.1.2"   # 0.1.2 = capture LiteLLM token usage per run (Monitoring truth)
  chatModel: sovereign-mock
  # Two-tier model strategy (stack-decisions): EVERY agent PLANS with the reasoning
  # tier, then HANDS OFF execution to the execution tier.
  reasoningModel: sovereign-reasoning   # PLAN phase of every agent
  executionModel: sovereign-default     # EXECUTE phase of every agent
  # Shared runtime <-> OS UI token.
  token: "agent-runtime-local-dev-token"
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }
  # CronJob-per-schedule entries (empty by default -> no CronJob renders).
  schedules: []

# =============================================================================
# Layer 2 (Context / Foundations)

# OPA — policy-as-code at the MCP/tool boundary. Default-deny tool authorization.
opa:
  enabled: true
  image:
    repository: openpolicyagent/opa
    tag: "1.4.2-static"
    digest: sha256:3c995dc8a59f6ddfd92eb7404d2f7ff9fe71cd025d9251199957a8a6afbfd76e
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }
  grants:
    sovereign-agents:           # the default agent key — no internet
      - rag_search
      - llm_generate
      - query                    # governed Trino lakehouse query MCP tool
    sovereign-agents-web:        # explicitly granted the governed web tool
      - rag_search
      - llm_generate
      - query
      - web_fetch
    # DOMAIN principals — the governed data tools authorize as `user.domains[0]`
    # (the domain), so a domain must be granted the read tools its members + agents
    agentic-leader-q3-2026:     # the live Q3-2026 cohort domain (36 students)
      - query                    # governed Trino lakehouse read (query_data)
      - metrics                  # governed metrics (query_metric)
      - retrieve                 # governed RAG over domain knowledge (search_knowledge)
    test:                       # the internal test/admin domain
      - query
      - metrics
      - retrieve
    conn-notion-workspace:      # MCP connection — reads on, create held for approval
      - notion_search
      - notion_get_page
      - notion_create_page       # Write-approval (see requiresApproval); delete is Blocked (absent)
    conn-salesforce-sales-org:  # API connection — reads scoped to Sales, bounded write
      - read_account
      - read_opportunity
      - update_opportunity_amount # Write-bounded (≤ €X enforced in policy); delete/mass_update absent
  # High-stakes tools held for human approval even when granted (golden path §7):
  requiresApproval:
    - connection_crm_write
    - knowledge_certify
    - notion_create_page         # Connections slice: Write-approval (Notion create page)
  # Trino data governance (read by package `trino` -> data.governance).
  governance:
    # Tables are keyed by the REAL schema the data lives in: `iceberg.sales.*`
    # (marts.schema / dbt profiles / queryTool.trino.schema are all `sales`).
    tables:
      # The LIVE Northpeak gold mart (written by northpeak-marts-init)
      iceberg.sales.gold_northpeak_commerce:
        domain: sales
        # SHARED with the Q3-2026 cohort: the Northpeak campaign is THEIR case-study
        # dataset, so their domain principal must pass the row filter (else a granted
        visibility: shared
        shared_with: ["agentic-leader-q3-2026"]
        sensitive_columns: {}
      # The Sales mart (dbt-trino Iceberg) — row filter by domain.
      iceberg.sales.daily_revenue:
        domain: sales
        visibility: domain          # domain-scoped: non-members get a `false` row filter
        shared_with: []
        sensitive_columns: {}
      # The Sales staging table — column mask by sensitivity (customer = PII).
      iceberg.sales.stg_orders:
        domain: sales
        visibility: domain
        shared_with: []
        sensitive_columns:
          customer: pii              # masked unless the principal holds the `pii` clearance
    principals:
      sales-agent:                  # owning domain — sees rows + PII
        domains: [sales]
        clearances: [pii]
      marketing-agent:              # cross-domain — rows masked, PII masked
        domains: [marketing]
        clearances: []
      # Sales-lane SERVICE principals.
      dbt-sales:                    # dbt-trino builds (dbt.trino.user)
        domains: [sales]
        clearances: []
      northpeak-marts:              # gold-mart seed Job (marts.trino.user)
        domains: [sales]
        clearances: []
      # DOMAIN principals — the governed query tools run AS `user.domains[0]` (the
      # DOMAIN name is the Trino session user), so each domain MUST map to itself here
      sales:                        # the Sales worked-example domain
        domains: [sales]
        clearances: [pii]
      agentic-leader-q3-2026:       # the live Q3-2026 cohort domain
        domains: [agentic-leader-q3-2026]
        clearances: []
      test:                         # the internal test/admin domain
        domains: [test]
        clearances: [pii]

# Docling — document parsing (docling-serve).
docling:
  enabled: true
  image:
    repository: quay.io/docling-project/docling-serve-cpu
    tag: "latest"
    digest: sha256:7b7448d333e0e444adcc3818c65f87bc3e5861bea4f72100e4ac49048d73eae3
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }

# Dagster — data orchestrator (subchart).
dagster:
  enabled: true
  postgresPasswordLocal: dagster-local-dev    # must match postgres.extraDatabases dagster
  # External Postgres (our CNPG), password from the Secret above.
  generatePostgresqlPasswordSecret: false
  global:
    postgresqlSecretName: dagster-postgresql
  postgresql:
    enabled: false
    postgresqlHost: pg-rw
    postgresqlUsername: dagster
    postgresqlDatabase: dagster
  # Official dagster/* images are amd64-only; we use an arm64-native image we
  # build (sovereign-os/dagster)
  dagster-user-deployments:
    enabled: true
    deployments:
      - name: example-user-code
        image:
          repository: sovereign-os/dagster
          tag: "0.2.0"
          pullPolicy: IfNotPresent
        dagsterApiGrpcArgs:
          - "--python-file"
          - "/opt/dagster/app/repo.py"
        port: 3030
        # Central Trino connection for dbt-trino runs (env propagates to launched
        # run pods via includeConfigInLaunchedRuns).
        env:
          - { name: TRINO_HOST, value: trino }
          - { name: TRINO_PORT, value: "8080" }
          - { name: TRINO_USER, value: dbt-sales }
          - { name: TRINO_CATALOG, value: iceberg }
          - { name: TRINO_SCHEMA, value: analytics }
        resources:
          requests: { cpu: 50m, memory: 384Mi }
          limits: { cpu: "1", memory: 1Gi }   # headroom for dbt materializations
        # ── dbt.projectSource: git — Dagster user-code from the repo (epic #146 Ph 4)
  dagsterWebserver:
    image:
      repository: sovereign-os/dagster
      tag: "0.2.0"
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  dagsterDaemon:
    image:
      repository: sovereign-os/dagster
      tag: "0.2.0"
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }

# dbt (dbt-trino) — the SINGLE governed transform path.
dbt:
  enabled: true
  image:
    repository: sovereign-os/dbt     # built locally, loaded into kind
    tag: "0.2.0"                      # 0.2.0 = dbt-trino adapter
  # Central Trino connection.
  trino:
    host: trino
    port: 8080
    user: dbt-sales
    catalog: iceberg
    # The domain schema the marts land in.
    schema: sales

# dagster-analytics — dedicated Trino/OPA warehouse principal for Dagster runs
# (epic #146 Phase 4).
dagsterAnalytics:
  warehousePrincipal:
    enabled: false
    # The principal name (Trino session user) + the domains it is entitled to.
    name: dagster-analytics
    domains: [sales]
    clearances: []

# Northpeak gold-mart materialization (templates/extensions/lakehouse/northpeak-marts-init.yaml).
marts:
  enabled: true
  # Node 22 (global fetch) drives the Trino REST protocol — same base as os-ui/seed.
  image:
    repository: node
    tag: "22.13.1-alpine3.21"
  trino:
    host: trino
    port: 8080
    user: northpeak-marts
    catalog: iceberg
  schema: sales
  table: gold_northpeak_commerce
  rows: 150000          # session rows; ~conversion of these become paid orders
  conversion: 0.032     # session→order conversion (avg(converted))
  churnRate: 0.18       # fraction of customers with no order in 90 days
  force: false          # true → DROP + rebuild even if the table already has rows
  backoffLimit: 6

# =============================================================================
# Secure-by-default egress baseline (security.md)

# Egress proxy (tinyproxy) — the single outbound chokepoint. Allowlist-only.
egressProxy:
  enabled: true
  image:
    repository: sovereign-os/egress-proxy    # built locally, loaded into kind
    tag: "0.1.0"
  # Approved external domains (matched against host; subdomains included).
  allowlist:
    - example.com
    - github.com
    - salesforce.com           # Connections slice — Salesforce API endpoints
    - my.salesforce.com
    - login.salesforce.com
    - api.kajabi.com           # Kajabi public API (token + data — one host)
    - notion.com               # Connections slice — Notion MCP endpoints
    - mcp.notion.com
    - api.notion.com
    # Personal connected-drive OAuth (Connections tab) — mirrors lib/secrets.ts.
    - googleapis.com           # Google Drive (www.googleapis.com) + token (oauth2.googleapis.com)
    - accounts.google.com      # Google OAuth consent/authorize
    - graph.microsoft.com      # OneDrive via Microsoft Graph
    - login.microsoftonline.com # Microsoft OAuth authorize + token
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 96Mi }

# Governed web_fetch tool — OPA-authorized, proxy-routed, sanitized.
webFetch:
  enabled: true
  image:
    repository: sovereign-os/web-fetch     # built locally, loaded into kind
    tag: "0.1.0"
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }

# Software live-app runner (Software tab).
softwareRunner:
  enabled: false
  namespace: agentic-apps
  appsDomain: "apps.local"
  # Teaching default served when a built app has no image of its own.
  runnerImage: "traefik/whoami:latest"
  ingressClass: ""        # falls back to ingress.className
  tlsIssuer: ""           # falls back to ingress.tlsIssuer
  # SECURITY (C2): isolate student apps from the platform.
  podSecurityStandard: baseline
  networkPolicy:
    enabled: true
    ingressNamespace: ingress-nginx

# Software DIRECT BUILD SERVICE (deploy redesign Phase B).
# Connections golden path — manually-credentialed Connections (API/MCP/Database/
# SaaS) a Builder/Admin creates.
connections:
  enabled: true
  # Optional scheduled catalog-refresh sweep (lakehouse Expose).
  catalogRefresh:
    enabled: false
    schedule: "23 * * * *"        # hourly, offset from the other sweeps
    osUiUrl: "http://os-ui:3000"
    tokenSecret: "os-ui"
    tokenSecretKey: "agent-runtime-token"
  externalSecrets:
    enabled: false             # turn on once the External Secrets Operator + a
                               # STACKIT Secrets Manager SecretStore are installed
    secretStoreRef:
      name: stackit-secrets-manager
      kind: ClusterSecretStore
    # The slice's two worked-example connections.
    items:
      - name: connection-notion-workspace
        remoteKey: connection-notion-workspace
        property: mcp-token
      - name: connection-salesforce-sales-org
        remoteKey: connection-salesforce-sales-org
        property: oauth-token

# =============================================================================
# Layer 3 (Self-service)

# Polaris — Iceberg REST catalog.
polaris:
  enabled: true
  image:
    repository: apache/polaris
    # 1.1.0-incubating: adds AwsStorageConfigInfo endpoint/endpointInternal/
    # stsEndpoint/pathStyleAccess so Polaris's OWN server-side write/commit FileIO
    tag: "1.1.0-incubating"
    digest: sha256:27d081a539aa021df00f18ff1ae0a59d9b9e7a1db2a44b643ba29c61eaa9cdf9
  # Admin/bootstrap tool image (same Polaris release).
  adminImage:
    repository: apache/polaris-admin-tool
    tag: "1.1.0-incubating"
    digest: sha256:7cdd9216c2e55a45ad0e725f47949c7632e6eadcf1e18bbcaeee19ea65f2c94e
  # Image for the catalog-registration Job (templates/extensions/lakehouse/polaris-bootstrap.yaml):
  bootstrapImage:
    repository: curlimages/curl
    tag: "8.11.1"
    digest: ""                    # optional pin; tag-only is fine
  persistenceType: in-memory      # local; relational-jdbc (durable) for STACKIT
  # Durable metastore (persistenceType: relational-jdbc).
  jdbc:
    database: polaris
    secretName: postgres-polaris-credentials
  realm: default-realm
  secretName: polaris-credentials  # local: chart-created; STACKIT: external
  s3:
    endpoint: http://minio:9000
    region: us-east-1
  catalog:
    name: lakehouse
    baseLocation: s3://lakehouse/wh
  local:
    rootClientId: root
    rootClientSecret: polaris-local-dev-secret
  # Quarkus/JVM catalog — request reflects steady JVM footprint (heap + metaspace).
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "2", memory: 1Gi }

# Governed `query` MCP tool — read-only SQL THROUGH central Trino over the Iceberg
# marts.
queryTool:
  enabled: true
  image:
    repository: sovereign-os/query-tool     # built locally, loaded into kind
    tag: "0.6.2"                             # 0.6.2 = ADDS the promote-as-view allowlist
                                             #         (CREATE OR REPLACE VIEW / DROP VIEW for
                                             #         builder+ into an entitled domain schema)
  trino:
    host: trino
    port: 8080
    user: query-agent
    catalog: iceberg
    # Default session schema for unqualified queries.
    schema: sales
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

# data-runner — the REAL ingest service.
dataRunner:
  enabled: true
  image:
    repository: sovereign-os/data-runner     # built locally, loaded into kind
    tag: "0.2.1"   # 0.2.1 = service-bearer auth (/ingest + /ingest-rows require
                   #         Authorization: Bearer when SERVICE_BEARER_TOKEN set;
                   #         /health open; fail-open when unset — netpol primary).
  polaris:
    # Same Polaris REST catalog + warehouse Trino reads/writes.
    uri: "http://polaris:8181/api/catalog"
    warehouse: lakehouse
    oauthScope: "PRINCIPAL_ROLE:ALL"
    # Reuse the SAME Polaris OAuth client Trino writes Iceberg with (key
    # POLARIS_OAUTH_CREDENTIAL = "clientId:clientSecret").
    oauthSecretName: trino-catalog-credentials
  s3:
    # Static object-storage creds come from objectStorage.secretName (no STS on MinIO
    # -> Polaris vends none; the client writes the Iceberg data files, like Trino).
    region: us-east-1
    pathStyleAccess: true
  # MinIO bucket holding both the uploads/ prefix and the wh/ warehouse root.
  uploadsBucket: lakehouse
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

# service-bearer — shared token for the in-cluster DATA-PLANE calls
# (os-ui -> query-tool + os-ui -> data-runner).
serviceBearer:
  enabled: false
  token: ""

# NOTE (2026-06-29): The personal-query sandbox engine was removed.

# Trino — the CENTRAL GOVERNED query engine for all shared marts (decided
# 2026-06-29).
trino:
  enabled: true
  image:
    repository: trinodb/trino
    tag: "476"
    pullPolicy: IfNotPresent
  # node.environment label (Trino requires it; lowercase alnum).
  environment: sovereign
  jvm:
    # Heap for the single coordinator-as-worker.
    maxHeap: "6G"
  query:
    # Cluster-wide + per-node memory ceilings; spill to disk keeps big joins alive.
    maxMemory: "4GB"
    maxMemoryPerNode: "2GB"
    spillEnabled: true
  catalog:
    # Iceberg connector against the Polaris REST catalog (OAuth2).
    iceberg:
      restUri: "http://polaris:8181/api/catalog"
      warehouse: lakehouse
      oauth2Scope: "PRINCIPAL_ROLE:ALL"
      # Local: static S3 creds (Polaris S3 credential vending needs AWS STS, absent
      # in the MinIO stand-in).
      vendedCredentials: false
      # local: clientId:clientSecret derived from polaris.local; external: from a
      # Secret named here with key POLARIS_OAUTH_CREDENTIAL (External Secrets).
      oauth2SecretName: ""
  s3:
    region: us-east-1
    pathStyleAccess: true
  # External-warehouse FEDERATED catalogs (opt-in; default EMPTY so nothing changes).
  externalCatalogs: []
  # PER-CLOUD MANAGED catalog (opt-in; DEFAULT off → provider empty, nothing renders,
  # so STACKIT/local are unchanged and Apache Polaris stays the sole/default catalog).
  cloudCatalog:
    provider: ""
  # Optional ServiceAccount for the Trino pod — the IRSA (AWS)
  serviceAccount:
    create: false
    name: trino
    annotations: {}
  # OPA governance + resource groups are layered in their own phases (the chart
  # renders access-control.properties + resource-groups.properties from these).
  opa:
    enabled: true
    uri: "http://opa:8181"          # same OPA instance that governs agent tools
  # Per-domain resource groups (static JSON file manager).
  resourceGroups:
    enabled: true
    rootSoftMemoryLimit: "80%"
    rootHardConcurrency: 100
    rootMaxQueued: 1000
    # Per-domain cap — low enough that a burst of heavy queries from one domain
    # QUEUES rather than starving the cluster (the "resource group caps a heavy
    perDomainSoftMemoryLimit: "30%"
    perDomainHardConcurrency: 3
    perDomainMaxQueued: 20
    domains:
      - sales
      - marketing
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { cpu: "4", memory: 8Gi }

# Metrics — the alert-evaluator CronJob that drives the builder+ alert-run route
# (os-ui app/api/metrics/alerts/run) on a schedule.
metrics:
  alerts:
    cron:
      enabled: false            # operator turns it on
      schedule: "*/5 * * * *"   # every 5 minutes
      # Secret holding the builder+ service principal's credentials (keys:
      # username, password). Provision it before enabling.
      principalSecret: metrics-alert-principal
      # os-ui service DNS (in-cluster). Override only for non-default topologies.
      osUiUrl: "http://os-ui:3000"

# Data — the Data tab's scheduled surfaces.
data:
  quality:
    cron:
      enabled: false             # operator turns it on
      schedule: "*/15 * * * *"   # every 15 minutes
      # Secret holding the builder+ service principal's credentials (keys:
      # username, password). Provision it before enabling.
      principalSecret: dq-run-principal
      # os-ui service DNS (in-cluster). Override only for non-default topologies.
      osUiUrl: "http://os-ui:3000"

# Data sync — the SCHEDULED INCREMENTAL SYNC fallback sweep (Data tab).
dataSync:
  sweep:
    enabled: false               # operator turns it on
    schedule: "*/15 * * * *"     # every 15 minutes
    # The due-window the sweep passes to the route; keep >= the schedule cadence
    # so no cron slot can fall between two sweeps.
    windowMinutes: 15
    # os-ui service DNS (in-cluster). Override only for non-default topologies.
    osUiUrl: "http://os-ui:3000"
    # Secret + key holding the shared agent-runtime bearer (the same one the
    # os-ui Deployment mounts as AGENT_RUNTIME_TOKEN).
    tokenSecret: os-ui
    tokenSecretKey: agent-runtime-token

# Admin Console — REMOVED.

# OS UI — the Next.js front door. App shell + live surfaces:
osUI:
  enabled: true
  # Operational + external connector adoption (Connections tab and its MCP tools).
  # The template reads EXTERNAL_CONNECTORS_ENABLED; keep the key here so an
  # operator's `true` is not silently lost when values are re-derived.
  externalConnectorsEnabled: false
  # Local (kind): scripts/os sets nodePort=30080 so the UI is http://localhost:8080.
  service:
    nodePort: null
  # Gate os-ui startup on OpenSearch (the durable user-directory mirror).
  waitForOpenSearch: true
  # In-memory user seeding while the mirror is unreachable is a no-cluster DEV
  # convenience only. Production fails closed (503)
  allowOfflineUserSeed: false
  image:
    repository: sovereign-os/os-ui    # built locally, loaded into kind
    tag: "0.1.0"
  # Model pricing for Monitoring cost facts — EUR per 1M tokens per LiteLLM
  # model_name.
  modelPricesJson: '{"sovereign-default":{"inputPerM":0.15,"outputPerM":0.25},"sovereign-mock":{"inputPerM":0.15,"outputPerM":0.25},"sovereign-reasoning":{"inputPerM":1.5,"outputPerM":1.75}}'
  # OS_ENABLED_TABS env var. Comma-separated tab keys (replaces the base tier). Empty = base tier, "*" = all tabs.
  enabledTabs: ""
  # In-cluster backend Service URLs (base URLs; the app appends the paths).
  queryToolUrl:   "http://query-tool:8000"
  # data-runner (Data-tab REAL ingest).
  dataRunnerUrl:  "http://data-runner:8000"
  # Object-storage bucket holding the uploads/ prefix (same warehouse bucket as the
  # lakehouse).
  uploadsBucket:  "lakehouse"
  langfuseUrl:    "http://agentic-os-langfuse-web:3000"
  opensearchUrl:  "http://opensearch:9200"
  knowledgeIndex: "knowledge"
  # Files tab (unstructured context products).
  filesIndex:      "files"
  filesEmbedModel: "sovereign-embed"
  # Ingest-by-type services (Phase 3).
  doclingUrl:    ""
  transcribeUrl: ""
  ocrUrl:        ""
  litellmUrl:     "http://agentic-os-litellm:4000"
  opaUrl:         "http://opa:8181"
  dagsterUrl:     "http://agentic-os-dagster-webserver:80"
  # Browser-reachable consoles (linked/opened from the browser, never proxied;
  # each tool keeps its own auth).
  langfuseConsoleUrl: "http://localhost:3000"
  dagsterConsoleUrl:  "http://localhost:3070"  # internal on ingress (no public host)
  # Secret-backed credentials — reuse the stack's existing Secrets so nothing
  # sensitive sits in plaintext (names/keys verified against the running cluster).
  langfuseSecret:
    name: langfuse-init
    key: LANGFUSE_INIT_PROJECT_SECRET_KEY
  litellmSecret:
    name: litellm-credentials     # keys incl. masterkey
    key: masterkey
  # Auth session-signing secret (HMAC-SHA256 for the login cookie). Leave EMPTY:
  sessionSecret: ""
  # Optional operator pre-seed of REAL users as a JSON array, e.g.
  usersSeed: ""
  # ---- Outbound email (OPTIONAL).
  graph:
    enabled: false
    tenantId: ""      # Entra tenant (directory) id
    clientId: ""      # Entra app (client) id
    # Client secret.
    clientSecret: ""
    mailFrom: "support@datamasterclass.com"   # sending mailbox / From address
  # Transport 2 — generic SMTP relay (fallback when not on M365).
  smtp:
    enabled: false
    host: ""          # e.g. smtp.eu.mailgun.org — presence enables real sends
    port: 587         # 587 STARTTLS (default) or 465 implicit TLS
    secure: false     # true → implicit TLS (port 465)
    user: ""          # AUTH LOGIN username (optional → unauthenticated relay)
    # AUTH LOGIN password.
    password: ""
    from: "support@datamasterclass.com"
  # Set "false" to disable email verification even when a mailer IS configured.
  # Empty/unset = verification ON whenever a mailer (Graph or SMTP) is configured.
  emailVerification: ""
  # Absolute external base URL used in emailed verification links
  # (e.g. https://os.example.com).
  publicUrl: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    # 1Gi headroom for Files-tab uploads: the upload route buffers the whole file
    # in memory (~2× the byte size at peak), so a 200 MB upload can spike ~500 MB.
    limits:   { cpu: 500m, memory: 1Gi }

# Components are added to this file as each is wired into the chart
# (thinnest runnable slice first).
