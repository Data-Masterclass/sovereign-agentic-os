
# PriorityClasses — protect the data layer under memory pressure.
# WP-47 ladder (00 §10.1 decision 2), highest first. Under node pressure the kubelet evicts lower
# first, and the scheduler preempts lower to place higher:
#   critical (Postgres, OPA, os-ui; Keycloak when it lands) > infra (data backends) > app (the rest)
#   > 0 (pods of subcharts with no priorityClassName value upstream: Langfuse, LiteLLM, Dagster)
#   > observability (the Victoria stack) > userApps (Software-tab apps; never preempts).
# `value` is immutable on a live PriorityClass: change a value by adding a class with a new name.
priorityClasses:
  enabled: true
  critical:
    name: sovereign-os-critical
    value: 1000000
  infra:
    name: sovereign-os-infra
    value: 100000
  app:
    name: sovereign-os-app
    value: 1000
  observability:
    name: sovereign-os-observability
    value: -10
  userApps:
    name: sovereign-os-user-apps
    value: -100

global:
  # Logical namespace the workloads live in (created via --create-namespace).
  namespace: agentic-os
  # Profile: "local" (kind) or "stackit". Templates may branch on this.
  profile: local
  # Throwaway test renders only: lets a non-laptop render (ingress on, or another profile) keep
  # the chart's published default secrets (templates/base/secret-defaults-guard.yaml). Never set
  # it for a real install.
  allowChartDefaultSecrets: false
  # Empty => use the cluster's default StorageClass (kind: "standard").
  storageClass: ""
  imagePullPolicy: IfNotPresent
  # Registry pull secret(s) for the bespoke images.
  imagePullSecrets: []
  # Secure-by-default pod hardening applied to bespoke workloads.
  podSecurity:
    runAsNonRoot: true
    seccompProfile: RuntimeDefault

# Secure-by-default network baseline (security.md).
networkPolicies:
  defaultDeny: true
  # Ingress allowlists for the Dagster webserver and code-location gRPC server: only the OS
  # components that use them may connect (templates/base/network/dagster-ingress-policies.yaml).
  # Rendered only when dagster.enabled. The ingress controller is NEVER admitted to a Dagster
  # webserver: Dagster has no login, so its only door is the OS (<OS>/tools/dagster, admin-only);
  # `ingress.hosts.dagster` is a pure redirect there. `ingressNamespace` is still read by the
  # LiteLLM policy (litellm-ingress-policy.yaml).
  dagster:
    enabled: true
    ingressNamespace: ingress-nginx
  # OpenSearch: restrict ingress to the OS components that use it (defence in depth).
  # templates/base/network/opensearch-ingress-policy.yaml; rendered only with opensearch.enabled.
  # Lives here, not under `opensearch:`, which is the upstream subchart's own value tree.
  opensearchIngress: true
  # LiteLLM: restrict ingress to the OS components that use it (defence in depth).
  # templates/base/network/litellm-ingress-policy.yaml; rendered only with litellm.enabled.
  # Lives here, not under `litellm:`, which is the upstream subchart's own value tree.
  litellmIngress: true
  # Default-deny INGRESS for every pod in the release namespace, plus one allowlist per platform
  # service naming exactly its callers (templates/base/network/platform-ingress-policies.yaml).
  # os-ui :3000 admits this namespace and the ingress controller only (os-repos.yaml).
  platformIngress:
    enabled: true
    ingressNamespace: ingress-nginx
  # The Kubernetes API server's endpoint addresses (CIDRs) for `allow-apiserver-egress`. Empty =
  # discovered from the `kubernetes` EndpointSlice at install/upgrade (`lookup`); set it for
  # GitOps renderers, where `lookup` is empty and the rule would otherwise stay un-narrowed.
  apiserver:
    cidrs: []
    # Addresses ADDED to the rule above: the address the pods' KUBERNETES_SERVICE_HOST resolves to
    # when the platform injects a domain there. Gardener (STACKIT SKE) does, through the
    # gardener-resource-manager webhook `kubernetes-service-host.resources.gardener.cloud`, so the
    # Dagster run launcher and other in-cluster clients connect to that address, not the endpoint.
    # scripts/deploy.sh fills it per cluster from the running pods (scripts/lib/apiserver-cidrs.py);
    # set it yourself for GitOps.
    extraCidrs: []
  # Workloads that still reach public HTTPS directly (their clients do not use the egress
  # proxy yet): os-ui and its worker (connector APIs and OAuth from Node fetch) and the Dagster
  # code location and run pods (dlt sources). Everything else goes through the egress proxy.
  directHttpsEgress:
    workloads:
      - { name: os-ui, matchLabels: { app.kubernetes.io/component: os-ui } }
      - { name: os-ui-worker, matchLabels: { app.kubernetes.io/component: os-ui-worker } }
      - { name: dagster-user-code, matchLabels: { component: user-deployments } }

# Dagster run-pod shape, enforced by the API server (templates/extensions/dagster/run-pod-admission.yaml):
# Pods and Jobs written by the Dagster ServiceAccounts must look like a run pod (run labels only,
# pinned images, the run ServiceAccount, no host access, not privileged). Empty lists = the
# subchart's names for this release.
dagsterPodAdmission:
  enabled: true
  launcherServiceAccounts: []
  runServiceAccounts: []
  extraImages: []

# Backups (templates/extensions/backup/).
backup:
  pgDump:
    enabled: false
    schedule: "30 2 * * *"     # nightly, 02:30 UTC
    retentionDays: 14
    bucket: lakehouse          # existing bucket (objectStorage.buckets)
    prefix: backups/pg
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 256Mi }
  # WP-56 — git bundles after every commit, to an object-locked bucket (docs/backups.md
  # "Git bundles and restore drills"). OFF by default; the OWNER creates the bucket (Object Lock
  # on) and the Secret first. Runs as the `git-backup` sidecar on the os-ui pod.
  gitBundles:
    enabled: false
    image:
      # Our own image (images/base/backup-tools): git + aws-cli + jq. Built by build-images.yml.
      repository: ghcr.io/data-masterclass/sovereign-os/backup-tools
      tag: "1.0.0"
      digest: ""
    endpoint: https://object.storage.eu01.onstackit.cloud
    endpointHost: object.storage.eu01.onstackit.cloud   # joins the egress-proxy allowlist
    region: eu01
    bucket: ""                    # required when enabled (Object Lock + versioning, owner-created)
    # Secret with AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for the bucket (owner-created).
    secretName: git-backup-s3
    prefix: git-bundles
    refsPrefix: git-refs          # hourly hash-chained ref-heads records (tamper evidence)
    pollSeconds: 5                # queue check (markers dropped by os-ui after each commit/push)
    rescanSeconds: 600            # full pass: bundles every repo whose refs moved (lost markers)
    refsRecordSeconds: 3600
    # Bundle staging space. A repo larger than tmpBudgetMi is refused (red in Monitoring), never
    # staged: the emptyDir's sizeLimit must stay ABOVE the budget, or the os-ui pod is evicted.
    tmpBudgetMi: 768
    tmpSizeLimit: 1Gi
    # Optional explicit per-object retention. Empty = the bucket's DEFAULT retention applies
    # (recommended). Mode COMPLIANCE or GOVERNANCE.
    objectLock: { mode: "", days: 0 }
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 500m, memory: 256Mi }
  # WP-56 — weekly restore drill: git (bundles), Postgres (latest pg-dump) and OpenSearch (latest
  # snapshot). OFF by default. Results: the `restore-drill-status` ConfigMap (Monitoring), the
  # bucket (drills/weekly/), one JSON log line; a failed drill fails the Job.
  drill:
    enabled: false
    schedule: "0 4 * * 0"         # Sundays 04:00 UTC, after the 02:30 dump and the 03:00 snapshot
    statusConfigMap: restore-drill-status
    git: { enabled: true }
    postgres: { enabled: true }
    opensearch:
      enabled: true
      repository: stackit-s3      # the WP-21 S3 repository (opensearchSnapshots.s3.repositoryName)
      indices: "files*,knowledge*,os-*"
      maxDriftPct: 10             # restored vs live _count; the snapshot is hours older than live
    lagRetries: 3                 # git: re-read the newest bundle before calling a ref mismatch
    lagSleepSeconds: 20
    timeoutSeconds: 3600          # activeDeadlineSeconds of the drill Job
    maxAgeHours: 26               # a newer dump / snapshot than this is required (else: stale = fail)
    postgresCompare:
      maxDriftPct: 25             # restored vs live row count per table
      minDriftRows: 10
      ignoreDatabases: []         # databases legitimately empty (never the OS's own)
      criticalTables: []          # "db:schema.table" that must have rows in the restore; REQUIRED (render fails) when the postgres check runs
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: "1", memory: 1Gi }
  # WP-56 — monthly Velero restore into a scratch namespace (os-repos volume), checked with
  # git fsck, then deleted. OFF by default. Needs Velero (deploy/velero/) and the namespace below.
  veleroDrill:
    enabled: false
    schedule: "0 5 1 * *"         # 1st of the month, 05:00 UTC
    veleroNamespace: velero
    scheduleName: velero-daily-agentic-os   # the Velero Schedule whose newest backup is restored
    scratchNamespace: agentic-os-restore-drill
    timeoutSeconds: 3600
    # `restores: create` in the Velero namespace lets the holder restore ANY backup into ANY
    # namespace (Velero has no per-namespace restore permission). The drill only ever maps into
    # the scratch namespace, but the token could do more. Set true to accept that, knowingly.
    acceptRestoreCreateRisk: false
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 512Mi }

# Ingress + TLS — OFF by default (Mode A is port-forward only).
ingress:
  enabled: false
  className: nginx            # ingress controller class (Mode B: ingress-nginx)
  tlsIssuer: letsencrypt-prod # cert-manager ClusterIssuer (cert-manager.io/cluster-issuer)
  annotations:                # extra annotations merged onto every tool Ingress
    # File uploads (Files tab)
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"
    # A large upload over a normal link takes longer than nginx's default 60s
    # read/send timeout — nginx then CUTS the connection mid-body, so the app
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  # Per-tool public hostnames. Empty => that tool gets NO Ingress.
  hosts: {}
  # When the OS UI answers on two hosts (hosts.osUI + hosts.osUIApex), send the one that is NOT
  # osUI.publicUrl to its home page with a 308 (ingress-nginx's documented permanent-redirect takes
  # a URL only, so the path is not carried over), so sessions, OAuth nonce cookies and callbacks
  # always share one origin. The /git route on hosts.osUI is not redirected.
  redirectAliasToPublicUrl: false
  # RESTRICTED CONSOLES. The model gateway (LiteLLM) and Langfuse get NO public route, even
  # when `hosts.litellm` / `hosts.langfuse` are set. LiteLLM holds the provider credentials and
  # an admin API; Langfuse holds every prompt, completion and tool result of every run. Nothing
  # outside the cluster needs to call either: os-ui, the worker, the gateway and the Jobs use
  # the in-cluster Services; admins open the LiteLLM console through the OS at /tools/litellm/ui
  # (authenticated proxy), and both consoles with `kubectl port-forward`.
  # To publish one anyway you must set `expose: true` AND put a protection on the route under
  # `annotations` — an IP allowlist (nginx.ingress.kubernetes.io/whitelist-source-range), an
  # external auth (auth-url), basic auth (auth-type + auth-secret) or client certificates
  # (auth-tls-verify-client: "on"). The render FAILS without one. Do it in a private overlay:
  # `scripts/check-consoles-not-public.mjs` fails the gate if a committed profile does.
  # With the route off, the OS gets an empty console URL and hides its "open in Langfuse" links.
  restricted:
    litellm:
      expose: false
      annotations: {}
    langfuse:
      expose: false
      annotations: {}
      # The operators' browser route to the Langfuse web UI, protected the way the Dagster
      # console is: nginx basic auth from an htpasswd Secret (key `auth`, release namespace;
      # ingress-nginx answers 503 if it is missing, never an open route). Langfuse's own login
      # stays in place behind it. Needs `ingress.hosts.langfuse` and
      # `langfuse.langfuse.nextauth.url: https://<that host>` (the render fails otherwise). The
      # OS's "open in Langfuse" links then point at that host. OFF here and in the STACKIT
      # profile; values.dev.yaml turns it on. See docs/components/langfuse.md.
      operatorIngress:
        enabled: false
        basicAuthSecret: langfuse-basic-auth

# Object storage — local stand-in for STACKIT Object Storage (MinIO, S3).
objectStorage:
  enabled: true
  # Backend mode. "bundled" (default) runs MinIO in-cluster; "external" (or
  mode: bundled
  external:
    # Managed S3 endpoint used when objectStorage is external (e.g. STACKIT Object Storage).
    endpoint: ""
  # Name of the Secret holding S3 credentials.
  secretName: object-storage-credentials
  region: us-east-1            # clients just need a value
  buckets:
    - langfuse                 # Langfuse v3 blob store (events/media)
    - lakehouse                # Iceberg warehouse (Polaris / Layer 3)
    - sandbox                  # personal/sandbox lane — per-user private prefixes (Iceberg personal_<uid>.*)
    - files                    # Files tab ORIGINAL uploaded bytes (config.filesBucket=FILES_BUCKET,
                               # default "files").
  image:
    # ghcr MIRROR of Chainguard's community MinIO build (cgr.dev/chainguard/minio,
    # MinIO RELEASE.2026-09-22T19-25-18Z).
    repository: ghcr.io/aborek/sovereign-os/minio
    digest: sha256:1887982b34cc821a569fdc94c4d30ee01c2826184fe7d3a49aee37bb3bbb23a7
  awsCli:
    repository: amazon/aws-cli
    digest: sha256:e14216fb361cce909ce199616711ad103182d5937f851cda9bebf25867d7180a   # 2.31.13
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    # Raised 768Mi→1536Mi (2026-07-26 audit: live MinIO sat at 86% of 768Mi —
    # headroom for scheduled-sync slice writes; the 20Gi PVC is the real ceiling,
    limits: { cpu: "1", memory: 1536Mi }
  # Data volume.
  persistence:
    enabled: false
    size: 20Gi
  # Dev-only credentials, used ONLY when global.profile == local.
  local:
    accessKey: agentic-os-local
    secretKey: agentic-os-local-secret

# Postgres (infra tier) — CloudNativePG-managed.
postgres:
  enabled: true
  # In-cluster engine (only applies when enabled:true):
  engine: plain
  # When enabled:false (Mode B), no in-cluster Postgres is created and the PG
  external:
    host: ""                   # managed PostgreSQL host (e.g. STACKIT PostgreSQL Flex)
    # Its address range (e.g. "10.20.0.5/32"): the model gateway's egress NetworkPolicy allows 5432 to
    # this CIDR only (templates/base/litellm/egress-policy.yaml). Required with a managed Postgres.
    cidr: ""
  clusterName: pg              # creates services pg-rw / pg-ro / pg-r
  instances: 1                 # local: single instance (3 in production for HA)
  database: langfuse
  username: langfuse
  # Secret (kubernetes.io/basic-auth) for the app owner.
  secretName: postgres-langfuse-credentials
  storageSize: 2Gi
  # Image for engine:cnpg — CloudNativePG's PostgreSQL build (operator needs a tag
  # for upgrade detection; tag@digest pins the exact image too).
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    tag: "17.5"
    digest: sha256:b1deeed2aa998b2f381e39c5cadb9ec06127708c8bd62965743af19abf21628f
  # Image for engine:plain — the official upstream Postgres (PostgreSQL license).
  # No Kubernetes-API dependency; bootstraps DBs/users purely from env + initdb.
  plainImage:
    repository: postgres
    tag: "17"
    digest: sha256:5c855ad7b85e68e48a62f34662853f38b57c1c1d80f3a927ab58034fd6d31c5e
  resources:
    # Request bumped so concurrent boot-time schema migrations (Langfuse, LiteLLM,
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: "1", memory: 1Gi }
  # Dev-only password, used ONLY when global.profile == local. Not a production secret.
  local:
    password: langfuse-local-dev
  # Additional databases on the SAME CNPG cluster, each as a managed role +
  # Database CR. Other services (LiteLLM, Dagster, …)
  extraDatabases:
    - name: litellm           # LiteLLM admin UI + virtual keys + cost caps
      username: litellm
      secretName: postgres-litellm-credentials
      createdb: true          # Prisma's migration resolver needs a shadow DB
      localPassword: litellm-local-dev
    - name: dagster           # Dagster run/event/schedule storage
      username: dagster
      secretName: postgres-dagster-credentials
      createdb: false
      localPassword: dagster-local-dev
    - name: polaris           # Iceberg catalog metadata (CloudNativePG)
      username: polaris
      secretName: postgres-polaris-credentials
      createdb: false
      localPassword: polaris-local-dev
    - name: agent_runs        # LangGraph checkpoints of agent runs (os-ui engine; thread id = run id)
      username: agent_runs
      secretName: postgres-agent-runs-credentials
      createdb: false
      localPassword: agent-runs-local-dev
  # Governance store (WP-07): a SEPARATE database for os_governance + pg-boss, owned by a
  # NOSUPERUSER/NOCREATEROLE role, with the OS running as a distinct non-owner login. When
  # enabled, the os-governance-bootstrap hook (as the superuser) creates only the roles and the
  # database; the `os-governance-migrate` hook Job then runs the migrations as the owner (post-install,
  # post-upgrade; a failure fails the release).
  governance:
    enabled: false
    database: os_governance
    # REQUIRED when enabled: a DEDICATED Secret (keys `username`, `password`) for a superuser the
    # bootstrap hook uses to create the roles and the database. Never postgres.secretName (live,
    # that is Langfuse's own login); the template refuses it.
    adminSecretName: ""
    owner:
      username: os_governance
      secretName: postgres-os-governance-owner-credentials
      localPassword: os-governance-owner-local-dev
    runtime:
      username: os_governance_rt
      secretName: postgres-os-governance-runtime-credentials
      localPassword: os-governance-rt-local-dev
    queue:              # pg-boss's own login: owns only schema `pgboss`
      username: os_governance_queue
      secretName: postgres-os-governance-queue-credentials
      localPassword: os-governance-queue-local-dev
  # CLOUD-DURABLE CNPG extras (engine:cnpg ONLY).
  cnpg:
    # Durable zonal CSI storage class for the Postgres data volume (a zonal disk
    # can't cross-AZ-attach, so HA comes from replicas in OTHER zones, not shared
    storageClass: ""
    highAvailability:
      # Spread the 3 instances across zones (a soft topology-spread constraint)
      enabled: false
      # topology.kubernetes.io/zone spread across the node pool's AZs.
      topologyKey: topology.kubernetes.io/zone
      # PDB: keep at least this many instances available during voluntary disruption.
      minAvailable: 2
    backup:
      # WAL archiving + base backups to the overlay's object store via the Barman
      # Cloud PLUGIN (CNPG >= 1.26; the in-tree `spec.backup.barmanObjectStore`
      enabled: false
      # Barman plugin identifier (fixed by the plugin project).
      pluginName: barman-cloud.cloudnative-pg.io
      # Name of the ObjectStore CR this template creates and the Cluster references.
      objectStoreName: pg-barman-store
      # Bucket URL for WAL/base backups.
      destinationPath: ""
      # S3-compatible endpoint (EKS/S3-API only; leave empty for native GCS/Azure).
      endpointURL: ""
      # Retention policy (Barman `retentionPolicy`).
      retention: "30d"
      # Cron for the base backup (ScheduledBackup).
      schedule: "0 0 3 * * *"
    serviceAccount:
      # Bind the CNPG instance pods to a cloud identity so Barman's WAL push is
      # KEYLESS (Workload Identity / Pod Identity / Entra WI).
      enabled: false
      annotations: {}

# Valkey (BSD-3) — Langfuse queue/cache. NOT Redis (SSPL) — stack-decisions.md.
# Cache only; not backed up. Local: single ephemeral pod with auth.
valkey:
  enabled: true
  secretName: valkey-credentials   # local: chart-created; STACKIT: external
  image:
    repository: valkey/valkey
    tag: "8.1-alpine"
    digest: sha256:77643d152547b446fc15cbafaff22004545663fcd40c6b28038ad283837baa75
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  local:
    password: valkey-local-dev

# ClickHouse (Apache 2.0) — Langfuse v3 analytics backend.
clickhouse:
  enabled: true
  secretName: clickhouse-credentials   # local: chart-created; STACKIT: external
  database: langfuse
  user: langfuse
  image:
    repository: clickhouse/clickhouse-server
    tag: "24.8"
    digest: sha256:1ffa82edee000a42c09313bd9f1293d94c570aee74babc1b3ca9983a35fa597b
  resources:
    # ClickHouse keeps mark/uncompressed caches resident; request reflects real
    # steady-state.
    requests: { cpu: 200m, memory: 2Gi }
    # 00 §10.1: 6 → 4 Gi only AFTER the Langfuse v4 move, and only if 05's load test agrees.
    # Not trimmed in WP-47 (the v4 window is 14–18 Dec 2026).
    limits: { cpu: "2", memory: 6Gi }
  # Data volume. 30Gi (was 10Gi): production reached 90% of 10Gi on 2026-11-19 with no
  # retention on trace data or on ClickHouse's own system logs. A larger volume is the
  # stop-gap; retention is tracked separately. Volumes can grow but never shrink.
  persistence:
    enabled: false
    size: 30Gi
  local:
    password: clickhouse-local-dev

# Langfuse's base path. The langfuse-oss web image (images/extensions/langfuse-oss, the default below)
# is BUILT with NEXT_PUBLIC_BASE_PATH=/tools/langfuse and serves every page and API there, so the OS
# serves its console through os-ui at <domain>/tools/langfuse/. Every in-cluster caller (os-ui
# LANGFUSE_URL, LiteLLM LANGFUSE_HOST, the OTel collector) gets `langfuseInit.host` + this path
# (soa.langfuseUrl). The web probes and NEXTAUTH_URL are subchart values and carry it literally
# (langfuse.langfuse.web.*Probe.path, langfuse.langfuse.nextauth.url). "" for an image served at the site
# root: deploy/overlays/langfuse-upstream-image.yaml. docs/components/langfuse-oss.md.
langfuseBasePath: /tools/langfuse

# Langfuse project keys (consumed by os-ui + LiteLLM to send traces).
langfuseInit:
  publicKey: "pk-lf-localdev0000public"
  secretKey: "sk-lf-localdev0000secret"
  host: "http://agentic-os-langfuse-web:3000"
  # The init user's password (LANGFUSE_INIT_USER_PASSWORD). Used only when Langfuse CREATES the
  # user; changing it later does not change an existing user's password
  # (docs/ops/secret-rotation.md, "Langfuse admin password").
  userPassword: "langfuse-local-dev-admin"
  # Optional overrides of the other local-profile literals (unset = the chart's dev literals):
  # userEmail, userName (the Langfuse init user) and salt, nextauthSecret, encryptionKey
  # (langfuse-core-secrets; encryptionKey is 64 hex chars). scripts/dev/bootstrap-secrets.sh sets
  # them, and userPassword, to random values for the dev environment.

# Langfuse v3 (MIT core) — wrapped upstream subchart, wired to OUR backends.
langfuse:
  enabled: true

  # ---- Langfuse application core ----
  langfuse:
    salt:
      secretKeyRef: { name: langfuse-core-secrets, key: salt }
    encryptionKey:
      secretKeyRef: { name: langfuse-core-secrets, key: encryptionKey }
    # OUR images, built from Langfuse's MIT source without the Enterprise Edition
    # (images/extensions/langfuse-oss, docs/components/langfuse-oss.md), pinned by digest. Private org
    # packages: the pull secret is the one the namespace already has for the OS images.
    # Rollback to the upstream images: deploy/overlays/langfuse-upstream-image.yaml.
    image:
      pullSecrets:
        - name: registry-pull-secret
    nextauth:
      # NextAuth's public URL INCLUDING the base path (langfuseBasePath): the web image serves its
      # auth routes under /tools/langfuse. Local port-forward target.
      url: http://localhost:3000/tools/langfuse
      secret:
        secretKeyRef: { name: langfuse-core-secrets, key: nextauthSecret }
    features:
      # Telemetry off (owner, 2026-11-25: "telemetry off makes sense."): the subchart renders it as
      # TELEMETRY_ENABLED="false" on BOTH langfuse-web and langfuse-worker (its shared env helper), so no
      # additionalEnv duplicate. Test: scripts/tests/langfuse-oss-chart.test.sh (every profile + overlays).
      telemetryEnabled: false           # sovereign/offline — no phone-home
      # AUTH_DISABLE_SIGNUP=true: only existing users can sign in. The OS's own Langfuse user,
      # org, project and API keys are created by headless initialisation (LANGFUSE_INIT_*,
      # Secret `langfuse-init`), which writes them directly and does not use sign-up.
      # https://langfuse.com/self-hosting/security/authentication-and-sso
      # https://langfuse.com/self-hosting/administration/headless-initialization
      signUpDisabled: true
    # Headless org/project/key provisioning (Secret from templates/base/langfuse/init.yaml).
    additionalEnvFrom:
      - secretRef:
          name: langfuse-init

    # ---- CH readiness gate ----
    # initContainer that polls ClickHouse HTTP /ping before langfuse-web starts.
    extraInitContainers:
      - name: wait-for-clickhouse
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        command:
          - sh
          - -c
          - |
            echo "Waiting for ClickHouse HTTP /ping …"
            until wget -qO- http://clickhouse:8123/ping 2>/dev/null | grep -q Ok; do
              echo "  CH not ready, retrying in 5s"
              sleep 5
            done
            echo "ClickHouse is ready."

    # via the subchart's shared deployment annotations.
    # WP-47 (00 §10.1): web 1536 → 1280 Mi and worker 1280 → 1024 Mi (live use 777 / 414 Mi).
    web:
      image:
        repository: ghcr.io/data-masterclass/sovereign-os/langfuse-oss-web
        # build-images.yml dispatch 2026-11-25 from 56e4c9169 (3.194.1-soa.2); digest read back from ghcr.io
        tag: "3.194.1-soa.2@sha256:409802f2978c42345f9231171ba3797e93b8ceb143a961d8f11f5e9929bea360"
      # Under the base path the image is built with (langfuseBasePath).
      livenessProbe:
        path: /tools/langfuse/api/public/health
      readinessProbe:
        path: /tools/langfuse/api/public/ready
      resources:
        requests: { cpu: 100m, memory: 768Mi }
        limits: { cpu: "1", memory: 1280Mi }
      # Node's default old-space cap (~640MB) is raised to 75 % of the limit, leaving the rest for
      # buffers and native memory.
      pod:
        additionalEnv:
          - name: NODE_OPTIONS
            value: "--max-old-space-size=960"
    worker:
      image:
        repository: ghcr.io/data-masterclass/sovereign-os/langfuse-oss-worker
        # build-images.yml dispatch 2026-11-25 from 56e4c9169 (3.194.1-soa.2); digest read back from ghcr.io
        tag: "3.194.1-soa.2@sha256:1c625990290904376e52c4016972441e50504100a4e1d2ac97f4ad7a26ffa205"
      resources:
        requests: { cpu: 100m, memory: 768Mi }
        limits: { cpu: "1", memory: 1024Mi }
      # No queue consumer whose job handler lives under worker/src/ee/ (Langfuse Enterprise License)
      # is started. Upstream registers the data-retention consumer by default ("true" in
      # worker/src/env.ts, v3.194.1), so EE code ran without a licence; the cloud ones also need
      # Stripe/cloud settings, and are set off here so no future default turns them on.
      # Test: scripts/tests/langfuse-ee-queues-chart.test.sh; docs/components/langfuse.md.
      pod:
        additionalEnv:
          - name: QUEUE_CONSUMER_DATA_RETENTION_QUEUE_IS_ENABLED            # ee/dataRetention
            value: "false"
          - name: QUEUE_CONSUMER_CLOUD_USAGE_METERING_QUEUE_IS_ENABLED      # ee/cloudUsageMetering
            value: "false"
          - name: QUEUE_CONSUMER_CLOUD_SPEND_ALERT_QUEUE_IS_ENABLED         # ee/cloudSpendAlerts
            value: "false"
          - name: QUEUE_CONSUMER_FREE_TIER_USAGE_THRESHOLD_QUEUE_IS_ENABLED # ee/usageThresholds
            value: "false"
          - name: LANGFUSE_POSTGRES_METERING_DATA_EXPORT_IS_ENABLED         # ee/meteringDataPostgresExport
            value: "false"

  # ---- Postgres: external (CloudNativePG `pg-rw`) ----
  postgresql:
    deploy: false
    host: pg-rw
    port: 5432
    auth:
      username: langfuse
      database: langfuse
      existingSecret: postgres-langfuse-credentials
      secretKeys:
        userPasswordKey: password
        adminPasswordKey: password

  # ---- Redis protocol: external Valkey ----
  redis:
    deploy: false
    host: valkey
    port: 6379
    auth:
      username: default
      existingSecret: valkey-credentials
      existingSecretPasswordKey: password

  # ---- ClickHouse: external single node (NOT a cluster) ----
  clickhouse:
    deploy: false
    host: clickhouse
    httpPort: 8123
    nativePort: 9000
    database: langfuse
    clusterEnabled: false               # single node — no ON CLUSTER DDL
    auth:
      username: langfuse
      existingSecret: clickhouse-credentials
      existingSecretKey: password

  # ---- Blob storage: external SeaweedFS (S3) ----
  s3:
    deploy: false
    storageProvider: s3
    bucket: langfuse
    region: us-east-1
    endpoint: http://minio:9000
    forcePathStyle: true                # required for non-AWS S3
    accessKeyId:
      secretKeyRef: { name: object-storage-credentials, key: AWS_ACCESS_KEY_ID }
    secretAccessKey:
      secretKeyRef: { name: object-storage-credentials, key: AWS_SECRET_ACCESS_KEY }

# Mock model — local OpenAI-compatible stub for offline/kind deployments.
mockModel:
  enabled: true
  image:
    repository: sovereign-os/mock-model   # built locally, loaded into kind
    tag: "0.1.1"                           # 0.1.1 adds poem mode
  # EMBED_DIM is retrieval.knnDimension (one source; WP-21 removed mockModel.embedDim).
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }

# STACKIT AI Model Serving — PREMIUM, managed, pay-per-token. NOT the default.
stackitPremium:
  enabled: false                 # opt-in; public default is self-hosted only
  # OpenAI-compatible base URL for STACKIT AI Model Serving (eu01).
  apiBaseUrl: "https://api.openai-compat.model-serving.eu01.onstackit.cloud/v1"
  # Confirmed STACKIT catalog model ids.
  visionModelId: "Qwen/Qwen3-VL-235B-A22B-Instruct-FP8"   # vision + last-resort chat
  chatModelId: "Qwen/Qwen3-VL-235B-A22B-Instruct-FP8"     # reuse the VLM for text fallback
  secretName: stackit-ai-model-serving-key
  # Local dev: key stays EMPTY (route defined but unauthenticated; only errors if
  # actually reached).
  local:
    apiKey: ""
  externalSecrets:
    enabled: false               # turn on with ESO + a STACKIT Secrets Manager store
    secretStoreRef:
      name: stackit-secrets-manager
      kind: ClusterSecretStore
    remoteKey: stackit-ai-model-serving-key
    property: apiKey

# LLM providers an admin connects in Platform -> Models & Providers (Azure OpenAI, OpenAI-compatible,
# Ollama, Mistral, STACKIT, any LiteLLM provider). The connections and models live in LiteLLM's own
# database (`/credentials`, `/model/new`); these values are the deployment-side half.
llmProviders:
  # Outbound model calls leave through the egress proxy (needs egressProxy.enabled). In-cluster
  # names (*.svc, the OS's own services) are reached directly.
  viaEgressProxy: true
  # Provider hosts the gateway may reach, joined to the egress proxy filter (subdomains included).
  # The STACKIT model-serving host joins automatically when stackitPremium.enabled.
  #   allowHosts: [my-resource.openai.azure.com, api.mistral.ai]
  allowHosts: []
  # Extra in-cluster names for the gateway's NO_PROXY (OS-internal; never accepted as a provider).
  noProxy: []
  # Local model servers an admin may connect as a provider (an in-cluster Ollama or vLLM): exact
  # names or ".suffix" entries. They join NO_PROXY. Any other endpoint that names or RESOLVES to a
  # cluster-internal or private address is refused by the Models & Providers flow (SSRF guard);
  # metadata, loopback and link-local addresses are refused always.
  #   localModels: [ollama, vllm.models.svc]
  localModels: []
  # Namespaces the gateway may reach for those servers (its egress NetworkPolicy; same namespace
  # is always allowed).
  localModelNamespaces: []
  # Every admin-registered model joins this LiteLLM access group; the shared agent key holds it.
  accessGroup: os-admin-registered
  # Provider hosts the PLATFORM needs, set here in the chart (git), JOINED to `allowHosts` above in the
  # egress allowlist (soa.egressHosts) — so an operator's `allowHosts` never removes them and they never
  # replace it. The models themselves live in each environment's LiteLLM database (created by hand,
  # docs/components/litellm.md "Models live in LiteLLM's database"); only the way out is in git.
  #   api.lyceum.technology — Lyceum's OpenAI-compatible API (production got it by hand on 2026-11-23,
  #   owner-approved; the render now produces it, so the next deploy changes nothing for that host).
  platformHosts:
    - api.lyceum.technology

# LiteLLM master key (admin access to the gateway; os-ui + the key-init Job).
# Local dev throwaway; external on STACKIT.
litellmMasterKey: "sk-litellm-local-dev-master"

# LiteLLM salt key (LITELLM_SALT_KEY): encrypts database-stored model credentials. Unset, LiteLLM
# uses the master key for that, and rotating the master key loses them. ONCE SET, NEVER CHANGE IT.
# templates/base/litellm/_salt-key.tpl; docs/ops/litellm-salt-key.md; docs/ops/secret-rotation.md.
litellmSaltKey:
  # local profile: the value, rendered into litellm-credentials. Set it from a private overlay.
  value: ""
  # other profiles (required there): an operator/ESO-managed Secret with key LITELLM_SALT_KEY,
  # also listed in litellm.environmentSecrets.
  existingSecret: ""
  # Only for a full re-key (docs/ops/litellm-salt-key.md, C), once with --set: lets a render
  # replace the live salt key. A rollback keeps it.
  allowChange: false

# LiteLLM admin UI login (DB-backed UI at /ui). Local dev throwaway.
# UI-only credential for the embedded LiteLLM admin console. os-ui mints a browser
# session from it (core/infra/tool-sso-litellm.ts) so an admin never logs in twice.
# Deliberately NOT the proxy master key: a leaked UI session must not equal full API
# access. Empty username/password => the OS says 'not configured' instead of framing
# LiteLLM's own login. Override in values.private.yaml; never commit a real password.
litellmUI:
  username: "admin"
  password: "litellm-admin-local-dev"

# Scoped virtual key for the agents (least privilege — security.md).
litellmAgentKey:
  enabled: true
  secretName: agent-litellm-key
  alias: "sovereign-agents"
  # Per-model cost caps (model_max_budget)
  enterprise: false
  # OWNERSHIP: this shared key's budget, models and limits belong to the platform team in LiteLLM.
  # The key-init Job therefore CREATES the key when it is absent and, when it exists, only REPORTS
  # how it differs from the values below (`[key-drift]` lines in the Job log) — an edit made in
  # LiteLLM survives `helm upgrade`. true = the earlier behaviour: re-apply the values below with
  # /key/update on every upgrade (use it once to roll a changed `models` list out, then switch off).
  reapplyOnUpgrade: false
  # Spend cap on this key PER `budgetDuration`. LiteLLM calls the unit "USD" but converts
  # nothing: the amount is in whatever currency the `model_info` prices below are in — EUR on
  # the shipped price book. This ONE key serves every assistant and every agent run that has
  # no key of its own, for all users, so it is sized above the per-system default
  # (`osUI.agentSystemKey.maxBudget`, 5 a week): 25 is roughly 16M input tokens of the
  # reasoning model or 160M of the standard model per week at the seeded prices.
  maxBudget: 25
  # Reset window for maxBudget (LiteLLM key `budget_duration`: "7d" weekly, "30d", "24h").
  # Weekly, like `osUI.agentSystemKey.budgetDuration`. Empty => NO reset: a lifetime cap, after
  # which every caller of this key is refused until an admin raises it. Do not ship that.
  # Changing the window on an existing key (with `reapplyOnUpgrade` below, the key-init Job runs
  # /key/update on every upgrade) sets a new reset time; it does NOT zero the spend already counted
  # — that happens at the first reset. See docs/components/litellm.md "Budgets".
  budgetDuration: "7d"
  models:                 # only these models are callable with this key
    # THE THREE ROLE NAMES are the only names the OS calls. Which catalog model each one means is the
    # mapping in Platform -> Models (os/models.yml), enforced at the gateway, so a remap needs no change here.
    - sovereign-strong
    - sovereign-worker
    - sovereign-embedding
    # LiteLLM model ACCESS GROUP, not an alias: every model an admin registers in
    # Admin -> Models & Providers joins it (`model_info.access_groups`), so this key can call
    # it without a Helm change (os-ui tabs/admin/lib/provider-registration.ts).
    - os-admin-registered
  # HARD COST GUARDRAIL: a dedicated per-model USD cap for the pay-per-token
  # STACKIT routes.
  modelMaxBudget: {}
  # Per-key rate limits. They do NOT queue: a request over rpm / tpm / max_parallel_requests is
  # refused at once with HTTP 429 (body "Rate limit exceeded ... Limit resets at: ...", header
  # `retry-after`). The router's `num_retries` only retries UPSTREAM errors, never this refusal,
  # so backing off is the caller's job — the OS does it in core/runtime/rate-limit.ts.
  # This ONE key serves every agent run and assistant of every user, so the limits are
  # tenant-wide, not per run. 200000 tokens/min was reached by a single 12-document run
  # on 2026-11-19 (each step re-sends its prompt and history, about 20k tokens a step).
  # Spend stays bounded by maxBudget / modelMaxBudget above, not by these.
  rpmLimit: 300
  tpmLimit: 1000000
  maxParallelRequests: 8
  local:
    value: "sk-agents-local-dev"

# LiteLLM — model/MCP gateway (wrapped upstream subchart, alias `litellm`).
litellm:
  enabled: true
  # The gateway image, pinned by DIGEST (the digest is authoritative; the tag is for people).
  # OUR OWN image (owner decision 2026-11-24: permissive code only): LiteLLM 1.109.1 from the MIT
  # wheel, WITHOUT the proprietary litellm-enterprise the upstream `litellm-database` image ships,
  # with the same Prisma client/CLI the migration step needs and the same layout
  # (images/extensions/litellm-oss, docs/components/litellm-oss.md). Built and licence-gated by
  # build-images.yml (tag litellm-oss-v<version>).
  # ROLLBACK to the upstream image (same LiteLLM version, same schema, image-only):
  #   VALUES_OVERLAY=deploy/overlays/litellm-upstream-image.yaml scripts/deploy.sh ...
  # Why 1.109.1 and the upgrade procedure (migrate FIRST): components/litellm/UPSTREAM.md and
  # docs/ops/litellm-upgrade.md.
  image:
    repository: ghcr.io/data-masterclass/sovereign-os/litellm-oss
    tag: "1.109.1-soa.4@sha256:26851caf34168f2de4bd29c4fd98a017235c2e8b1132c14bdfcc5b359564b0a5"
  # The org package is private: the subchart does not read global.imagePullSecrets, so the
  # gateway pod (and its db-migrate initContainer) get the cluster's pull secret here. On a
  # cluster without that Secret (kind) the reference is only a warning event; values.local.yaml
  # empties it.
  imagePullSecrets:
    - name: registry-pull-secret
  # Use the existing CloudNativePG database (enables the admin UI + virtual keys
  # + cost caps).
  db:
    deployStandalone: false
    useExisting: true
    endpoint: pg-rw
    database: litellm
    secret:
      name: postgres-litellm-credentials
      usernameKey: username
      passwordKey: password
  migrationJob:
    hooks:
      argocd:
        enabled: false   # Argo CD is not part of the stack
    # Keep enabled: the subchart sets DISABLE_SCHEMA_UPDATE=true on the proxy
    # container when this is on, so the running proxy never races the DB on a
    enabled: true
  # Schema migration as an initContainer on the proxy pod (NOT a Helm/Argo hook).
  extraInitContainers:
    - name: db-migrate
      image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
      imagePullPolicy: "{{ .Values.image.pullPolicy }}"
      command: ["python", "litellm/proxy/prisma_migration.py"]
      workingDir: "/app"
      env:
        - name: DATABASE_USERNAME
          valueFrom:
            secretKeyRef: { name: postgres-litellm-credentials, key: username }
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef: { name: postgres-litellm-credentials, key: password }
        - name: DATABASE_HOST
          value: pg-rw
        - name: DATABASE_NAME
          value: litellm
        # $(VAR) refers to the env vars defined above (k8s dependent-env expansion).
        - name: DATABASE_URL
          value: postgresql://$(DATABASE_USERNAME):$(DATABASE_PASSWORD)@$(DATABASE_HOST)/$(DATABASE_NAME)
        # Force the migration to run here even though the proxy container has it
        # disabled (schema ownership lives in this initContainer).
        - name: DISABLE_SCHEMA_UPDATE
          value: "false"
      resources:
        # Prisma client-generate + `migrate deploy` spikes RAM; 1Gi OOMKills
        # (exit 137) on a cold DB. WP-47: 2 → 1.5 Gi together with the proxy — the pod's
        # effective limit is the larger of the two, so trimming only the proxy saves nothing.
        requests: { cpu: 100m, memory: 512Mi }
        limits: { cpu: "1", memory: 1536Mi }
  # The gateway's outbound path (HTTP(S)_PROXY / NO_PROXY) — rendered by templates/base/litellm/egress-env.yaml
  # from egressProxy + llmProviders below. Empty when the proxy is off.
  environmentConfigMaps:
    - litellm-egress-env
  # Master key + Langfuse env come from our local Secret.
  masterkeySecretName: litellm-credentials
  masterkeySecretKey: masterkey
  environmentSecrets:
    - litellm-credentials
  # SERVER_ROOT_PATH lets LiteLLM serve its UI + emit redirects under a path
  # prefix.
  envVars:
    SERVER_ROOT_PATH: "/tools/litellm"
    # DURABLE admin-registered models.
    STORE_MODEL_IN_DB: "true"
    # The gateway's Langfuse record goes through LiteLLM's OpenTelemetry v2 `langfuse_otel`
    # callback (proxy_config.litellm_settings.callbacks below). OTel v2 is off until this flag is
    # set. Docs: https://docs.litellm.ai/docs/observability/langfuse_to_otel_v2_migration
    LITELLM_OTEL_V2: "true"
    # Which of the gateway's spans reach Langfuse (10 F1 point 4, decided by measurement on 1.109.1
    # against Langfuse 3.194.1; components/litellm/UPSTREAM.md "Span scope"):
    #   `llm_only` (chosen) — exactly one GENERATION per call, in the caller's trace (the
    #       `traceparent` trace id), sent as a root observation. The OS links it to its
    #       `llm.<node>` span by the call id (`x-litellm-call-id` = `litellm.call_id` =
    #       the span's `litellm_call_id`). Nothing else is exported.
    #   `full` — nests the generation under the caller's span, but LiteLLM also exports its own
    #       background database/cache polls as root traces (0.667 per second idle in the rig) and
    #       has no setting to exclude them from the operator's exporter (`excluded_services` covers
    #       key/team destinations only). Only an OTel Collector filter in front of Langfuse removes
    #       them: WP-05. Under `full`, `LITELLM_OTEL_BAGGAGE_PROMOTED_KEYS` must also drop the model
    #       keys, or every span is typed GENERATION (the gate enforces it).
    # Spell the value exactly; an invalid one disables every OTel v2 callback. Never an OTel sampler.
    LITELLM_OTEL_LANGFUSE_SPAN_SCOPE: "llm_only"
  # A3: the Valkey password for the response cache (`cache_params.password` above reads it
  # as os.environ/REDIS_PASSWORD). Same Secret Langfuse uses (local: chart-created;
  # STACKIT: external) — one Valkey credential, not two.
  extraEnvVars:
    - name: REDIS_PASSWORD
      valueFrom:
        secretKeyRef:
          name: valkey-credentials
          key: password
  resources:
    # This proxy was OOMKilled during the all-at-once boot. WP-47 (00 §10.1): 2 → 1.5 Gi.
    requests: { cpu: 100m, memory: 1Gi }
    limits: { cpu: "1", memory: 1536Mi }
  proxy_config:
    model_list:
      # --- THE CATALOG, under REAL model names. The chart seeds it; LiteLLM owns it from then on (the platform team
      # adds and removes models in the LiteLLM UI; models added there are never removed by an upgrade). The OS calls
      # only the three ROLE names (sovereign-strong / -worker / -embedding); the mapping onto these models is
      # `os/models.yml`, first seeded from `osUI.modelRoles.seed` below. This chart NEVER sets
      # `router_settings.model_group_alias`: LiteLLM refuses to change a config-file alias through the API, which
      # is how the OS writes the roles (scripts/tests/litellm-no-config-alias.test.sh).
      # --- Worker candidate (STACKIT gpt-oss-20b, pay-per-token)
      #
      # `model_info` — WHY EVERY ALIAS CARRIES ONE. These are custom model ids behind an
      # OpenAI-compatible endpoint, so LiteLLM's built-in price map does not know them: without
      # `input_cost_per_token` / `output_cost_per_token` it books every call at cost 0, key
      # spend never moves, and NO budget (`litellmAgentKey.maxBudget`, a system's own key) ever
      # triggers. The prices are the same ones as `osUI.modelPricesJson` (per 1M tokens there,
      # per token here: divide by 1,000,000), in the same currency (EUR, STACKIT's price list);
      # LiteLLM labels its ledger "USD" but converts nothing. `scripts/check-litellm-model-info.mjs`
      # fails the gate when an alias has no price, when a price disagrees with the price book,
      # or when `supports_vision` disagrees with os-ui/core/models/capabilities.ts.
      # Limits and capabilities are STACKIT's published figures (docs.stackit.cloud, "Available
      # shared models"): gpt-oss-20b 131K context / 8192 max generation, text only, tool calling;
      # Qwen3-VL-235B 200K context / 16384 max generation, text + image, tool calling.
      # `max_input_tokens` is informational here (it is what `/model/info` reports): the router's
      # `enable_pre_call_checks` is deliberately NOT on — see docs/components/litellm.md.
      - model_name: stackit-gpt-oss-20b
        litellm_params:
          model: openai/openai/gpt-oss-20b   # STACKIT id is openai/gpt-oss-20b; LiteLLM adds the provider prefix
          api_base: os.environ/STACKIT_API_BASE
          api_key: os.environ/STACKIT_API_KEY
        model_info:
          mode: chat
          input_cost_per_token: 0.00000015     # 0.15 per 1M
          output_cost_per_token: 0.00000025    # 0.25 per 1M
          max_input_tokens: 131000
          max_output_tokens: 8192
          supports_vision: false
          supports_function_calling: true
      # --- Strong candidate (STACKIT Qwen3-VL-235B, pay-per-token)
      - model_name: stackit-qwen3-vl-235b
        litellm_params:
          model: openai/Qwen/Qwen3-VL-235B-A22B-Instruct-FP8   # == stackitPremium.chatModelId
          api_base: os.environ/STACKIT_API_BASE
          api_key: os.environ/STACKIT_API_KEY
          timeout: 300                        # generous: reasoning generations are long
        model_info:
          mode: chat
          input_cost_per_token: 0.0000015      # 1.50 per 1M
          output_cost_per_token: 0.00000175    # 1.75 per 1M
          max_input_tokens: 200000
          max_output_tokens: 16384
          supports_vision: true                # the strong role is on the OS image allowlist (capabilities.ts)
          supports_function_calling: true
      # --- Offline embeddings (mock-model, deterministic 384-dim) -------------
      - model_name: mock-embedding
        litellm_params:
          model: openai/mock-embed
          api_base: http://mock-model:8080/v1
          api_key: "sk-mock-unused"
        model_info:
          mode: embedding
          input_cost_per_token: 0              # the bundled mock is free: priced AT zero, on purpose
          output_cost_per_token: 0
          supports_vision: false
      # NOTE: this list is the shipped SEED of the catalog for the laptop / kind profiles only. Dev and production
      # carry NO config models: scripts/deploy.sh layers deploy/gateway-no-config-models.yaml (an empty list) over
      # every other values source; their models are LiteLLM database rows created by hand per environment
      # (docs/components/litellm.md "Models live in LiteLLM's database").
    router_settings:
      routing_strategy: simple-shuffle        # load-balance across healthy deployments
      num_retries: 3                          # retry transient failures before failover
      timeout: 120                            # per-request timeout (s)
      allowed_fails: 3                        # circuit-breaking: trip after N fails...
      cooldown_time: 60                       # ...then cool the deployment down (s)
      # No static fallbacks: the seed catalog has no duplicate route to fail over to. A fallback per role is
      # a LiteLLM setting on the catalog models (docs/components/litellm.md, "Fallbacks per role").
    litellm_settings:
      # Gateway-level tracing to Langfuse over OTLP (OpenTelemetry v2, env LITELLM_OTEL_V2 above).
      # Exactly one GENERATION per model call. NEVER also `success_callback: ["langfuse"]` (the
      # legacy SDK callback): "running both callbacks logs every request twice" (LiteLLM's
      # migration guide), and Langfuse v4 rejects the legacy one. The caller nests the generation
      # in its own trace with a W3C `traceparent` header and names it with `x-litellm-call-id`
      # (os-ui core/runtime/gateway-trace.ts); `existing_trace_id` / `parent_observation_id` are
      # ignored on OTel v2. `scripts/check-litellm-model-info.mjs` fails the gate if `langfuse`
      # comes back in either callback list.
      callbacks: ["langfuse_otel"]
      # CONTENT STAYS OUT OF THE GATEWAY'S TRACE. Without this the gateway's own Langfuse
      # generation carries the full prompt and completion of every call — document text, tool
      # results, images — which defeats the OS's own redaction (`osUI.langfuseRedaction`). With
      # it LiteLLM replaces the messages and the completion text with "redacted-by-litellm"
      # before any callback runs and still logs model, usage, cost, latency, tags and the trace
      # ids. Owner decision 2026-11-19: no document or image content in traces by default. What
      # it does not cover, and how to switch content on for one debugging session, is in
      # docs/components/langfuse.md "What the gateway writes".
      turn_off_message_logging: true
      # NO `failure_callback: ["langfuse"]` — deliberately. When the PROXY ITSELF refuses a
      # request (rate limit, spent budget, a model outside the key's list) LiteLLM logs the
      # whole request body as the generation's model parameters, and `turn_off_message_logging`
      # does not reach that copy: the full prompt of every refused call landed in Langfuse
      # (measured on 1.90.0 and 1.108.12). A rate-limited run is exactly the run that carries
      # twelve documents. The OS records a refused or failed call itself, on its own span, at
      # its own redaction level (os-ui/core/infra/langfuse.ts), so nothing is lost but the
      # gateway's duplicate. `scripts/check-litellm-model-info.mjs` fails the gate if this
      # callback comes back. docs/components/langfuse.md "What the gateway writes".
      drop_params: true
      # A3: response cache on the bundled Valkey, OPT-IN PER REQUEST. `mode: default_off`
      # means nothing is cached unless the caller sends `cache: {"use-cache": true}` —
      # the OS does so only on its deterministic paths (classify at temperature 0, both
      # embedders). Agent runs never opt in, so a run is never served a stale answer.
      cache: true
      cache_params:
        type: redis
        host: valkey                           # the chart's Valkey Service (templates/base/valkey)
        port: 6379
        password: os.environ/REDIS_PASSWORD    # extraEnvVars below, from valkey-credentials
        mode: default_off
        ttl: 86400                             # 24h — embeddings/classifications are stable
        supported_call_types: ["acompletion", "completion", "aembedding", "embedding"]
    general_settings:
      master_key: os.environ/PROXY_MASTER_KEY
      # Persist admin-registered models (via /model/new)
      store_model_in_db: true
      # Spend logs (the gateway's own Postgres) keep metadata only — never the prompt or the
      # completion. This is LiteLLM's default; it is pinned here so the admin console cannot
      # switch it on by accident (from LiteLLM 1.103 a value in this file wins over the database).
      store_prompts_in_spend_logs: false
    # MCP gateway — register tool servers; agents call them via LiteLLM
    mcp_servers:
      sovereign_query:
        url: "http://query-tool:8000/mcp"
        transport: "http"
        description: "Governed SQL over the lakehouse marts via central Trino (row/column governed)"

# OpenSearch — retrieval backbone (vector + lexical). Single node for local.
opensearch:
  enabled: true
  # When enabled:false (Mode B), the bundled OpenSearch subchart is NOT deployed and
  # consumers resolve their endpoint via soa.opensearchUrl
  external:
    protocol: https            # managed endpoints terminate TLS
    host: ""                   # managed OpenSearch host
    port: "9200"
  clusterName: opensearch
  masterService: opensearch
  singleNode: true
  replicas: 1
  protocol: http                          # security plugin disabled -> plain HTTP
  opensearchJavaOpts: "-Xmx512M -Xms512M"
  securityConfig:
    enabled: false
  persistence:
    enabled: false                        # ephemeral local stand-in
  sysctlInit:
    enabled: true                         # set vm.max_map_count=262144
  extraEnvs:
    - name: DISABLE_INSTALL_DEMO_CONFIG
      value: "true"
    - name: DISABLE_SECURITY_PLUGIN
      value: "true"
  priorityClassName: sovereign-os-infra   # priorityClasses.infra.name
  resources:
    # Heap is -Xmx512M; request covers heap + Lucene off-heap/page cache.
    requests: { cpu: 250m, memory: 1Gi }
    limits: { cpu: "2", memory: 1536Mi }

# OpenSearch filesystem snapshot repository.
opensearchSnapshots:
  enabled: false                          # off for local/kind; on for STACKIT
  repositoryName: sovereign-fs            # name used by the register Job + UI
  mountPath: /usr/share/opensearch/snapshots
  pvc:
    size: 20Gi
    accessMode: ReadWriteOnce
    # storageClass falls back to global.storageClass (same as all other PVCs)
  # Post-install/post-upgrade Job that registers the fs snapshot repo.
  registerJob:
    image:
      repository: curlimages/curl
      tag: "8.8.0"
    resources:
      requests: { cpu: 50m, memory: 32Mi }
      limits: { cpu: 200m, memory: 64Mi }
  # Optional nightly CronJob that snapshots all indices.
  cronJob:
    enabled: true
    schedule: "0 3 * * *"              # 03:00 UTC, after pg-dump (02:30)
    resources:
      requests: { cpu: 50m, memory: 32Mi }
      limits: { cpu: 200m, memory: 64Mi }

  # Off-cluster snapshots (WP-21, design 02 step 3): `repository-s3` (our own image,
  # images/extensions/opensearch) to STACKIT Object Storage through egress-proxy:3128, plus a
  # Snapshot Management policy. The s3 CLIENT settings (endpoint, protocol, path-style, proxy)
  # live in opensearch.yml and the keys in the keystore — both set by the STACKIT overlay
  # deploy/overlays/opensearch-s3-snapshots.stackit.yaml. The post-install/post-upgrade Job
  # `register-opensearch-s3-repo` registers the repository, runs `_verify` (a failure fails the
  # Job) and applies the policy. The fs repository + CronJob above stay on in parallel for one
  # week after the first verified S3 snapshot, then they are removed.
  s3:
    enabled: false                        # on via the STACKIT overlay only
    repositoryName: stackit-s3
    bucket: ""                            # required when enabled
    # Object-storage host. Added to the egress-proxy allowlist when s3 is on; must equal
    # s3.client.default.endpoint in opensearch.yml (the CI harness renders both and proves it).
    endpointHost: object.storage.eu01.onstackit.cloud
    basePath: opensearch                  # key prefix inside the bucket
    # The Secret the OpenSearch keystore is built from (subchart `keystore`); its keys MUST be
    # named s3.client.default.access_key and s3.client.default.secret_key. Created by the owner.
    keystoreSecret: opensearch-s3-keystore
    policy:
      name: nightly
      description: "Nightly snapshot of the OS indices to off-cluster object storage"
      schedule: "0 3 * * *"
      timezone: UTC
      indices: "files*,knowledge*,os-*"
      maxAge: 30d
      minCount: 7
    job:
      resources:
        requests: { cpu: 50m, memory: 32Mi }
        limits: { cpu: 200m, memory: 64Mi }

# The chart's OpenSearch client settings, shared by every caller (os-ui, worker,
# initContainer, maintenance Jobs) through the helper `soa.opensearchClientEnv`.
opensearchClient:
  # Secret with `username` / `password` keys; empty while the security plugin is off.
  # WP-22 sets it — this is the only place credentials are wired.
  credentialsSecret: ""

# One-time removal of indices left by components the OS no longer runs (WP-21, design 02
# step 1): the OpenMetadata `*_search_index_rebuild_<13 digits>` and
# `*_report_data_index_rebuild_<13 digits>` indices, the `di-data-assets-*` data streams and
# `haystack_knowledge` — exact anchored names, nothing else. A post-install/post-upgrade Job: it
# snapshots everything first, refuses if more than `maxDelete` match, and is a no-op once they
# are gone. Script: files/opensearch/cleanup/delete-orphans.sh.
# OFF by default: it deletes data, so it runs only where an operator opts in — the STACKIT
# overlay deploy/overlays/opensearch-s3-snapshots.stackit.yaml, after the S3 repository is
# verified. A plain release never renders it (scripts/tests/opensearch-chart.test.sh).
opensearchCleanup:
  enabled: false
  maxDelete: 77                           # 55 + 5 rebuild + 16 backing indices + 1 on 2026-11-20
  # Repository for the pre-delete snapshot. Empty = the S3 repository when s3 is on, else the
  # fs repository when it is on; with neither the Job refuses to delete anything.
  snapshotRepository: ""
  dryRun: false

# Shared retrieval settings (knowledge index name + k-NN dimension).
retrieval:
  indexName: knowledge
  # 4096 = the dimension the live embedding model returns (Qwen3-VL-Embedding-8B) and what
  # runs live (FILES_EMBED_DIM / KNOWLEDGE_EMBED_DIM). The kind mock-model follows it.
  knnDimension: 4096

# MCP test agent — proves the OS's own real, governed MCP registry (/api/mcp)
# Agent schedules + the shared SERVICE BEARER the OS's own CronJobs present to os-ui.
#
# A5 (engine rebuild, 2026-11-13) deleted the Python `agent-runtime` Deployment this block
# was named after — agent systems now execute as a real LangGraph StateGraph inside os-ui,
# as the signed-in user. Gone with it: `enabled`, `image`, `replicas`, `resources` and the
# three model aliases (`chatModel` / `reasoningModel` / `executionModel` — os-ui's own
# LITELLM_*_MODEL defaults are the live ones, and `scripts/check-litellm-allowlist.mjs`
# checks those).
#
# What is left:
#   • token     — the shared bearer os-ui mounts as AGENT_RUNTIME_TOKEN and validates on its
#                 service paths (scheduled runs, data-sync, catalog-refresh); the Dagster
#                 sidecar reads the same Secret. Renamed once the data side owns it.
#   • schedules — declarative agent-schedule CronJobs (empty by default; the Agents tab
#                 provisions schedules itself at runtime).
agentRuntime:
  token: "agent-runtime-local-dev-token"
  # CronJob-per-schedule entries (empty by default -> no CronJob renders).
  # Each: { name, systemId, cron, prompt }
  schedules: []

# =============================================================================
# Layer 2 (Context / Foundations)

# OPA — policy-as-code at the MCP/tool boundary. Default-deny tool authorization.
opa:
  enabled: true
  image:
    repository: openpolicyagent/opa
    # Newest 1.x (components/opa/UPSTREAM.md). The default tag: its binary is
    # statically linked like `-static` (opa#9431), and upstream deprecated the
    # `_static` binaries in 1.22.0 (opa#9441); for images it was only discussed.
    tag: "1.22.4"
    digest: sha256:ff50f50332ff9e722ffafe2658c195ced1f9b6d4f3064000c2ecfa8cdf7acccf
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }
  # One masked JSON line per decision in OPA's log output (decision_logs.console).
  decisionLogs:
    enabled: true
  # WP-11: OPA loads policy DATA as bundles served by os-ui (`os-data`: grants, approval holds,
  # governance tables/principals, os_data.users/app_grants; `os-grants`: run grants from the
  # os_governance database, long-polled), persists them and survives restarts without os-ui.
  # Off = the interim REST-push path with its reconciler (rollback, one release).
  dataBundle:
    enabled: false
    serviceUrl: http://os-ui:3000/api/opa
    polling: { minDelaySeconds: 5, maxDelaySeconds: 15 }
    # os-grants (needs postgres.governance.enabled): HTTP long polling, < 2 s propagation.
    grants: { longPollingTimeoutSeconds: 30 }
    # 10 F7: the only user attributes that may reach os_data.users[uid].attrs.
    abacAttributes: [region, cost_center]
    # A small volume for /var/opa so a NEW pod (node roll, eviction, rollout restart) starts from
    # the last good bundles instead of nothing. Off → emptyDir (container restarts only).
    persistence:
      enabled: true
      size: 1Gi
      storageClass: ""
    # Bundle guards (os-ui): a compile with fewer governance tables than the last good bundle, a
    # missing internal (`iceberg.*`) table, or a relative drop above this in grant principals,
    # governance principals or tables is refused until an admin acknowledges it.
    maxDropPercent: 10
    # A refusal that lasts longer than this many minutes is raised in Monitoring and in every
    # admin's notification bell; it clears when a compile passes (Platform → Policy data).
    refusalAlertMinutes: 15
  # WP-30: knowledge guardrails as OPA DATA. Each domain's committed
  # `knowledge/workflows/<slug>/guardrails.json` reaches OPA in the os-data bundle
  # (os_data.guardrails) and the platform policy `policies/guardrails.rego` (package
  # os.guardrails) decides; nothing is uploaded at runtime. Needs dataBundle.enabled.
  # Off = the interim per-workflow module upload (rollback, one release).
  guardrailsData:
    enabled: false
  # OPA's own API protection: `--authentication=token --authorization=basic` with the chart's
  # `system.authz` policy (policies/system/authz.rego; https://www.openpolicyagent.org/docs/security).
  # Two bearer tokens in the Secret `opa-tokens` (keys `writer`, `reader`):
  #   writer  os-ui and os-ui-worker (the OS reconciler): data and policy writes, every read;
  #   reader  web-fetch: tool decisions under /v1/data/agentic only.
  # Trino's OPA plugin has no bearer setting, so it evaluates `/v1/data/trino/*` (POST) without a
  # token; only the pods `opa-allow-callers` admits can reach OPA at all.
  # Rollout (docs/ops/opa-api-auth.md): the default `enforce: false` distributes the tokens to
  # every client but leaves OPA open, so the first release never meets a token-less pod with a
  # 401. Once every client presents its token (web-fetch on an image that sends it), a follow-up
  # release sets `enforce: true`.
  auth:
    enforce: false
    # An operator/ExternalSecret-managed Secret with keys `writer` and `reader`; empty = the chart
    # renders `opa-tokens` (random on first install, kept across upgrades via `lookup`).
    existingSecret: ""
  grants:
    sovereign-agents:           # the default agent key — no internet
      - rag_search
      - llm_generate
      - query                    # governed Trino lakehouse query MCP tool
    sovereign-agents-web:        # explicitly granted the governed web tool
      - rag_search
      - llm_generate
      - query
      - web_fetch
    # DOMAIN principals — the governed data tools authorize as `user.domains[0]`
    # (the domain), so a domain must be granted the read tools its members + agents
    agentic-leader-q3-2026:     # the live Q3-2026 cohort domain (36 students)
      - query                    # governed Trino lakehouse read (query_data)
      - metrics                  # governed metrics (query_metric)
      - retrieve                 # governed RAG over domain knowledge (search_knowledge)
    test:                       # the internal test/admin domain
      - query
      - metrics
      - retrieve
    conn-notion-workspace:      # MCP connection — reads on, create held for approval
      - notion_search
      - notion_get_page
      - notion_create_page       # Write-approval (see requiresApproval); delete is Blocked (absent)
    conn-salesforce-sales-org:  # API connection — reads scoped to Sales, bounded write
      - read_account
      - read_opportunity
      - update_opportunity_amount # Write-bounded (≤ €X enforced in policy); delete/mass_update absent
  # High-stakes tools held for human approval even when granted (golden path §7):
  requiresApproval:
    - connection_crm_write
    - knowledge_certify
    - notion_create_page         # Connections slice: Write-approval (Notion create page)
  # Trino data governance (read by package `trino` -> data.governance).
  governance:
    # Tables are keyed by the REAL schema the data lives in: `iceberg.sales.*`
    # (marts.schema / dbt profiles / queryTool.trino.schema are all `sales`).
    tables:
      # The LIVE Northpeak gold mart (written by northpeak-marts-init)
      iceberg.sales.gold_northpeak_commerce:
        domain: sales
        # SHARED with the Q3-2026 cohort: the Northpeak campaign is THEIR case-study
        # dataset, so their domain principal must pass the row filter (else a granted
        visibility: shared
        shared_with: ["agentic-leader-q3-2026"]
        sensitive_columns: {}
      # The Sales mart (dbt-trino Iceberg) — row filter by domain.
      iceberg.sales.daily_revenue:
        domain: sales
        visibility: domain          # domain-scoped: non-members get a `false` row filter
        shared_with: []
        sensitive_columns: {}
      # The Sales staging table — column mask by sensitivity (customer = PII).
      iceberg.sales.stg_orders:
        domain: sales
        visibility: domain
        shared_with: []
        sensitive_columns:
          customer: pii              # masked unless the principal holds the `pii` clearance
    principals:
      sales-agent:                  # owning domain — sees rows + PII
        domains: [sales]
        clearances: [pii]
      marketing-agent:              # cross-domain — rows masked, PII masked
        domains: [marketing]
        clearances: []
      # Sales-lane SERVICE principals.
      dbt-sales:                    # dbt-trino builds (dbt.trino.user)
        domains: [sales]
        clearances: []
      northpeak-marts:              # gold-mart seed Job (marts.trino.user)
        domains: [sales]
        clearances: []
      # DOMAIN principals — the governed query tools run AS `user.domains[0]` (the
      # DOMAIN name is the Trino session user), so each domain MUST map to itself here
      sales:                        # the Sales worked-example domain
        domains: [sales]
        clearances: [pii]
      agentic-leader-q3-2026:       # the live Q3-2026 cohort domain
        domains: [agentic-leader-q3-2026]
        clearances: []
      test:                         # the internal test/admin domain
        domains: [test]
        clearances: [pii]

# Docling — document parsing (docling-serve).
docling:
  enabled: true
  # OUR derived image (images/extensions/docling): upstream docling-serve-cpu v1.38.2 plus the
  # Apache-2.0 TableFormer v2 weights and the MiniLM tokenizer, the CDLA-licensed TableFormer v1
  # weights removed, and the table preset fixed to v2 server-side. Built by build-images.yml
  # (`gh workflow run build-images.yml -f image=docling -f version=<tag>`); the tag is
  # <docling-serve version>-<our build>. The digest is REQUIRED (the template refuses to render
  # without it); `localBuild: true` (values.local.yaml) is the only exception.
  image:
    repository: ghcr.io/data-masterclass/sovereign-os/docling
    tag: "1.38.2-1"
    digest: sha256:edcb61bd35a9931a1afe0b5cddc446bdf5654bd65c5f52cf56c297d3fe0c2a53   # build-images run 44691106133
    localBuild: false
  # docling-serve settings (docs/configuration.md, v1.38.2), rendered as DOCLING_SERVE_* env.
  maxFileSize: 52428800        # 50 MiB
  maxNumPages: 400
  maxDocumentTimeout: 900      # seconds; os-ui's DOCLING_TIMEOUT_MS (600 s) stays below it
  resultRemovalDelay: 600      # seconds a fetched result is kept (results are single-use)
  workers: 1                   # ENG_LOC_NUM_WORKERS: each worker holds its own model set
  showVersionInfo: true        # exposes GET /version (the deploy's live evidence)
  # API key (DOCLING_SERVE_API_KEY), sent by os-ui as X-Api-Key. Resolution: `apiKey.existingSecret`
  # (e.g. created by an ExternalSecret; key `apiKey`) → `apiKey.value` → the value already in the
  # chart's `docling-api-key` Secret → a random value on first install.
  apiKey:
    existingSecret: ""
    value: ""
  # Ingress allowlist: only os-ui and os-ui-worker may call :5001
  # (templates/base/network/docling-ingress-policy.yaml).
  networkPolicy:
    enabled: true
  # Request at the warm idle level so the scheduler does not overcommit the node; the 4Gi ceiling
  # stays (one photo-sized image OOM-killed it at 2Gi, 2026-11-19).
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "2", memory: 4Gi }

# Dagster — data orchestrator (subchart).
dagster:
  enabled: true
  postgresPasswordLocal: dagster-local-dev    # must match postgres.extraDatabases dagster
  # External Postgres (our CNPG), password from the Secret above.
  generatePostgresqlPasswordSecret: false
  global:
    postgresqlSecretName: dagster-postgresql
  postgresql:
    enabled: false
    postgresqlHost: pg-rw
    postgresqlUsername: dagster
    postgresqlDatabase: dagster
  # ── Launched RUN pods (engine rebuild B2, review B2-review-H1).
  # The subchart derives each code location's container context from its deployment entry, but the
  # ONLY label it puts on a run pod is none: `component: user-deployments` lives on the CODE-SERVER
  # Deployment's pod template and nowhere else. Run pods must reach the read-only git daemon
  # (`git://os-repos`, port 9418) to clone their pinned commit, and the one ingress rule that opens
  # 9418 selects exactly that label (templates/base/os-ui/os-repos.yaml) — so the run launcher
  # stamps it on every run pod. Keep the `component` value IN STEP with that NetworkPolicy;
  # images/extensions/dagster/tests/test_os_projects.py (ChartContract) asserts they agree.
  runLauncher:
    config:
      k8sRunLauncher:
        runK8sConfig:
          podTemplateSpecMetadata:
            labels:
              component: user-deployments
              app.kubernetes.io/part-of: sovereign-os
  # Official dagster/* images are amd64-only; we use an arm64-native image we
  # build (sovereign-os/dagster)
  dagster-user-deployments:
    enabled: true
    deployments:
      # The code location NAME is this deployment's name: `sovereign` is what
      # `reloadRepositoryLocation` and the OS's `DAGSTER_LOCATION` address (engine rebuild B2).
      - name: sovereign
        image:
          repository: ghcr.io/data-masterclass/sovereign-os/dagster
          tag: "0.4.2"
          # Pinned by digest (the subchart renders repository@digest and ignores the tag; the
          # tag stays for people). Built by build-images.yml from tag dagster-v0.4.2 (main 2e531de2: the repo-sync reload retry, #350).
          digest: "sha256:1ef25ec2310ab1872c7252f61e532158a591353b1a6f4e3a5d7fdaa10d5d7853"
          pullPolicy: IfNotPresent
        # `dagster code-server start`, not `dagster api grpc`: only a code server reloads its
        # definitions in place when repo-sync calls reloadRepositoryLocation after a domain commit.
        # `dagster api grpc` logs "Reloading definitions ... without restarting the process is not
        # currently supported" and keeps what it loaded at boot (the subchart's documented
        # `codeServerArgs`; test: images/extensions/dagster/tests/image/code-server-reload.sh).
        # One replica only: the subchart refuses codeServerArgs with replicaCount > 1.
        codeServerArgs:
          - "--python-file"
          - "/opt/dagster/app/repo.py"
        port: 3030
        # Central Trino connection for dbt-trino runs (env propagates to launched
        # run pods via includeConfigInLaunchedRuns).
        env:
          - { name: TRINO_HOST, value: trino }
          - { name: TRINO_PORT, value: "8080" }
          # The Trino user dbt-trino CONNECTS as (profiles.yml `user`), before
          # `impersonation_user: OS_PRINCIPAL` sets the governed session identity. It MUST equal
          # `trino.accessControl.serviceUser` below, because that is the only `original_user` the
          # generated `rules.json` lets become an OS principal — `dbt-sales` (the old value) is
          # denied by its own impersonation rule the moment Trino authenticates clients.
          # A subchart's values cannot be templated from here, so the equality is asserted by
          # `scripts/check-trino-rules-chart.mjs` (run from os-ui/scripts/gate.sh). B3-review-H-5.
          - { name: TRINO_USER, value: dbt-runner }
          - { name: TRINO_CATALOG, value: iceberg }
          # dlt's Trino destination for the Bronze ingestion in each repo's data/dagster/definitions.py
          # (WP-49). The USERNAME is per run: the principal, derived from the run's os/principal tag (os_projects.run_tag_env).
          - { name: DESTINATION__SQLALCHEMY__CREDENTIALS__DRIVERNAME, value: trino }
          - { name: DESTINATION__SQLALCHEMY__CREDENTIALS__HOST, value: trino }
          - { name: DESTINATION__SQLALCHEMY__CREDENTIALS__PORT, value: "8080" }
          - { name: DESTINATION__SQLALCHEMY__CREDENTIALS__DATABASE, value: iceberg }
          # The domain schema the marts land in — the SAME value as dbt.trino.schema and
          # marts.schema (`sales`); the old `analytics` literal here had drifted from them.
          - { name: TRINO_SCHEMA, value: sales }
          # repo-sync settings the USER-CODE container sees. The sidecar that actually runs the
          # script carries its own copy under `sidecarContainers` below — flip BOTH to opt out.
          - { name: REPO_SYNC_ENABLED, value: "true" }
          - { name: REPO_SYNC_DOMAINS, value: "" }          # extra domains; the index discovers the rest
          - { name: REPO_SYNC_INDEX_URL, value: "http://os-ui:3000/api/data/projects" }
          - { name: REPO_SYNC_GIT_BASE, value: "git://os-repos" }
          - { name: REPO_SYNC_CHECKOUT, value: "/repos-checkout" }
          - { name: REPO_SYNC_INTERVAL, value: "15" }
          - { name: REPO_SYNC_STATUS_PORT, value: "8089" }
          - { name: DAGSTER_RELOAD_LOCATION, value: "sovereign" }
          - { name: DAGSTER_GRAPHQL_URL, value: "http://agentic-os-dagster-webserver:80/tools/dagster/graphql" }
          # The `os_principals` sensor reads the OS repo index to pause a deactivated owner's
          # schedules (concept §6) from the snapshot the repo-sync sidecar writes into the shared
          # checkout; missing or stale ⇒ the sensor skips with that reason, never guesses.
          - { name: OS_INDEX_FILE, value: "/repos-checkout/.os-index.json" }
          # Consecutive failures after which the failure sensor pauses a schedule — the OS's
          # own QUARANTINE_THRESHOLD (tabs/data/lib/sync-runs.ts).
          - { name: OS_QUARANTINE_THRESHOLD, value: "10" }
          # NO credential in this env: launched run pods inherit it (includeConfigInLaunchedRuns),
          # and authored dbt reads env with env_var(). The bearer lives only in the repo-sync
          # sidecar below (scripts/tests/dagster-run-pod-env.test.sh).
        resources:
          # `dagster code-server start` holds the loaded definitions in a child server (about
          # 530 MiB measured with the dev domains, against 294 MiB for `dagster api grpc`), and a
          # reload builds every domain again. Limit 1.5Gi for that headroom; the request stays modest.
          requests: { cpu: 50m, memory: 512Mi }
          limits: { cpu: "1", memory: 1536Mi }
        # ── Data products in git (engine rebuild B1/B2): the validated-commit checkout the
        # `sovereign` code location loads from. `repo-sync` (same image, `git` added) discovers
        # domains from the OS index, fetches git://os-repos/<domain>.git, runs `dbt parse` in a
        # worktree, repoints /repos-checkout/<domain>/current ONLY on success and then calls
        # reloadRepositoryLocation (images/extensions/dagster/repo-sync.sh).
        # NOTE (corrected — review B2-review-M1): includeConfigInLaunchedRuns propagates
        # volumes/volumeMounts/env AND `sidecarContainers` into run pods — the subchart renders the
        # latter as `run_k8s_config.pod_spec_config.containers`. A K8s Job only completes once EVERY
        # container exits, so the repo-sync copy in a run pod MUST exit: it reads POD_NAME (downward
        # API, below) and returns 0 in a `dagster-run-*` pod. The sidecar cannot be dropped here —
        # the code-server pod is the only place it can maintain the shared `current` checkout.
        # A run pod's emptyDir starts EMPTY and `os_projects.ensure_checkout` clones the commits
        # named in the run's os/pinned tag (-> OS_PINNED_COMMITS, os_projects.apply_run_env_from_tags) before building definitions.
        volumes:
          - name: repos-checkout
            emptyDir: {}
        volumeMounts:
          - name: repos-checkout
            mountPath: /repos-checkout
        sidecarContainers:
          - name: repo-sync
            image: ghcr.io/data-masterclass/sovereign-os/dagster:0.4.2@sha256:1ef25ec2310ab1872c7252f61e532158a591353b1a6f4e3a5d7fdaa10d5d7853
            imagePullPolicy: IfNotPresent
            command: ["/bin/sh", "/opt/dagster/app/repo-sync.sh"]
            env:
              # Which pod am I in? A Dagster run pod is `dagster-run-<run id>-…`; repo-sync exits 0
              # there so the run Job can complete (review B2-review-M1).
              - name: POD_NAME
                valueFrom:
                  fieldRef: { fieldPath: metadata.name }
              # The status server binds THIS address, not 0.0.0.0 (review B2-review-L5, closed in
              # B3): reachable through the pod's own IP only. Unset would mean 127.0.0.1.
              - name: POD_IP
                valueFrom:
                  fieldRef: { fieldPath: status.podIP }
              # ON since B4, together with osUI.dataProjectGit.enabled. THIS is the copy the
              # script reads (the deployment `env` list above belongs to the user-code container).
              # In a Dagster RUN pod the same sidecar is inherited and exits 0 on POD_NAME, so a
              # run Job still completes (review B2-review-M1).
              - { name: REPO_SYNC_ENABLED, value: "true" }
              - { name: REPO_SYNC_DOMAINS, value: "" }
              - { name: REPO_SYNC_INDEX_URL, value: "http://os-ui:3000/api/data/projects" }
              - { name: REPO_SYNC_GIT_BASE, value: "git://os-repos" }
              - { name: REPO_SYNC_CHECKOUT, value: "/repos-checkout" }
              - { name: REPO_SYNC_INTERVAL, value: "15" }
              - { name: REPO_SYNC_STATUS_PORT, value: "8089" }
              - { name: DAGSTER_RELOAD_LOCATION, value: "sovereign" }
              - { name: DAGSTER_GRAPHQL_URL, value: "http://agentic-os-dagster-webserver:80/tools/dagster/graphql" }
              - name: AGENT_RUNTIME_TOKEN
                valueFrom:
                  secretKeyRef: { name: agent-runtime-token, key: token }
            ports:
              - { name: repo-status, containerPort: 8089 }
            volumeMounts:
              - name: repos-checkout
                mountPath: /repos-checkout
            resources:
              requests: { cpu: 20m, memory: 128Mi }
              limits: { cpu: 500m, memory: 512Mi }
        # ── dbt.projectSource: git — Dagster user-code from the repo (epic #146 Ph 4)
  dagsterWebserver:
    image:
      repository: ghcr.io/data-masterclass/sovereign-os/dagster
      tag: "0.4.2"
      digest: "sha256:1ef25ec2310ab1872c7252f61e532158a591353b1a6f4e3a5d7fdaa10d5d7853"
      pullPolicy: IfNotPresent
    # ── The Dagster console behind the OS sign-in (docs/ops/tool-consoles.md). Both webservers run
    # under the OS proxy's prefix (`--path-prefix`), so the UI's chunks and GraphQL calls resolve
    # under <domain>/tools/dagster/. EVERY in-cluster address of the webserver therefore carries
    # the prefix: osUI.dagsterUrl and both DAGSTER_GRAPHQL_URL values above, and the two Dagster
    # overlays at the repo root. A subchart value cannot be templated from the parent, so
    # `scripts/check-dagster-path-prefix.mjs` asserts the equality (and the os-ui registry's
    # prefix in core/infra/tool-proxy.ts).
    pathPrefix: /tools/dagster
    # A second webserver in `--read-only` mode (no launches, no schedule toggles, no wipes):
    # Service agentic-os-dagster-webserver-read-only, the ONLY upstream of the admin console at
    # /tools/dagster. Its NetworkPolicy admits os-ui only (templates/base/network/
    # dagster-ingress-policies.yaml). The editable webserver keeps serving os-ui's launches.
    enableReadOnly: true
    # The subchart's probe path does not follow pathPrefix; without the prefix it 404s forever.
    readinessProbe:
      httpGet:
        path: /tools/dagster/server_info
        port: 80
      periodSeconds: 20
      timeoutSeconds: 10
      successThreshold: 1
      failureThreshold: 3
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  dagsterDaemon:
    image:
      repository: ghcr.io/data-masterclass/sovereign-os/dagster
      tag: "0.4.2"
      digest: "sha256:1ef25ec2310ab1872c7252f61e532158a591353b1a6f4e3a5d7fdaa10d5d7853"
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }

# dbt (dbt-trino) — the SINGLE governed transform path.
dbt:
  enabled: true
  image:
    repository: sovereign-os/dbt     # built locally, loaded into kind
    tag: "0.2.0"                      # 0.2.0 = dbt-trino adapter
  # Central Trino connection.
  trino:
    host: trino
    port: 8080
    # The DOMAIN principal of `schema` below. On a fresh install os-ui's boot-time Trino rules give a
    # domain's schema to that domain's principals only (core/infra/trino-rules.ts), and this hook
    # runs CREATE SCHEMA IF NOT EXISTS + CTAS in it — as `dbt-sales` it was denied (first dev
    # install, 2026-11-20). A service user here is honoured only for a schema NO domain owns
    # (TRINO_SEED_WRITERS).
    user: sales
    catalog: iceberg
    # The domain schema the marts land in.
    schema: sales

# WP-16 (design 01 M2; 10 F6, F10): os-ui reads dbt's verdict per commit and dbt's manifests from
# repo-sync (Service dagster-repo-status) and copies the verdicts into os_governance.commit_checks.
# OFF by default.
dagsterRepoStatus:
  enabled: false
  location: sovereign
  port: 8089

# WP-15 (design 01 R1–R3, 10 F3/F4): Dagster runs act as the run's OWNER in Trino, bounded by a
# run grant os-ui checks when the run starts. OFF by default: Dagster keeps today's path. Turning it
# on is the cut-over step "Dagster -> svc-dagster-runner" (docs/components/trino-cutover.md, step 5)
# and needs the overlay values.dagster-run-identity.yaml (the Dagster subchart's half), plus
# postgres.governance, opa.dataBundle, trino.auth and trino.opa.sidecar (with the os-grants bundle).
dagsterRunIdentity:
  enabled: false
  runServiceAccount: dagster-run
  codeServiceAccount: dagster-code
  # The OPA instances (`labels.instance`) /start waits on: the one that judges Trino.
  opaInstances: [trino-sidecar]

# dagster-analytics — dedicated Trino/OPA warehouse principal for Dagster runs
# (epic #146 Phase 4).
dagsterAnalytics:
  warehousePrincipal:
    enabled: false
    # The principal name (Trino session user) + the domains it is entitled to.
    name: dagster-analytics
    domains: [sales]
    clearances: []

# Northpeak gold-mart materialization (templates/extensions/lakehouse/northpeak-marts-init.yaml).
marts:
  enabled: true
  # Node 22 (global fetch) drives the Trino REST protocol — same base as os-ui/seed.
  image:
    repository: node
    tag: "22.13.1-alpine3.21"
  trino:
    host: trino
    port: 8080
    # The DOMAIN principal of `schema` below, for the same reason as `dbt.trino.user`. With
    # trino.auth.enabled + clients.northpeakMarts the Job authenticates with a password, so the user
    # must then also be in trino.auth.directUsers (the chart refuses to render otherwise).
    user: sales
    catalog: iceberg
  schema: sales
  table: gold_northpeak_commerce
  rows: 150000          # session rows; ~conversion of these become paid orders
  conversion: 0.032     # session→order conversion (avg(converted))
  churnRate: 0.18       # fraction of customers with no order in 90 days
  force: false          # true → DROP + rebuild even if the table already has rows
  backoffLimit: 6

# =============================================================================
# Secure-by-default egress baseline (security.md)

# Egress proxy (tinyproxy) — the single outbound chokepoint. Allowlist-only.
egressProxy:
  enabled: true
  image:
    repository: sovereign-os/egress-proxy    # built locally, loaded into kind
    tag: "0.1.0"
  # Approved external domains (matched against host; subdomains included).
  allowlist:
    - example.com
    - github.com
    - salesforce.com           # Connections slice — Salesforce API endpoints
    - my.salesforce.com
    - login.salesforce.com
    - api.kajabi.com           # Kajabi public API (token + data — one host)
    - notion.com               # Connections slice — Notion MCP endpoints
    - mcp.notion.com
    - api.notion.com
    # Personal connected-drive OAuth (Connections tab) — mirrors lib/secrets.ts.
    - googleapis.com           # Google Drive (www.googleapis.com) + token (oauth2.googleapis.com)
    - accounts.google.com      # Google OAuth consent/authorize
    - graph.microsoft.com      # OneDrive via Microsoft Graph
    - login.microsoftonline.com # Microsoft OAuth authorize + token
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 96Mi }

# Governed web_fetch tool — OPA-authorized, proxy-routed, sanitized.
webFetch:
  enabled: true
  image:
    repository: sovereign-os/web-fetch     # built locally, loaded into kind
    tag: "0.1.0"
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 250m, memory: 128Mi }

# Software live-app runner (Software tab).
softwareRunner:
  enabled: false
  namespace: agentic-apps
  appsDomain: "apps.local"
  # WP-54: an `image` app deploys its OWN committed `apps/<slug>/k8s/` manifests; the OS builds
  # no images and generates no objects. imageRegistry is the registry the PLATFORM owns and keeps
  # (an org-owned registry namespace, never an in-cluster forge that can disappear): an app may
  # run only `<imageRegistry>/<slug>@sha256:<digest>`. EMPTY = every image deploy is refused.
  # Pull credentials, when the registry is private: attach a pull secret to the `default`
  # ServiceAccount of `namespace` (kubectl patch serviceaccount default -p '{"imagePullSecrets":…}').
  imageRegistry: ""
  ingressClass: ""        # falls back to ingress.className
  tlsIssuer: ""           # falls back to ingress.tlsIssuer
  # SECURITY (C2): isolate student apps from the platform. Pod Security `restricted` (the scaffolded
  # k8s/ manifests meet it; a deploy is dry-run against this admission before it is applied).
  podSecurityStandard: restricted
  # WP-54: ValidatingAdmissionPolicies in `namespace` (files/apps-admission-policy.yaml). They hold
  # for every write os-ui makes there, independently of the OS's own gate. Kubernetes >= 1.30.
  admissionPolicy:
    enabled: true
  networkPolicy:
    enabled: true
    ingressNamespace: ingress-nginx
  # Annotation allow-list for app Ingresses, enforced by the API server
  # (templates/base/os-ui/apps-ingress-admission.yaml). Keep `allowedAnnotations` equal to
  # ALLOWED_INGRESS_ANNOTATIONS in os-ui/tabs/software/lib/native-deploy.ts (the gate checks it).
  ingressPolicy:
    enabled: true
    allowedAnnotations: ["cert-manager.io/cluster-issuer"]
    # cert-manager's controller writes its HTTP-01 solver Ingress into the app namespace.
    exemptUsers: ["system:serviceaccount:cert-manager:cert-manager"]
  # THE APP BUILDER SWITCH (docs/superpowers/specs/2026-11-26-app-builder-design.md section 2a). Default false, and
  # independent of `softwareRunner.enabled` (prod has the runner on and this off). On: os-ui gets
  # SOFTWARE_APP_BUILDER=on (templates/base/os-ui/_os-ui-env-appbuilder.tpl) and the App Builder's env namespaces,
  # registry, build steps, databases and token Secret may render. Off: every App Builder partial renders nothing, so
  # the os-ui environment is byte-identical and no pod restarts. Workstream C1 owns the rest of this block.
  environments:
    enabled: false
    # ---- C1: the two env namespaces (templates/base/os-ui/software-apps-envs.yaml, spec 6.4). Pod Security
    # `restricted` enforced, default-deny, DNS (53 and SKE CoreDNS 8053), app ingress on 8080 only from the
    # ingress controller and os-ui, a ResourceQuota each, the registry pull Secret on `default`.
    devNamespace: apps-dev
    prodNamespace: apps-prod
    appPort: 8080
    quota:
      dev: { pods: "40", cpu: "4", memory: 8Gi }
      prod: { pods: "40", cpu: "4", memory: 8Gi }
    # ---- C1: the build steps of the app-checks pipeline (build-image, push-image, scan-image; spec 6.1).
    build:
      # The builder image (images/base/builder; .github/workflows/build-images.yml image=builder), by digest.
      # Empty while the flag is on = the chart refuses to render (no silent default).
      image: ""
      # Seccomp of the build pod: `runtime-default`, or the approved fallback `localhost` = the profile
      # security-profiles-operator distributes (scripts/spo/install.sh; dev only). Never Unconfined.
      seccomp: runtime-default
      localhostProfile: operator/buildkit-rootless.json
      # Build pods (build-image, push-image, scan-image, gates) run below every platform pod and never preempt.
      priorityClass: { name: soa-build-low, value: -200 }
      resources:
        buildkitd: { requests: { cpu: 500m, memory: 1Gi }, limits: { cpu: "2", memory: 3Gi } }
        push: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
        scan: { requests: { cpu: 50m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
      # The scanner of the pushed image (same Trivy pin as the tree scan).
      trivyImage: "docker.io/aquasec/trivy:0.58.2@sha256:665030f4d33a82c1e8d9d5e0453365842236723c1ee5cc3becca698268e66a56"

# Connections golden path — manually-credentialed Connections (API/MCP/Database/
# SaaS) a Builder/Admin creates.
connections:
  enabled: true
  # Optional scheduled catalog-refresh sweep (lakehouse Expose).
  catalogRefresh:
    enabled: false
    schedule: "23 * * * *"        # hourly, offset from the other sweeps
    osUiUrl: "http://os-ui:3000"
    # The shared service bearer os-ui validates (templates/base/agent-runtime/agent-runtime-token.yaml).
    # `os-ui`/`agent-runtime-token` (the old default) names a Secret no profile renders.
    tokenSecret: "agent-runtime-token"
    tokenSecretKey: "token"
  externalSecrets:
    enabled: false             # turn on once the External Secrets Operator + a
                               # STACKIT Secrets Manager SecretStore are installed
    secretStoreRef:
      name: stackit-secrets-manager
      kind: ClusterSecretStore
    # The slice's two worked-example connections.
    items:
      - name: connection-notion-workspace
        remoteKey: connection-notion-workspace
        property: mcp-token
      - name: connection-salesforce-sales-org
        remoteKey: connection-salesforce-sales-org
        property: oauth-token

# =============================================================================
# Layer 3 (Self-service)

# Polaris — Iceberg REST catalog.
polaris:
  enabled: true
  image:
    repository: apache/polaris
    # 1.1.0-incubating: adds AwsStorageConfigInfo endpoint/endpointInternal/
    # stsEndpoint/pathStyleAccess so Polaris's OWN server-side write/commit FileIO
    tag: "1.1.0-incubating"
    digest: sha256:27d081a539aa021df00f18ff1ae0a59d9b9e7a1db2a44b643ba29c61eaa9cdf9
  # Admin/bootstrap tool image (same Polaris release).
  adminImage:
    repository: apache/polaris-admin-tool
    tag: "1.1.0-incubating"
    digest: sha256:7cdd9216c2e55a45ad0e725f47949c7632e6eadcf1e18bbcaeee19ea65f2c94e
  # Image for the catalog-registration Job (templates/extensions/lakehouse/polaris-bootstrap.yaml):
  bootstrapImage:
    repository: curlimages/curl
    tag: "8.11.1"
    digest: ""                    # optional pin; tag-only is fine
  persistenceType: in-memory      # local; relational-jdbc (durable) for STACKIT
  # Durable metastore (persistenceType: relational-jdbc).
  jdbc:
    database: polaris
    secretName: postgres-polaris-credentials
  realm: default-realm
  secretName: polaris-credentials  # local: chart-created; STACKIT: external
  s3:
    endpoint: http://minio:9000
    region: us-east-1
  catalog:
    name: lakehouse
    baseLocation: s3://lakehouse/wh
  # PURGE (delete domain only) — OFF BY DEFAULT. Switch it ON only for an announced delete window
  # (`--set polaris.purge.enabled=true`), run the delete, then switch it OFF again in the next
  # release. This is the DELETE WINDOW: while it is off, deleting a domain that holds ANY artifact
  # (data, files, knowledge, connections, metrics, dashboards, agents, apps, …) is refused; only an
  # empty domain can be deleted without it (a fresh backup is required either way). The regular `iceberg` catalog never
  # purges (its principal lacks TABLE_WRITE_DATA: a Data-tab DROP TABLE is refused, the table stays).
  # ON: the polaris-purge Job creates a DEDICATED principal holding the purge privilege, writes its
  # Trino catalog (`catalog`) into Secret `secretName` (mounted optionally into Trino's catalog dir)
  # and restarts Trino once. OFF: the same Job deletes that principal and Secret. OPA lets only
  # `trinoUser` touch the catalog; the query-tool sends only admin delete-domain drops there. The
  # long-term guard is Trino authentication (WP-14) and the default-deny NetworkPolicy package:
  # until they land, the purge user is a Trino session NAME, which is why the window stays short.
  # `catalog` and `trinoUser` are also named in policies/trino.rego.
  purge:
    enabled: false
    principal: os-domain-delete
    trinoUser: os-domain-delete
    catalog: iceberg_purge
    secretName: trino-catalog-iceberg-purge
  local:
    rootClientId: root
    rootClientSecret: polaris-local-dev-secret
  # Quarkus/JVM catalog — request reflects steady JVM footprint (heap + metaspace).
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "2", memory: 1Gi }

# Governed `query` MCP tool — read-only SQL THROUGH central Trino over the Iceberg
# marts.
# Delete domain (Admin -> Domains). `veleroNamespace`: where Velero writes its Backups — os-ui gets
# read-only get/list on `backups.velero.io` there, and the backup gate reads the
# deploy/pre-upgrade-backup.sh pair from it. Empty = no Velero: the gate refuses.
domainDelete:
  veleroNamespace: ""

queryTool:
  enabled: true
  image:
    repository: sovereign-os/query-tool     # built locally, loaded into kind
    tag: "0.6.2"                             # 0.6.2 = ADDS the promote-as-view allowlist
                                             # NEXT (0.6.3, built by build-images.yml from tag
                                             # query-tool-v0.6.3 into the org registry): DROP SCHEMA +
                                             # the purge catalog for the delete-domain run, /health
                                             # capabilities, trino_login.py. A delete run is refused
                                             # until a query-tool advertising `domain-delete` is live.
                                             #         (CREATE OR REPLACE VIEW / DROP VIEW for
                                             #         builder+ into an entitled domain schema)
  trino:
    host: trino
    port: 8080
    user: query-agent
    catalog: iceberg
    # Default session schema for unqualified queries.
    schema: sales
  # READ BUDGET for /query and MCP `query_data` (B4-review-E-1). `maxRunTime` becomes Trino's
  # `query_max_run_time` session property, which is the ONLY thing that makes Trino abandon a
  # runaway read — os-ui's 8 s abort ends its own wait, not the query. `maxRows` bounds what the
  # query-tool buffers and returns; past it the payload carries `truncated: true` and the limit
  # rather than a silently clipped result set.
  # `executeMaxRunTime` (unset) would bound WRITES too; left off on purpose, because a
  # full-refresh sync or a promote CTAS legitimately runs for minutes.
  budget:
    maxRunTime: "60s"
    maxRows: 10000
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }

# data-runner — the REAL ingest service.
dataRunner:
  enabled: true
  # Pinned by DIGEST, chart-owned (the template refuses to render without one; `localBuild: true`
  # in values.local.yaml is the only exception). Built by build-images.yml on a
  # `data-runner-v<version>` tag into the org registry namespace (as dagster and docling).
  # TODAY this pins the image that runs live (0.2.2, built by hand into the aborek namespace,
  # digest read from the running pod 2026-11-20) until the first org build exists; then
  # repository / tag / digest move together to the org image in one change.
  # DEPLOY ORDER: none needed. os-ui sends `columnNames`; an older runner ignores them and lands
  # the raw headers (valid physical names, emitted quoted); a newer runner refuses a list that
  # does not fit the file BEFORE writing and os-ui retries under the file's own names.
  image:
    repository: ghcr.io/aborek/sovereign-os/data-runner
    tag: "0.2.2"
    digest: sha256:8f7b8a3287368c915af90ee37e6053dfd77326d98fea450f87b97f4835a2e482
    localBuild: false
  # Digests of runner builds that do NOT apply os-ui's `columnNames` (built before it existed).
  # An EXTRA guard only: scripts/deploy.sh decides the capability from the pinned image's own OCI
  # label (org.sovereign-os.applies-column-names, read from the registry, fail closed) and passes
  # it as dataRunner.verifiedCapability; a digest listed here is "false" whatever its label says.
  # Rendered as the Deployment annotation sovereign-os/applies-column-names, which
  # scripts/rollback.sh and scripts/deploy.sh read (scripts/lib/runner-capability.py) to refuse
  # going below such a build while datasets store mapped column names.
  legacyDigests:
    - sha256:8f7b8a3287368c915af90ee37e6053dfd77326d98fea450f87b97f4835a2e482   # 0.2.2 (hand-built, aborek)
  # Set by scripts/deploy.sh from the image label; never set it by hand.
  verifiedCapability: ""
  polaris:
    # Same Polaris REST catalog + warehouse Trino reads/writes.
    uri: "http://polaris:8181/api/catalog"
    warehouse: lakehouse
    oauthScope: "PRINCIPAL_ROLE:ALL"
    # Reuse the SAME Polaris OAuth client Trino writes Iceberg with (key
    # POLARIS_OAUTH_CREDENTIAL = "clientId:clientSecret").
    oauthSecretName: trino-catalog-credentials
  s3:
    # Static object-storage creds come from objectStorage.secretName (no STS on MinIO
    # -> Polaris vends none; the client writes the Iceberg data files, like Trino).
    region: us-east-1
    pathStyleAccess: true
  # MinIO bucket holding both the uploads/ prefix and the wh/ warehouse root.
  uploadsBucket: lakehouse
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

# service-bearer — shared token for the in-cluster DATA-PLANE calls
# (os-ui -> query-tool + os-ui -> data-runner).
serviceBearer:
  enabled: false
  token: ""

# NOTE (2026-06-29): The personal-query sandbox engine was removed.

# Trino — the CENTRAL GOVERNED query engine for all shared marts (decided
# 2026-06-29).
trino:
  enabled: true
  image:
    repository: trinodb/trino
    tag: "476"
    pullPolicy: IfNotPresent
  # node.environment label (Trino requires it; lowercase alnum).
  environment: sovereign
  jvm:
    # Heap for the single coordinator-as-worker. Trino's deployment guide: -Xmx at 70–85 % of the
    # memory available; 4608M is 75 % of the 6 Gi limit below (WP-47, 00 §10.1).
    maxHeap: "4608M"
  query:
    # Cluster-wide + per-node memory ceilings; spill to disk keeps big joins alive.
    maxMemory: "4GB"
    # Set explicitly (06, WP-47): with memory.heap-headroom-per-node at its default 30 % of heap,
    # 2GB + 1.35GB stays below the 4608M heap, as Trino requires.
    maxMemoryPerNode: "2GB"
    spillEnabled: true
  catalog:
    # Iceberg connector against the Polaris REST catalog (OAuth2).
    iceberg:
      restUri: "http://polaris:8181/api/catalog"
      warehouse: lakehouse
      oauth2Scope: "PRINCIPAL_ROLE:ALL"
      # Local: static S3 creds (Polaris S3 credential vending needs AWS STS, absent
      # in the MinIO stand-in).
      vendedCredentials: false
      # local: clientId:clientSecret derived from polaris.local; external: from a
      # Secret named here with key POLARIS_OAUTH_CREDENTIAL (External Secrets).
      oauth2SecretName: ""
      # Dataset versions are Iceberg snapshots (WP-37). `snapshotRetention` is how long the weekly
      # maintenance keeps an UNTAGGED snapshot (`expire_snapshots`, `<n>d` or `<n>h`); a tagged or
      # branched version is kept whatever its age (Iceberg keeps every snapshot a ref points to).
      # It reaches os-ui as OS_ICEBERG_SNAPSHOT_RETENTION and the dbt project as the
      # `snapshot_retention` var. `expireSnapshotsMinRetention` is Trino's floor
      # (`iceberg.expire-snapshots.min-retention`); empty keeps Trino's default (7d).
      snapshotRetention: 7d
      expireSnapshotsMinRetention: ""
  s3:
    region: us-east-1
    pathStyleAccess: true
  # External-warehouse FEDERATED catalogs (opt-in; default EMPTY so nothing changes).
  externalCatalogs: []
  # PER-CLOUD MANAGED catalog (opt-in; DEFAULT off → provider empty, nothing renders,
  # so STACKIT/local are unchanged and Apache Polaris stays the sole/default catalog).
  cloudCatalog:
    provider: ""
  # Optional ServiceAccount for the Trino pod — the IRSA (AWS)
  serviceAccount:
    create: false
    name: trino
    annotations: {}
  # OPA governance + resource groups are layered in their own phases (the chart
  # renders access-control.properties + resource-groups.properties from these).
  opa:
    enabled: true
    uri: "http://opa:8181"          # same OPA instance that governs agent tools
    # WP-14 (04 M8, 06 §5.4): an OPA container in the Trino pod on 127.0.0.1:8181 serves Trino's
    # checks (same image, policies and config as `opa`), and `uri` above is ignored. Keep OFF
    # until the `os-data` / `os-grants` bundles (WP-11) are live: os-ui's runtime PUTs reach the
    # `opa` Service only, so a sidecar without bundles would hold no governance data. `bundles`
    # is OPA's own `services:` + `bundles:` configuration, appended to the sidecar's config file
    # unchanged (https://www.openpolicyagent.org/docs/management-bundles).
    sidecar:
      enabled: false
      bundles: {}
  # AUTHENTICATION (WP-14, design 06 §5.2 option B / T2). Off by default: nothing changes until
  # the cut-over (docs/components/trino-cutover.md). When on, Trino serves TLS on `httpsPort`
  # and authenticates every client there with the PASSWORD file authenticator
  # (https://trino.io/docs/476/security/password-file.html, tls.html, internal-communication.html).
  # The three `svc-*` users may then act for someone else only as OPA allows
  # (policies/trino_impersonation.rego); `directUsers` log in as themselves and impersonate nobody.
  auth:
    enabled: false
    httpsPort: 8443
    # DUAL-RUN. true: the plain-HTTP port keeps serving the clients that have not moved yet,
    # exactly as today (`http-server.authentication.allow-insecure-over-http=true`: no password
    # is ever accepted there). false: the closed state — Trino refuses every statement on plain
    # HTTP (403 "Authentication over HTTP is not enabled"); only /v1/info stays for the probes.
    insecureHttp: true
    # The server certificate. `helm`: a namespace CA and certificate generated once by Helm and
    # kept across upgrades (lookup), for kind, CI and dev. `certManager`: cert-manager issues it
    # from a namespace CA (Issuer chain below; needs cert-manager >= 1.15 for the CombinedPEM
    # output Trino's PEM keystore reads). `existing`: a Secret you provide with keys
    # `tls-combined.pem` (key + chain) and `ca.crt`. Clients trust `ca.crt` only.
    tls:
      source: helm
      secretName: trino-tls
      certManager:
        duration: 2160h      # 90 d
        renewBefore: 360h    # 15 d
    # Service users and their passwords. Generated once (bcrypt cost 10, kept across upgrades)
    # into Secret `secretName`: key `password.db` for Trino, one key per user for its client. With
    # `existingSecret` (ESO, WP-10) the chart renders nothing and mounts that Secret instead; it
    # must carry the same keys.
    passwords:
      secretName: trino-service-users
      existingSecret: ""
    impersonators: [svc-os-ui, svc-os-worker, svc-dagster-runner]
    # `sales`: the seed Job's default Trino user (marts.trino.user, the sales DOMAIN principal) — it
    # authenticates with its own password here when clients.northpeakMarts is on.
    directUsers: [northpeak-marts, sales]
    # Direct service users whose password the query-tool also mounts, so it logs in AS them when
    # one is the principal (no impersonation). The delete-domain purge user belongs here once
    # PR #197 is in (`os-domain-delete`, also in `directUsers`).
    queryToolDirectUsers: []
    # Who may reach which Trino port while the cut-over runs (templates/.../trino-network-policy.yaml).
    # 8443: any pod in the namespace. 8080 (dual-run only): the query-tool and the seed Job until
    # their flags move them, plus `legacyHttpClients` — the Dagster code server and run pods
    # (`component: user-deployments`) until WP-15 moves them to svc-dagster-runner.
    networkPolicy:
      enabled: true
      legacyHttpClients:
        - { component: user-deployments }
    # Which clients use the TLS port. Each switches on its own; see the cut-over order.
    clients:
      queryTool: false        # needs a query-tool image with trino_login.py (WP-14)
      northpeakMarts: false
  # ADMISSION CONTROL (06 §5.5, WP-13). `config` IS Trino's resource-group document
  # (https://trino.io/docs/476/admin/resource-groups.html), rendered as JSON unchanged.
  # Selection is by the client's source (`X-Trino-Source`), first match wins:
  #   - `dbt-trino-<version>` (the source dbt-trino itself sends), `dagster/...` (the Dagster
  #     code location) and `os-seed/...` (seed Jobs) → global.system;
  #   - `os-ui/<domain>/<surface>` (query-tool, set by os-ui) → global.domains.<domain>.<user>,
  #     created on demand from the named capture and ${USER};
  #   - `query-tool/mcp` (the query-tool's MCP tools, its service user) → global.other, by name;
  #   - anything else → global.other, small on purpose, so an untagged client is visible. No os-ui
  #     path reaches it: os-ui always sends a captured source (core/infra/trino-source.ts), and the
  #     query-tool refuses an untagged /query or /execute with 400.
  # The source is a scheduling input only. WP-14 (T2) adds authentication and moves the system
  # selector to `authenticatedUser`.
  resourceGroups:
    enabled: true
    config:
      rootGroups:
        - name: global
          softMemoryLimit: "80%"
          hardConcurrencyLimit: 40
          maxQueued: 2000
          subGroups:
            - { name: system, softMemoryLimit: "40%", hardConcurrencyLimit: 6, maxQueued: 100 }
            - name: domains
              softMemoryLimit: "60%"
              hardConcurrencyLimit: 30
              maxQueued: 1000
              subGroups:
                - name: "${domain}"
                  softMemoryLimit: "30%"
                  hardConcurrencyLimit: 8
                  maxQueued: 200
                  subGroups:
                    # maxQueued 40: a dashboard fans out one query per measure, all at once
                    # (tabs/dashboards/lib/build/panel-query.ts Promise.all), so one viewer's
                    # queue must hold the largest dashboard (WP-13 verifier note 6). A queued
                    # query costs no memory; a full queue rejects with QUERY_QUEUE_FULL.
                    # Proven by tests/lakehouse/limits.int.test.mjs (2 running + 40 queued).
                    - name: "${USER}"
                      softMemoryLimit: "15%"
                      hardConcurrencyLimit: 2
                      maxQueued: 40
                      softCpuLimit: 5m
                      hardCpuLimit: 10m
            - { name: other, softMemoryLimit: "10%", hardConcurrencyLimit: 2, maxQueued: 20 }
      cpuQuotaPeriod: 1m
      selectors:
        - { source: '^(dbt-trino-[0-9.]+|dagster/.+|os-seed/.+)$', group: global.system }
        - { source: '^os-ui/(?<domain>[a-z0-9_]+)/.*', group: 'global.domains.${domain}.${USER}' }
        # The query-tool's own MCP tools (via the LiteLLM MCP gateway, as its service user).
        - { source: '^query-tool/mcp$', group: global.other }
        - { group: global.other }
  # SERVER-SIDE QUERY LIMITS (06 §5.5, WP-13): Trino's file session-property manager
  # (https://trino.io/docs/476/admin/session-property-managers.html). `rules` IS its JSON
  # document. Reads in the domain groups get the interactive budget; writes (CTAS, syncs) are
  # not bounded here, matching the query-tool's unbounded `/execute`. These are defaults a
  # client may override when access control allows it; the OPA deny for `query_max_*` is WP-14.
  sessionProperties:
    enabled: true
    rules:
      - group: '^global\.domains\..*'
        queryType: SELECT
        sessionProperties: { query_max_run_time: 60s, query_max_execution_time: 45s, query_max_scan_physical_bytes: 20GB }
      - group: '^global\.domains\..*'
        queryType: DESCRIBE
        sessionProperties: { query_max_run_time: 60s, query_max_execution_time: 45s }
      - group: '^global\.domains\..*'
        queryType: EXPLAIN
        sessionProperties: { query_max_run_time: 60s, query_max_execution_time: 45s }
      - group: '^global\.system$'
        sessionProperties: { query_max_run_time: 2h, query_max_execution_time: 2h }
  # FILE-BASED ACCESS CONTROL, CHAINED AFTER OPA (engine rebuild B3). Trino accepts a
  # LIST of system access controls (`access-control.config-files`) and every one of them
  # must allow — so this file can only ever NARROW what policies/trino.rego permits. It
  # expresses the two things the OPA plugin cannot: IMPERSONATION (dbt-trino in a Dagster
  # run pod connects as `serviceUser` and acts as `OS_PRINCIPAL`) and SCHEMA OWNERSHIP
  # (who may CTAS into a domain schema / a personal lane).
  #   What ships here is the BOOTSTRAP file: impersonation bounded by the OS id SHAPE,
  #   nothing ownable. os-ui then reconciles the same ConfigMap key from real domain
  #   membership (core/infra/trino-rules-server.ts) and Trino re-reads it within
  #   `refreshPeriod` — no roll. Enumerated principals replace the pattern at that point.
  #   NO SECRET may ever go in this file: it is a ConfigMap, visible to anyone who can read it.
  accessControl:
    enabled: true
    # The Trino user dbt-trino authenticates as (profiles.yml `user`), allowed to act as
    # an OS principal and as nothing else.
    serviceUser: dbt-runner
    # The shape of an OS principal id (domain name or uid). MUST equal
    # core/infra/trino-rules.ts OS_PRINCIPAL_PATTERN (os-ui/core/infra/trino-rules.test.ts
    # asserts it, together with the whole bootstrap document below).
    principalPattern: "[A-Za-z0-9][A-Za-z0-9._-]{0,63}"
    # How often Trino re-reads rules.json (so a membership change lands without a restart).
    refreshPeriod: 30s
    # How often os-ui re-reconciles the ConfigMap even when nothing changed (minutes, jittered,
    # a no-op PATCH-wise when the bytes already match). This is what repairs a `helm upgrade`,
    # which rewrites Helm's bootstrap value over the OS's enumerated one — B3-review-H-3.
    reconcileIntervalMinutes: 10
  resources:
    requests: { cpu: "1", memory: 2Gi }
    limits: { cpu: "4", memory: 6Gi }   # WP-47 (00 §10.1): 8 → 6 Gi with the heap above

# Metrics — the alert-evaluator CronJob that drives the builder+ alert-run route
# (os-ui app/api/metrics/alerts/run) on a schedule.
metrics:
  alerts:
    cron:
      enabled: false            # operator turns it on
      schedule: "*/5 * * * *"   # every 5 minutes
      # Secret holding the builder+ service principal's credentials (keys:
      # username, password). Provision it before enabling.
      principalSecret: metrics-alert-principal
      # os-ui service DNS (in-cluster). Override only for non-default topologies.
      osUiUrl: "http://os-ui:3000"

# Data — the Data tab's scheduled surfaces.
#
# REMOVED in engine rebuild B4: `data.quality.cron` (the DQ sweep CronJob → POST /api/data/dq/run-all)
# and `dataSync.sweep` (the fallback sync sweep CronJob → POST /api/data/sync-due), together with
# both routes. Quality rules ARE dbt tests now: every scheduled `dbt build` runs them inside the
# Dagster run and the OS reads them back as asset checks, so a second OS-side sweep would write rows
# Dagster does not know about; and sync schedules live in each domain's repository
# (`os/schedules.yml`), executed by the Dagster `sovereign` code location, so a sweep that also
# fired them would run every slice twice. Nothing in the OS provisions a `batch/v1` CronJob for data
# any more (checklist D7).
#
# Known gap, recorded as a follow-up in the plan: the DQ sweep was also what delivered the
# "new failure" e-mail to a dataset owner. The Dagster failure sensor quarantines a repeatedly
# failing schedule, but nobody is notified yet; the smallest fix is to alert from the asset-check
# read-back (`latestDqRun` + a persisted last-alerted badge + `deliverDqAlert`, all of which exist).

# Admin Console — REMOVED.

# OS UI — the Next.js front door. App shell + live surfaces:
osUI:
  # WP-05: the Platform page's node list, read with a read-only ClusterRole (get/list nodes;
  # templates/base/os-ui/os-ui-nodes.yaml). enabled=false = the list is off by config and the page
  # says so in a neutral note. createClusterRole=false = the list stays on, but the ClusterRole +
  # binding are pre-created by a cluster admin (for a deploy account without cluster RBAC rights).
  nodesReader:
    enabled: true
    createClusterRole: true
  enabled: true
  # Operational + external connector adoption (Connections tab and its MCP tools).
  # The template reads EXTERNAL_CONNECTORS_ENABLED; keep the key here so an
  # operator's `true` is not silently lost when values are re-derived.
  externalConnectorsEnabled: false
  # Local (kind): scripts/os sets nodePort=30080 so the UI is http://localhost:8080.
  service:
    nodePort: null
  # Gate os-ui startup on OpenSearch (the durable user-directory mirror).
  waitForOpenSearch: true
  # In-memory user seeding while the mirror is unreachable is a no-cluster DEV
  # convenience only. Production fails closed (503)
  allowOfflineUserSeed: false
  # MAY THIS DEPLOYMENT FABRICATE? (OS_OFFLINE_MOCK — core/kernel/offline-mock.ts)
  # `refuse` (the default, and what every unrecognised value resolves to): an unreachable
  # engine — Trino, the query-tool, the data-runner, an app runner — is an OUTAGE. The OS
  # returns a typed ENGINE_UNAVAILABLE refusal and NO number, NO table, NO row count and NO
  # passing security scan. `allow`: the local TEACHING flow, where no cluster exists and the
  # deterministic, honestly-labelled `offline-mock` worked example is the point.
  # Set it here rather than leaving it to a default: the predecessor gate keyed on OS_PROFILE,
  # which nothing in this chart ever set, so it read `local` on a real cluster and the OS served
  # hash-seeded numbers as KPIs. Rendered into BOTH the os-ui and os-ui-worker env.
  #
  # ONE LEVER, DELIBERATELY. There is NO per-subsystem exemption and none is planned: a
  # per-metric, per-ingest or per-scan escape hatch would be filed under pressure, for one
  # subsystem, by whoever hit the refusal first — and the whole value of a single tripwire is
  # that there is exactly one place to read to answer "can this cluster fabricate?".
  # The consequence to plan for: with `refuse`, a SOFTWARE DEPLOY CANNOT BE APPROVED until a
  # real scanner (Semgrep / Trivy / gitleaks) is wired behind `securityScan(files, 'live')`,
  # because `decide_deploy` approves only on a passing scan and a scan with no engine now
  # reports `unavailable` instead of `passed`. Flipping this key to `allow` to unblock a deploy
  # also re-enables fabricated metrics, ingests and connector syncs tenant-wide. Wire the
  # scanner instead.
  offlineMock: refuse
  # WHICH MODELS MAY BE SENT IMAGES (MODEL_IMAGE_ALLOWLIST - os-ui/core/models/capabilities.ts).
  # An image sent to a model leaves the OS for wherever that gateway alias points, so the
  # answer is an EXPLICIT list of LiteLLM model_names, never a guess from the name.
  #   - key absent / null (DEFAULT): the built-in list - the role `sovereign-strong` (and the old
  #     names that still resolve to it for one release). Map `sovereign-strong` to a model that
  #     accepts images, or set this list.
  #   - a list: REPLACES the built-in list (it is not merged), so you can remove a model as
  #     well as add one. Names are exact and case-sensitive; there is no wildcard.
  #       imageAllowlist: ["sovereign-strong", "my-eu-vlm"]
  #   - an empty list []: NO model may be sent images.
  # A model that is not on the list is never sent an image, whatever it is called. If you
  # re-point a listed alias at another endpoint in `litellm.proxy_config.model_list`, or add a
  # router fallback from a listed alias to an unlisted one, update this list in the same change.
  # Platform -> Models & Providers shows the list in force and an "Images: yes/no" tag per model.
  # Rendered into BOTH the os-ui and os-ui-worker env. Nothing sends images to a model yet;
  # this is the list the upcoming image features will obey.
  imageAllowlist: null
  # MODEL CONTEXT AND OUTPUT LIMITS (MODEL_CONTEXT_WINDOWS - os-ui/core/models/context-windows.ts).
  # By DEFAULT the OS reads each model's limits from LiteLLM (`/model/info`: `max_input_tokens`,
  # `max_output_tokens`) for the catalog model every role (sovereign-strong / -worker) is mapped to,
  # so a remap follows with no change here. Set `litellm.proxy_config.model_list[].model_info` for a
  # model LiteLLM does not know. This key is an EXPLICIT OVERRIDE and wins over the catalog:
  #   modelContextWindows:
  #     sovereign-strong: { contextWindow: 256000, reservedOutput: 32000, maxOutput: 262144 }
  # `reservedOutput` is the normal `max_tokens`; `maxOutput` (optional) is the ceiling a retry may use
  # when a reasoning model spent its whole budget thinking. Absent/null = no override. Rendered into
  # BOTH the os-ui and the os-ui-worker env (the worker makes the model calls).
  modelContextWindows: null
  # `reasoning_effort` PER STEP KIND of an agent run (MODEL_REASONING_EFFORT_ACT / _PLAN / _FINAL):
  # bounded ACT steps `low`, the PLAN and the FINAL report `medium` (or `high`). Each is OFF unless set:
  # LiteLLM forwards the parameter unchanged to an OpenAI-compatible provider (it also has a per-model
  # `default_reasoning_effort` in `model_info`), but whether the model honours it is the provider's
  # decision. Independently of this, a reasoning model that spends its whole output budget thinking is
  # retried ONCE at `low` (see os-ui/core/runtime/reasoning-budget.ts).
  #   reasoningEffort: { act: low, plan: medium, final: medium }
  reasoningEffort: null
  # An ADMIN OVERRIDE (unset by default): the WORKER role's own `reasoning_effort` in an agent run
  # (MODEL_REASONING_EFFORT_WORKER_ACT / _PLAN / _FINAL), each falling back to `reasoningEffort` above, e.g.
  #   reasoningEffortWorker: { act: low, plan: medium }
  # Temperature / top_p are NOT set here: every call is sampled as its model's vendor recommends
  # (os-ui/core/models/model-sampling.ts, with the source of each value).
  reasoningEffortWorker: null
  # SOFTWARE TAB - the LIVE SECURITY SCANNER (2026-11-19). Trivy (Apache-2.0) runs as ONE
  # Kubernetes Job per deploy request, in THIS namespace, over the app's committed tree:
  # dependency vulnerabilities from its manifests/lockfiles + committed secrets. The Job's
  # JSON is mapped onto the review card's existing scan shape. `mode: 'live'` is reported
  # ONLY when the Job actually completed - a disabled scanner, an unreachable API server, a
  # failed Job or a timeout all leave the scan `unavailable` with a reason, which the Builder
  # review card shows and `decide_deploy` refuses to approve (PR #56). This is the thing that
  # `osUI.offlineMock: refuse` tells you to wire; it is NOT a way to re-enable fabrication,
  # and it changes OS_OFFLINE_MOCK not at all.
  #
  # `sast` stays honestly NOT RUN: Trivy is not a SAST engine, and Semgrep's engine is
  # LGPL-2.1 - forbidden by licenses/policy.json - so there is nothing allowed to
  # wire behind it. The card labels the category "not run" rather than showing `sast 0`.
  software:
    scanner:
      # ON by default. A cluster WITHOUT a scanner cannot approve a software deploy at all,
      # so the useful default is "try, and say so honestly when it does not work".
      enabled: true
      image:
        repository: aquasec/trivy
        tag: "0.58.2"
        digest: ""              # optional pin; set it for an immutable, content-addressed ref
      # WHERE TRIVY GETS ITS VULNERABILITY DATABASE - a real choice, not a detail:
      #   mirror  (default) the Job pulls the DB from `dbRepository`. Needs DNS + TCP 443 to
      #                     that registry; the chart's `software-scanner-egress` NetworkPolicy
      #                     opens exactly that and nothing else.
      #   offline           `--skip-db-update --skip-java-db-update --offline-scan`. The DB must
      #                     ALREADY be inside the image you pull. Air-gapped installs set this
      #                     AND point `image.repository` at their own DB-baked mirror image.
      # `mirror` is the default deliberately: `offline` against an image with no DB finds
      # NOTHING and would report a PASS - a clean verdict from an empty database is the exact
      # outcome this gate exists to prevent.
      dbMode: mirror
      dbRepository: ghcr.io/aquasecurity/trivy-db
      # WHERE THE SCAN RUNS. Empty = the release namespace, beside os-ui (the default, and what
      # has been exercised). Deliberately NOT softwareRunner.namespace: a scan holds the app's
      # SOURCE, and the apps namespace is where untrusted student code runs.
      #
      # The cost of the default, stated plainly: `pods`/`pods/log` cannot be narrowed by name, so
      # in the release namespace the os-ui ServiceAccount gains read access to every pod LOG in
      # the platform namespace (it already had namespace-wide `pods` get/list, so this adds the
      # log subresource rather than a new reach). Setting a name here — e.g. `software-scans` —
      # moves the whole grant set (jobs, pods/log, and secrets create/delete) into a dedicated,
      # default-deny, Pod-Security-`restricted` namespace this chart creates, and leaves the
      # platform namespace with none of it. That is the better posture and the intended default
      # once it has been run on a real cluster.
      namespace: ""
      # Wall clock for one scan, including the DB fetch. On expiry the Job is abandoned and the
      # scan is `unavailable` with the timeout as its reason - never a pass.
      timeoutSeconds: 180
      resources:
        requests: { cpu: 100m, memory: 256Mi }
        limits:   { cpu: "1",  memory: 1Gi }
    # SOFTWARE FACTORY CI (go-live 1): the per-commit checks of an app run as Tekton PipelineRuns.
    # OFF by default because it needs Tekton Pipelines and Triggers installed first, as separately
    # versioned platform components: `bash scripts/tekton/install.sh` (pins in
    # scripts/tekton/versions.env). With it off, a check can not run and says so (the record
    # carries the reason; a deploy of a golden-path app is refused), it is never reported green.
    # This replaces the hand-made sandbox Job and its SOFTWARE_SANDBOX_* settings (retired).
    tekton:
      enabled: false
      # The build namespace: Pod Security `restricted`, default-deny network, a quota.
      namespace: agentic-build
      # Where a run clones the domain repository from. Empty = the in-cluster `os-git-http` Service.
      gitBaseUrl: ""
      # Where the npm registry is reached from. Empty = the platform egress proxy; its allowlist
      # (`egressHosts` below) is the only way out for the app's code.
      httpProxy: ""
      egressHosts:
        - registry.npmjs.org
      timeouts:
        pipeline: 30m
      workspace:
        storage: 2Gi
        storageClassName: ""
      quota: { pods: "20", cpu: "6", memory: 12Gi, pvcs: "30" }
      # Run history: the newest N PipelineRuns are kept (the OS copies each verdict and its logs
      # into the app record, so nothing is lost by pruning).
      history: { keep: 30, schedule: "17 * * * *" }
      pruner:
        image: ""             # default pins ghcr.io/tektoncd/plumbing/tkn by digest
      # How long os-ui waits for a run when a caller needs the answer now (verify_app_gates,
      # request_deploy). The run continues after; a caller that times out gets `running`.
      waitSeconds: 180
    # ---- APP BUILDER blocks (docs/superpowers/specs/2026-11-26-app-builder-design.md). Created EMPTY by W0; each
    # is owned and filled by one workstream (plan "Ownership after W0"). Nothing reads them while
    # `softwareRunner.environments.enabled` is false, so they render nothing by default.
    # Workstream C1: the platform registry (Zot) apps are built into and pulled from
    # (templates/base/os-ui/software-registry.yaml, spec 6.2). Rendered only with softwareRunner.environments.enabled.
    registry:
      # zot = the in-cluster Zot below; external = any OCI registry at `externalUrl` (Zot not rendered; push
      # credentials and pull Secrets are then the operator's).
      mode: zot
      externalUrl: ""
      image: "ghcr.io/project-zot/zot:v2.1.23@sha256:9d3de83ac2099e6f4843045b4c9b65b7e8baf40f92d28f54906dee9d4d390fd7"
      storage: { size: 20Gi, storageClassName: "" }
      resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
      # NODE PULLS. The kubelet's runtime cannot use cluster DNS, so nodes pull through one of:
      #   ingress-restricted (default): an Ingress on the platform controller with TLS and a MANDATORY source-range
      #     allowlist (the nodes' / NAT egress CIDRs); the chart refuses to render with an empty list;
      #   internal-lb: a provider internal LoadBalancer (annotations below);
      #   external: Zot is not exposed (mode external, or pulls handled elsewhere).
      exposure: ingress-restricted
      host: ""                  # node-facing registry host, e.g. registry.dev.example.com
      allowedSourceRanges: []   # REQUIRED for ingress-restricted, e.g. ["203.0.113.7/32"]
      tlsSecretName: ""         # default zot-tls (issued by ingress.tlsIssuer through cert-manager)
      internalLoadBalancer: { annotations: {} }
      # Base images: Zot's on-demand sync mirror, through the egress proxy, of these docker.io repositories only.
      mirror:
        upstream: https://registry-1.docker.io
        prefixes: ["library/node"]
      # Retention: release digests are tagged `release-*` by the release flow (C2) and kept; otherwise the newest N.
      retention: { keepNewest: 10, delay: 24h }
      # The zot-users reconcile (htpasswd + access control from the per-domain push Secrets os-ui writes).
      users:
        schedule: "*/5 * * * *"
        resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
    # Workstream D: the app databases (CloudNativePG `apps-pg` per env namespace; mode cnpg | external).
    databases: {}
  # Workstream E (App Builder): the app identity token (D1) signing key and issuer.
  appToken: {}
  image:
    repository: sovereign-os/os-ui    # built locally, loaded into kind
    tag: "0.1.0"
  # AGENT RUNS IN A WORKER (engine rebuild A4). Off by default: with `enabled: false` the pod
  # that files a run in `run_jobs` also executes it (AGENTS_WORKER=inline) — a kind install or a
  # single-pod deploy behaves exactly as before and needs no second workload.
  # With `enabled: true` a second Deployment (`os-ui-worker`, SAME image, the worker command)
  # claims jobs with FOR UPDATE SKIP LOCKED and drives them off-request, and os-ui switches to
  # AGENTS_WORKER=worker so it only ENQUEUES and TAILS `run_events`. That is what makes a run
  # longer than the 300 s request cap finish, and an os-ui rolling restart lose no run.
  # Requires postgres.enabled (the `agent_runs` database holds the queue AND the checkpoints).
  # X9 (engine rebuild Part D) — the agent engine's guardrails on EVERY tool call, so a large or
  # slow data read can neither blow the prompt nor hang a superstep. Empty ⇒ the code defaults
  # (20 000 characters, 60 000 ms). Run-path: the os-ui-worker pod gets them as well.
  agentToolResultMaxChars: ""
  agentToolCallTimeoutMs: ""
  # RETENTION for the `agent_runs` database (A13 follow-up). A LangGraph checkpoint holds the
  # run's RAW tool results and `run_events` holds the same payloads as a stream, so without a
  # bound the database grows forever — and it is the one store the Langfuse redaction setting
  # does NOT cover. A run that SETTLED (`done` / `failed`) longer ago than this many days has its
  # checkpoint thread, its `run_events` rows and its `run_jobs` row deleted by a periodic sweep
  # (the worker loop every 6 h; one sweep at os-ui boot when `worker.enabled: false`).
  # A `parked` run — one waiting on a Governance approval — is NEVER swept at any age: its
  # checkpoint IS the run, and deleting it would make the pending decision unresumable.
  # Empty ⇒ the code default of 30 days. `"0"` ⇒ keep everything (your own policy decides).
  agentRunsRetentionDays: ""
  # AGENT SYSTEMS AS NATIVE LANGGRAPH MODULES (WP-53). `enabled: false` (default): today's engine and
  # git layout, unchanged. `enabled: true`: NEW runs execute the system's committed graph.mjs (after
  # its hash check) and the domain repo is generated in the module layout — ONLY in the listed
  # `domains` (a list, e.g. [test], or "test,sales"; "*" = every domain). An empty list means no
  # domain, so `enabled: true` without domains refuses to render. A parked run ALWAYS resumes on the
  # engine stamped on it, whatever these values say (turning this off never moves a parked run).
  # Before turning it on, run the read-only id preflight in the worker pod for those domains:
  #   node --experimental-strip-types src/worker/agent-id-preflight.mjs --domains test   (exit 0)
  agentGraphModule:
    enabled: false
    domains: []
  # NATIVE DASHBOARDS (WP-52). `false` (default): dashboards are written in the os.sovereign/v1
  # format, unchanged. `true`: DASHBOARDS_NATIVE=true — each domain's dashboards/ subtree is
  # generated as dbt `saved_queries:` + `exposures:` and Vega-Lite v5 panel specs, and drawn back
  # from those files. The first write in a domain after turning it on regenerates that domain's
  # dashboards/ (the migration; dry-run plan: os-ui/scripts/dashboards-native-migrate.mjs).
  # Rollback: set it back to false; the next write regenerates the v1 files (`git revert` the
  # regeneration commit to restore the exact bytes).
  dashboardsNative: false
  # THE KEY EACH AGENT SYSTEM GETS AT BUILD (`os-<systemId>`, minted by os-ui's Build with the
  # LiteLLM admin API — not the shared `litellmAgentKey` above, whose values never reached it).
  # These caps are applied on EVERY Build / Rebuild: an existing key is reconciled to them
  # (LiteLLM /key/update), so changing a value here and pressing Rebuild is enough.
  #   maxBudget      USD the key may spend per budgetDuration.
  #   budgetDuration LiteLLM `budget_duration` ("7d" weekly, "30d", "24h"). "none" = a LIFETIME cap
  #                  that never resets: the system stops for good once it is spent. At the seeded
  #                  price of the reasoning model ($1.50 per 1M input tokens) $5 is roughly 3M
  #                  tokens — a few dozen ordinary runs.
  #   rpmLimit / tpmLimit  requests and tokens per minute, per system (same as the shared key).
  #   maxParallelRequests  model calls in flight on one system's key at once (LiteLLM
  #                  `max_parallel_requests`; a breach is a 429 the agent engine waits out).
  # Leave a value empty to use the code default shown here.
  # The key's MODEL list is not set here: Build derives it from the system's definition, the
  # model roles a run uses (reasoning + tools) and the gateway's router fallbacks
  # (litellm.proxy_config.router_settings.*fallbacks), so a fallback never hits a 403.
  agentSystemKey:
    maxBudget: 5
    budgetDuration: "7d"
    rpmLimit: 300
    tpmLimit: 1000000
    maxParallelRequests: 8
    # THE CONTINUOUS KEY RECONCILE. The platform team may edit a system's key directly in LiteLLM, so
    # os-ui compares every system's key with its definition on a timer (the first pass is one
    # interval after start-up) and REPORTS a difference — Admin → Gateway and Monitoring → Agents —
    # without overwriting it. An admin puts a key back with "Re-apply from the OS" (audited).
    #   intervalSeconds     how often; 0 switches the check off.
    #   autoCorrectSystems  system ids whose key is put back automatically when it drifts
    #                       (audited as gateway.key.reconcile); ["*"] = every system. Empty = alert only.
    reconcile:
      intervalSeconds: 300
      autoCorrectSystems: []
  # THE SECRET THE PER-SYSTEM KEYS ARE ENCRYPTED UNDER. Each system's key is random, and its
  # only copy outside the gateway is stored encrypted in the `agent_runs` database; os-ui and the
  # worker decrypt it with this secret (it is NOT the LiteLLM master key). Leave both EMPTY on a
  # `helm install/upgrade` deployment: the chart generates a value once and keeps it across
  # upgrades (templates/base/os-ui/os-ui-agent-key-encryption.yaml).
  #   secret          an explicit value (32+ characters). REQUIRED when the chart is rendered
  #                   without access to the live cluster (`helm template`, a GitOps
  #                   controller), because the generated value cannot be kept there.
  #   existingSecret  name of a Secret you manage, with the key AGENT_KEY_ENCRYPTION_KEY.
  # IF THIS VALUE CHANGES, every stored key becomes unreadable: each system shows "Rebuild
  # needed" and does not run until its owner presses Rebuild once. Nothing else is lost.
  agentKeyEncryption:
    secret: ""
    existingSecret: ""
  # CONNECTION CREDENTIALS (2026-11-23). Every credential a user saves on a connection (API token,
  # OAuth token set, client secret) is stored as ONE Kubernetes Secret in a dedicated namespace
  # (`os-conn-secret-*`, labels app.kubernetes.io/managed-by=os-ui +
  # app.kubernetes.io/component=connection-secret), SEALED app-side with AES-256-GCM under the key in
  # `os-secrets-encryption-key` — etcd and backups only hold ciphertext, whether or not the cluster
  # encrypts etcd at rest. os-ui and os-ui-worker read/write them with their own ServiceAccounts
  # (Role `os-ui-connection-secrets`, in that namespace only). Leave the key fields EMPTY on helm install/upgrade: the chart
  # generates the key once and keeps it (lookup + resource-policy keep).
  #   secret              an explicit key (32+ characters). REQUIRED under `helm template` / GitOps.
  #   existingSecret      a Secret you manage with the key OS_SECRETS_ENCRYPTION_KEY.
  #   previousKeysSecret  a Secret with OS_SECRETS_ENCRYPTION_KEY_PREVIOUS (comma-separated retired
  #                       keys that may still decrypt) — only during a deliberate rotation.
  # IF THE KEY CHANGES without previousKeysSecret, every stored credential becomes unreadable (named
  # on /api/status) and each connection needs a reconnect. It is never rotated silently.
  #   namespace           the DEDICATED namespace the credential Secrets live in (default
  #                       `<release namespace>-conn-secrets`; never the release namespace — the
  #                       render fails). The only namespace where os-ui/os-ui-worker hold Secret rights.
  #   createNamespace     false when the namespace is managed outside this chart.
  #   gitops              true under helm template / Argo / Flux: the render then FAILS unless the key
  #                       comes from `secret`, `existingSecret` or ESO (a generated key cannot be kept).
  # The key Secret is labelled velero.io/exclude-from-backup (never backed up with the ciphertext):
  # for disaster recovery source it from STACKIT Secrets Manager (ESO / existingSecret).
  #
  # ENVELOPE ENCRYPTION (2026-11-24; docs/ops/connection-keys.md): credentials are sealed under a DATA
  # key; a KEY PROVIDER wraps it. The provider is chosen by the admin in the install wizard / Platform →
  # Encryption keys — builtin (this Secret is the master key; the admin saves a one-time recovery key),
  # STACKIT KMS, … — not in values. This Secret is ALWAYS needed: it is the builtin master key, and it
  # seals the credential of any other provider (a provider cannot protect its own credential).
  # GitOps installs may instead source it from STACKIT Secrets Manager through ESO; the first key record
  # then names the `eso` provider (os-ui reads OS_KEY_PROVIDER=eso):
  #   externalSecrets:
  #     enabled: true
  #     store: {instanceId: <id>, username: <read-only user>}
  #     managed: [..., os-secrets-encryption-key]            # + os-secrets-encryption-key-previous
  #     remoteKeys: {os-secrets-encryption-key: <KV path>}   # optional; default <prefix>/<name>
  #   (leave secret/existingSecret empty; put the key in the vault first with
  #    scripts/ops/conn-key-secrets-manager.py create | migrate)
  # PROD RELEASE CHECK (scripts/smoke-test.sh): builtin needs a CONFIRMED recovery key; override
  # --allow-unrecoverable-conn-key.
  connectionSecrets:
    namespace: ""
    createNamespace: true
    gitops: false
    secret: ""
    existingSecret: ""
    previousKeysSecret: ""

  worker:
    enabled: false
    replicas: 1
    # Lease a worker holds on a claimed run (ms). A `running` job whose heartbeat is older than
    # this is re-queued ONCE (it continues from its checkpoint), then failed. Must exceed the
    # longest superstep (one model call + one tool call).
    leaseMs: 600000
    # Must be >= one superstep: SIGTERM lets the current superstep finish and checkpoint, then the
    # run goes back on the queue. Too short and the pod is killed mid-model-call (still resumable
    # from the previous checkpoint, but a wasted call).
    terminationGracePeriodSeconds: 420
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits:   { cpu: "2",  memory: 1536Mi }
  # How much of a model/tool call reaches Langfuse (LANGFUSE_REDACTION). Empty = `structure`:
  # roles + character counts for message content, the full tool-call structure, a 160-char result
  # preview. `strict`: argument KEY NAMES + character counts only, no preview — for tenants whose
  # tool arguments may carry personal data. LiteLLM's own nested generation is governed
  # separately, at the gateway: `litellm.proxy_config.litellm_settings.turn_off_message_logging`
  # (on by default) — docs/components/langfuse.md "What the gateway writes".
  langfuseRedaction: ""
  # Model pricing for Monitoring cost facts — EUR per 1M tokens per LiteLLM
  # model_name.
  modelPricesJson: '{"stackit-gpt-oss-20b":{"inputPerM":0.15,"outputPerM":0.25},"stackit-qwen3-vl-235b":{"inputPerM":1.5,"outputPerM":1.75}}'
  # THE FIRST ROLE MAPPING. The OS calls only sovereign-strong / -worker / -embedding; the mapping onto
  # catalog models is the file os/models.yml, edited in Platform -> Models. When that file does not exist yet
  # (first boot after this seed) the OS writes it from these three catalog names - or from the old per-role
  # admin setting where there was one (never overwriting a file that exists). Each name must be in the
  # catalog above (scripts/check-litellm-role-catalog.mjs).
  modelRoles:
    seed:
      sovereign-strong: stackit-qwen3-vl-235b
      sovereign-worker: stackit-gpt-oss-20b
      sovereign-embedding: mock-embedding
  # OS_ENABLED_TABS env var. Comma-separated tab keys (replaces the base tier). Empty = base tier, "*" = all tabs.
  enabledTabs: ""
  # In-cluster backend Service URLs (base URLs; the app appends the paths).
  queryToolUrl:   "http://query-tool:8000"
  # data-runner (Data-tab REAL ingest).
  dataRunnerUrl:  "http://data-runner:8000"
  # Object-storage bucket holding the uploads/ prefix (same warehouse bucket as the
  # lakehouse).
  uploadsBucket:  "lakehouse"
  langfuseUrl:    "http://agentic-os-langfuse-web:3000"
  knowledgeIndex: "knowledge"
  # Files tab (unstructured context products).
  filesIndex:      "files"
  # Ingest-by-type services (Phase 3).
  doclingUrl:    ""
  transcribeUrl: ""
  ocrUrl:        ""
  litellmUrl:     "http://agentic-os-litellm:4000"
  opaUrl:         "http://opa:8181"
  # The editable webserver runs under dagster.dagsterWebserver.pathPrefix, so its address carries
  # that prefix (os-ui POSTs {dagsterUrl}/graphql). scripts/check-dagster-path-prefix.mjs.
  dagsterUrl:     "http://agentic-os-dagster-webserver:80/tools/dagster"
  # The READ-ONLY webserver (dagster.dagsterWebserver.enableReadOnly): the upstream of the admin
  # console at <domain>/tools/dagster (Platform → Tool consoles, OFF by default). An ORIGIN only:
  # the proxy forwards the /tools/dagster prefix itself. "" ⇒ the console is "not set up".
  dagsterReadOnlyUrl: "http://agentic-os-dagster-webserver-read-only:80"
  # Browser-reachable consoles (linked/opened from the browser, never proxied;
  # each tool keeps its own auth).
  langfuseConsoleUrl: "http://localhost:3000"
  # Local port-forward to the webserver, which serves under /tools/dagster.
  dagsterConsoleUrl:  "http://localhost:3070/tools/dagster/"  # internal on ingress (no public host)
  # ---- Data products in git (engine rebuild B1-B4). ON by default since B4: os-ui gets
  # DATA_PROJECT_GIT=true + the `os-repos` PVC at /repos (one bare repo per domain, every
  # dataset change committed as the acting user), a read-only `git daemon` sidecar + Service
  # `os-repos` (:9418) + a NetworkPolicy admitting only the Dagster user-code pod, which runs the
  # repo-sync sidecar (see dagster.dagster-user-deployments above — REPO_SYNC_ENABLED is on too).
  #
  # ONE flag, TWO halves — flipping it enables BOTH (B4-review-H-2/H-4):
  #   DATA:   a dataset/composition/quality-rule/schedule change is a git commit in the domain's
  #           repository, the generated dbt project is what Dagster materialises from a validated
  #           commit, and the OS reads run state back from Dagster instead of its own ledger.
  #           NOTE (B4-review-L-1): dbt/Dagster own the SCHEDULED path. An interactive build
  #           (the Silver/Gold buttons, their MCP twins) still runs the OS's own TypeScript CTAS
  #           first — the honesty gate registers a version only after a real apply+verify — and
  #           then commits and launches the equivalent dbt assets. Deviations B4-6/B4-7.
  #   AGENTS: every agent-system definition write commits an `agents/<slug>/…` subtree into the
  #           SAME repository (Part D).
  # The FIRST boot commits every existing dataset and every existing agent system
  # (`OS-Reason: boot-reconcile`), and DELETES every pre-B2 per-dataset sync CronJob before that
  # first commit, so one slice cannot fire twice during the upgrade — which is why the os-ui Role
  # carries a `batch`/`cronjobs` grant (base/os-ui/os-ui.yaml).
  #
  # `enabled: false` remains the EMERGENCY OPT-OUT for one release (then the flag goes): the OS
  # falls back to its own CTAS/ledger execution and the repositories stop being written. Read the
  # CHANGELOG entry before flipping it off — scheduled syncs no longer run in that state, because
  # B4 deleted the per-dataset CronJob provisioning and the fallback sweeps.
  dataProjectGit:
    enabled: true
    reposSize: 2Gi
    # Repository layout (component design 12): user-<token> / domain-<domain> / platform repos,
    # the dbt project at data/dbt/, os/ for OS metadata, generated READMEs. `migration: apply`
    # migrates every existing domain repo at boot (one commit each, `git mv` semantics) — deploy
    # the Dagster image that reads os/layout.yml FIRST. Rollback: `git revert` the migration commit.
    layout:
      migration: "off"
      dbtProjectDir: data/dbt
      # The first Dagster image whose loader and repo-sync read os/layout.yml (built from WP-55).
      # `migration: apply` refuses to render while the code location or repo-sync is older.
      dagsterMinVersion: "0.3.3"
      # The sha256 digests of the Dagster images built with that loader. `apply` also requires
      # BOTH the code location and repo-sync to run one of these — a tag can be moved, a digest
      # cannot. 0.4.0 (built from main with the WP-55 loader): its loader reads os/layout.yml and
      # keeps unmigrated v1 repos on the legacy path (images/extensions/dagster/tests/image/lakehouse.sh
      # run on this digest, 21 Nov 2026).
      dagsterLayoutDigests:
        - "sha256:1ef25ec2310ab1872c7252f61e532158a591353b1a6f4e3a5d7fdaa10d5d7853"
        - "sha256:468a8fe7f7b3fb17586ab3e1bb2e239225d05614733d7dd7b614f594be00343d"
        - "sha256:b919d55fe9161128ace6a22894c43f2569f77b7639cd4d92e486f0e34734cea3"
      # Limit `migration` (dry-run or apply) to these domains, e.g. [sales], to move one domain
      # first. Empty = every domain. With `apply`, NEW repos are created v2 either way; a repo not
      # in the list keeps its v1 layout until it is listed.
      migrationDomains: []
    gitDaemon:
      image:
        # Our own image (images/base/git-daemon): no stock git image ships `git daemon` — Alpine
        # packages it separately and alpine/git omits it, which crash-looped the first 0.8.0 rollout.
        # git (GPL-2.0) still runs as a separate process from a distro package, never linked.
        repository: ghcr.io/aborek/sovereign-os/git-daemon
        tag: "1.0.0"
    # ---- stream E: the engineer's door (decision D27) -------------------------------------
    # Authenticated git over HTTP at https://<os>/git/<domain>.git — clone, fetch and push from
    # VS Code. The transport is git's OWN `git-http-backend` CGI behind lighttpd in our own image
    # (images/base/git-http); authentication is an OS personal access token, resolved by
    # /api/git/authenticate through the ingress sub-request, and every push passes the receive
    # gate (/api/git/receive). Needs `ingress.enabled` + `ingress.hosts.osUI` to be reachable
    # from outside; in-cluster the NetworkPolicy admits the ingress controller only.
    gitHttp:
      enabled: true
      image:
        repository: ghcr.io/aborek/sovereign-os/git-http
        tag: "1.0.0"
      # The namespace of the ingress controller that is allowed to reach port 9419. It is the ONLY
      # peer admitted, because the Ingress is where the OS's auth-url sub-request runs.
      ingressNamespace: ingress-nginx
      # Largest push body accepted, on the Ingress AND in lighttpd (which is configured in KiB:
      # 512m => server.max-request-size = 524288). Must stay below the pod's /tmp emptyDir (2Gi).
      maxPushSize: 512m
  # Secret-backed credentials — reuse the stack's existing Secrets so nothing
  # sensitive sits in plaintext (names/keys verified against the running cluster).
  langfuseSecret:
    name: langfuse-init
    key: LANGFUSE_INIT_PROJECT_SECRET_KEY
  litellmSecret:
    name: litellm-credentials     # keys incl. masterkey
    key: masterkey
  # Auth session-signing secret (HMAC-SHA256 for the login cookie). Leave EMPTY:
  sessionSecret: ""
  # MCP bearer-token signing key (OS_MCP_TOKEN_SECRET). Leave EMPTY: it is kept across
  # upgrades (first upgrade: the previous session secret, so issued MCP tokens survive).
  # Set it only to rotate MCP tokens, or under GitOps renderers without `lookup`.
  mcpTokenSecret: ""
  # Optional operator pre-seed of REAL users as a JSON array, e.g.
  usersSeed: ""
  # ---- Outbound email (OPTIONAL).
  graph:
    enabled: false
    tenantId: ""      # Entra tenant (directory) id
    clientId: ""      # Entra app (client) id
    # Client secret.
    clientSecret: ""
    mailFrom: "support@datamasterclass.com"   # sending mailbox / From address
  # Transport 2 — generic SMTP relay (fallback when not on M365).
  smtp:
    enabled: false
    host: ""          # e.g. smtp.eu.mailgun.org — presence enables real sends
    port: 587         # 587 STARTTLS (default) or 465 implicit TLS
    secure: false     # true → implicit TLS (port 465)
    user: ""          # AUTH LOGIN username (optional → unauthenticated relay)
    # AUTH LOGIN password.
    password: ""
    from: "support@datamasterclass.com"
  # Set "false" to disable email verification even when a mailer IS configured.
  # Empty/unset = verification ON whenever a mailer (Graph or SMTP) is configured.
  emailVerification: ""
  # Absolute external base URL used in emailed verification links
  # (e.g. https://os.example.com).
  publicUrl: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    # 1Gi headroom for Files-tab uploads: the upload route buffers the whole file
    # in memory (~2× the byte size at peak), so a 200 MB upload can spike ~500 MB.
    limits:   { cpu: 500m, memory: 1Gi }

# Components are added to this file as each is wired into the chart
# (thinnest runnable slice first).

# ---------------------------------------------------------------------------
# THE APP-BUILDING HARNESS (stream H). Additive, OFF by default.
#
# softwareBuilder.mode selects which builder the Software "Build" stage uses:
#   • "spec"    (DEFAULT) — today's behaviour, unchanged: one reasoning-model
#     turn fills a declarative AppSpec, with validator-seeded repair turns.
#   • "agentic" — the bounded planner -> coder -> build -> reviewer loop: a
#     grounding pack extracted from the shipped source (dataset schemas with
#     real sample rows, metric definitions, the OS SDK and UI API surfaces,
#     design tokens, one exemplar), the real in-process compile gate run every
#     iteration with its diagnostics fed back, and acceptance checks derived
#     from the app's own user stories. Max 4 iterations.
#
# The coder tier of the loop runs on the `sovereign-strong` role (Platform -> Models).
softwareBuilder:
  mode: "spec"

# WP-10 — platform Secrets through the External Secrets Operator (ESO) from STACKIT Secrets Manager.
# OFF by default: nothing renders and no Secret changes. Install ESO first
# (deploy/external-secrets/install.sh); the migration run-book is docs/ops/external-secrets-migration.md.
externalSecrets:
  enabled: false
  store:
    create: true
    name: stackit-secrets-manager
    server: "https://prod.sm.eu01.stackit.cloud"
    instanceId: ""          # required when enabled: the Secrets Manager instance ID (the KV v2 mount)
    username: ""            # required when enabled: the READ-ONLY Secrets Manager user
    authMount: userpass
    passwordSecret:         # created once by the owner; never rendered by this chart
      name: stackit-secrets-manager-eso
      namespace: external-secrets
      key: password
  remotePrefix: ""          # remote key = <remotePrefix | release namespace>/<secret name>
  # Per-Secret remote key, when one does not live under the prefix: {<secret name>: <KV path>}.
  #   remoteKeys: {os-secrets-encryption-key: agentic-os/os-secrets-encryption-key}
  remoteKeys: {}
  refreshInterval: 1h
  # Step 1 (handover release): Secrets the chart still renders, now with helm.sh/resource-policy: keep.
  handover: []
  # Step 2: Secrets ESO writes (names from files/external-secrets/catalog.yaml); the chart stops rendering them.
  managed: []

# =============================================================================
# Observability (WP-05, design 00 §6): an OpenTelemetry Collector feeding VictoriaMetrics and
# VictoriaLogs, all Apache-2.0 (Grafana and Loki are AGPL-3.0 and excluded). Pins, docs and licences:
# components/otel-collector/UPSTREAM.md, components/victoriametrics/UPSTREAM.md.
# Sized for the single node (scripts/check-capacity.mjs), lowest platform priority class: under
# memory pressure observability is evicted first (00 §10.1 decision 2).
observability:
  enabled: true
  # Backup FAILURE alerts in Monitoring (templates/base/os-ui/_backup-alerts.tpl), each read from
  # its own source: the pg-dump / opensearch-snapshot CronJobs' newest Job, the Velero Schedule's
  # newest Backup, each OpenSearch repository's newest snapshot. Read-only grants.
  backupAlerts:
    enabled: true
    velero:
      namespace: ""                       # "" = no Velero here; prod: velero (deploy/velero/)
      scheduleName: velero-daily-agentic-os
  # Ingress allow-lists for the stores and the Collector (templates/extensions/observability/
  # network-policies.yaml): only the Collector writes, only os-ui reads.
  networkPolicy:
    enabled: true
  collector:
    # The Kubernetes distribution (otel/opentelemetry-collector-releases, distributions/otelcol-k8s):
    # file_log, kubelet_stats, otlp, filter, headers_setter, health_check — nothing else needed.
    image:
      repository: otel/opentelemetry-collector-k8s
      tag: "0.165.0"
      digest: sha256:ce55d0a38923c83120e4ba613fbdf446786652d2ce9f29d1cd7879e5d869829f
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 256Mi }
    # Go soft memory limit, about 85 % of the memory limit above.
    goMemLimit: 215MiB
    # Pod CPU / memory from each node's kubelet (/stats/summary).
    kubeletStats:
      enabled: true
      interval: 30s
      # Where the kubelets listen (:10250): the node network, as CIDRs. Under default-deny egress the
      # Collector may reach :10250 ONLY there. Empty = not narrowed (port-only rule; a laptop / kind
      # render that does not know its node network). values.stackit-managed.yaml sets SKE's.
      nodeCidrs: []
    # Container logs (/var/log/pods) of the PLATFORM namespaces only, JSON lines parsed into fields,
    # so a LogsQL query can filter on `decision_id` (OPA) or `trace_id` (os-ui). Empty list = the
    # release namespace alone. The user-apps namespace (softwareRunner.namespace) is refused at
    # render time: student code's logs are not platform logs. Every line passes the secret-masking
    # step (otel-collector.yaml `transform/redact_secrets`) before it is stored.
    podLogs:
      enabled: true
      namespaces: []
    # OPTION for WP-32 — UNSAFE TODAY, KEEP OFF (WP-05 review #11). Embeddings, /api/classify and
    # virtual-key calls send no `traceparent`, so `dropOrphanSpans` would silently drop their
    # generations (usage and cost); and Langfuse's ingress policy does not admit the Collector.
    # docs/ops/litellm-otel-collector-filter.md lists what must change first.
    # LiteLLM's `langfuse_otel` export routed through the Collector.
    # LiteLLM posts to `<LANGFUSE_OTEL_HOST>/api/public/otel/v1/traces`; with this on, point
    # LiteLLM's `LANGFUSE_OTEL_HOST` at `http://otel-collector:4319` (litellm.envVars). The
    # Collector forwards LiteLLM's own Basic-auth header (headers_setter), so it holds no Langfuse key.
    # Off by default; see docs/ops/litellm-otel-collector-filter.md.
    litellmLangfuse:
      enabled: false
      # Drop LiteLLM spans that have no parent (`IsRootSpan()`): the background DB polls under
      # LITELLM_OTEL_LANGFUSE_SPAN_SCOPE=full. A generation called with a `traceparent` has a parent
      # and passes. Caveat: a call WITHOUT `traceparent` is a root too and is dropped as well.
      dropOrphanSpans: false
      serviceName: litellm
      # Langfuse's OTLP base; otlp_http appends /v1/traces. Empty = <the in-cluster Langfuse address,
      # base path included>/api/public/otel (soa.langfuseUrl).
      langfuseEndpoint: ""
  victoriaMetrics:
    image:
      repository: victoriametrics/victoria-metrics
      tag: v1.156.0
      digest: sha256:da8a90ac0912f16589be2b96a6441a2fca4bca415c83783d972d92e3b5b66970
    retentionPeriod: 14d
    storage: 5Gi
    resources:
      requests: { cpu: 50m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
  victoriaLogs:
    image:
      repository: victoriametrics/victoria-logs
      tag: v1.54.0
      digest: sha256:ee4e820cac3721f5f5d91641b950c22439593adc4224f9655e5333d5a84c1dfe
    # OPA decision logs carry principal ids: kept 7 days, then deleted by VictoriaLogs.
    retentionPeriod: 7d
    storage: 5Gi
    # Leave headroom on the PVC: VictoriaLogs drops the oldest data above this.
    maxDiskSpaceUsageBytes: 4GiB
    resources:
      requests: { cpu: 50m, memory: 256Mi }
      limits: { cpu: 500m, memory: 512Mi }
