#
# capacity.dev-m2i4.yaml — the CHEAPER dev node option (docs/ops/dev-environment.md "Sizing"):
# m2i.4 = 4 vCPU / 32 GB, EUR 0.27037/h = EUR 194.67/month (STACKIT price list 1.0.45). Used
# with values.dev.m2i4.yaml (Trino and Docling CPU requests cut) and DEV_NODE=m2i4.
# Same format as capacity.yaml; read by scripts/check-capacity.mjs:
#
#   node scripts/check-capacity.mjs --profile default \
#     --budget charts/sovereign-agentic-os/capacity.dev-m2i4.yaml --values values.dev.yaml --values values.dev.m2i4.yaml
#
# scripts/deploy.sh --env dev runs exactly this (plus the private overlay) before any upgrade.
# Not read by any template (.helmignore).

node:
  # m2i.4 = 4 vCPU / 32 GB (docs.stackit.cloud .../server/basics/machine-types/).
  flavour: m2i.4
  count: 1
  allocatable:
    # MEASURED on the dev node (2026-11-20, `kubectl --context dmagosdev get nodes`, m2i.4,
    # Kubernetes 1.35.9): allocatable 3920m CPU, 29710845384 bytes (27.67 GiB).
    cpu: 3920m
    memory: "29710845384"

thresholds:
  requests:
    cpu: 85
    memory: 85
  limits:
    memory: 85

minimumWorkloads: 10

outsideChart:
  - name: "kube-system (SKE platform: CNI, DNS, CSI, VPN, metrics) — as read on the production node"
    perNode: true
    requests: { cpu: 1377m, memory: 1621Mi }
    limits: { cpu: 300m, memory: 2312Mi }
  # dev keeps 256Mi (scripts/dev/ingress-nginx-values.yaml); production's 512Mi is ingress-nginx-values.prod.yaml.
  - name: ingress-nginx (scripts/dev/platform.sh)
    requests: { cpu: 100m, memory: 90Mi }
    limits: { memory: 256Mi }
  - name: cert-manager (scripts/dev/platform.sh — controller, webhook, cainjector)
    requests: { cpu: 30m, memory: 192Mi }
    limits: { memory: 384Mi }
  - name: node sysctl DaemonSet (kube-system, scripts/dev/manifests/node-sysctl.yaml)
    perNode: true
    requests: { cpu: 1m, memory: 4Mi }
    limits: { memory: 8Mi }
  - name: model-key-proxy (namespace dev-model-key, scripts/dev/bootstrap-secrets.sh)
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }
  # Apps the acceptance journey AT-d deploys from the Software tab (namespace agentic-apps).
  - name: agentic-apps (journey AT-d)
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 512Mi }

  # APP BUILDER (workstream H, values.dev.yaml softwareRunner.environments). With the switch on and builds and
  # app databases OFF (dev today), it adds NO long-running pod: the chart renders only the env namespaces'
  # quota, limit range, NetworkPolicies, os-ui Role and admission policies, and no App Builder app can be
  # released (no builder ⇒ `no_builder`), so nothing runs in apps-dev / apps-prod. Measured 2026-11-27 with
  # scripts/check-capacity.mjs: unchanged with the switch on (m2i.4: CPU requests 84.3 %, memory limits 84.4 %;
  # g2i.8: 50.0 % / 84.8 %).
  # When builds and databases go on, add these OUTSIDE-the-chart entries (the plan's dev requests; Zot and the
  # zot-users/keeper Jobs are chart objects and counted from the render) and re-run the check:
  #   - name: Tekton Pipelines/Triggers/interceptors/EventListener (scripts/tekton/install.sh, 7 pods)
  #     requests: { cpu: 70m, memory: 448Mi }
  #     limits: { memory: 1792Mi }
  #   - name: CloudNativePG operator (scripts/cnpg/install.sh)
  #     requests: { cpu: 20m, memory: 128Mi }
  #     limits: { memory: 256Mi }
  #   - name: apps-pg dev + prod (operator-created instance pods, osUI.software.databases.resources)
  #     requests: { cpu: 30m, memory: 384Mi }
  #     limits: { memory: 1Gi }
  #   - name: App Builder apps (apps-dev, apps-prod; 2 demo apps x Dev/Prod + 1 preview slot)
  #     requests: { cpu: 50m, memory: 640Mi }
  #     limits: { memory: 2560Mi }
  # On the m2i.4 that is +170m outside the chart (+20m Zot in it): ~89 % CPU requests, over the 85 % gate, so
  # builds and databases on dev need the larger dev node or pool first (plan "Dev capacity", owner follow-up).
