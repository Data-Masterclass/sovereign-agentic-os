# Forge-portable CI definition for this app (GitHub Actions format). The Sovereign OS runs the same
# gates in its own sandbox before any deploy; this file lets the app run them on any forge too.
name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: 22 }
      - uses: open-policy-agent/setup-opa@950f4a9bb1ba4a3ec22c0e6e6a8c8f1b6a1d7f0e # v2
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run gates
