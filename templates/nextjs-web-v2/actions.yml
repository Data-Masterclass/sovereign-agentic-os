actions:
  - name: classify_order
    description: Decide whether an order amount needs review (above the review limit) or is standard.
    write: false
    scopes: [records]
    input:
      amount: number
  - name: add_order
    description: Record an order in the app's records, as the signed-in user.
    write: true
    scopes: [records]
    input:
      amount: number
