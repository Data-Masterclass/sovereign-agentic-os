# Overlay for the masking e2e (gateway half): a second LiteLLM, same production image and OTel v2
# settings as `compose.yaml`'s, whose message logging is ON (litellm-config.content-on.yaml).
#
#   docker compose -f tests/langfuse/compose.yaml -f tests/langfuse/compose.masking.yaml -p lfmask up -d --wait
#   cd os-ui && TRACING_E2E=1 node --experimental-test-module-mocks --import ./scripts/test-setup.mjs \
#     --test --test-concurrency=1 tabs/agents/lib/engine/masking.e2e.test.ts tabs/agents/lib/engine/masking-gateway.e2e.test.ts
services:
  litellm-content:
    restart: always
    image: ghcr.io/data-masterclass/sovereign-os/litellm-oss:1.109.1-soa.2@sha256:62f7315c1a850bf4e421528b42f0b7687fcaf493b895f3ce6426104c2ea14e87
    depends_on:
      langfuse-web: { condition: service_healthy }
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${LITELLM_CONTENT_E2E_PORT:-14032}:4000
    environment:
      LITELLM_MASTER_KEY: sk-test-scoped-agent-key
      LANGFUSE_PUBLIC_KEY: pk-lf-e2e-public
      LANGFUSE_SECRET_KEY: sk-lf-e2e-secret
      LANGFUSE_HOST: http://langfuse-web:3000
      LITELLM_OTEL_V2: "true"
      LITELLM_OTEL_LANGFUSE_SPAN_SCOPE: "llm_only"
      # OTel v2 captures NO message content unless this is set (LiteLLM's langfuse_to_otel_v2
      # migration guide). This gateway is the one an operator has switched content capture on for.
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: span_only
      STUB_API_BASE: http://host.docker.internal:${STUB_MODEL_PORT:-18931}/v1
    volumes:
      - ./litellm-config.content-on.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness').status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 60
