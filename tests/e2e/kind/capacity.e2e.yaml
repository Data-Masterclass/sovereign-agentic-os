#
# Node budget for the kind acceptance harness on a GitHub-hosted `ubuntu-latest` runner (public
# repository: 4 vCPU, 16 GB RAM). Same format as charts/sovereign-agentic-os/capacity.yaml, read by
#   node scripts/check-capacity.mjs --profile default --budget tests/e2e/kind/capacity.e2e.yaml \
#     --values values.local.yaml --values tests/e2e/kind/values.e2e.yaml --values tests/e2e/kind/values.e2e-limits.yaml
# The workflow runs this BEFORE bringing the cluster up, so a harness that no longer fits the runner
# fails loudly instead of OOM-killing pods. With values.e2e-limits.yaml the requests fit this runner but
# the memory limits do not (about 128 %); use capacity.e2e-8core.yaml on the recommended 8-core runner.
node:
  flavour: github-ubuntu-latest (4 vCPU / 16 GB)
  count: 1
  allocatable:
    cpu: 4000m
    memory: "15569256448"   # 14.5 GiB: 16 GB minus the runner's OS, Docker and kubelet reserve

thresholds:
  requests:
    cpu: 85
    memory: 85
  limits:
    memory: 85

minimumWorkloads: 10

outsideChart:
  - name: "kind control plane (etcd, apiserver, controller-manager, scheduler, coredns x2, kube-proxy, local-path)"
    requests: { cpu: 950m, memory: 390Mi }
    limits: { memory: 340Mi }
  - name: calico (node + kube-controllers)
    requests: { cpu: 250m, memory: 64Mi }
    limits: {}
  - name: seaweedfs (tests/e2e/kind/manifests/seaweedfs.yaml)
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 1000m, memory: 512Mi }
  # Headroom for the pods the programme adds before WP-48. Reserved now so the gate fails the day the
  # runner stops fitting, not the day a pod is OOM-killed.
  - name: "planned: Keycloak (WP-38)"
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }
  - name: "planned: OTel Collector + VictoriaLogs/VictoriaMetrics (WP-05)"
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  - name: "planned: trivy-server (WP-42)"
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 768Mi }
  - name: "planned: metric-compile (WP-20)"
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 512Mi }
