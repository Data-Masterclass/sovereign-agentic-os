#
# kind cluster for the acceptance harness. The default CNI (kindnet) does NOT enforce
# NetworkPolicies, so it is disabled and Calico is installed instead (up.sh). Calico's manifest
# uses 192.168.0.0/16 for pods, so podSubnet matches it.
# The node image is passed on the command line from versions.env (--image), never here.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
