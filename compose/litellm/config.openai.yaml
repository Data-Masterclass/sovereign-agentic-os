# LiteLLM proxy config for the Compose `openai` profile. See compose/README.md.
# Needs OPENAI_API_KEY in .env. Not offline; mock-model is not started.
# Aliases stay sovereign-* so os-ui/agent-runtime config is unchanged.

model_list:
  - model_name: sovereign-default
    litellm_params:
      model: openai/gpt-4.1-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: sovereign-mock
    litellm_params:
      model: openai/gpt-4.1-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: sovereign-reasoning
    litellm_params:
      model: openai/gpt-4.1
      api_key: os.environ/OPENAI_API_KEY
      timeout: 300

  - model_name: sovereign-embed
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

router_settings:
  routing_strategy: simple-shuffle        # load-balance across healthy deployments
  num_retries: 3                          # retry transient failures before failover
  timeout: 120                            # per-request timeout (s)
  allowed_fails: 3                        # circuit-breaking: trip after N fails...
  cooldown_time: 60                       # ...then cool the deployment down (s)

litellm_settings:
  success_callback: ["langfuse"]          # gateway-level tracing to Langfuse
  drop_params: true

general_settings:
  master_key: os.environ/PROXY_MASTER_KEY
  store_model_in_db: true

mcp_servers:
  sovereign_query:
    url: "http://query-tool:8000/mcp"
    transport: "http"
    description: "Governed SQL over the lakehouse marts via central Trino (row/column governed)"
