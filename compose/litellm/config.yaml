# LiteLLM proxy config for the local Compose stack. See compose/README.md.
# Mirrors the Helm chart's litellm.proxy_config, with one deliberate
# divergence: sovereign-default/-mock/-reasoning point at the local
# mock-model stub instead of the chart's STACKIT endpoint, so the stack runs
# fully offline with no API key. Each has a commented real-provider variant.

model_list:
  - model_name: sovereign-default
    litellm_params:
      model: openai/gpt-oss-20b
      api_base: http://mock-model:8080/v1
      api_key: "sk-mock-unused"
  # Real provider instead of mock-model: replace the three values above with:
      # model: openai/gpt-4.1-mini
      # api_base: https://your-gateway.example.com/v1
      # api_key: os.environ/STACKIT_API_KEY

  - model_name: sovereign-mock            # back-compat alias -> worker tier
    litellm_params:
      model: openai/gpt-oss-20b
      api_base: http://mock-model:8080/v1
      api_key: "sk-mock-unused"
  # Real provider instead of mock-model: replace the three values above with:
      # model: openai/gpt-4.1-mini
      # api_base: https://your-gateway.example.com/v1
      # api_key: os.environ/STACKIT_API_KEY

  - model_name: sovereign-reasoning
    litellm_params:
      model: openai/Qwen/Qwen3-VL-235B-A22B-Instruct-FP8
      api_base: http://mock-model:8080/v1
      api_key: "sk-mock-unused"
      timeout: 300
  # Real provider instead of mock-model: replace the four values above with:
      # model: openai/gpt-4.1
      # api_base: https://your-gateway.example.com/v1
      # api_key: os.environ/STACKIT_API_KEY
      # timeout: 300

  - model_name: sovereign-embed
    litellm_params:
      model: openai/mock-embed
      api_base: http://mock-model:8080/v1
      api_key: "sk-mock-unused"

router_settings:
  routing_strategy: simple-shuffle        # load-balance across healthy deployments
  num_retries: 3                          # retry transient failures before failover
  timeout: 120                            # per-request timeout (s)
  allowed_fails: 3                        # circuit-breaking: trip after N fails...
  cooldown_time: 60                       # ...then cool the deployment down (s)

litellm_settings:
  success_callback: ["langfuse"]          # gateway-level tracing to Langfuse
  drop_params: true

general_settings:
  master_key: os.environ/PROXY_MASTER_KEY
  store_model_in_db: true

mcp_servers:
  sovereign_query:
    url: "http://query-tool:8000/mcp"
    transport: "http"
    description: "Governed SQL over the lakehouse marts via central Trino (row/column governed)"
