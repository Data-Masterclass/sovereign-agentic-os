# =============================================================================
# values.local.yaml — the laptop profile (kind). Used by `./scripts/os up`.
# =============================================================================
# Layered on charts/sovereign-agentic-os/values.yaml. Everything here exists to
# fit the whole OS on one node with a few GB of RAM: single replicas, small
# requests (limits stay generous so a burst is not throttled), no TLS, no
# cert-manager, no ingress controller — the UI is reached through the kind port
# mapping 8080 -> os-ui NodePort 30080.
#
# Production uses the SAME chart with values.stackit-managed.yaml instead.
# =============================================================================

global:
  profile: local
  storageClass: "standard"        # kind's default (rancher local-path)

# Applied and validated here; kindnet does not enforce them (Cilium does on STACKIT).
networkPolicies:
  defaultDeny: true

# ---------------------------------------------------------------- JVM services
# The three JVM services are what actually decide whether the stack fits.
opensearch:
  singleNode: true
  replicas: 1
  opensearchJavaOpts: "-Xms512m -Xmx512m"
  resources:
    requests: { cpu: 100m, memory: 640Mi }
    limits:   { cpu: 1,    memory: 1Gi }

trino:
  jvm:
    maxHeap: 1500M
  query:
    maxMemory: 1GB
    maxMemoryPerNode: 512MB
  resources:
    requests: { cpu: 200m, memory: 768Mi }
    limits:   { cpu: 2,    memory: 2Gi }

polaris:
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits:   { cpu: 1,    memory: 768Mi }

# ------------------------------------------------------------------- datastores
postgres:
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits:   { cpu: 1,   memory: 1Gi }

clickhouse:
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits:   { cpu: 1,    memory: 2Gi }

valkey:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }

objectStorage:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1,    memory: 1Gi }

# ------------------------------------------------------------------- app tier
langfuse:
  langfuse:
    web:
      resources:
        requests: { cpu: 100m, memory: 384Mi }
        limits:   { cpu: 1,    memory: 1Gi }
    worker:
      resources:
        requests: { cpu: 100m, memory: 384Mi }
        limits:   { cpu: 1,    memory: 1Gi }

litellm:
  # The chart's init container (config render + DB migration wait) OOM-killed at
  # 1Gi on kind — the Node toolchain it runs needs headroom even though the proxy
  # itself is small. 2Gi is the floor that starts reliably here.
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits:   { cpu: 1,    memory: 2Gi }

osUI:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 2,    memory: 1536Mi }
  # No external user directory on a laptop: first run bootstraps admin/admin and
  # forces a real email + password on first sign-in.
  allowOfflineUserSeed: true
  usersSeed: ""

# --------------------------------------------------------------- data + files
dagster:
  dagsterWebserver:
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits:   { cpu: 1,   memory: 512Mi }
  dagsterDaemon:
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits:   { cpu: 1,   memory: 512Mi }

dataRunner:
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits:   { cpu: 1,   memory: 1Gi }

queryTool:
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits:   { cpu: 1,   memory: 768Mi }

docling:
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits:   { cpu: 2,    memory: 2Gi }

# No public DNS on a laptop: no ingress, no cert-manager, no TLS.
ingress:
  enabled: false
