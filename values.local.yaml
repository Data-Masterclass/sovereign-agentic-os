# =============================================================================
# values.local.yaml — the laptop profile (kind). Used by `./scripts/os up`.
# =============================================================================
# Layered on charts/sovereign-agentic-os/values.yaml. Everything here exists to
# fit the whole OS on one node with a few GB of RAM: single replicas, small
# requests (limits stay generous so a burst is not throttled), no TLS, no
# cert-manager, no ingress controller — the UI is reached through the kind port
# mapping 8080 -> os-ui NodePort 30080.
#
# Production uses the SAME chart with values.stackit-managed.yaml instead.
# =============================================================================

global:
  profile: local
  storageClass: "standard"        # kind's default (rancher local-path)

# Applied and validated here; kindnet does not enforce them (Cilium does on STACKIT).
networkPolicies:
  defaultDeny: true

# ---------------------------------------------------------------- JVM services
# The three JVM services are what actually decide whether the stack fits.
opensearch:
  singleNode: true
  replicas: 1
  opensearchJavaOpts: "-Xms512m -Xmx512m"
  resources:
    requests: { cpu: 100m, memory: 640Mi }
    limits:   { cpu: 1,    memory: 1Gi }

trino:
  jvm:
    maxHeap: 1500M
  query:
    maxMemory: 1GB
    maxMemoryPerNode: 512MB
  resources:
    requests: { cpu: 200m, memory: 768Mi }
    limits:   { cpu: 2,    memory: 2Gi }

polaris:
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits:   { cpu: 1,    memory: 768Mi }

# ------------------------------------------------------------------- datastores
postgres:
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits:   { cpu: 1,   memory: 1Gi }

clickhouse:
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits:   { cpu: 1,    memory: 2Gi }

valkey:
  # --maxmemory ~20 % under the 256Mi limit (the chart default 400mb is sized for 512Mi).
  maxMemory: 200mb
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits:   { cpu: 500m, memory: 256Mi }

objectStorage:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1,    memory: 1Gi }
  # A laptop has no GHCR credential (global.imagePullSecrets is empty above), and the chart's
  # default is the PRIVATE org mirror. Pull the SAME digest anonymously from its upstream,
  # Chainguard's public community build (verified 2026-11-27: `crane validate --remote` PASS
  # with no credentials). MinIO (AGPL) is pulled from upstream here, not distributed by us.
  image:
    repository: cgr.dev/chainguard/minio
    digest: sha256:1887982b34cc821a569fdc94c4d30ee01c2826184fe7d3a49aee37bb3bbb23a7

# ------------------------------------------------------------------- app tier
langfuse:
  langfuse:
    # scripts/os (and tests/e2e/kind/up.sh) build images/extensions/langfuse-oss (targets web, worker) and
    # load them into kind: the chart pins registry digests of private org packages. The web build is a full
    # Next.js build and needs about 10 GB of Docker memory.
    image:
      pullSecrets: []
      pullPolicy: IfNotPresent
    web:
      image:
        repository: sovereign-os/langfuse-oss-web
        tag: local
      resources:
        requests: { cpu: 100m, memory: 384Mi }
        limits:   { cpu: 1,    memory: 1Gi }
    worker:
      image:
        repository: sovereign-os/langfuse-oss-worker
        tag: local
      resources:
        requests: { cpu: 100m, memory: 384Mi }
        limits:   { cpu: 1,    memory: 1Gi }

litellm:
  # scripts/os builds images/extensions/litellm-oss and loads it into kind: the chart pins a registry
  # digest of the private org package, which a laptop neither has nor needs.
  image:
    repository: sovereign-os/litellm-oss
    tag: local
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  # The chart's db-migrate init container runs Prisma (Node) and OOM-killed at
  # both 1Gi and 2Gi on kind; 3Gi is what actually completes. The proxy container
  # itself stays small — this ceiling is only ever touched during migration.
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits:   { cpu: 1,    memory: 3Gi }

osUI:
  # Data products in git (engine rebuild B4): ON, like the chart default — the laptop profile is
  # where the whole path is exercised (one bare repo per domain on the `os-repos` PVC, the
  # git-daemon sidecar, the Dagster `sovereign` code location reading a validated commit).
  dataProjectGit:
    enabled: true
    # The two git sidecars are our own images (images/base/git-daemon, images/base/git-http); the chart
    # names private ghcr.io packages. scripts/os builds both and loads them into kind under these tags.
    gitDaemon:
      image:
        repository: sovereign-os/git-daemon
        tag: local
    gitHttp:
      image:
        repository: sovereign-os/git-http
        tag: local
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 2,    memory: 1536Mi }
  # No external user directory on a laptop: first run bootstraps admin/admin and
  # forces a real email + password on first sign-in.
  allowOfflineUserSeed: true
  usersSeed: ""
  # THE TEACHING FLOW. This is the one profile where the deterministic, honestly-labelled
  # `offline-mock` is legitimate: a laptop has no Trino, no query-tool and no data-runner, and
  # the worked example IS the lesson. Every other profile leaves this at the chart default
  # (`refuse`), where an unreachable engine is a typed ENGINE_UNAVAILABLE and no number,
  # table, row count or passing security scan is invented. See core/kernel/offline-mock.ts.
  offlineMock: allow
  # Show the whole OS locally. Unset would fall back to the 10-key base tier and
  # hide Data/Files/Knowledge/Metrics/Dashboards/Software/Connections/Workflows.
  enabledTabs: "home,agents,dashboards,software,data,metrics,files,knowledge,connections,monitoring,governance,admin,workflows"

# --------------------------------------------------------------- data + files
dagster:
  # scripts/os builds images/extensions/dagster and loads it into kind as sovereign-os/dagster:local. The chart
  # pins a registry DIGEST of the private org package, which a local build cannot carry, so every place that
  # names the image is pointed at the local tag: both webservers and the daemon here, the code location and its
  # repo-sync sidecar in the generated block below, and the run pods (they inherit the code location's image).
  dagsterWebserver:
    image:
      repository: sovereign-os/dagster
      tag: local
      digest: ""
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits:   { cpu: 1,   memory: 512Mi }
  dagsterDaemon:
    image:
      repository: sovereign-os/dagster
      tag: local
      digest: ""
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits:   { cpu: 1,   memory: 512Mi }
  # The stock launcher default is `Always`, which would make every run pod try the registry for an image that
  # exists only inside the kind node.
  runLauncher:
    config:
      k8sRunLauncher:
        imagePullPolicy: IfNotPresent
  # >>> GENERATED by scripts/lib/local-images.py gen-values
  # from charts/sovereign-agentic-os/values.yaml's `sovereign` code location, with the image (and the repo-sync
  # sidecar's) pointed at the local build above. Do not edit by hand: change values.yaml, then run
  #   python3 scripts/lib/local-images.py gen-values --write
  # scripts/tests/local-images.test.sh fails CI when this block differs from the generator.
  dagster-user-deployments:
    deployments:
    - name: sovereign
      image:
        repository: sovereign-os/dagster
        tag: local
        pullPolicy: IfNotPresent
      codeServerArgs:
      - --python-file
      - /opt/dagster/app/repo.py
      port: 3030
      env:
      - name: TRINO_HOST
        value: trino
      - name: TRINO_PORT
        value: '8080'
      - name: TRINO_USER
        value: dbt-runner
      - name: TRINO_CATALOG
        value: iceberg
      - name: DESTINATION__SQLALCHEMY__CREDENTIALS__DRIVERNAME
        value: trino
      - name: DESTINATION__SQLALCHEMY__CREDENTIALS__HOST
        value: trino
      - name: DESTINATION__SQLALCHEMY__CREDENTIALS__PORT
        value: '8080'
      - name: DESTINATION__SQLALCHEMY__CREDENTIALS__DATABASE
        value: iceberg
      - name: TRINO_SCHEMA
        value: sales
      - name: REPO_SYNC_ENABLED
        value: 'true'
      - name: REPO_SYNC_DOMAINS
        value: ''
      - name: REPO_SYNC_INDEX_URL
        value: http://os-ui:3000/api/data/projects
      - name: REPO_SYNC_GIT_BASE
        value: git://os-repos
      - name: REPO_SYNC_CHECKOUT
        value: /repos-checkout
      - name: REPO_SYNC_INTERVAL
        value: '15'
      - name: REPO_SYNC_STATUS_PORT
        value: '8089'
      - name: DAGSTER_RELOAD_LOCATION
        value: sovereign
      - name: DAGSTER_GRAPHQL_URL
        value: http://agentic-os-dagster-webserver:80/tools/dagster/graphql
      - name: OS_INDEX_FILE
        value: /repos-checkout/.os-index.json
      - name: OS_QUARANTINE_THRESHOLD
        value: '10'
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          cpu: '1'
          memory: 1536Mi
      volumes:
      - name: repos-checkout
        emptyDir: {}
      volumeMounts:
      - name: repos-checkout
        mountPath: /repos-checkout
      sidecarContainers:
      - name: repo-sync
        image: sovereign-os/dagster:local
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - /opt/dagster/app/repo-sync.sh
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: REPO_SYNC_ENABLED
          value: 'true'
        - name: REPO_SYNC_DOMAINS
          value: ''
        - name: REPO_SYNC_INDEX_URL
          value: http://os-ui:3000/api/data/projects
        - name: REPO_SYNC_GIT_BASE
          value: git://os-repos
        - name: REPO_SYNC_CHECKOUT
          value: /repos-checkout
        - name: REPO_SYNC_INTERVAL
          value: '15'
        - name: REPO_SYNC_STATUS_PORT
          value: '8089'
        - name: DAGSTER_RELOAD_LOCATION
          value: sovereign
        - name: DAGSTER_GRAPHQL_URL
          value: http://agentic-os-dagster-webserver:80/tools/dagster/graphql
        - name: AGENT_RUNTIME_TOKEN
          valueFrom:
            secretKeyRef:
              name: agent-runtime-token
              key: token
        ports:
        - name: repo-status
          containerPort: 8089
        volumeMounts:
        - name: repos-checkout
          mountPath: /repos-checkout
        resources:
          requests:
            cpu: 20m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
  # <<< GENERATED (local-images.py)

dataRunner:
  # scripts/os builds images/extensions/data-runner and loads it into kind: no registry digest exists.
  image:
    localBuild: true
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits:   { cpu: 1,   memory: 1Gi }

queryTool:
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits:   { cpu: 1,   memory: 768Mi }

docling:
  # scripts/os builds images/extensions/docling and loads it into kind: no registry digest exists.
  image:
    localBuild: true
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits:   { cpu: 2,    memory: 2Gi }

# No public DNS on a laptop: no ingress, no cert-manager, no TLS.
ingress:
  enabled: false
