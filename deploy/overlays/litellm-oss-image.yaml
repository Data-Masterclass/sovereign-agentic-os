#
# The LiteLLM gateway on OUR image (images/extensions/litellm-oss: MIT core, no litellm-enterprise).
# This is the chart default; the overlay exists for a release whose values pin `litellm.image`
# themselves (production derives its values from the live release, so a changed chart default does
# not reach a value the release already pins), and to return after a rollback with
# deploy/overlays/litellm-upstream-image.yaml:
#
#   VALUES_OVERLAY=deploy/overlays/litellm-oss-image.yaml scripts/deploy.sh --from-registry <os-ui version>
#
# Keep it equal to charts/sovereign-agentic-os/values.yaml `litellm.image` (scripts/tests/litellm-oss-chart.test.sh).
litellm:
  image:
    repository: ghcr.io/data-masterclass/sovereign-os/litellm-oss
    tag: "1.109.1-soa.3@sha256:5ea2411f71a3d42c92c32b744cd94e24ae0279127990c504f91a0502ad58e8de"
  imagePullSecrets:
    - name: registry-pull-secret
