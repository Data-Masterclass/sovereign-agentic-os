#
# RETURN to our langfuse-oss images (the chart default) after deploy/overlays/langfuse-upstream-image.yaml,
# or for a production release whose live values still pin the upstream images (scripts/deploy.sh derives
# release values from the live release, so a new chart default does not reach them).
#
#   VALUES_OVERLAY=deploy/overlays/langfuse-oss-image.yaml scripts/deploy.sh --from-registry <os-ui version>
#
# NEXTAUTH_URL: the port-forward address with the base path; on dev also pass
#   --set langfuse.langfuse.nextauth.url=https://langfuse.dev.<domain>/tools/langfuse
# Must equal the chart default (scripts/tests/langfuse-oss-chart.test.sh). docs/components/langfuse-oss.md.
langfuseBasePath: /tools/langfuse
langfuse:
  langfuse:
    image:
      pullSecrets:
        - name: registry-pull-secret
    nextauth:
      url: http://localhost:3000/tools/langfuse
    web:
      image:
        repository: ghcr.io/data-masterclass/sovereign-os/langfuse-oss-web
        # build-images.yml dispatch 2026-11-25 from 28d5e343a; digest read back from ghcr.io
        tag: "3.194.1-soa.1@sha256:64bda745cfa3b718b43856fd9bc3cff8b9ba695be79bbfad79fe1399c5127534"
      livenessProbe:
        path: /tools/langfuse/api/public/health
      readinessProbe:
        path: /tools/langfuse/api/public/ready
    worker:
      image:
        repository: ghcr.io/data-masterclass/sovereign-os/langfuse-oss-worker
        # build-images.yml dispatch 2026-11-25 from 28d5e343a; digest read back from ghcr.io
        tag: "3.194.1-soa.1@sha256:4bc4c65e86fa147fcc4b8a968fca681aa52fef75a6df498ed85bcb02c9e33766"
