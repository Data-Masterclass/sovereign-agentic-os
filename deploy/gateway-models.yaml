#
# THE GATEWAY MODEL CATALOG FOR DEV AND PRODUCTION — one file, both environments.
#
# `scripts/deploy.sh` layers this file LAST on every deploy, `--env dev` and `--env prod` alike
# (after values.dev.yaml + the private overlay on dev, after the values derived from the live
# release on prod, and after any VALUES_OVERLAY). `litellm.proxy_config.model_list` is a LIST and
# Helm replaces a list whole, so whatever list an earlier source carried (the dev private overlay,
# the production release's own copy) is replaced by this one: the two environments cannot drift.
# Change the catalog HERE, never in the LiteLLM UI and never in a private overlay. It reaches dev
# first (main -> dev) and production with the next release, like every other change.
#
# Guards: scripts/check-gateway-catalog-parity.mjs renders the dev and the prod values with this
# file on top and fails when the two model_name sets differ, when a compatibility alias is not an
# exact copy of its catalog model, or when a source layered after this file sets a model_list.
# scripts/check-litellm-model-info.mjs (prices, limits, capabilities) and
# scripts/check-litellm-role-catalog.mjs (role seeds, old names) check it too.
# scripts/smoke-test.sh compares the live ConfigMap's model names with this file after a deploy.
# docs/components/litellm.md "One catalog for dev and production".
#
# Prices: EUR per token here, per 1M in `osUI.modelPricesJson` below (two ledgers, one price).
#   STACKIT AI Model Serving price list: gpt-oss-20b 0.15 / 0.25, Qwen3-VL-235B 1.50 / 1.75,
#   Qwen3-VL-Embedding-8B 0.08 input. Limits: docs.stackit.cloud "Available shared models".
#   Lyceum (https://api.lyceum.technology/openai/v1): the figures the owner entered for the two
#   models on dev (Kimi K3.1 Pro 2.00 / 10.00, DeepSeek V4.1 Flash 0.50 / 1.50 per 1M; cache read
#   0.20 / 0.13 per 1M), copied from the dev LiteLLM database on 2026-11-23.
litellm:
  proxy_config:
    model_list:
      # ---------------------------------------------------------------------------------------------
      # THE CATALOG, under real model names. Roles (sovereign-strong / -worker / -embedding) are
      # mapped onto these in Platform -> Models (os/models.yml); the OS writes them to LiteLLM as
      # `router_settings.model_group_alias` through the API.
      # ---------------------------------------------------------------------------------------------
      - model_name: stackit-gpt-oss-20b
        litellm_params: &gptOss20bParams
          model: openai/openai/gpt-oss-20b     # STACKIT id openai/gpt-oss-20b; LiteLLM adds the provider prefix
          api_base: os.environ/STACKIT_API_BASE
          api_key: os.environ/STACKIT_API_KEY
        model_info: &gptOss20bInfo
          mode: chat
          input_cost_per_token: 0.00000015     # 0.15 per 1M
          output_cost_per_token: 0.00000025    # 0.25 per 1M
          max_input_tokens: 131000
          max_output_tokens: 8192
          supports_vision: false
          supports_function_calling: true
      - model_name: stackit-qwen3-vl-235b
        litellm_params: &qwen3Vl235bParams
          model: openai/Qwen/Qwen3-VL-235B-A22B-Instruct-FP8
          api_base: os.environ/STACKIT_API_BASE
          api_key: os.environ/STACKIT_API_KEY
          timeout: 300                         # reasoning generations are long
          extra_body:
            chat_template_kwargs:
              enable_thinking: false
        model_info: &qwen3Vl235bInfo
          mode: chat
          input_cost_per_token: 0.0000015      # 1.50 per 1M
          output_cost_per_token: 0.00000175    # 1.75 per 1M
          max_input_tokens: 200000
          max_output_tokens: 16384
          supports_vision: true                # the strong role is on the OS image allowlist
          supports_function_calling: true
      - model_name: stackit-qwen3-vl-embedding-8b
        litellm_params: &qwen3VlEmbedParams
          model: openai/Qwen/Qwen3-VL-Embedding-8B
          api_base: os.environ/STACKIT_API_BASE
          api_key: os.environ/STACKIT_API_KEY
        model_info: &qwen3VlEmbedInfo
          mode: embedding
          input_cost_per_token: 0.00000008     # 0.08 per 1M, input only
          output_cost_per_token: 0
          max_input_tokens: 32000
          output_vector_size: 4096
          supports_vision: false
      # Lyceum (OpenAI-compatible). The key is LYCEUM_API_KEY from the per-environment Secret
      # `lyceum-api-key` (chart: litellm.extraEnvVars, optional). Without that Secret LiteLLM still
      # starts and every other model works; a call to these two answers an AuthenticationError
      # ("The api_key client option must be set"), measured on 1.109.1. Create the Secret:
      # docs/components/litellm.md "Lyceum key".
      - model_name: lyceum-kimi-k3.1-pro
        litellm_params:
          model: openai/moonshotai/kimi-k3.1-pro
          api_base: https://api.lyceum.technology/openai/v1
          api_key: os.environ/LYCEUM_API_KEY
          reasoning_effort: low                # as the model was configured on dev
        model_info:
          mode: chat
          input_cost_per_token: 0.000002       # 2.00 per 1M
          output_cost_per_token: 0.00001       # 10.00 per 1M
          cache_read_input_token_cost: 0.0000002
          max_input_tokens: 1048576
          max_output_tokens: 65536
          supports_vision: false               # not on the OS image allowlist
      - model_name: lyceum-deepseek-v4.1-flash
        litellm_params:
          model: openai/deepseek/deepseek-v4.1-flash
          api_base: https://api.lyceum.technology/openai/v1
          api_key: os.environ/LYCEUM_API_KEY
          reasoning_effort: low
        model_info:
          mode: chat
          input_cost_per_token: 0.0000005      # 0.50 per 1M
          output_cost_per_token: 0.0000015     # 1.50 per 1M
          cache_read_input_token_cost: 0.00000013
          max_input_tokens: 1048576
          max_output_tokens: 131072
          supports_vision: false
      # ---------------------------------------------------------------------------------------------
      # COMPATIBILITY ALIASES — ONE RELEASE ONLY. The old names, each an EXACT copy (YAML anchor) of
      # the catalog model its role now uses (os-ui/core/models/role-names.ts DEPRECATED_ALIASES), so
      # existing virtual keys, the production role mapping set by hand on 2026-11-23 and the
      # production fallbacks (router_settings.fallbacks, keyed by old names) keep working. Because
      # they are real catalog entries, the OS does not also write them as model_group_alias.
      # REMOVAL (the release after the one that ships this file) — docs/components/litellm.md
      # "Removing the compatibility aliases": remap the roles to stackit-* names in Platform ->
      # Models on both envs, drop the old-name fallbacks, check no key lists an old name, then
      # delete this block and the old names in osUI.modelPricesJson below.
      # ---------------------------------------------------------------------------------------------
      - { model_name: sovereign-default,        litellm_params: *gptOss20bParams,    model_info: *gptOss20bInfo }
      - { model_name: sovereign-mock,           litellm_params: *gptOss20bParams,    model_info: *gptOss20bInfo }
      - { model_name: sovereign-reasoning,      litellm_params: *qwen3Vl235bParams,  model_info: *qwen3Vl235bInfo }
      - { model_name: sovereign-reasoning-fast, litellm_params: *qwen3Vl235bParams,  model_info: *qwen3Vl235bInfo }
      - { model_name: sovereign-vision,         litellm_params: *qwen3Vl235bParams,  model_info: *qwen3Vl235bInfo }
      - { model_name: sovereign-premium,        litellm_params: *qwen3Vl235bParams,  model_info: *qwen3Vl235bInfo }
      - { model_name: sovereign-embed,          litellm_params: *qwen3VlEmbedParams, model_info: *qwen3VlEmbedInfo }

# The Lyceum host joins the egress proxy's allowlist on both environments (a LIST: this file owns
# it — add any other provider host here, not in a private overlay).
llmProviders:
  allowHosts:
    - api.lyceum.technology

osUI:
  # The OS price book (EUR per 1M tokens, per LiteLLM model_name) — the same numbers as the
  # model_info above (scripts/check-litellm-model-info.mjs). The old names stay priced while their
  # compatibility aliases exist.
  modelPricesJson: '{"stackit-gpt-oss-20b":{"inputPerM":0.15,"outputPerM":0.25},"stackit-qwen3-vl-235b":{"inputPerM":1.5,"outputPerM":1.75},"stackit-qwen3-vl-embedding-8b":{"inputPerM":0.08,"outputPerM":0},"lyceum-kimi-k3.1-pro":{"inputPerM":2,"outputPerM":10},"lyceum-deepseek-v4.1-flash":{"inputPerM":0.5,"outputPerM":1.5},"sovereign-default":{"inputPerM":0.15,"outputPerM":0.25},"sovereign-mock":{"inputPerM":0.15,"outputPerM":0.25},"sovereign-reasoning":{"inputPerM":1.5,"outputPerM":1.75},"sovereign-reasoning-fast":{"inputPerM":1.5,"outputPerM":1.75},"sovereign-vision":{"inputPerM":1.5,"outputPerM":1.75},"sovereign-premium":{"inputPerM":1.5,"outputPerM":1.75},"sovereign-embed":{"inputPerM":0.08,"outputPerM":0}}'
  # The first role mapping (written only when os/models.yml does not exist yet), the same on both
  # environments. An existing os/models.yml (production's, set by hand) is never overwritten.
  modelRoles:
    seed:
      sovereign-strong: stackit-qwen3-vl-235b
      sovereign-worker: stackit-gpt-oss-20b
      sovereign-embedding: stackit-qwen3-vl-embedding-8b
