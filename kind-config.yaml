# kind cluster config for the Sovereign Agentic OS.
# Enables containerd's registry certs.d so an image from a plain-HTTP registry can be
# pulled by the nodes. NOTE (night-2 S1): there is NO in-cluster registry and NO CI build
# in this stack — the OS does not build images. This patch is kept because an OPERATOR
# who publishes app images to their own plain-HTTP registry needs it; by default nothing
# uses it. install.sh creates the cluster with `--config kind-config.yaml`.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # os-ui NodePort (scripts/os sets osUI.service.nodePort=30080)
        hostPort: 8080
