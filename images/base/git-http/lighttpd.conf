#
# The whole server: one CGI, one URL prefix, no document root, no directory listing.
# `/git/<domain>.git/...` → git's own `git-http-backend` with GIT_PROJECT_ROOT=/repos.
server.modules = ( "mod_alias", "mod_setenv", "mod_cgi" )

server.port = 9419
server.bind = "0.0.0.0"
# No static content is served at all: everything outside /git/ is a 404.
server.document-root = "/var/www/localhost/htdocs"
server.errorlog = "/dev/stderr"
index-file.names = ( )
dir-listing.activate = "disable"

# A push is a POST whose body lighttpd buffers to disk. /tmp is an emptyDir in the chart because
# the root filesystem is read-only. 0 = no size cap (a first push of a large repo is legitimate).
server.upload-dirs = ( "/tmp" )
server.max-request-size = 0
server.max-write-idle = 1200

setenv.add-environment = (
  "GIT_PROJECT_ROOT"             => "/repos",
  # The bare repos are written by isomorphic-git and carry no `git-daemon-export-ok` marker,
  # exactly as the read-only git-daemon sidecar already has to allow for.
  "GIT_HTTP_EXPORT_ALL"          => "1",
  "GIT_HTTP_MAX_REQUEST_BUFFER"  => "200M"
)

alias.url += ( "/git" => "/usr/libexec/git-core/git-http-backend" )

$HTTP["url"] =~ "^/git" {
  cgi.assign = ( "" => "" )
}
