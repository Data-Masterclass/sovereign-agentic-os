#
# values.dev.m2i4.yaml — OPTIONAL: dev on the cheaper m2i.4 node (4 vCPU / 32 GB, about
# EUR 195/month instead of EUR 295). Layered after values.dev.yaml when DEV_NODE=m2i4.
#
# Only two CPU REQUESTS change, so the requests fit 4 vCPU (the capacity gate:
# charts/sovereign-agentic-os/capacity.dev-m2i4.yaml). Limits are unchanged, so Trino and Docling
# can still burst to 2 CPUs when the node is idle; under load they get less. The margin is thin
# (CPU requests about 84 % of 85 %): re-measure allocatable after the first apply, and expect
# slower queries and conversions than on g2i.8. The default stays g2i.8; the owner chooses.
trino:
  resources:
    requests: { cpu: 100m, memory: 1Gi }
    limits: { cpu: 2, memory: 2Gi }
docling:
  resources:
    requests: { cpu: 50m, memory: 768Mi }
    limits: { cpu: 2, memory: 1536Mi }

# ClickHouse (Langfuse traces): 1280Mi was OOM-killed 44x in 7h on the m2i.4 dev node (21 Nov
# 2026, caught by the dev smoke test). The node has 32 GB; memory is not the scarce resource here.
clickhouse:
  resources:
    requests: { cpu: 100m, memory: 1Gi }
    limits: { cpu: 1, memory: 3Gi }

# The read-only Dagster webserver behind /tools/dagster (docs/ops/tool-consoles.md) does NOT fit
# this node: with it, CPU requests reach 85.5 % and memory limits 86.5 % (capacity.dev-m2i4.yaml,
# threshold 85 %). Off here, so the Dagster console reports "not set up on this install" on m2i.4;
# the default dev node (g2i.8) runs it. The owner chooses.
dagster:
  dagsterWebserver:
    enableReadOnly: false
